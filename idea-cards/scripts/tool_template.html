<meta charset="utf-8">
<title>もーふの発想カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --desk: #DCE2E8;
  --desk-ink: #2B3440;
  --muted: #5F6B78;
  --paper: #FCFCFA;
  --rule: #C3D3E4;
  --red: #C8413A;
  --ink: #1D2631;
  --chip: #EEF2F6;
  --chip-on: #1D2631;
  --chip-on-ink: #FCFCFA;
  --shadow: 0 1px 0 rgba(29, 38, 49, .08), 0 8px 24px -12px rgba(29, 38, 49, .35);
  --focus: #2F6FB3;
  --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #161B21;
    --desk-ink: #DDE3EA;
    --muted: #93A0AE;
    --paper: #232A32;
    --rule: #34414F;
    --red: #E2665D;
    --ink: #E8ECF0;
    --chip: #232A32;
    --chip-on: #E8ECF0;
    --chip-on-ink: #161B21;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .8);
    --focus: #7FB0E6;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #161B21;
  --desk-ink: #DDE3EA;
  --muted: #93A0AE;
  --paper: #232A32;
  --rule: #34414F;
  --red: #E2665D;
  --ink: #E8ECF0;
  --chip: #232A32;
  --chip-on: #E8ECF0;
  --chip-on-ink: #161B21;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .8);
  --focus: #7FB0E6;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--desk-ink);
  font-family: var(--gothic);
  font-size: 14px;
  line-height: 1.6;
}
.wrap {
  height: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 14px 10px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
}
h1 {
  margin: 0;
  font-family: var(--mincho);
  font-weight: 700;
  font-size: clamp(19px, 2.6vw, 24px);
  letter-spacing: .04em;
  line-height: 1.3;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 var(--gothic);
  letter-spacing: .04em;
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: var(--chip);
  color: var(--desk-ink);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
button:focus-visible, a:focus-visible, label:focus-within, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* カードと「3枚引く」をひとまとまりにする。スマホは画面の残りいっぱい、広い画面は上下中央 */
.stage {
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 12px;
}
@media (min-width: 760px) {
  .stage { grid-template-rows: minmax(0, 330px) auto; align-content: center; gap: 22px; }
}

/* 3枚のカード。スマホは縦に3段、広い画面は横に3列。どちらも画面の残りの高さに収める */
.spread {
  min-height: 0;
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
@media (min-width: 760px) {
  .spread {
    grid-template-rows: minmax(0, 1fr);
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }
}

.card {
  min-height: 0;
  height: 100%;
  perspective: 1400px;
  border-radius: 4px;
  cursor: pointer;
  outline: none;
}
.inner {
  height: 100%;
  display: grid;
  transition: transform .5s cubic-bezier(.2, .7, .2, 1);
  transform-style: preserve-3d;
}
.card[aria-pressed="true"] .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1;
  min-height: 0;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 21px, var(--rule) 21px 22px);
  background-position: 0 38px;
  background-size: 100% calc(100% - 38px);
  background-repeat: no-repeat;
  border-radius: 4px;
  box-shadow: var(--shadow);
  padding: 7px 12px 8px;
  display: grid;
  grid-template-rows: 22px minmax(0, 1fr) auto;
  gap: 8px;
  position: relative;
}
.face::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 32px;
  border-top: 1.5px solid var(--red);
}
.back { transform: rotateY(180deg); }
.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font: 500 11px/1 var(--mono);
  letter-spacing: .05em;
  color: var(--muted);
}
.meta .date { margin-left: auto; }
.type {
  font-family: var(--gothic);
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--red);
}
.redo {
  font: 500 11px/1 var(--gothic);
  background: none;
  border: 0;
  padding: 5px 2px;
  color: var(--muted);
  cursor: pointer;
}
.redo:hover { color: var(--ink); }
.word {
  align-self: center;
  margin: 0;
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 19px;
  line-height: 1.5;
  color: var(--ink);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.word.sentence { font-weight: 500; font-size: 16px; line-height: 1.65; }
.hint { font-size: 10.5px; color: var(--muted); }
.backword {
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.backtext {
  margin: 0;
  font-size: 12.5px;
  line-height: 22px;
  color: var(--ink);
  overflow-y: auto;
  min-height: 0;
}
.dict {
  flex: none;
  font: 700 10px/1 var(--gothic);
  letter-spacing: .08em;
  padding: 3px 5px;
  border: 1px solid var(--muted);
  border-radius: 3px;
}
.src {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--muted);
}
.src a {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--rule);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.src time { font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }

.drawbar { display: flex; justify-content: center; }
.draw {
  font: 700 15px/1 var(--gothic);
  letter-spacing: .08em;
  padding: 13px 40px;
  border-radius: 6px;
  border: 0;
  background: var(--red);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.draw:active { transform: translateY(1px); box-shadow: none; }

.foot {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: center;
  font-size: 11.5px;
  color: var(--muted);
}
.textbtn {
  font: 500 11.5px/1 var(--gothic);
  background: none;
  border: 0;
  padding: 4px 0;
  color: var(--desk-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.foot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.foot label { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--desk-ink); }
.foot .spacer { flex: 1; }
.msg { color: var(--desk-ink); }
.msg.err { color: var(--red); }
.empty { grid-column: 1 / -1; grid-row: 1 / -1; align-self: center; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>もーふの発想カード</h1>
    <div class="chips" role="group" aria-label="種別で絞り込む">
      <button class="chip" id="f-all" data-type="" aria-pressed="true">すべて</button>
      <button class="chip" id="f-noun" data-type="固有名詞" aria-pressed="false">固有名詞</button>
      <button class="chip" id="f-concept" data-type="概念" aria-pressed="false">概念</button>
      <button class="chip" id="f-sentence" data-type="文" aria-pressed="false">文</button>
    </div>
  </header>

  <div class="stage">
    <main class="spread" id="spread" aria-live="polite"></main>
    <div class="drawbar"><button class="draw" id="draw">3枚引く</button></div>
  </div>

  <div class="foot">
    <span id="source"></span>
    <button class="textbtn" id="flipall">すべて裏返す</button>
    <span class="spacer"></span>
    <label for="csv">cards.csv を読み込む</label>
    <input type="file" id="csv" accept=".csv,text/csv">
    <button class="textbtn" id="reset" hidden>候補に戻す</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
// [ワード, 種別, 裏面テキスト, 出典タイトル, URL, 公開日, 裏面の種類]
const EMBEDDED = /*DATA*/[];
const EMBEDDED_LABEL = /*LABEL*/"";
const STORE = "hasso-cards-csv";

let cards = EMBEDDED;
let label = EMBEDDED_LABEL;
let filter = "";
let hand = [];

const $ = (id) => document.getElementById(id);

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function fromCSV(text) {
  const rows = parseCSV(text).filter((r) => r.some((c) => c.trim()));
  if (!rows.length) throw new Error("空のファイルです。");
  const head = rows[0].map((h) => h.trim());
  const cols = ["ワード", "種別", "裏面テキスト", "出典タイトル", "URL", "公開日", "裏面の種類"];
  const idx = cols.map((c) => head.indexOf(c));
  if (idx.slice(0, 3).some((i) => i < 0)) throw new Error("ワード・種別・裏面テキストの列が見つかりません。");
  const accept = head.indexOf("採否");
  const ok = new Set(["○", "〇", "o", "1", "y"]);
  return rows.slice(1)
    .filter((r) => accept < 0 || ok.has((r[accept] || "").trim()))
    .map((r) => idx.map((i) => (i < 0 ? "" : r[i] || "")))
    .filter((r) => r[0].trim());
}

function pool() {
  return filter ? cards.filter((c) => c[1] === filter) : cards;
}

function pick(n, exclude) {
  const p = pool();
  const out = [];
  const usedUrl = new Set(exclude.map((c) => c[4]));
  const used = new Set(exclude);
  for (let tries = 0; out.length < n && tries < 400; tries++) {
    const c = p[Math.floor(Math.random() * p.length)];
    if (!c || used.has(c)) continue;
    if (usedUrl.has(c[4]) && tries < 200) continue; // なるべく別の記事から
    used.add(c); usedUrl.add(c[4]); out.push(c);
  }
  return out;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function redoButton(i) {
  const b = el("button", "redo", "↻ 引き直す");
  b.setAttribute("aria-label", "この1枚を引き直す");
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    const next = pick(1, hand)[0];
    if (!next) return;
    hand[i] = next;
    render();
  });
  return b;
}

function flip(card) {
  card.setAttribute("aria-pressed", card.getAttribute("aria-pressed") === "true" ? "false" : "true");
}

function renderCard(c, i) {
  const card = el("div", "card");
  card.id = "card-" + i;
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-pressed", "false");
  card.setAttribute("aria-label", c[0] + "（タップで裏返す）");
  const inner = el("div", "inner");

  const front = el("div", "face front");
  const fm = el("div", "meta");
  fm.append(el("span", "type", c[1]), el("span", "date", c[5] ? c[5].slice(0, 7).replace("-", ".") : ""), redoButton(i));
  front.append(fm, el("div", "word" + (c[1] === "文" ? " sentence" : ""), c[0]), el("div", "hint", "タップで裏面"));

  const back = el("div", "face back");
  const bm = el("div", "meta");
  bm.append(el("span", "backword", c[0]));
  if (c[6] === "辞書") bm.append(el("span", "dict", "辞書"));
  const src = el("div", "src");
  if (c[4]) {
    const a = el("a", "", c[3] || c[4]);
    a.href = c[4]; a.target = "_blank"; a.rel = "noopener";
    a.addEventListener("click", (e) => e.stopPropagation());
    src.append(a);
  } else src.append(el("span", "", c[3]));
  src.append(el("time", "", c[5] || ""));
  back.append(bm, el("p", "backtext", c[2]), src);

  inner.append(front, back);
  card.append(inner);
  card.addEventListener("click", () => flip(card));
  card.addEventListener("keydown", (e) => {
    if (e.target !== card) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(card); }
  });
  return card;
}

function render() {
  const s = $("spread");
  s.replaceChildren();
  $("flipall").textContent = "すべて裏返す";
  if (!hand.length) {
    s.append(el("p", "empty", "この条件のカードがありません。"));
    return;
  }
  hand.forEach((c, i) => s.append(renderCard(c, i)));
}

function draw() {
  hand = pick(3, []);
  render();
}

function showSource() {
  const arts = new Set(cards.map((c) => c[4])).size;
  $("source").textContent = `${label} ${cards.length}枚・${arts}記事`;
  $("reset").hidden = cards === EMBEDDED;
}

function useCSV(text, name, save) {
  const list = fromCSV(text);
  if (!list.length) throw new Error("採用のカードがありません。採否列に ○ などが入っているか確認してください。");
  cards = list;
  label = name;
  if (save) { try { localStorage.setItem(STORE, JSON.stringify({ name, text })); } catch (e) {} }
  showSource();
  draw();
}

document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.type;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  draw();
}));
$("draw").addEventListener("click", draw);
$("flipall").addEventListener("click", () => {
  const all = [...document.querySelectorAll(".card")];
  const anyFront = all.some((b) => b.getAttribute("aria-pressed") !== "true");
  all.forEach((b) => b.setAttribute("aria-pressed", String(anyFront)));
  $("flipall").textContent = anyFront ? "すべて表に戻す" : "すべて裏返す";
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (e.code === "Space" && !(t instanceof HTMLButtonElement) && !(t instanceof HTMLInputElement) && !(t.classList && t.classList.contains("card"))) {
    e.preventDefault(); draw();
  }
});
$("csv").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const m = $("msg");
    try {
      useCSV(String(r.result), f.name, true);
      m.className = "msg"; m.textContent = `${f.name} を読み込みました。`;
    } catch (err) {
      m.className = "msg err"; m.textContent = err.message;
    }
    e.target.value = "";
  };
  r.readAsText(f, "utf-8");
});
$("reset").addEventListener("click", () => {
  try { localStorage.removeItem(STORE); } catch (e) {}
  cards = EMBEDDED; label = EMBEDDED_LABEL;
  $("msg").textContent = "";
  showSource(); draw();
});

(function start() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved) { useCSV(saved.text, saved.name, false); return; }
  } catch (e) {}
  showSource();
  draw();
})();
</script>
