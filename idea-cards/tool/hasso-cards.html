ュメは人が読むものから、AIに食べさせる素材へ変わりつつある。","文","AIで予稿集を読み解けるようになった筆者は、この情報量をリアル会場で何時間もかけて聞く必要があるのかという気持ちも抱いた。講演の録音を読み込ませる手もあるが、スライドが配布されないことが多い点はまだ課題だと述べている。","NotebookLMと学会準備","https://note.com/beefbowl60/n/n28d87d34fd9e","2025-06-18","文脈"],["リクライナー","概念","筆者が新宿の大塚家具で2シーターのソファを探していたとき、通りすがりに偶然見つけたチェアのカテゴリーである。背もたれをゆったり倒せ、映画館のプレミアムシートやグランクラスのような座り心地だと感じ、家にあったら最高だろうと心に引っかかったまま店を後にした。","カリモク\"THE FIRST\"を購入した話","https://note.com/beefbowl60/n/n1d77cb360b9a","2025-06-19","文脈"],["ストレスレスチェア","固有名詞","カリモクと並んで有名なリクライナーのブランドとして筆者が挙げたものである。店にいたストレスレスチェアの販売員が、日本製を暗に貶めつつヨーロッパ製の良さを熱弁していたのが印象的だったと記しており、筆者はその後カリモクを検討する方向へ進んでいる。","カリモク\"THE FIRST\"を購入した話","https://note.com/beefbowl60/n/n1d77cb360b9a","2025-06-19","文脈"],["カリモク THE FIRST","固有名詞","筆者が数か月かけて検討し購入したカリモクのリクライニングチェアである。お台場のショールームや百貨店で試座を重ね、Mサイズに絞り、ウォールナットのベースにビターブラウンの革地を選んだ。購入から1年以上たっても部屋の真ん中で安らぎの場所になっているという。","カリモク\"THE FIRST\"を購入した話","https://note.com/beefbowl60/n/n1d77cb360b9a","2025-06-19","文脈"],["AIでの色シミュレーション","概念","チェアのモデルとサイズが絞れた後、残った色選びのために筆者が用いた方法である。AI画像生成で革張りの色などを変えてあれこれ試し、実物を見た後にも家で改めてシミュレーションした。重厚感や存在感があるため、最終的にあえてオーソドックスな配色を選んでいる。","カリモク\"THE FIRST\"を購入した話","https://note.com/beefbowl60/n/n1d77cb360b9a","2025-06-19","文脈"],["寝そべる、座るという物理的な享楽は裏切らない。","文","購入したチェアは筆者がこれまで買ったもののなかでも金額上位に入る値段だった。それでも、家に帰ればこの椅子に座れると思えることが幸せになっていると述べ、身体で味わう快適さへの投資に満足している。座ったまま寝てしまうことも多いという。","カリモク\"THE FIRST\"を購入した話","https://note.com/beefbowl60/n/n1d77cb360b9a","2025-06-19","文脈"],["リクライナーは店頭で試座し、首の位置でサイズを合わせる。","文","購入から1年以上たった追記で、筆者が購入時に重要だと振り返った点である。家族複数人で使うと合う人と合わない人が出るのは仕方ないとも述べる。また、ロボット掃除機が脚に乗り上げて傷がつきそうだったため、掃除機のほうの使用をやめたと記している。","カリモク\"THE FIRST\"を購入した話","https://note.com/beefbowl60/n/n1d77cb360b9a","2025-06-19","文脈"],["不快な出来事への意味づけ","概念","日々の何気ない言動や思い通りにいかない状況、小さな違和感の積み重ねで感情が揺らぐことについて、筆者が手放すと決めたものである。いちいち考えていると疲弊するため、不快な出来事を無理に意味づけしないことにしたと述べ、揺らぎとの距離の取り方を示している。","波と戯れるように生きたい","https://note.com/beefbowl60/n/n416e7ce21fde","2025-06-20","文脈"],["感情の波は天気と同じ自然現象で、生きている実感そのものだ。","文","ささいなことで感情が揺らぐ日々を振り返った筆者は、感情の波を無理にならそうとしなくていいと考えた。その波こそが生きているという実感であり、天気のような自然現象と同じだと捉え直すことで、揺れる自分を否定せずに受け入れる姿勢をとっている。","波と戯れるように生きたい","https://note.com/beefbowl60/n/n416e7ce21fde","2025-06-20","文脈"],["達成した過去より、今の身体の感覚のほうが現実の生だ。","文","感情の波を受け入れる考えの延長で、筆者は生の実感の拠り所を身体に置いた。何かを達成した過去の記憶よりも、今疲れているのか満ち足りているのかという身体の感覚のほうが現実だと述べ、偶発性や不確実性との付き合い方が自分の在り方を形作るとも考えている。","波と戯れるように生きたい","https://note.com/beefbowl60/n/n416e7ce21fde","2025-06-20","文脈"],["確からしい方向","概念","不確実性を前提に生きる筆者が、進む先の目安として示した言葉である。偶発性を無視して未来は描けないとしたうえで、波に揺られながら今の自分にとっておおまかに確からしい方向を見ることこそが生活そのものだと述べ、自然の波と戯れるように一喜一憂して生きたいと結んでいる。","波と戯れるように生きたい","https://note.com/beefbowl60/n/n416e7ce21fde","2025-06-20","文脈"],["Wave Is Life","固有名詞","記事のBGMとして筆者が挙げた、ヤン富田がプロデュースしたパードン木村の曲で、大好きだという。波と戯れるように生きたいという記事の主題に重なる一曲として添えられており、筆者はいつかサーフィンをしてみたいという願いとともに紹介している。","波と戯れるように生きたい","https://note.com/beefbowl60/n/n416e7ce21fde","2025-06-20","文脈"],["生活のタイムシフト","概念","梅雨入り後に急に夏のような暑さになった週に、筆者が始めた取り組みである。朝1時間早く起きることにして、生活全体の時間を前倒しにずらした。起床時刻を起点に日々のリズムそのものを組み替える試みとして、週のまとめの冒頭に記録している。","【記録】今週のまとめ 2025/06/22","https://note.com/beefbowl60/n/nabd7c3a8a2da","2025-06-22","文脈"],["Google AI Pro","固有名詞","学会準備でNotebookLMを試行錯誤し、流れでGeminiも使ってみた筆者が乗り換えた有料プランである。GeminiはChatGPTと回答の傾向が少し違って興味深いと感じ、それまで課金していたChatGPT Plusからこちらへ切り替えたと記している。","【記録】今週のまとめ 2025/06/22","https://note.com/beefbowl60/n/nabd7c3a8a2da","2025-06-22","文脈"],["自分の蔵書や記録をAIに読ませると、読書の仕方が変わる。","文","筆者はNotebookLMに、以前スキャンした書籍や自分の記録を読み込ませる使い方を模索している。学会の予稿集で効果を実感した流れで対象を広げており、本との向き合い方そのものが変わってきていると感じていることを週のまとめに書き留めている。","【記録】今週のまとめ 2025/06/22","https://note.com/beefbowl60/n/nabd7c3a8a2da","2025-06-22","文脈"],["オーイ！とんぼ","固有名詞","筆者がこの週に買った漫画で、第15巻に入ったところである。50巻以上出ているので、まだまだ先は長いと記している。週のまとめの「今週買ったもの」として挙げられており、長いシリーズを少しずつ読み進めていく楽しみがうかがえる。","【記録】今週のまとめ 2025/06/22","https://note.com/beefbowl60/n/nabd7c3a8a2da","2025-06-22","文脈"],["習得への情熱―チェスから武術へ―","固有名詞","筆者がこの週に読んでいた本で、チェスマスターが武術を習得していく過程を描いたドキュメントである。副題は「上達するための、僕の意識的学習法」。筆者は分野をまたいで上達していくその思考プロセスが面白いと評価している。","【記録】今週のまとめ 2025/06/22","https://note.com/beefbowl60/n/nabd7c3a8a2da","2025-06-22","文脈"],["できないことより、できていることに感謝すべきだ。","文","思い通りにいかないことが多々あった一週間を締めくくる言葉として、筆者が書き留めた学びである。足りない点を数えるより、今できていることに目を向けて感謝する姿勢を確認している。","【記録】今週のまとめ 2025/06/22","https://note.com/beefbowl60/n/nabd7c3a8a2da","2025-06-22","文脈"],["オールドコンデジ","概念","10年以上前のコンパクトデジタルカメラを指す呼び名である。noteでコンデジを載せる人が増えたのを見て、筆者も手元に残した思い出深い2台を紹介した。他にも多く持っていたが処分してしまい、勿体なかったと振り返っている。","我が家のコンデジ","https://note.com/beefbowl60/n/n6e162d4ef7f3","2025-06-25","文脈"],["サイバーショット DSC-TX7","固有名詞","筆者が手元に残している屈曲型のコンデジで、2010年1月発売である。広角25mmレンズと光学4倍ズームを備える。Geminiに仕様を尋ねたところ完璧な回答が返ってきたといい、バッテリーを充電して試し撮りするつもりだと述べている。","我が家のコンデジ","https://note.com/beefbowl60/n/n6e162d4ef7f3","2025-06-25","文脈"],["サイバーショット DSC-WX100","固有名詞","筆者が残しているもう一台の沈胴型コンデジで、2012年3月発売である。薄型のAAレンズで光学10倍ズームを実現しつつ、約124gの軽さを誇る。今見るとオモチャのように小さくてかわいいと、画像に添えて筆者は記している。","我が家のコンデジ","https://note.com/beefbowl60/n/n6e162d4ef7f3","2025-06-25","文脈"],["機材の発売年を並べると、その時代の空気が立ち上がる。","文","手元の2台の発売時期を調べた筆者は、その間に東日本大震災があったことに気づいた。カメラの仕様を確かめる作業が、そのまま当時の時代を思い出すきっかけになり、「そんな時代です」と短く感慨を記している。","我が家のコンデジ","https://note.com/beefbowl60/n/n6e162d4ef7f3","2025-06-25","文脈"],["古いカメラで撮るとき、試されているのは撮る側の自分だ。","文","まだ使えそうな古いコンデジを充電し、翌日の試し撮りを計画した筆者の感想である。どんな写りになるのかを考えると、カメラではなく自分が試されているような気分になると述べ、撮れた写真を後日アップしたいとしている。","我が家のコンデジ","https://note.com/beefbowl60/n/n6e162d4ef7f3","2025-06-25","文脈"],["矢舟テツロー","固有名詞","ジャズを基調にシティポップやソウルの要素を織りまぜるSSW／ピアニストである。小西康陽との共作でも知られる。筆者は新作が「Free Soul」名義で出たと知りApple Musicで聴き、スタンダード曲のカバーで聴きやすく、すぐにお気に入りになった。","フリーソウルの時代","https://note.com/beefbowl60/n/n06eb1372b0b0","2025-06-26","文脈"],["Free Soul（フリーソウル）","固有名詞","橋本徹が選曲するコンピレーションアルバムのシリーズである。筆者は膨大なコレクションに一時かなりお世話になったという。CDの時代が終わって見かけなくなったが、去年で30周年だったと知り、当時を懐かしんでいる。","フリーソウルの時代","https://note.com/beefbowl60/n/n06eb1372b0b0","2025-06-26","文脈"],["コンピレーションアルバム","概念","名曲だけを拾って聴くのは「イージー」だという空気がありつつも、筆者はコンピの魅力を認めている。フリーソウルのシリーズを例に、膨大な曲を一度に知る入口として役立った体験を語り、配信時代にその機会が減ったことを惜しんでいる。","フリーソウルの時代","https://note.com/beefbowl60/n/n06eb1372b0b0","2025-06-26","文脈"],["元ネタ","概念","筆者がフリーソウルのコンピを聴くなかで見つけた、他の曲の下敷きになった原曲のことである。あの曲やあの曲の元ネタを数知れず発見したと振り返り、コンピが過去の音楽へと遡る手がかりになっていたことを示している。","フリーソウルの時代","https://note.com/beefbowl60/n/n06eb1372b0b0","2025-06-26","文脈"],["配信の時代は、過去の名曲と偶然出会う機会を減らした。","文","CDの時代が終わり、フリーソウルのようなコンピレーションはほとんど見かけなくなった。筆者は、編集された選曲を通じて昔の曲に出会う回路が細ってしまったと感じ、何でも聴ける配信の時代にかえって出会いが減ったと述べている。","フリーソウルの時代","https://note.com/beefbowl60/n/n06eb1372b0b0","2025-06-26","文脈"],["コクヨのソフトリングノート","固有名詞","筆者が2年以上愛用しているノートである。リング部分が柔らかい樹脂で、手をついても痛くない点を気に入っている。A5方眼を横にして真ん中に線を入れて使うが、この仕様はグレーしかないので色を増やしてほしいと要望している。","コクヨのノートの話","https://note.com/beefbowl60/n/n0a7ecc03b139","2025-06-27","文脈"],["活字未満","概念","スマホのメモよりも紙のノートに向く内容を筆者が表した言葉である。まだ文章として整わない考えや、視覚的に整理したいことは紙の方がよいとし、デジタルと手書きを内容の成熟度で使い分けている様子がうかがえる。","コクヨのノートの話","https://note.com/beefbowl60/n/n0a7ecc03b139","2025-06-27","文脈"],["シャチハタの回転日付印","固有名詞","筆者がノートの日付記入に愛用しているスタンプである。手書きで日付を書くより圧倒的に早く、見返すときにも分かりやすいと評価している。道具ひとつで手書きのノートに秩序がもたらされる感覚を気持ち良いと述べている。","コクヨのノートの話","https://note.com/beefbowl60/n/n0a7ecc03b139","2025-06-27","文脈"],["手書きの規格化","概念","日付印を押すことで、自由な手書きのノートに「秩序化」「規格化」がもたらされると筆者が感じた感覚である。乱雑になりがちな紙のメモに一定の型を与えることが、書く気持ち良さと見返しやすさの両方につながると考えている。","コクヨのノートの話","https://note.com/beefbowl60/n/n0a7ecc03b139","2025-06-27","文脈"],["他人のノートの使い方を覗くのは、なぜか無性に楽しい。","文","自分にとっては当たり前になっているノートの使い方を、筆者はあえて記事にまとめた。その締めくくりで、人のノートを見るのはなぜか楽しいと述べ、日常の道具の使い方こそ他人には面白く映るという感覚を示している。","コクヨのノートの話","https://note.com/beefbowl60/n/n0a7ecc03b139","2025-06-27","文脈"],["週休2.5日","概念","二週間に一度ほど休みを取る筆者の働き方を、平均して表した言い方である。1週間に半日の休みが加わる計算で、今はこのくらいがちょうど良いという。目標は週休4日としつつも、今の生活に十分感謝していると述べている。","週休2.5日の生活","https://note.com/beefbowl60/n/n3e6094e46356","2025-06-27","文脈"],["疲れる前に休む","概念","自分をいたわるために筆者が心がけている方針である。休日に食洗機のメンテをしながら、機械も不具合の前に手入れすべきで、汚れる前に掃除するのと同じ意識だと述べ、体の休養も予防として捉えている。","週休2.5日の生活","https://note.com/beefbowl60/n/n3e6094e46356","2025-06-27","文脈"],["頑張ることより、ストレスを溜めずに続けることが大事だ。","文","少し疲れたくらいで休まず頑張らなければ、という気持ちが自分にも少しあると筆者は認めている。それでも、無理をして一時的に踏ん張るより、ストレスを溜めずに長く続けることのほうが大事だと結論づけている。","週休2.5日の生活","https://note.com/beefbowl60/n/n3e6094e46356","2025-06-27","文脈"],["無理をしないことは、自分を知ることでもある。","文","休み方について書いた記事の結びで、筆者は無理をしないためには自分の限界を知る必要があると示している。そのうえで、自分だけでなく他人にも無理をさせたくないと述べ、自分へのいたわりを周囲への配慮へと広げている。","週休2.5日の生活","https://note.com/beefbowl60/n/n3e6094e46356","2025-06-27","文脈"],["AIは乗り換えてもすぐ慣れるが、使いこなしは別の話だ。","文","筆者はChatGPT PlusからGoogle AI Proに乗り換え、Geminiを主に使うようになった。最初の違和感はすぐに消えたものの、数あるAIサービスの中で自分に適した使いこなし方はまだ見つかっていないと、手探りの状態を率直に記している。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["映画『選挙と鬱』","固有名詞","青柳拓監督のドキュメンタリーで、水道橋博士の2022年参院選出馬から当選、辞職、その後までを追う。筆者は渋谷ユーロスペースの舞台挨拶付き上映で観た。ツラい映画かと予想していたが想像以上に面白く、自分の生き方を考えさせられたという。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["生き恥をさらす","概念","映画『選挙と鬱』の中で出てきて、筆者にずっしりと響いた言葉である。水道橋博士の出馬から辞職、その後を追う映像に刺激され、筆者は観ながら自分のこれからの生き方について考えさせられたと振り返っている。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["Me, We!","概念","『選挙と鬱』で掲げられた選挙スローガンで、「俺、俺たち」を意味する。筆者はこの言葉から連想が広がり、久々に映画『モハメド・アリ かけがえのない日々』も観たくなったと記しており、一本の映画が別の作品へ関心をつないでいる。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["エル・カブキ「247」","固有名詞","漫才コンビ、エル・カブキが2025年上半期を振り返った60分漫才の単独ライブである。タイトルはTHE SECONDでの敗北時の点数に由来する。ずっと楽しみにしていた筆者は配信で観て満足し、鋭い毒舌のネタを楽しんで次回も期待している。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["ラロ・シフリン","固有名詞","「スパイ大作戦」のテーマ曲などで知られるアルゼンチン出身の作曲家で、93歳で死去したニュースを筆者は取り上げた。筆者にとっては映画『ブリット』のテーマ曲の印象が強く、昔「タイタンライブ」のオープニングで使われていたと回想している。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["山崎照朝","固有名詞","極真の全日本空手道選手権の初代王者で、力石徹のモデルとされる空手家である。訃報に接した筆者は、数年前にテレビで姿を見られてよかったと述べ、この機に評伝を再読した。梶原兄弟との喧嘩の末に大山倍達が放つ言葉が最高だという。","今週のまとめ #2025/06/29","https://note.com/beefbowl60/n/nf2a84b542a3d","2025-06-29","文脈"],["書くために何かをすることが、日々を動かしていく。","文","上半期の出来事として、筆者はnote投稿を始めて2ヶ月続いていることを挙げた。書くことがそれなりにあるだけでなく、noteに書こうと思って何かをすることもあり、良い暇つぶしになっているという。気軽な反応も励みになっている。","上半期のふりかえり","https://note.com/beefbowl60/n/n01c238781501","2025-07-01","文脈"],["映画「敵」","固有名詞","筒井康隆原作の映画で、筆者は公開直後に観に行った。長塚京三演じる老人の暮らしのシーンが頭から離れないと述べ、その淡々とした日常描写を「パーフェクトデイズ感」と表現している。上半期に観た映画の筆頭に挙げた一本である。","上半期のふりかえり","https://note.com/beefbowl60/n/n01c238781501","2025-07-01","文脈"],["新宿109プレミアム","固有名詞","筆者が個人の感想として史上最高の映画館と呼ぶ劇場である。デヴィッド・リンチ追悼の「マルホランド・ドライブ」再上映をここで観て、最高の没入体験だったという。ポップコーンを食べ過ぎてしまう危険な劇場だとも書いている。","上半期のふりかえり","https://note.com/beefbowl60/n/n01c238781501","2025-07-01","文脈"],["「新・黄金の七人 7x7」","固有名詞","筆者がサントラだけずっと前から聴いていて、再上映でようやく本編を観られた映画である。他愛のないドタバタクライムコメディで、ロンドンが舞台なのに皆イタリア語を話す違和感を面白がっている。上映後には川辺ヒロシと小柳帝のトークがあった。","上半期のふりかえり","https://note.com/beefbowl60/n/n01c238781501","2025-07-01","文脈"],["Compuma","固有名詞","上半期に観たライブの中で、筆者が最も印象に残ったと挙げた音楽家である。WWWでのライブを観て、モジュラーシンセに興味を持つきっかけになったという。同じ半年でジム・オルークを3回も観ていたことにも気づいている。","上半期のふりかえり","https://note.com/beefbowl60/n/n01c238781501","2025-07-01","文脈"],["他生の縁","概念","上半期のふりかえりの結びで、筆者が下半期の目標としてnoteの継続を掲げたときに添えた言葉である。スキやコメントといった読者からの反応を励みにしてきた筆者は、縁を感じ、感謝しつつ長く続けていきたいと述べている。","上半期のふりかえり","https://note.com/beefbowl60/n/n01c238781501","2025-07-01","文脈"],["Apple Music All time replay","固有名詞","Apple Music10周年を機にできた、全期間の再生数順に曲を並べたプレイリストである。筆者は自分のトップ10を見て「へー」としか言えず、もっと他にも聴いている曲があるはずだと思いつつ、この結果を受け止めるしかないと述べている。","Apple Music All time replay","https://note.com/beefbowl60/n/n6695e57eb966","2025-07-02","文脈"],["再生回数のランキングからは、自分の弱点しか読み取れない。","文","全期間の再生数トップ10を眺めた筆者は、「Get Lucky」が入っているのがちょっと恥ずかしいなど、見えてくるのは自分の好みの偏りばかりだと感じた。記録された嗜好は、自分の弱点を映す鏡のようになっている。","Apple Music All time replay","https://note.com/beefbowl60/n/n6695e57eb966","2025-07-02","文脈"],["丸サ進行","概念","筆者がJust the two of us進行を今風に言い換えた呼び方である。再生数ランキングの上位曲を見て、自分はこのコード進行に弱そうだと分析している。好きな曲の共通点が、無意識の好みとしてランキングに現れていることに気づいた。","Apple Music All time replay","https://note.com/beefbowl60/n/n6695e57eb966","2025-07-02","文脈"],["Final Spank Happy「夏の天才」","固有名詞","筆者の全期間再生ランキングに入っていたSPANK HAPPYの曲である。恥ずかしさや弱点ばかりが目についた結果のなかで、これだけはこの季節に最適なものだったと肯定している。記事の最後には歌詞の一節も引いている。","Apple Music All time replay","https://note.com/beefbowl60/n/n6695e57eb966","2025-07-02","文脈"],["Scaffold #1","固有名詞","Jim O'Rourkeと石橋英子との対話から生まれたライブイベントの初回で、筆者は2025年7月1日に渋谷クラブクアトロで観た。今この体験を共有したいと感じる音楽家を紹介する企画である。アンコールは3人での演奏だった。","Scaffold #1 へ行きました","https://note.com/beefbowl60/n/n8e10f119258a","2025-07-02","文脈"],["Jim O'Rourke×石橋英子","固有名詞","Scaffold #1の1st setを務めた二人で、企画の共同発起人でもある。純粋に音楽を追求する音楽家同士のしなやかなつながりから生まれた共演だと紹介されている。筆者はクアトロで着席して聴き、アンコールの3人演奏まで見届けた。","Scaffold #1 へ行きました","https://note.com/beefbowl60/n/n8e10f119258a","2025-07-02","文脈"],["Rafael Toral","固有名詞","Scaffold #1の初回ゲストとして招かれたギタリスト／音楽家で、2nd setを務めた。キャリアを通じてギターによる実験的なアンビエント／ドローンに取り組んでいると紹介されている。アンコールではJimと石橋英子との3人で演奏した。","Scaffold #1 へ行きました","https://note.com/beefbowl60/n/n8e10f119258a","2025-07-02","文脈"],["『Spectral Evolution』","固有名詞","Rafael Toralのアルバムで、Jimが主宰するDrag City傘下のレーベルMoikaiから出た。ギターの実験的なアンビエント／ドローン作品で、石橋英子は昨年世界で出た中で一番素晴らしいアルバムだと評したと、筆者は企画の紹介文を引いている。","Scaffold #1 へ行きました","https://note.com/beefbowl60/n/n8e10f119258a","2025-07-02","文脈"],["ドローン〜アンビエント","概念","Scaffold #1の演奏全体を筆者がひと言で表した言葉である。持続音を重ねる音楽が一晩を通じて続き、筆者は着席して聴いた。終演後は早さと安さを求めて蕎麦屋で2次会をし、ビールと蕎麦で締めくくっている。","Scaffold #1 へ行きました","https://note.com/beefbowl60/n/n8e10f119258a","2025-07-02","文脈"],["ソニー サイバーショット DSC-TX7","固有名詞","実家で発掘された2010年発売のコンデジで、筆者はこれを持って渋谷を撮り歩いた。AUTO設定のJPEGで後処理なしである。不便な点も多いが、小さく薄く軽い点に驚き、当時5万円ほどのハイテク機に感じたと振り返っている。","15年前のコンデジで渋谷を撮る","https://note.com/beefbowl60/n/na0ba8278bc12","2025-07-03","文脈"],["東急本店跡地","固有名詞","古いコンデジで渋谷を撮り歩いた筆者が被写体にした場所の一つである。写真には東南アジア感があるという説明を添えている。109の昔のロゴや工事中のJR渋谷駅とともに、変わりゆく街の姿を15年前の機材で切り取った。","15年前のコンデジで渋谷を撮る","https://note.com/beefbowl60/n/na0ba8278bc12","2025-07-03","文脈"],["ナチュラルな絵作り","概念","筆者が古いコンデジの写りを総括した言葉である。シャープネスやコントラストが弱めでふわっとしており、キレはないが色味が浅く独特だと評した。日中でもブレやすく、フレアや暗所のノイズも多いと、弱点も具体的に挙げている。","15年前のコンデジで渋谷を撮る","https://note.com/beefbowl60/n/na0ba8278bc12","2025-07-03","文脈"],["撮れた写真をすぐ確認できない不便さが、楽しみを増やす。","文","古いコンデジは液晶で写りを確認しづらく、無線接続もないためSDカードをアダプター経由でスマホに移すまで結果が分からない。筆者はその待ち時間を、逆に楽しみが増す感じだったと好意的に受け止めている。","15年前のコンデジで渋谷を撮る","https://note.com/beefbowl60/n/na0ba8278bc12","2025-07-03","文脈"],["古いカメラを使うと、ブレない今のスマホのすごさが分かる。","文","15年前のコンデジで撮ると、歩きながらでも日中でもよくブレ、室内ではかなりブレた。筆者はその体験を通じて、絶対にブレない今のスマホはすごいと改めて感じたと述べ、技術の進歩を逆方向から実感している。","15年前のコンデジで渋谷を撮る","https://note.com/beefbowl60/n/na0ba8278bc12","2025-07-03","文脈"],["道標の修正","概念","月次レビューと上半期のレビューを行った筆者が、下期の過ごし方を検討した作業である。年初の目標の進捗率は50％ほどで、現状を踏まえて道標を少し修正した。こうした振り返りの作業自体がけっこう楽しいと述べている。","今週のまとめ 2025/07/06","https://note.com/beefbowl60/n/nff4488a55f95","2025-07-06","文脈"],["自分の時間を優先してやれるのは、結局のところ自分しかいない。","文","加速度的に忙しくなるなかで、筆者が自分に言い聞かせている言葉である。上半期のレビューで下期の過ごし方を検討した週に、この言葉を支えに色々と工夫を重ねていると、週のまとめの冒頭で記している。","今週のまとめ 2025/07/06","https://note.com/beefbowl60/n/nff4488a55f95","2025-07-06","文脈"],["Manus","固有名詞","筆者が最近使い始めたAIサービスである。GoogleAIに加入したのでDeepResearchも使い切ろうと調査対象を考える毎日だが、情報量が多すぎて消化しきれない状態になってきたという。筆者はこれをまだ過渡期的だと捉えている。","今週のまとめ 2025/07/06","https://note.com/beefbowl60/n/nff4488a55f95","2025-07-06","文脈"],["『マイ・ウェイ －東京ダイナマイト ハチミツ二郎自伝－』","固有名詞","友人から単独ライブに誘われたのをきっかけに筆者が読んだ本である。知らなかったことが多く、瀕死、糾弾、M-1、プロレスと読みどころが多くて1日で読み終えたという。ストレス解消のKindleまとめ買いの一冊だった。","今週のまとめ 2025/07/06","https://note.com/beefbowl60/n/nff4488a55f95","2025-07-06","文脈"],["『八巻建志自伝 真、未だ極まらず』","固有名詞","書店の武道コーナーで筆者が何気なく手に取り、引き込まれてそのまま購入した空手家の自伝である。ストレス解消のためにKindleで軽めの本をまとめ買いした週の一冊として、ハチミツ二郎の自伝などと並べて紹介されている。","今週のまとめ 2025/07/06","https://note.com/beefbowl60/n/nff4488a55f95","2025-07-06","文脈"],["ネットで買う回数が減ったのは、物を買わなくなったからだ。","文","Amazonの夜間注文翌朝配送の全国展開というニュースに触れた筆者は、ネットで物を買うことが昔より減ったと気づいた。配送が便利になる一方で、自分はそもそも物をあまり買わなくなったのかもしれないと振り返っている。","今週のまとめ 2025/07/06","https://note.com/beefbowl60/n/nff4488a55f95","2025-07-06","文脈"],["免許更新の事前予約","概念","筆者が久しぶりに免許証の更新に行った際、東京ではネットでの事前予約制になっていた。長い桁の番号を何度も打たされる使いにくいシステムで手間がかかったわりに、予約なしでも受けられたらしいと知り、何だかなという釈然としない気持ちを書き残している。","免許証の更新に行きました","https://note.com/beefbowl60/n/n698124016af2","2025-07-10","文脈"],["普段のメガネを忘れると視力検査が試練になる。","文","更新手続きで「不合格でも返金しない」と表示された視力検査に臨んだ筆者は、運転用のメガネを忘れて度の弱いコンタクトしか着けていなかった。目を開いたり細めたりして何とか通過し、次回への反省点の筆頭に視力検査用のメガネを挙げている。","免許証の更新に行きました","https://note.com/beefbowl60/n/n698124016af2","2025-07-10","文脈"],["前回うまくいったことほど油断して出来が落ちる。","文","免許証の写真撮影に、筆者はきちんとした身なりで臨んだが、表情が固く自己採点は50点ほどだった。前回は80点くらいの出来だったので油断したと振り返り、次回に向けて表情の練習をしておくことを反省点として挙げている。","免許証の更新に行きました","https://note.com/beefbowl60/n/n698124016af2","2025-07-10","文脈"],["自転車の反則金","概念","優良講習で、あおり運転の罰則とともに説明されていた話題である。筆者は普段から自転車をわりと利用しているため、翌年4月から始まる自転車の反則金の運用に興味を持ったと記している。30分待って30分受ける講習の中で、自分事として響いた内容だった。","免許証の更新に行きました","https://note.com/beefbowl60/n/n698124016af2","2025-07-10","文脈"],["免許更新の手続きは想定の三倍の時間を見込んでおく。","文","筆者は免許更新を30分ほどで終わると見込んでいたが、支払い、視力検査、写真撮影、講習待ちと講習を経て合計1時間半ほどかかった。次回への反省点として、時間には1.5〜2時間の余裕をみておくことを書き残し、読者の参考にもなればとまとめている。","免許証の更新に行きました","https://note.com/beefbowl60/n/n698124016af2","2025-07-10","文脈"],["泉岳寺","固有名詞","用事で近くに来た筆者が寄り道して見学した東京のお寺である。赤穂四十七士のお墓があることで有名だと紹介している。当日はお墓参りの人で混雑していたため、お墓参りはやめて門などを見て回るだけにとどめ、帰りに高輪ゲートウェイ駅周辺へ足を延ばした。","今週のまとめ 2025/07/13","https://note.com/beefbowl60/n/nc49522886e54","2025-07-13","文脈"],["高輪ゲートウェイ駅","固有名詞","泉岳寺からの帰りに筆者が見学した駅である。遠くから見てはいたが、周辺の高層ビル群をほぼ完成した状態で間近に見るのは初めてだった。駅前の広場や構内はどこから来たのか家族連れで賑わっており、開業当時の騒ぎを思い出すきっかけにもなった。","今週のまとめ 2025/07/13","https://note.com/beefbowl60/n/nc49522886e54","2025-07-13","文脈"],["開業時の騒ぎも、時が経てばどうでもよくなる。","文","高輪ゲートウェイ駅の賑わいを目の当たりにした筆者は、開業当時に駅名やフォントについていろいろ言われていたことを思い出した。しかし家族連れで賑わう現在の様子を見て、そうした議論はどうでもいいことだったと感じたと書いている。","今週のまとめ 2025/07/13","https://note.com/beefbowl60/n/nc49522886e54","2025-07-13","文脈"],["NVIDIA","固有名詞","週のまとめの「気になったニュース」で筆者が取り上げた米半導体大手である。時価総額が史上初めて4兆ドルを超えたという日経新聞の記事を紹介し、AIの「黒子」がもたらした地殻変動として、生成AI関連の話題と並べて週の出来事に記録している。","今週のまとめ 2025/07/13","https://note.com/beefbowl60/n/nc49522886e54","2025-07-13","文脈"],["生成AIを使うようになって検索をほとんどしなくなった。","文","生成AIの個人利用が日本では26%台にとどまるという情報通信白書のニュースを紹介しつつ、筆者は今週Grok4が話題だったことに触れる。そのうえで自身については、いわゆる「ググる」ことはほとんどしなくなったと利用の実感を述べている。","今週のまとめ 2025/07/13","https://note.com/beefbowl60/n/nc49522886e54","2025-07-13","文脈"],["佐藤雅彦展","固有名詞","横浜美術館で開催中の展覧会で、筆者は予約購入していたその図録・書籍を忘れた頃にAmazonで受け取った。めくってみると目新しさは少なかったが文章が思ったより多く、じっくり読みたいと感じた。すでに人気の展示にも平日に行ってみたいと考えている。","届き物","https://note.com/beefbowl60/n/n8a9d8acfa4bc","2025-07-14","文脈"],["佐藤雅彦フリーク","概念","筆者が自分自身を表した言葉で、佐藤雅彦の過去の作品や刊行物にはほとんど目を通しているという。そのため展覧会の図録にも目新しい内容は少なかったと述べる。佐藤雅彦氏については、折を見て改めて記事を書いてみたいという意欲も記している。","届き物","https://note.com/beefbowl60/n/n8a9d8acfa4bc","2025-07-14","文脈"],["『広告批評』佐藤雅彦研究室特集号","固有名詞","筆者が雑誌でありながら人生のベスト10に入るほど影響を受けたと語る一冊である。そこで語られていたモノの作り方と、それをロジカルかつスマートに自己分析する様が当時とても新鮮で、今思えば内心とても憧れていたのだと振り返っている。","届き物","https://note.com/beefbowl60/n/n8a9d8acfa4bc","2025-07-14","文脈"],["作り方を自分で分析して語る","概念","『広告批評』の佐藤雅彦研究室特集号で筆者が強く惹かれた点である。作品そのものだけでなく、モノの作り方をロジカルかつスマートに自己分析して言葉にする姿勢が新鮮だった。当時の気持ちを、今思えば内心とても憧れていたのだと言い直している。","届き物","https://note.com/beefbowl60/n/n8a9d8acfa4bc","2025-07-14","文脈"],["些細な出来事でも書けば思いがけず誰かに通じる。","文","本が届いたという小さな記事を、別のnoteの書き手が自分の記事で紹介してくれたことを受けた筆者の感想である。自分にとって些細と思った出来事でも書いてみるもので、思いがけず通じたり繋がったりするのが嬉しく、不思議で面白いと述べている。","届き物","https://note.com/beefbowl60/n/n8a9d8acfa4bc","2025-07-14","文脈"],["同じ本を二度買う","概念","筆者がブックオフで税込110円で買った本と同じものが、家の本棚にすでにあったという出来事である。クーポンを使ったのでノーダメージであり、好きな本なので全然いいと受け止めている。好きな本ほど手に取ってしまうことを示す小さな失敗談として書かれている。","同じ本","https://note.com/beefbowl60/n/n06d6ffc9b2a9","2025-07-18","文脈"],["永井均『子どものための哲学対話』","固有名詞","筆者が二冊持つことになった、人間とネコが対話する子ども向けの体裁をとった哲学の本である。「元気が出ないときどうしたらいいか？」「友だちは必要か？」「クジラは魚である！」など、少し変わった問いを章ごとに扱っている点を紹介している。","同じ本","https://note.com/beefbowl60/n/n06d6ffc9b2a9","2025-07-18","文脈"],["ペネトレ","固有名詞","『子どものための哲学対話』で「ぼく」と対話するネコの名前である。筆者が引用した章では、左翼と右翼のどちらが正しいのかと尋ねる「ぼく」に、ペネトレが「どっちも同じようなものだよ」と答える。筆者はその問答を読み進め、考えさせられたと述べている。","同じ本","https://note.com/beefbowl60/n/n06d6ffc9b2a9","2025-07-18","文脈"],["左翼と右翼って何？","概念","筆者が同じ本を何となくめくっていて気になった章の題である。どちらが正しいのかという問いに対し、どちらも同じようなものだという答えが返ってくる。筆者は読み進めてなるほどと考えさせられ、この問いをもう少し考えてみたいと保留のまま締めくくっている。","同じ本","https://note.com/beefbowl60/n/n06d6ffc9b2a9","2025-07-18","文脈"],["子ども向けの体裁の哲学書が大人に問いを残す。","文","筆者は子ども向けの形をとった哲学対話の本を何となくめくり、左翼と右翼をめぐる章に目を留めた。平易な問答を読み進めるうちに考えさせられ、この問いをもう少し考えてみたいと感じた。好きな本として再び手に取ったことが、新たな問いに出会うきっかけになった。","同じ本","https://note.com/beefbowl60/n/n06d6ffc9b2a9","2025-07-18","文脈"],["ネタ切れと思っても書けた週には満足感が残る。","文","週のまとめで筆者は、最近ネタ切れだと感じていたわりにその週は4件も記事を書けたと振り返る。そのことに満足感があり、ささやかだけれどいい事が幾つかあった週だったとまとめている。日曜は参院選の投票にも行き、強い日差しでくたくたになったと記している。","今週のまとめ 2025/07/20","https://note.com/beefbowl60/n/nf6d8365b6cd0","2025-07-20","文脈"],["コニー・フランシス","固有名詞","「可愛いベイビー」「ヴァケイション」「カラーに口紅」などのヒットで知られるシンガーである。週のまとめの「気になったニュース」で、筆者はその死去を伝える記事を紹介し、逝去を短く悼んでいる。記事内での言及はこの訃報にとどまっている。","今週のまとめ 2025/07/20","https://note.com/beefbowl60/n/nf6d8365b6cd0","2025-07-20","文脈"],["Grokのコンパニオンモード","固有名詞","xAIの対話型AI「Grok」のiOSアプリで、3Dアニメーションのキャラクターとリアルタイムに対話できる機能である。筆者はその週に話題になったニュースとして取り上げつつ、自分はAIやスマホに向かって会話することにまだ慣れていないと感想を添えている。","今週のまとめ 2025/07/20","https://note.com/beefbowl60/n/nf6d8365b6cd0","2025-07-20","文脈"],["ソニー RX1RⅢ","固有名詞","ソニーが約10年ぶりに発表した、レンズ一体型のフルサイズコンパクトデジタルカメラの最上位機種である。推定価格66万円という日経新聞の記事を筆者は「気になったニュース」に挙げ、その値段の高さに驚きを示している。","今週のまとめ 2025/07/20","https://note.com/beefbowl60/n/nf6d8365b6cd0","2025-07-20","文脈"],["機材の値段に世界と日本の金銭感覚の差が表れる。","文","ソニーの新しいフルサイズコンデジが推定66万円と報じられたことに対し、筆者は驚きとともに、世界基準の価格設定と日本での金銭感覚との差が気になると述べている。円安や所得の話には踏み込まず、違和感を短く書き留めるにとどめている。","今週のまとめ 2025/07/20","https://note.com/beefbowl60/n/nf6d8365b6cd0","2025-07-20","文脈"],["自分用と読まれる用のハイブリッド","概念","noteで全期間最も読まれているFP2級の受験記録を書いたときの筆者の気持ちを表した言葉である。自分用の記録と、誰かに読まれることの想定が混ざっていたため、適度な雑味と勢いが生まれた。筆者自身も時々読み返していると自画自賛している。","一番読まれてる記事、勉強法、Anki","https://note.com/beefbowl60/n/n79a505b87444","2025-07-21","文脈"],["Anki","固有名詞","FP2級の受験記録で筆者が紹介した学習アプリである。言葉の暗記の反復学習を効率的かつ楽しくできる神アプリだと評し、今でも勉強や趣味のクイズのインプットに使っている。何年も使い込んでいるが、いまだに新たな気づきがあると述べている。","一番読まれてる記事、勉強法、Anki","https://note.com/beefbowl60/n/n79a505b87444","2025-07-21","文脈"],["『科学的根拠に基づく最高の勉強法』","固有名詞","Ankiの利用を想定した間隔学習や反復の理論を扱う勉強本の代表として筆者が挙げた本である。アクティブリコールと分散学習を組み合わせた連続的再学習を最強の学習法として紹介している、と筆者は内容をまとめている。","一番読まれてる記事、勉強法、Anki","https://note.com/beefbowl60/n/n79a505b87444","2025-07-21","文脈"],["連続的再学習","概念","「アクティブリコール（テストして思い出す）」と「分散学習（時間を空けて繰り返す）」を合わせた学習法で、勉強本で最強の学習法として紹介されていると筆者は述べる。ただし最高の学習法系の結論そのものは目新しいものではないとも評している。","一番読まれてる記事、勉強法、Anki","https://note.com/beefbowl60/n/n79a505b87444","2025-07-21","文脈"],["『英単語学習の科学』","固有名詞","第二言語学習の専門家による研究結果をまとめた本として筆者が紹介した一冊である。最高の学習法系の本と結論自体は大きく変わらないが、こちらのほうがより学術的な内容になっていると比較している。読みやすさでは別の子ども向けの本を推している。","一番読まれてる記事、勉強法、Anki","https://note.com/beefbowl60/n/n79a505b87444","2025-07-21","文脈"],["座学の知識はカード化できれば後は回す回数の勝負だ。","文","筆者は世の中の座学事象はだいたいAnkiに入れられると考える。ただし問題の作り方、知識のカード化、時間が経った問題の処理などは試行錯誤の世界だという。最近は生成AIを使ったノウハウも溜まり、別途記事にまとめたいと考えている。","一番読まれてる記事、勉強法、Anki","https://note.com/beefbowl60/n/n79a505b87444","2025-07-21","文脈"],["『効率化オタクが実践する 光速パソコン仕事術』","固有名詞","筆者が数年前に読み、スマホのユーザ辞書を活用するようになったきっかけの本である。以来「おつ」で「おつかれさまです」、「あと」で「あと5分で着きます」のように、よく使う定型文や打ちづらい言葉を短い読みで登録する習慣が続いている。","ユーザ辞書を活用しよう","https://note.com/beefbowl60/n/nd19d2374ec05","2025-07-23","文脈"],["ユーザ辞書登録","概念","筆者が勧めるスマホの入力効率化の方法である。定型のあいさつや「YouTube」「BLUE NOTE TOKYO」のような表記を短い読みで登録し、プライベートで使う固有名詞はさらに多く登録している。気づいた時に内容をアップデートすることが大事だと述べている。","ユーザ辞書を活用しよう","https://note.com/beefbowl60/n/nd19d2374ec05","2025-07-23","文脈"],["鎮座DOPENESS","固有名詞","筆者が「登録しておいて良かったワード3選」の一つに挙げた名前で、「ちんざ」で変換できるようにしている。ほかに「CHO CO PA CO CHO CO QUIN QUIN」「3-4x10月」も挙げており、正確に打ちづらい固有名詞ほど辞書登録の効果が大きいことを示す例になっている。","ユーザ辞書を活用しよう","https://note.com/beefbowl60/n/nd19d2374ec05","2025-07-23","文脈"],["ユーザ辞書は気づいた時に更新してこそ役に立つ。","文","筆者はあいさつや到着連絡などの定型文、よく使う固有名詞を短い読みで辞書登録している。そのうえで、一度登録して終わりにせず、ときおり気づいた時に内容をアップデートするのが大事だと強調し、よく使う打ちづらい言葉で試すよう読者に勧めている。","ユーザ辞書を活用しよう","https://note.com/beefbowl60/n/nd19d2374ec05","2025-07-23","文脈"],["打ちづらい言葉を秒で返せると快感がある。","文","鎮座DOPENESSや「3-4x10月」のような打ちづらいワードを辞書登録しておいた結果、筆者はメッセンジャーのやり取りでそれらを即座に返せるようになった。そうした秒レスができると気持ち良すぎて恍惚とする、と辞書登録の効用を楽しげに語っている。","ユーザ辞書を活用しよう","https://note.com/beefbowl60/n/nd19d2374ec05","2025-07-23","文脈"],["『うなづきマーチ』","固有名詞","「メモれ〜」「コピれ〜」のフレーズの元祖として筆者が挙げる曲である。これらは『今夜はブギー・バック』で有名になったが、筆者は元祖にある「テプれ〜」の意味を前回の記事で探り、読者の協力のもと一応の結論が見られたと報告している。","テプレーの続き","https://note.com/beefbowl60/n/n068b4392979e","2025-07-26","文脈"],["大事なことを録る発想は今ならボイスレコーダーだ。","文","「テプれ〜」を大事なことをテープに録ることと解釈した筆者は、今で言えばスマホのボイスレコーダーに吹き込むような行為だろうと考えた。一方で、テープでは知りたい箇所を探すのが大変そうだと、当時の記録手段の不便さにも思いを巡らせている。","テプレーの続き","https://note.com/beefbowl60/n/n068b4392979e","2025-07-26","文脈"],["大瀧詠一","固有名詞","『うなづきマーチ』を作詞・作曲した人物である。いつ良いアイデアが浮かぶか分からないからとスタジオで録音テープを常時回していたという逸話を筆者は紹介し、その点で「テプれー」は実感のこもった歌詞に感じられたと述べている。","テプレーの続き","https://note.com/beefbowl60/n/n068b4392979e","2025-07-26","文脈"],["録り続けた人が書いた歌詞には実感がこもる。","文","大瀧詠一がアイデアを逃さないよう録音テープを常時回していたという逸話を知った筆者は、『うなづきマーチ』の「テプれー」という歌詞を、作り手自身の習慣から出た言葉として読み直した。単なる言葉遊びではなく実感のこもった歌詞に感じられたという。","テプレーの続き","https://note.com/beefbowl60/n/n068b4392979e","2025-07-26","文脈"],["水道橋博士『藝人春秋２』","固有名詞","水道橋博士が福生の大滝邸を訪ねたエピソードが詳しく書かれている本として筆者が紹介した。数十台のビデオデッキが常時録画しているのに一体いつ観るのか、といったエキセントリックな話が載っている。探訪の模様はテレビでも放送され、翌日学校で話題になった思い出があるという。","テプレーの続き","https://note.com/beefbowl60/n/n068b4392979e","2025-07-26","文脈"],["うなづきマーチ（スチャダラパーREMIX）","固有名詞","筆者が聴いていて歌詞の謎に引っかかった曲である。「メモレー」「コピレー」という有名なフレーズに続き、歌詞の最後に「テプレー」が出てくる。この曲をきっかけに、筆者は言葉の由来を調べ始め、記事にまとめることになった。","テプレーの謎","https://note.com/beefbowl60/n/nd0907ae18a76","2025-07-26","文脈"],["「コピる」","概念","『うなづきマーチ』の「コピレー」というフレーズから、筆者が1982年の時点ですでに「コピる」という言葉があったのかと興味を持った語である。動詞化された言葉が当時から使われていたことを、ちょっとした発見として面白がっている。","テプレーの謎","https://note.com/beefbowl60/n/nd0907ae18a76","2025-07-26","文脈"],["テプラ","固有名詞","キングジムのラベルライターで、筆者が「テプレー」を最初にこれのことかと考えた製品である。しかし曲の作られた時代にはまだテプラは発売されていなかったと気づき、この説を退けた。そこから「テプレー」の意味をめぐる謎がさらに深まることになった。","テプレーの謎","https://note.com/beefbowl60/n/nd0907ae18a76","2025-07-26","文脈"],["テプレー","概念","『うなづきマーチ』の歌詞の最後に出てくる言葉で、筆者はテープに録ることかと推測しつつ、あまり聞いたことがないと首をかしげる。AIに尋ねると今どき有り得ないほどのハルシネーションが起き、答えは得られなかった。謎は続く記事へと持ち越された。","テプレーの謎","https://note.com/beefbowl60/n/nd0907ae18a76","2025-07-26","文脈"],["並んだ言葉のうち一つだけが廃れる理由は謎だ。","文","「メモレー」「コピレー」は今も通じるのに、同じ歌詞に並ぶ「テプレー」は聞き慣れないことに筆者は気づいた。「コピる」は1982年当時からあったのに、なぜ「テプレー」だけが廃れたのかと問いを立て、謎が深まっていると結論を保留している。","テプレーの謎","https://note.com/beefbowl60/n/nd0907ae18a76","2025-07-26","文脈"],["『ゼロからトースターを作ってみた結果』","固有名詞","充実した前週から一転、苦難の多い一週間に筆者が読んでいた本の作者による有名な著作として、画像キャプションで紹介された本である。筆者は読んでいる本をユーモラスで面白いと評しており、つらい日々の中で手に取った読書として記録している。","今週のまとめ 2025/07/27","https://note.com/beefbowl60/n/n86468756f8a5","2025-07-27","文脈"],["富士山みたいなコーヒーカップ","概念","筆者が松本旅行の際に陶器屋さんで見つけ、数年愛用しているコーヒーカップである。サイズ感と厚み、持ち手の突起、富士山のような配色と形を気に入っている。何焼きかも分からず、割れたら悲しいので似たものを探しているが見つかっていない。","今週のまとめ 2025/07/27","https://note.com/beefbowl60/n/n86468756f8a5","2025-07-27","文脈"],["愛用品を撮るのはペットの写真を残すのに近い。","文","筆者は数年愛用しているコーヒーカップの記念に写真を撮り、その気持ちを愛犬や愛猫の写真をアップして残しておく感覚に近いと説明する。欠けたり割れたりしたら悲しいという思いもあり、身近な道具への愛着を記録として残そうとしている。","今週のまとめ 2025/07/27","https://note.com/beefbowl60/n/n86468756f8a5","2025-07-27","文脈"],["ニュースは将来振り返ったときに面白くなるから残す。","文","週のまとめに気になったニュースを載せる理由を、筆者は将来振り返ったときに面白くなるからだけだと明かす。本当に気になったものと単なるスクショ的なものが混ざっているといい、この週も日経平均の高値や首相の進退をめぐるSNS投稿、訃報などを並べている。","今週のまとめ 2025/07/27","https://note.com/beefbowl60/n/n86468756f8a5","2025-07-27","文脈"],["Cornelius×HERALBONY「Glow Within」","固有名詞","Corneliusと、クリエイティブカンパニーHERALBONYの契約作家13名が共作した“音の世界”の展覧会である。筆者は週のまとめで気になったニュースの一つとして、その開始を伝える音楽ナタリーの記事を挙げている。感想は添えず記録として残している。","今週のまとめ 2025/07/27","https://note.com/beefbowl60/n/n86468756f8a5","2025-07-27","文脈"],["すべてが一瞬で過ぎるから、毎日を大事にしたい。","文","前週までの充実と没頭から一転して苦難の多い一週間を過ごした筆者は、週のまとめの最後に、もう7月も終わりだと振り返る。記事は無計画に書いたがコメント欄での交流に感謝しつつ、すべてが一瞬だとして毎日を大事にしようと締めくくっている。","今週のまとめ 2025/07/27","https://note.com/beefbowl60/n/n86468756f8a5","2025-07-27","文脈"],["デイジー・ホリデー","固有名詞","細野晴臣がinter FMで続けるラジオ番組である。筆者は数週間前の放送で、曲名の由来をめぐる細野氏と対談相手のやりとりを聴いた。藤子作品の混同に聞こえた応答に数日モヤモヤしたことが、この記事を書くきっかけになっている。","FもAもない時代","https://note.com/beefbowl60/n/nb073289b892d","2025-07-29","文脈"],["北京ダック","固有名詞","細野晴臣の曲で、タイトルは藤子不二雄の短編漫画から拝借したと本人が番組で語った。筆者はその原作を、客が北京ダックにされてしまう藤子不二雄Aのとてもブラックな短編として記憶しており、ネットで当該作を探して時代背景を確かめている。","FもAもない時代","https://note.com/beefbowl60/n/nb073289b892d","2025-07-29","文脈"],["ミノタウロスの皿","固有名詞","番組で「北京ダック」の話題が出た際に対談相手が挙げた短編である。筆者は藤子・F・不二雄のSF短編として、話も絵柄も全く別物と認識していたため混同はあり得ないと感じたが、分裂前の作品と知って見方を改めている。","FもAもない時代","https://note.com/beefbowl60/n/nb073289b892d","2025-07-29","文脈"],["FとA分裂以降のパラダイム","概念","藤子不二雄が二人の作家に分かれた後の見方を、筆者が自覚した言い方である。分裂前の作品なら同一作者として語るのは自然な姿勢であり、自分のモヤモヤはこの枠組みに長く生きてきたために生じた違和感にすぎなかったと目が開いた。","FもAもない時代","https://note.com/beefbowl60/n/nb073289b892d","2025-07-29","文脈"],["違和感の正体は、今の枠組みで過去を見ていることだった。","文","ラジオでの藤子作品の混同に引っかかった筆者は、数日後にネットで原作を調べ、当時はまだ藤子不二雄が分裂していない時代だったと気づいた。相手が誤っていたのではなく、自分の側の前提が後年のものだったと受け止め直している。","FもAもない時代","https://note.com/beefbowl60/n/nb073289b892d","2025-07-29","文脈"],["感情的な返信は、30分寝かせるだけで不要になることがある。","文","理不尽な要求のメールに感情的な返信を書きかけた筆者は、自分がイライラしていると自覚して手を止めた。メールを閉じて30分ほど放置すると、話が別の方向に転がって自然に解決し、返さなくてよかったと振り返っている。","アンガーマネジメント","https://note.com/beefbowl60/n/n43c03bf19024","2025-07-30","文脈"],["正しさを認めさせたい欲求","概念","理不尽なメールに返信しかけたときの最初の感情の正体として、筆者が見定めたものである。そのまま返していれば相手との間に感情の溝が生じるだけだったと考える一方、踏みとどまったこと自体も打算的な行動だと自嘲気味に書いている。","アンガーマネジメント","https://note.com/beefbowl60/n/n43c03bf19024","2025-07-30","文脈"],["ぶつけ合う誠意は、消耗する元気があって初めて成り立つ。","文","筆者は若い頃、感情をぶつけ合うことこそ誠意ある行動だと思っていたという。今も少しそう思っているが、正面衝突を避けるようになったのは考えが変わったからではなく、消耗する元気がなくなっただけかもしれないと留保している。","アンガーマネジメント","https://note.com/beefbowl60/n/n43c03bf19024","2025-07-30","文脈"],["美しい合気道","固有名詞","正面からぶつからずに「さける」「よける」という考え方や術を、筆者は武術から学んだと述べ、その流れで紹介した一冊である。理不尽な相手に感情で応じず受け流すという振る舞いの背景に、武術の身体感覚があることを示している。","アンガーマネジメント","https://note.com/beefbowl60/n/n43c03bf19024","2025-07-30","文脈"],["「哲学実技」のすすめ","固有名詞","「若い頃はぶつけ合うのが誠意」という価値観を見直すきっかけになったと筆者が挙げる本である。自分に誠実であろうとすると大変なことになると哲学教室のドキュメンタリ形式で描かれており、ある意味とても面白いと薦めている。","アンガーマネジメント","https://note.com/beefbowl60/n/n43c03bf19024","2025-07-30","文脈"],["趣味がいやになるのは、たいてい考えすぎているときだ。","文","趣味がいやになる瞬間とは何かという問いに、筆者は冒頭で「だいたい考えすぎ」と答えている。上達の細部や周囲への気づかいに頭を使いすぎると楽しさが失われるとして、気楽にやることを何より大事な姿勢に据えている。","趣味がいやになる瞬間","https://note.com/beefbowl60/n/na0f4e30221e6","2025-08-03","文脈"],["余裕を楽しむ遊び","概念","筆者による趣味の定義である。趣味とはつまり余裕を楽しむ遊びなのだから、気楽にやることが大事だと述べる。義務や成果に縛られ始めた時点で本来の姿から外れる、という以降の主張全体の土台になっている考え方である。","趣味がいやになる瞬間","https://note.com/beefbowl60/n/na0f4e30221e6","2025-08-03","文脈"],["共に楽しむための適度な距離感","概念","趣味の人間関係について筆者が勧める構えである。周りに過度に気を使うストレスが楽しむ本質を奪うのはもったいないとし、まず自分を中心に据えたうえで、他人と一緒に楽しめる程度の距離を保てばよいと考えている。","趣味がいやになる瞬間","https://note.com/beefbowl60/n/na0f4e30221e6","2025-08-03","文脈"],["完璧主義は楽しみの敵で、できている大部分を喜べばいい。","文","趣味では細かい上手くできないことばかりが気になりがちだと筆者は書く。できないところはそのうち良くなると楽観的に構え、すでにできている大部分を喜ぶ姿勢を持っていたいと、自分への心構えとしてまとめている。","趣味がいやになる瞬間","https://note.com/beefbowl60/n/na0f4e30221e6","2025-08-03","文脈"],["自分を褒めまくる","概念","筆者が趣味を楽しむ方法として挙げる実践である。少しできたら自分を褒め、「才能あるんじゃないか」と前向きに考えながら取り組む。自分の気持ちよさを追求し、うまくいった点を見つけて褒めまくればいいと締めくくっている。","趣味がいやになる瞬間","https://note.com/beefbowl60/n/na0f4e30221e6","2025-08-03","文脈"],["引き寄せの法則を全部やったら、効きすぎて人生バグりかけた話","固有名詞","オカルト系サイト「トカナ」元編集長の角由紀子による、怪しげな引き寄せメソッドの体験レポートである。疲れた週の気分転換に読み始めた筆者は一気に引き込まれて半日かからず読了し、ヘミシンクや断食など試したいものもあるが、ハマると危ないと書いている。","今週のまとめ 2025/08/03","https://note.com/beefbowl60/n/ne70893ba2e6a","2025-08-03","文脈"],["ユリイカ 佐藤雅彦特集号","固有名詞","筆者が久しぶりに買った雑誌ユリイカの特集号である。爆笑問題の太田光など縁のある人々が寄稿しており、読みながら自分が佐藤雅彦という名前をはっきり認識したきっかけや、かつて受けた特別講義の記憶をたどり直している。","今週のまとめ 2025/08/03","https://note.com/beefbowl60/n/ne70893ba2e6a","2025-08-03","文脈"],["佐藤雅彦『クリック』","固有名詞","筆者が佐藤雅彦の名前をはっきり認識するきっかけになった本で、太田光の夫人に薦められたものだと記憶している。ユリイカの特集号を読んでいるうちに、確かそういうタイトルだったと思い出したという、記憶の糸口として登場する。","今週のまとめ 2025/08/03","https://note.com/beefbowl60/n/ne70893ba2e6a","2025-08-03","文脈"],["一冊の特集号が、かつて受けた講義の興奮を呼び戻す。","文","ユリイカで柴田聡子が藝大での佐藤教授の様子を書いた文章を読み、筆者は数年前にクラウドファンディングの特典で東京藝術大学の特別講義を2日間受けたことを思い出した。そのときの感動と興奮がよみがえったと振り返っている。","今週のまとめ 2025/08/03","https://note.com/beefbowl60/n/ne70893ba2e6a","2025-08-03","文脈"],["This is Lounge","固有名詞","Atom™（a.k.a Atom Heart）の「This is 〜」シリーズの一作である。筆者はこのシリーズが大好きだとし、なかでも本作を秀逸と評している。今週聴いた曲として、延々とリピートできる作品と並べて紹介している。","今週のまとめ 2025/08/03","https://note.com/beefbowl60/n/ne70893ba2e6a","2025-08-03","文脈"],["新しいスマホが注目を集める時代は、もう過ぎた。","文","アップルの決算でiPhoneが好調というニュースを受けての筆者の感想である。今年のモデルについても噂はいろいろ出ているが、新製品のスマホが世間の関心の中心になる時代ではなくなったと、やや醒めた目で受け止めている。","今週のまとめ 2025/08/03","https://note.com/beefbowl60/n/ne70893ba2e6a","2025-08-03","文脈"],["刑事コロンボ","固有名詞","体調を崩して薬を飲み寝続けた週に、筆者が思い出した昔のアメリカドラマである。大富豪（≒犯人）の夫人はだいたい睡眠薬を常用し、カウンセリングや催眠療法を受けている。それほど一般的な方法なのか、時代的なものなのかと首をかしげている。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["直前にキャンセルできる予約は、不安な人の背中を押す。","文","筆者は映画の座席予約で、見づらい席ではないか、前に大きな帽子の人が座ったらどうしようと悩み、決済まで進めないことがある。そのため直前キャンセルができる映画アプリを、観る人の気持ちを分かっていると感心している。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["不確定要素が怖いという現代病","概念","不安症気味で行動に踏み切れない自分を振り返り、筆者が名付けた見立てである。予約ひとつでも何もかも疑い始め、行動に制限がかかってしまう。こうした不確定要素への恐れは、個人の性格を超えた現代病の一つではないかと考えている。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["自己催眠法","概念","ずっと若い頃、筆者が催眠術の本を見様見真似で試していたものである。ロウソクの灯をイメージして100から数を減らすと、まぶたや腕が重くなった気がしたが、今思えばすべて気のせいだったと、空へのUFOへの呼びかけとともに笑って振り返っている。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["横尾忠則","固有名詞","若い頃の筆者が自己催眠を試したり、空に向かってUFOに呼びかけたりしていた背景として、細野晴臣と並べて挙げる影響源である。大槻ケンヂの著作群も加え、オカルト的なものへの興味がこうした人々から来ていたと自己分析している。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["相手の重心を崩す","概念","1ヶ月ぶりに参加した武術の稽古で筆者が習ったことである。相手の手首を取って重心をコントロールするなどを学んだ。道着を新調して帯を締めると気持ちが引き締まり、稽古後には脳内に何かが出ているような爽快感があったと書いている。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["問いの立て方ひとつで、答えはオカルトに寄ってしまう。","文","稽古で筆者は、触れる前の相手のバランスは目で視るのかと先生に尋ね、怪訝な顔をされた。答えは「よく観察する」だったが、目以外でどう感じるのかと問うこと自体がオカルト的な答えを誘う問いだったと、後から自分で気づいている。","今週のまとめ 2025/08/10","https://note.com/beefbowl60/n/nb64461ef1d7e","2025-08-10","文脈"],["キムズビデオ","固有名詞","NYで映画ファンの聖地だったレンタルビデオ店の膨大なコレクションの数奇な運命を追うドキュメンタリーで、筆者は渋谷で観た。本気と冗談、虚と実、愛とユーモアに溢れ、昔レンタル店の片隅にあった謎の作品を観たような不思議な感覚になったという。","映画「キムズビデオ」の感想","https://note.com/beefbowl60/n/n829787c1eacd","2025-08-11","文脈"],["ロストテクノロジーとしてのホームページ","概念","映画のオフィシャルサイトについて筆者が面白がった点である。バナーや配色、解像度まで作り込まれ、文字を横に流したり点滅させたりする今ではほぼ失われた手法が使われている。担当者のこだわりとユーモアが伝わり、観る前から間違いないと感じた。","映画「キムズビデオ」の感想","https://note.com/beefbowl60/n/n829787c1eacd","2025-08-11","文脈"],["面倒で不便だった時間こそ、どうしようもなく豊かだった。","文","筆者は棚から真剣に5本ほど選び、1週間で観て返しに行くレンタルビデオ時代を思い出した。今より格段に面倒だったがあの時間が良かったとしみじみし、映画はその時間を偏愛と狂気で肯定してくれた気がしたと書いている。","映画「キムズビデオ」の感想","https://note.com/beefbowl60/n/n829787c1eacd","2025-08-11","文脈"],["14インチのブラウン管でも、映像美に心は震えた。","文","レンタルビデオ時代、筆者はビデオの画質で14インチほどのブラウン管を見ていたにもかかわらず、ゴダールの鮮烈な色彩やタルコフスキーの映像美に感動していた。その不思議さを、映画を観ながら改めて噛みしめている。","映画「キムズビデオ」の感想","https://note.com/beefbowl60/n/n829787c1eacd","2025-08-11","文脈"],["無限という形式の有限","概念","配信サービスで無限の作品にアクセスできるようになった現在を、筆者は「無限という形式のあまりにも有限な」ものと言い表した。そのうえで、一本の映画を選ぶのに、かつてほど真剣に胸をときめかせているだろうかと自問している。","映画「キムズビデオ」の感想","https://note.com/beefbowl60/n/n829787c1eacd","2025-08-11","文脈"],["ヨンマン・キム","固有名詞","店「キムズビデオ」の主である韓国系アメリカ人実業家である。筆者は雑感の中で、彼の謎めいた雰囲気が映画の魅力を引き上げていたと評している。NYCとシチリアを行き来する映像の対比や、90分以下の見やすさとともに挙げた印象の一つである。","映画「キムズビデオ」の感想","https://note.com/beefbowl60/n/n829787c1eacd","2025-08-11","文脈"],["作業中の音は、意識の邪魔にならないことが一番だ。","文","筆者は以前、ラジオや音楽をかけながら作業することが多かったが、最近はそれを耳障りに感じるようになった。そこで、なるべく意識の邪魔にならない音を探して使うようになり、ノイズや倍音など候補を試している最中である。","作業用のBGM","https://note.com/beefbowl60/n/n6a7821e63de8","2025-08-13","文脈"],["ブラウンノイズ","概念","筆者が作業用に使っている、低音域のランダムノイズである。「ゴーーー」という感じの音で、ホワイトノイズよりも耳障りがよいと評している。意識の邪魔にならない音を求めて行き着いた選択肢の一つとして、最初に紹介している。","作業用のBGM","https://note.com/beefbowl60/n/n6a7821e63de8","2025-08-13","文脈"],["倍音系の動画","概念","筆者が作業用の音として挙げる二つ目の系統である。動画がたくさんアップされていて尽きることがないという。作業中というより、ストレッチなどゆっくり体を動かしている時間に比較的よく合うと、使いどころを分けて評価している。","作業用のBGM","https://note.com/beefbowl60/n/n6a7821e63de8","2025-08-13","文脈"],["ヘミシンク","固有名詞","筆者が「怪しい系」として紹介する音源である。左右で微妙にずれた周波数を聴くと脳波がその差分に一致してくるらしく、幽体離脱などの話もあるという。超常現象には達していないが、疲れて寝ながら聞くと少し意識がとぶ感じはあると書いている。","作業用のBGM","https://note.com/beefbowl60/n/n6a7821e63de8","2025-08-13","文脈"],["モジュラーシンセで自分に最適な音をつくる","概念","作業用の音をまだ模索中だと認めたうえで、筆者がゆくゆくやってみたいと語る目標である。既存のノイズや音源を選ぶだけでなく、モジュラーシンセのアプリを使って、自分の意識に最も合う音を自分で制作したいという展望を示している。","作業用のBGM","https://note.com/beefbowl60/n/n6a7821e63de8","2025-08-13","文脈"],["手帳に夢を書くと実現する","概念","たまに耳にするこの話を、筆者は正直好きではなかったが、一度だけ試したところ長年ぼんやり願っていたことが3ヶ月ほどで実現した。人に話すと変に思われそうなのでnoteに書いたとし、体験から導いた結論は「実現する」だった。","夢は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/nbbbcfd3654fa","2025-08-15","文脈"],["ロルバーンのノート","固有名詞","筆者が夢を書いた「手帳」の実物である。書いたことが実現した後、ゴールから逆算して行動を具体化する作業もこのノートで行った。記事の最後では、また今の夢を考えて書いてみたいとし、ロルバーンのノートにと結んでいる。","夢は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/nbbbcfd3654fa","2025-08-15","文脈"],["夢を書いた瞬間から、実現の方法を真剣に考えはじめる。","文","書いたことで何かが変わったのかと自問した筆者は、変わったと答える。書いた瞬間からどうすれば実現できるかを考えだした気がするという。努力だけでは届かず運もあったが、書くことで可能性を最大限まで高められたと振り返っている。","夢は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/nbbbcfd3654fa","2025-08-15","文脈"],["ゴールからの逆算","概念","夢をノートに書いた後、筆者が実際に行った進め方である。ゴールから逆算して何をすればよいかを細かいステップに具体化し、順に実行していった。この作業もノートで行っており、書くことが漠然とした願望を行動計画に変える働きをしたとみている。","夢は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/nbbbcfd3654fa","2025-08-15","文脈"],["夢を書くのは引き寄せではなく、TODOリストに近い。","文","筆者は手帳に夢を書く効果を、神秘的な引き寄せではなく、やることをTODOリストに書くのに近いものと捉えた。書いていないと忘れるが、書いてあればやり、そして近づいていく。つまらないほど現実的な話だと言い切っている。","夢は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/nbbbcfd3654fa","2025-08-15","文脈"],["何度書いても遠ざかる願望","概念","書けば何でも実現するのかという問いへの筆者の留保である。仕事やお金、趣味の願望は書いておいたことで数多く実現したが、ダイエットは何度書いても近づくどころか遠ざかっている。書き方が甘いのか意志が弱いのかと答えを保留している。","夢は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/nbbbcfd3654fa","2025-08-15","文脈"],["昔聴いていた曲が、ある日急によくなる瞬間がある。","文","筆者にとってそれはU.F.Oの「ユナイテッド・フューチャー・エアラインズ」だった。イントロのベースラインにピアノのリフが入るところに惹かれ、深夜に妄想の中のフロアを想像して一人で盛り上がったという、再発見の体験が記事の起点になっている。","U.F.O、MXU、ケニシー","https://note.com/beefbowl60/n/n457ae14374bf","2025-08-17","文脈"],["UNITED FUTURE ORGANIZATION（U.F.O）","固有名詞","1990年結成で、日本のクラブジャズの先駆けとされるグループである。筆者はほとんどの曲を後追いで聴いた。1990年代のクラブではこんなにカッコいい曲がかかっていたのかと驚き、当時の現場を想像しながら聴き込んでいる。","U.F.O、MXU、ケニシー","https://note.com/beefbowl60/n/n457ae14374bf","2025-08-17","文脈"],["元ネタ探し","概念","曲にハマった筆者が次に取りかかった楽しみ方である。サンプリング元としてThe Singers Unlimitedの「Stone Ground Seven」やThe Nite-Litersの「K-JEE」にたどり着き、元ネタの方もかっこいいと評している。一曲から聴く範囲が広がっていく過程である。","U.F.O、MXU、ケニシー","https://note.com/beefbowl60/n/n457ae14374bf","2025-08-17","文脈"],["ケン・イシイのDJミックスCD","固有名詞","ずいぶん前に聴いたこのCDに例の曲が入っていたと思い出し、筆者はフリマサイトで送料込600円で即購入した。届くと小包を破り捨てて聴き、ピアノリフのないリミックス版でもアガると書く。プラネットロックからRIOT IN LAGOSへ繋ぐ箇所も聴きどころに挙げている。","U.F.O、MXU、ケニシー","https://note.com/beefbowl60/n/n457ae14374bf","2025-08-17","文脈"],["アナログっぽい繋ぎ方","概念","筆者がこの時代のDJ MIXに感じた魅力である。ミキサーのツマミでごちゃごちゃやっている感じが伝わってくる繋ぎ方で、それだけで最高だと評している。曲そのものだけでなく、曲と曲の間の手触りに時代の空気を聴き取っている。","U.F.O、MXU、ケニシー","https://note.com/beefbowl60/n/n457ae14374bf","2025-08-17","文脈"],["行けなかった時代のフロアに、今になって焦がれる。","文","CDをひとしきり聴き、脳の渇望感が落ち着いた後、筆者は90年代のクラブでケン・イシイのDJで踊りたかったと記す。そして「今は2025年だ」と一行で締め、後追いでしか触れられない時代への憧れと、その距離を淡々と示している。","U.F.O、MXU、ケニシー","https://note.com/beefbowl60/n/n457ae14374bf","2025-08-17","文脈"],["CHO CO PA CO CHO CO QUIN QUIN","固有名詞","通称チョコパ。筆者が若いバンドの中で一番好みだと語るバンドで、今週は全曲カバーの新作アルバムを聴いた。「tradition」のMVを5回ほど見て底知れぬ才能を感じたといい、東京でライブをやってほしいと望んでいる。","今週のまとめ（2025/08/17）","https://note.com/beefbowl60/n/nb6fe18d0dc1c","2025-08-17","文脈"],["ダースレイダー寄席","固有名詞","筆者が8月5日にTwitch配信で見たお笑いのイベントである。ダースレイダーらがMCとライブを務め、複数の芸人がネタとトークを披露した。エル・カブキの漫才は安定の面白さだったと評し、初見の芸人との出会いもあったと書いている。","今週のまとめ（2025/08/17）","https://note.com/beefbowl60/n/nb6fe18d0dc1c","2025-08-17","文脈"],["今夜も星が綺麗","固有名詞","ダースレイダー寄席で筆者が初めて見たお笑いコンビである。ビルの窓掃除を題材にした漫才コントが面白かったと挙げ、M-1で準決勝まで進んだことがあるそうだと紹介している。配信イベントで新しい芸人を知る楽しみが表れている。","今週のまとめ（2025/08/17）","https://note.com/beefbowl60/n/nb6fe18d0dc1c","2025-08-17","文脈"],["AIで書けない記事","概念","最近の筆者がnoteを書くうえで心がけている方針である。AIでは書けないような、自分自身が読みたい記事を書くことを意識しているという。夏休みの週のまとめの中で、今週書いた記事を振り返る流れで表明された、書き手としての姿勢である。","今週のまとめ（2025/08/17）","https://note.com/beefbowl60/n/nb6fe18d0dc1c","2025-08-17","文脈"],["感覚が一部の人にでも伝われば、書く意味がある。","文","今週書いた記事について、筆者は「誰か一部の人にでも感覚が伝わったら嬉しい」を心がけていると述べる。多くの読者に向けた情報よりも、自分の感覚が少数にでも届くことを重視する、個人的な書き方の目標として示されている。","今週のまとめ（2025/08/17）","https://note.com/beefbowl60/n/nb6fe18d0dc1c","2025-08-17","文脈"],["パープレキシティ","固有名詞","AI検索の米スタートアップである。グーグルのブラウザー「クローム」に約5兆円の買収案を出したというニュースに筆者が注目した。以前はAppleがパープレキシティを買収するという噂が出ていたと思う、と一言添えて今週気になったニュースに挙げている。","今週のまとめ（2025/08/17）","https://note.com/beefbowl60/n/nb6fe18d0dc1c","2025-08-17","文脈"],["手元のレコードを一枚ずつ掛けることが、ささやかな楽しみになる。","文","筆者はレコードプレイヤーを買ってから、手元にあるレコード盤を掛けることが日々のささやかな楽しみになったと週のまとめの冒頭に書いている。ルーマニア・モンテビデオやIno Hidefumiの盤を写真で添え、聴く行為そのものを楽しんでいる様子がうかがえる。","今週のまとめ（2025/08/24）","https://note.com/beefbowl60/n/n14a0772d5d32","2025-08-24","文脈"],["INTJ（建築家）タイプ","概念","筆者が今週試した性格診断テストで判定された自分のタイプである。内向型と直感型に偏っているという結果だったと簡潔に記している。診断結果に対する評価や感想は特に書かず、一週間の出来事の一つとして淡々と報告するにとどめている。","今週のまとめ（2025/08/24）","https://note.com/beefbowl60/n/n14a0772d5d32","2025-08-24","文脈"],["菊地成孔の新音楽制作工房","固有名詞","筆者が今週聴いた音楽として挙げた、菊地成孔による新音楽制作工房の作品群である。2nd Spanky Happyの楽曲のカバーやリアレンジが中心だと紹介している。レコードを楽しむ日々の中で、週のまとめに記録しておきたい一枚として取り上げている。","今週のまとめ（2025/08/24）","https://note.com/beefbowl60/n/n14a0772d5d32","2025-08-24","文脈"],["Tatsuya Oe（Captain Funk）","固有名詞","筆者が今週聴いた音楽として挙げたアーティストである。モデルエレクトロニックレコーズからリリースされた一枚を紹介し、どこか懐かしいアーバンな雰囲気のファンクが良いと評している。菊地成孔の作品と並べて、今週の愛聴盤として記録している。","今週のまとめ（2025/08/24）","https://note.com/beefbowl60/n/n14a0772d5d32","2025-08-24","文脈"],["米粒写経のガラパゴスイッチ","固有名詞","筆者が週のまとめで取り上げた配信イベントである。ゲストはマッハスピード剛速球と片手袋研究家の石井公二で、石井がデイリーポータルZの記事をもとに「都市の謎を探求しよう」などのテーマで語った回として、本人の投稿を引いて紹介している。","今週のまとめ（2025/08/24）","https://note.com/beefbowl60/n/n14a0772d5d32","2025-08-24","文脈"],["退職は健康に良い影響をもたらすという調査結果がある。","文","筆者が今週気になったニュースとして挙げた話題である。慶大と早大の研究者らが50歳以上の約10万人を対象に、退職が健康に与える影響を調べた研究報告を紹介している。筆者は「退職は健康に良いそうだ」と短く受け止め、それ以上の論評はしていない。","今週のまとめ（2025/08/24）","https://note.com/beefbowl60/n/n14a0772d5d32","2025-08-24","文脈"],["ノートに願望を書く","概念","以前の記事の続編として、筆者が再び試した行為である。倍率が高そうな音楽ライブにどうしても行きたく、「チケットが当選する！」とノートに書いた。宝くじのような抽選に効くはずがないと思いつつ、半信半疑のまま願望を書き出してみたと振り返っている。","願望は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/n049569d2c512","2025-08-26","文脈"],["馬鹿げていると思いながら書いた願いが、なぜか叶う。","文","筆者はチケットの当落など宝くじのようなものだと考え、自分でも馬鹿げていると思いながらノートに願望を書いた。ところが午後6時の当落発表で当選しており、また願いが実現してしまったと驚いている。前回に続く二度目の実現だったことが驚きを大きくしている。","願望は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/n049569d2c512","2025-08-26","文脈"],["イープラス","固有名詞","筆者が行きたかった音楽ライブのチケット抽選を行ったプレイガイドである。当落発表は午後6時で、筆者はその時刻を待ちながら結果を確かめた。ノートに願望を書いた直後の抽選で当選しており、この記事の顛末を決定づける場面として登場している。","願望は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/n049569d2c512","2025-08-26","文脈"],["偶然だと思っても、続けば「あるとしか言えない」と感じる。","文","チケット当選という結果を受け、筆者は書いたからではなく偶々だろうと自分に言い聞かせている。しかし願望を書いて実現することが二度続き、正気ではいられないかもしれないと述べ、もはや効果は「あるとしか言えない」と半ば冗談めかして結論を保留している。","願望は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/n049569d2c512","2025-08-26","文脈"],["コクヨのノート","固有名詞","今回の願望を書くのに筆者が使ったノートである。前回の記事ではロルバーンを使っていたことを踏まえ、今回はロルバーンではなくコクヨだったと最後に付け加えている。道具が違っても願いが叶ったという点を、さりげなく記録にとどめる役割を果たしている。","願望は手帳に書くと実現するのか？","https://note.com/beefbowl60/n/n049569d2c512","2025-08-26","文脈"],["本の内容によるデバイスの使い分け","概念","筆者がKindle本を読むときの方針である。通常の書籍はiPhoneかiPad mini、マンガは主にiPad mini、雑誌や画像中心の書籍はiPad Proと、読む本の中身に合わせて機器を選んでいる。普段はiPhoneで読むことが最も多いと述べている。","読書に適したタブレットのサイズは？","https://note.com/beefbowl60/n/n62930095b987","2025-08-29","文脈"],["iPad mini（8.3インチ）","固有名詞","筆者が通常の書籍やマンガを読むときに使うタブレットである。マンガは基本的にこれで読んでいるが、昔の作品は絵や台詞が小さいことが多く物足りない場面もあるという。また雑誌や画像の多い書籍には8インチでは小さすぎると述べている。","読書に適したタブレットのサイズは？","https://note.com/beefbowl60/n/n62930095b987","2025-08-29","文脈"],["iPad Pro（13インチ）","固有名詞","筆者が雑誌や画像中心の書籍、昔のマンガを読むときに使うタブレットである。8インチでは小さすぎる本を読むのに必要だとし、個人的にはKindle読書に13インチのタブレットが必須になっていると述べている。大画面の必要性を実感している。","読書に適したタブレットのサイズは？","https://note.com/beefbowl60/n/n62930095b987","2025-08-29","文脈"],["昔のマンガは絵も台詞も小さく、大きな画面のほうが読みやすい。","文","筆者はマンガを基本的にiPad miniで読んでいるが、昔の作品は絵や台詞が小さいことが多いと気づいた。そうした作品はiPad Proの13インチ画面で読む方が読みやすい場合が多々あるとし、作品の年代によっても適した画面の大きさが変わると述べている。","読書に適したタブレットのサイズは？","https://note.com/beefbowl60/n/n62930095b987","2025-08-29","文脈"],["機器を減らしたくても、読書用の大画面だけは手放せない。","文","筆者は機器の数をなるべく減らして集約したいと考えている。しかし雑誌や昔のマンガを読むには13インチのタブレットが欠かせず、iPhoneやiPad miniと併用せざるを得ない。この点についてはまだ良い解が見つかっていないと、結論を保留している。","読書に適したタブレットのサイズは？","https://note.com/beefbowl60/n/n62930095b987","2025-08-29","文脈"],["月次レビュー","概念","筆者が月末に行う作業の一つである。毎週末に作る週次レビューを集約し、Macの標準メモに行ったイベントや読んだ本、購入したモノなどをまとめる。1か月を振り返って状況や総評を書き、次月の見通しや目標も簡単に設定している。","月末の作業","https://note.com/beefbowl60/n/nf4e36f18c958","2025-08-30","文脈"],["月末精算","概念","筆者が月末に行う金銭管理の作業である。管理アプリは使わず、銀行口座や証券口座の残高をまとめ、カードの使用履歴も確認してスプレッドシートにメモしている。日常の金銭管理は基本的にこれだけだと述べ、簡素な仕組みで回していることがわかる。","月末の作業","https://note.com/beefbowl60/n/nf4e36f18c958","2025-08-30","文脈"],["日付つきメモ帳としての紙のカレンダー","概念","筆者は月末に2か月表示の紙のカレンダーへ予定を書き込んでいる。予定表の母体はGoogleカレンダーで、壁に貼った紙のカレンダーは日付つきのメモ帳のような扱いだという。デジタルを主としつつ紙を補助に使う役割分担を示している。","月末の作業","https://note.com/beefbowl60/n/nf4e36f18c958","2025-08-30","文脈"],["GTD（Getting Things Done）","固有名詞","筆者が月次レビューを始めるヒントになった仕事術である。記事では『はじめてのGTD ストレスフリーの整理術』を紹介している。GTDをきっかけに始めた習慣だが、今はTODOの整理よりも記録をまとめて総括する方向に変化したと述べている。","月末の作業","https://note.com/beefbowl60/n/nf4e36f18c958","2025-08-30","文脈"],["月次レビューはTODOの整理より、記録を総括する場になった。","文","筆者はGTDをヒントに月次レビューを始めたが、続けるうちにやり方が変わった。今はタスクを整理するためではなく、週次レビューに記したイベントや本、買ったモノなどの記録をまとめて1か月を総括するスタイルに落ち着いたと振り返っている。","月末の作業","https://note.com/beefbowl60/n/nf4e36f18c958","2025-08-30","文脈"],["noteのモチベーション","概念","筆者は週のまとめの冒頭で、noteのモチベーションが下がり目だと打ち明けている。自分で書く意欲は落ちているものの、他の人の記事を読む方はまだ少し楽しめているという。書くことと読むことで気持ちに差が出ている状態を率直に記している。","今週のまとめ（2025/08/31）","https://note.com/beefbowl60/n/n2d476f6d2c4b","2025-08-31","文脈"],["決まった時間に更新される記事を読むことが、いつしか日課になる。","文","筆者は毎日同じ時間に更新される書き手の記事を読むのが日課のようになり、無意識のうちに楽しみにしていると気づいた。更新がないと何だか寂しいと感じるほどで、noteを書く意欲が下がる中でも読む楽しみは残っていると述べている。","今週のまとめ（2025/08/31）","https://note.com/beefbowl60/n/n2d476f6d2c4b","2025-08-31","文脈"],["『護道の完成』","固有名詞","筆者が今週読んだ本である。ストリートでの武勇伝から子の自閉症、脳波の話を経て護道へと展開していく流れがおもしろいと評している。話題が次々に移り変わりながら一つの武道論へ収束していく構成に、筆者は読みどころを見いだしている。","今週のまとめ（2025/08/31）","https://note.com/beefbowl60/n/n2d476f6d2c4b","2025-08-31","文脈"],["『グルメ外道』","固有名詞","筆者が今週読んだ新潮新書の一冊である。ふだんの「食」について考えさせられたと述べ、独特の文体にほぐされる感覚があったと評している。前週のまとめでも刺激的で面白かった本として挙げており、続けて読み進めていたことがうかがえる。","今週のまとめ（2025/08/31）","https://note.com/beefbowl60/n/n2d476f6d2c4b","2025-08-31","文脈"],["池田亮司（Ryoji Ikeda）","固有名詞","筆者が今週気になったニュースに登場した人物である。米誌タイムの「人工知能（AI）分野で最も影響力がある100人」に選ばれたという報道を紹介している。筆者は選出の話題そのものより、またライブに行きたいという思いを一言で添えている。","今週のまとめ（2025/08/31）","https://note.com/beefbowl60/n/n2d476f6d2c4b","2025-08-31","文脈"],["細野晴臣 I’m back from London!","固有名詞","7月のロンドン公演の凱旋として突如発表された細野晴臣の単独ライブである。筆者はイープラスの急な抽選で幸運にもチケットを得て、2025年9月4日に参加した。くくくやシャッポらと共演し、どの曲も痺れるほど最高だったと感想を記している。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["東京キネマ倶楽部","固有名詞","細野晴臣のライブ会場となった、JR鶯谷駅のそばにある会場である。筆者は初めて訪れ、開演30分前に着いて物販を物色した。観客は整理番号順に厳密にエレベータで6階まで運ばれ、高い位置にセカンドステージがある独特の空間だったと写真で紹介している。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["水原佑果","固有名詞","細野晴臣のライブで開演前にDJを務めた人物である。筆者によれば、会場の高い位置にあるセカンドステージから、細野曲の元ネタが多めの選曲を流していた。筆者はTwin Peaksの曲や「香港ブルース」などを含むセットリストの一部を書き留めている。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["音楽の神様が降臨する演出","概念","細野晴臣の登場場面を筆者が形容した言葉である。「美しき青きドナウ」が流れる中、細野がゆっくりと階段を降りてくる姿が、音楽の神様が降臨してくるように見えたという。その後デイジーのテーマ曲が鳴って本編が始まったと記している。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["「プリオシーヌ」","固有名詞","筆者がライブで特に印象に残ったと挙げた曲である。故・福澤もろのボーカルパートをくくくの2人が担い、シャーマニックな空間が再現されたという。筆者はこの曲をライブで聴ける日が来るとは思わず、なんと幸せなことだろうと喜びを記している。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["角銅真実","固有名詞","細野晴臣のライブに参加したくくくの一人である。筆者は、角銅真実が加わったことでリズムと音響空間の彩りや立体感が素晴らしかったと評し、「スポーツマン」のマリンバを例に挙げた。このメンバーで色々な曲を演ってほしいと妄想したと記している。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["シリーウォーク","概念","細野晴臣が「北京ダック」の後のMCで話題にしたものである。筆者のおぼえがきによれば、細野はイギリスの昔のコメディアンであるマックス・ウォールやジョージ・カールに触れ、来年はシリーウォークのコンテストをやりたいと語ったという。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["ヴァンパイア・ウィークエンド「2021」","固有名詞","ライブのアンコールで演奏された曲である。筆者のおぼえがきによれば、細野の『花に水』収録「TALKING」のメロディに歌を付けた楽曲で、元の英語詞の「2021」を「2025」に替えて歌われたという。後半の日本語詞はオリジナルかと推測している。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["満足感が大きいほど、待ちわびた催しが終わる寂しさも大きい。","文","アンコール後も拍手が鳴り止まず、最後に細野の孫である細野悠太が挨拶に出て公演はお開きになった。筆者は大きな満足感を得る一方で、1週間心待ちにしていたイベントが終わってしまった寂しさも大きかったと振り返り、帰りに駅近で食事をして余韻に浸った。","細野晴臣ライブ\"I’m back from London!\"の感想","https://note.com/beefbowl60/n/n5e9da3cc2b5b","2025-09-05","文脈"],["タナカカツキ『今日はそんな日』","固有名詞","筆者が今週読んだマンガ作品で、続編『今日もまたそんな日　超朝型ルーティン生活の愉しみ』と合わせて紹介している。毎朝4時に起きて決まったタスクをこなす日常を描いた作品だという。疲れで気力がないと書いた週に、筆者が手に取った本である。","今週のまとめ（2025/09/07）","https://note.com/beefbowl60/n/ndc97362fe0c7","2025-09-07","文脈"],["超朝型ルーティン","概念","タナカカツキのマンガ『今日もまたそんな日』の副題に含まれる言葉で、筆者はこの作品を毎朝4時に起きて決まったタスクをこなす日常を描いたものと紹介している。疲れで気力がないと記した週に、規則正しい生活を描く作品を読んでいた点が対照的である。","今週のまとめ（2025/09/07）","https://note.com/beefbowl60/n/ndc97362fe0c7","2025-09-07","文脈"],["毎朝同じタスクをこなす日常にも、確かな愉しみがある。","文","筆者が今週読んだタナカカツキの二冊は、毎朝4時に起きて決まったタスクをこなす日常を描いたマンガで、続編には「超朝型ルーティン生活の愉しみ」という副題が付く。筆者は疲れで気力がない週に、ルーティンを愉しむ生活を描いた作品を読んでいた。","今週のまとめ（2025/09/07）","https://note.com/beefbowl60/n/ndc97362fe0c7","2025-09-07","文脈"],["石破茂首相の辞任表明","固有名詞","筆者が今週気になったニュースとして挙げた出来事である。石破茂首相が首相官邸で臨時の記者会見を開き、退陣を決断した理由などを説明し、次期総裁選には出馬しないと表明したという日本経済新聞の記事を紹介している。筆者は「首相辞任表明」と一言添えるのみである。","今週のまとめ（2025/09/07）","https://note.com/beefbowl60/n/ndc97362fe0c7","2025-09-07","文脈"],["課題ばかりの武術稽古でも、久々に出れば楽しめる。","文","筆者はこの週、久々に武術の稽古へ出かけた。課題しかないと自己評価しつつも、これは楽しめたかなと振り返っている。平日は雷雨の中の出来事もあり、気持ちの淀みやプレッシャー、ストレスが続く中で、稽古がひとときの楽しみになったことがうかがえる。","今週のまとめ（2025/09/14）","https://note.com/beefbowl60/n/nab9ffa01f9fa","2025-09-14","文脈"],["『刑事コロンボとピーター・フォーク』","固有名詞","筆者が今週買った本で、副題は「その誕生から終幕まで」。久々にリアル書店で買ったハードカバー本で、ちょっと高かったと述べている。あわせて『刑事コロンボ研究 上』も紹介しており、刑事コロンボ関連の本を続けて手に取っていたことがわかる。","今週のまとめ（2025/09/14）","https://note.com/beefbowl60/n/nab9ffa01f9fa","2025-09-14","文脈"],["『刑事コロンボ研究』","固有名詞","筆者が今週いちおう読了した星海社新書の本である。面白いのか面白くないのか判断がつかないと述べ、賛否ありと評価を保留している。同じ週に『刑事コロンボとピーター・フォーク』も買っており、刑事コロンボへの関心が続いていたことがうかがえる。","今週のまとめ（2025/09/14）","https://note.com/beefbowl60/n/nab9ffa01f9fa","2025-09-14","文脈"],["ETV特集「POP 大滝詠一 幸せな結末」","固有名詞","筆者が今週見たテレビ番組である。さすがNHKと当時の資料映像の多さを評価し、楽しめたと述べている。初期ナイアガラ時代から「A LONG VACATION」に至るエピソードは何度も聞いたり読んだりして知っていたが、それでも番組を見終えた後に「君は天然色」を聴いたと続けている。","今週のまとめ（2025/09/14）","https://note.com/beefbowl60/n/nab9ffa01f9fa","2025-09-14","文脈"],["何度も知った話でも、改めて名曲を聴けば泣けてしまう。","文","筆者は大滝詠一を扱ったETV特集を見た。初期ナイアガラ時代から「A LONG VACATION」に至るエピソードはもう何度も聞いたり読んだりして知っている話だったが、番組を見終えた後に「君は天然色」を聴いたら、やっぱり泣けたと記している。","今週のまとめ（2025/09/14）","https://note.com/beefbowl60/n/nab9ffa01f9fa","2025-09-14","文脈"],["OS26","固有名詞","アップルが全OSを「26」に揃えて一斉公開した最新版である。筆者はiPhone、iPad、MacBook Airなど自宅のApple機器を一斉にアップデートした。最近使っていないWatchは見送ったという。デザインの変化に違和感を覚えつつ、使ううちに評価を改めていった。","OS26にアップデート","https://note.com/beefbowl60/n/nd2c44bd34012","2025-09-16","文脈"],["Liquid Glass","固有名詞","OS26で採用された新しいデザインである。筆者は、全体が丸っこく透明な雰囲気になった一方で、何かぼやっとした感じもあると述べている。カメラのアイコンが変わったのが最大の違いかと感じ、これが最新のデザインだと言われてもあまりピンと来ないと記している。","OS26にアップデート","https://note.com/beefbowl60/n/nd2c44bd34012","2025-09-16","文脈"],["新しいデザインへの違和感も、結局は慣れで片づいていく。","文","OS26にアップデートした筆者は、丸っこく透明になったデザインにちょっとした違和感を覚え、最新のデザインと言われてもピンと来なかった。それでも、結局は慣れなのだろうと受け止めている。違和感を否定せず、時間に委ねる姿勢をとっている。","OS26にアップデート","https://note.com/beefbowl60/n/nd2c44bd34012","2025-09-16","文脈"],["細かな動きのデザインの良さは、使い込んで初めて気づく。","文","筆者は記事の追記で、OS26を使い慣れていくうちに細かい動きのデザインが格段に良くなっていることに気づいたと書いている。第一印象では違和感が勝っていたが、評価が好転した。一方でバッテリー消費が早くなった点はマイナスだと付け加えている。","OS26にアップデート","https://note.com/beefbowl60/n/nd2c44bd34012","2025-09-16","文脈"],["NOLTY＜ティオ＞","固有名詞","筆者が昨年と今年、日記のようなものをメモするのに使ってきたウィークリーノートである。この週、渋谷のLOFTで来年の手帳を眺めながら、次の一冊を考えていた。これまでの記録の器として使い続けてきた手帳として紹介している。","今週のまとめ（2025/09/21）","https://note.com/beefbowl60/n/n2da6e89beaae","2025-09-21","文脈"],["ほぼ日5年手帳","固有名詞","筆者が渋谷のLOFTで来年の手帳を眺めていて、少し気になったという手帳である。昨年と今年はNOLTY＜ティオ＞に日記のようなものをメモしていたが、来年はこれもいいかもしれないと考えている。乗り換えるかどうかの結論はまだ出していない。","今週のまとめ（2025/09/21）","https://note.com/beefbowl60/n/n2da6e89beaae","2025-09-21","文脈"],["WILD SKETCH SHOW","固有名詞","2002年に行われたスケッチショーのライブで、筆者が見た週の金曜にYouTubeでライブ配信された。当時の表記は「ワイドゥド・スケッチ・ショー」だったと筆者は記し、今はないSHIBUYA-AXというホールで催された記憶があると振り返っている。","今週のまとめ（2025/09/21）","https://note.com/beefbowl60/n/n2da6e89beaae","2025-09-21","文脈"],["新しいデザインも慣れてしまえば、前よりも良いと思える。","文","筆者は前週の記事で違和感を覚えたOS26のデザインに、この週にはすっかり慣れた。今では前よりも絶対にいいと思うまでになったと評価を改めている。一方でMacBook Airが頻繁に発熱するようになったことだけは、唯一気になる点として挙げている。","今週のまとめ（2025/09/21）","https://note.com/beefbowl60/n/n2da6e89beaae","2025-09-21","文脈"],["iPhone 17 Pro","固有名詞","筆者が買い替えを検討している機種である。iPhone 17 Pro、Apple Watch 11、AirPods Pro 3をまとめて一度に買い替えようかと思案中で、費用は30万円くらいになると見積もっている。前週にはProを買うか悩んでいると書いており、迷いが続いている。","今週のまとめ（2025/09/21）","https://note.com/beefbowl60/n/n2da6e89beaae","2025-09-21","文脈"],["コールドスリープ","概念","筆者が今週気になったニュースとして挙げた、Perfumeの活動休止を指す言葉である。Perfumeが年内で活動をひと区切りし、2026年から「コールドスリープ」に入ると発表し、パワーアップしてカムバックしたいと明言したという音楽ナタリーの記事を紹介している。","今週のまとめ（2025/09/21）","https://note.com/beefbowl60/n/n2da6e89beaae","2025-09-21","文脈"],["欲求と満足のサイクル","概念","祝日に寝室にこもり天井を見ていた筆者が、自分の人生を言い表した言葉である。何も強く欲さず、その半分はネット通販で満たされるような虚しい循環のまま終わるのではないかと感じ、明日死んでも40年後に死んでも本質は変わらないのではとまで考えた。","憂・涼・買","https://note.com/beefbowl60/n/n53e6eff3133e","2025-09-24","文脈"],["明日死ぬのと40年後に死ぬのとの違いが分からなくなる日がある。","文","疲れを癒やすためにベッドに寝転がり続けた祝日、筆者は街に出る意欲も湧かず、欲求と満足を繰り返すだけの人生を思った。その憂いの中で、生きる時間の長さが本質的に何を変えるのか理解できなくなったと率直に書き留めている。","憂・涼・買","https://note.com/beefbowl60/n/n53e6eff3133e","2025-09-24","文脈"],["「発送しました」の通知が生きる活力になることもある。","文","何も欲しくない憂鬱な休日でも、筆者はメルカリで欲求を刺激されたアイテムを即断で買い、ポイント目当てにヤフーショッピングも初めて使った。届く「発送しました」の通知だけが活力を与えてくれると、消費に支えられる自分を自嘲気味に描いている。","憂・涼・買","https://note.com/beefbowl60/n/n53e6eff3133e","2025-09-24","文脈"],["快適な巣","概念","働くのを辞めたら日本中や世界中を旅行しようと考えていた筆者が、現実には面倒に感じ始めた自分の居場所を指した言葉である。興味のある場所は極端に限られており、結局は快適な巣に閉じこもりSNSで世の中を伺う典型に収斂するのかと自問している。","憂・涼・買","https://note.com/beefbowl60/n/n53e6eff3133e","2025-09-24","文脈"],["ダースレイダー＆DJオショウ「はぁ〜？」","固有名詞","退屈な祝日の夕方に筆者が聞いたYouTubeのラジオ番組である。聞いてみると面白く、バックナンバーが300回分くらいあるので、しばらく楽しめそうだと静かな安心感を得たという。憂鬱な一日の中で数少ない明るい手応えとして記されている。","憂・涼・買","https://note.com/beefbowl60/n/n53e6eff3133e","2025-09-24","文脈"],["つげ義春大全","固有名詞","退屈と怠惰の時間の中で、筆者がKindle版を1冊購入した漫画全集である。全20冊超で7万円以上するため少しずつ買っていきたいと述べ、こうやって生き延びるつもりでやっていると記す。集め続ける楽しみを生きる支えとしている。","憂・涼・買","https://note.com/beefbowl60/n/n53e6eff3133e","2025-09-24","文脈"],["中古CDの買い集め","概念","涼しくなった週に、筆者が暇つぶしとしてメルカリなどで続けていた趣味である。稽古を休んで運動不足が進む一方で、中古CDを買い集めていたという。いずれ記事にしたいネタだが需要はたぶんないと書き添え、半ば自嘲しながらも温めている題材である。","今週のまとめ（2025/09/28）","https://note.com/beefbowl60/n/nd8ad2469ee97","2025-09-28","文脈"],["需要がなさそうなネタほど、いつか書きたくなる。","文","週のまとめの中で、筆者は中古CDを買い集めていることに触れ、これはいずれ記事にしたいネタだと述べた。そのうえで需要はたぶんないと括弧書きで付け加えている。読者の反応より自分の関心を優先して書く題材を選ぶ姿勢がうかがえる。","今週のまとめ（2025/09/28）","https://note.com/beefbowl60/n/nd8ad2469ee97","2025-09-28","文脈"],["ほぼ日5年手帳","固有名詞","筆者が来年からの日記記録として使ってみることにした手帳である。人生の5年間を残せる一冊とうたわれている。この週の時点ではまだ到着しておらず、届いたら来週何か書いてみたいと楽しみにしている様子が記されている。","今週のまとめ（2025/09/28）","https://note.com/beefbowl60/n/nd8ad2469ee97","2025-09-28","文脈"],["暇と退屈の倫理学","固有名詞","筆者がこの週に読んでいる本として挙げた一冊（新潮文庫）である。ところが暇が足りないので本当に少しずつしか読めていないと書いている。暇と退屈を論じる本を、暇のなさのせいで読み進められないという皮肉な状況が一言で表されている。","今週のまとめ（2025/09/28）","https://note.com/beefbowl60/n/nd8ad2469ee97","2025-09-28","文脈"],["暇を論じる本ほど、暇がないと読み進められない。","文","週のまとめで『暇と退屈の倫理学』を読書中の本に挙げた筆者は、暇が足りないので本当に少しずつ読んでいると添えた。暇つぶしに中古CDを集めていると書いた同じ週に、暇が足りないと嘆いてもいる。暇と退屈をめぐる感覚の揺れが垣間見える一言である。","今週のまとめ（2025/09/28）","https://note.com/beefbowl60/n/nd8ad2469ee97","2025-09-28","文脈"],["ウーブン・シティ","固有名詞","トヨタ自動車が静岡県裾野市につくった実証都市で、この週に開業したというニュースを筆者は気になったニュースの筆頭に挙げた。新たな製品やサービスを生み出す場とされ、筆者はWOVEN CITYに移住してみたいという願望が少しだけあると記している。","今週のまとめ（2025/09/28）","https://note.com/beefbowl60/n/nd8ad2469ee97","2025-09-28","文脈"],["NOLTY＜ティオ＞A5","固有名詞","筆者がここ2年ほど日々の記録を残してきた手帳である。来年の日記帳をどうするか考える中で、1年ごとに一冊を使うこの形から、5年分を一冊にまとめる連用手帳への切り替えを検討するきっかけとして、これまでの記録の器として紹介されている。","「ほぼ日5年手帳」は今日から使い始められる","https://note.com/beefbowl60/n/n0764eb72bc9c","2025-09-29","文脈"],["連用日記","概念","1ページに複数年分の同じ日を書き込める日記の形式で、筆者が来年の日記帳として選んだものである。ほぼ日でなくてもよかったが、A6サイズの連用日記はあまりないと気づいたことが、ほぼ日5年手帳に決めた理由の一つになったと述べている。","「ほぼ日5年手帳」は今日から使い始められる","https://note.com/beefbowl60/n/n0764eb72bc9c","2025-09-29","文脈"],["5年を一冊にすれば、手軽に読み返す楽しみが生まれる。","文","来年の日記帳を考えていた筆者は、1年分の手帳を毎年替えるより、5年を一冊にできれば効率もよいと考えた。さらに一冊にまとまっていれば手軽に読み返せて楽しいだろうと思ったことが、連用手帳を試してみる動機になったと振り返っている。","「ほぼ日5年手帳」は今日から使い始められる","https://note.com/beefbowl60/n/n0764eb72bc9c","2025-09-29","文脈"],["新しい手帳は、来年を待たずに今日から使い始めてよい。","文","2026年から始まるほぼ日5年手帳を開封した筆者は、見開き右上のスペースに今年の分を書き込めることに気づいた。そこで来年を待たずに届いた日から書き始めることにし、新しい手帳はやはり気分が上がると結んでいる。","「ほぼ日5年手帳」は今日から使い始められる","https://note.com/beefbowl60/n/n0764eb72bc9c","2025-09-29","文脈"],["想像もできない5年後","概念","5年分書ける手帳を使い始めた筆者が、書き終えるころの未来を指して述べた言葉である。来年から始めれば2030年までと区切りもよいと喜ぶ一方、5年後という想像もできない未来まで記録が続くだろうかと、少しの不安とともに問いかけている。","「ほぼ日5年手帳」は今日から使い始められる","https://note.com/beefbowl60/n/n0764eb72bc9c","2025-09-29","文脈"],["AppleWatch","固有名詞","筆者が5年ほど前に買ったものの、「タッチで支払い」機能を一度も使っていなかった腕時計型端末である。ある日急に思い立って支払いの設定をし、コンビニのセルフレジで試したところ、なんとなく便利かもしれないという控えめな感想を残している。","AppleWatchで支払いをした日","https://note.com/beefbowl60/n/ndb1786cb7adc","2025-10-03","文脈"],["Suica","固有名詞","筆者がAppleWatchでの支払いを放置してきた理由に関わる交通系ICカードである。スマホ本体のSuicaがWatchに移るのは困り、2枚持つのも煩わしいと感じていた。最終的にはWatch用のSuicaを新規作成して転送し、1000円をチャージして使い始めた。","AppleWatchで支払いをした日","https://note.com/beefbowl60/n/ndb1786cb7adc","2025-10-03","文脈"],["面倒だと思い込んでいた設定も、やってみれば10分で終わる。","文","AppleWatch用のSuicaを新規作成して転送する作業について、筆者はすごく面倒なイメージを持っていた。ところが急に思い立って試してみると10分もかからず完了し、5年間放置していた機能があっさり使えるようになったと記している。","AppleWatchで支払いをした日","https://note.com/beefbowl60/n/ndb1786cb7adc","2025-10-03","文脈"],["腕を不自然に曲げてピッとやる人","概念","AppleWatchで支払えるようになった筆者が、自分の変化をユーモラスに表した言葉である。スマホでピッとやる人から、腕を不自然に曲げてピッとやる人に「進化」したと書き、新しい便利さに伴うぎこちなさを自嘲気味に描いている。","AppleWatchで支払いをした日","https://note.com/beefbowl60/n/ndb1786cb7adc","2025-10-03","文脈"],["新しい支払い手段は、空いた時間のセルフレジで試すのがいい。","文","Watchでの支払いを設定した筆者は、お客さんの少ない午後のコンビニのセルフレジで最初の支払いを試した。人目を気にせず慣らしてから、次は週末に駅の改札で試してみようと、段階を踏んで新しい習慣に移ろうとしている。","AppleWatchで支払いをした日","https://note.com/beefbowl60/n/ndb1786cb7adc","2025-10-03","文脈"],["極早生みかん","概念","仕事で地方に出かけた筆者が知人からもらったミカンで、そう呼ぶらしいと紹介している。皮は少し青いが甘みがあって美味しかったという。同じ週に届いたシャインマスカットと並び、涼しくなる中で秋の味覚が充実してきたことを感じさせる話題である。","今週のまとめ（2025/10/05）","https://note.com/beefbowl60/n/nb5a91db46022","2025-10-05","文脈"],["スマホを取り出さずに済むのは、地味だが確かな便利さだ。","文","AppleWatchにSuicaを登録した筆者は、週末に初めて改札を通った。左腕に付けているのでスマホでタッチするより少しスムーズさに欠けるが、いちいち取り出さなくていいのは地味に便利かもと感じ、Watchの活用が広がりそうだと楽しみにしている。","今週のまとめ（2025/10/05）","https://note.com/beefbowl60/n/nb5a91db46022","2025-10-05","文脈"],["つげ義春大全 第十一巻「女忍 鬼面石」","固有名詞","筆者がこの週に読んだつげ義春の全集の一冊である。初期作品の中でも少し後半に位置するのかと推測しつつ、画のタッチが作品ごとに大幅に違うことに驚いている。現代を舞台に社会問題をテーマにした作品もあり、興味深く読めたと記している。","今週のまとめ（2025/10/05）","https://note.com/beefbowl60/n/nb5a91db46022","2025-10-05","文脈"],["ザ・マジック","固有名詞","筆者がこの週に読んでいる本として挙げた一冊である。YouTubeで見て興味を持った「感謝ワーク」が載っており、全28日間のワークを試しに1週間続けている。まだ4分の1だが、効果はあるような気はしていると控えめに手応えを述べている。","今週のまとめ（2025/10/05）","https://note.com/beefbowl60/n/nb5a91db46022","2025-10-05","文脈"],["感謝ワーク","概念","筆者がYouTubeで見て興味を持ち、『ザ・マジック』に沿って試している習慣である。全部で28日間あるうちの1週間を終えたところで、何か効果があるかと問われれば、あるような気はしていると書く。結論は保留しつつ続けている段階である。","今週のまとめ（2025/10/05）","https://note.com/beefbowl60/n/nb5a91db46022","2025-10-05","文脈"],["世界も日本も、少しずつだが確実に変わっていく。","文","週のまとめの最後に、筆者は時事ネタのメモとして坂口安吾の書簡発見、マスク氏の純資産、自民党で史上初の女性総裁誕生などのニュースを並べた。それらを眺めたうえで、世の中は少しずつだが確実に変わっていくものだと実感したと結んでいる。","今週のまとめ（2025/10/05）","https://note.com/beefbowl60/n/nb5a91db46022","2025-10-05","文脈"],["ミックスアップ（MIX-UPシリーズ）","固有名詞","筆者が5枚買い揃えてコンプリートし、ここ半月ほどそれだけを聴いているミックスCDのシリーズである。ジェフ・ミルズのライブ録音盤が特に有名だが、他のDJもいいプレイをしていて甲乙つけがたいと評し、いずれコンプリート記念の感想記事を書きたいとしている。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["体の一部で支払いが済むのは、もはや魔法だ。","文","今月から使い始めたAppleWatchでの支払いに慣れてきた筆者は、この機能のためだけにWatchを使う価値があると実感するほどになった。なぜ今まで使っていなかったのかと振り返り、体の一部で支払いが完了することを魔法のようだと表現している。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["Kindleセール","概念","頻繁に開催されているのに、筆者が毎回つい乗せられて本を買ってしまうセールである。この週も古井由吉の短篇集やつげ義春の全集、紀行エッセイ、日記類などをまとめ買いした。安くなっているという理由が、読書の範囲を広げるきっかけにもなっている。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["古井由吉","固有名詞","筆者がKindleセールで『木犀の日』と『野川』をまとめて買った作家である。確か細野晴臣の著作に名前が出ていたと思う、という曖昧な記憶を手がかりに手に取っている。好きな音楽家の本から読書の関心がつながっていく様子がうかがえる。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["忍者秘帳","固有名詞","つげ義春大全の第九巻に収められた作品で、筆者は「忍者武芸帳」のようなタッチで描かれていると紹介する。話の途中で突然終わり、大全2巻を費やした割には微妙な評価になると率直に述べつつ、主要人物が呆気なく残酷な死に方をするところはよいと評価している。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["旅欲","概念","つげ義春の『つげ義春とぼく』『貧困旅行記』『つげ義春日記』といった紀行エッセイや日記類を安くまとめ買いした筆者が、読みながら感じたものである。これらの本によって旅に出たい気持ちが適度に刺激されると書き、旅への欲を本で満たしている。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["こじれた相手に感謝するワークは、なかなかつらい。","文","『ザ・マジック』の感謝ワークを続けている筆者は、関連する『ザ・シークレット』もセールで購入した。ワーク15日目のお題「人間関係がこじれた人に感謝」については、なかなかつらいものがあったと正直に振り返っている。","今週のまとめ（2025/10/16）","https://note.com/beefbowl60/n/nb1a51d97019c","2025-10-12","文脈"],["緑道ウォーキング","概念","スポーツの日に筆者が近所の緑道で行った1時間ほどの散歩である。1kmを2往復して約5キロ歩いた。休日で歩きやすい気温だったうえに人が少なくて快適だったと記し、録音したラジオを聞きながら歩く時間を写真とともに残している。","緑道散歩","https://note.com/beefbowl60/n/nedbedbb62894","2025-10-14","文脈"],["録音したラジオを聴きながら歩くと、散歩が充実する。","文","スポーツの日の緑道散歩で、筆者は録音しておいたラジオ番組を聞きながら1時間ほど歩いた。朝の帯番組と深夜の音楽番組をあらかじめアプリで保存しておき、人の少ない快適な道で耳を満たしながら歩く過ごし方を紹介している。","緑道散歩","https://note.com/beefbowl60/n/nedbedbb62894","2025-10-14","文脈"],["武田砂鉄 ラジオマガジン","固有名詞","文化放送で10月から始まった朝の帯番組で、筆者が最近よく聴いているものである。緑道散歩の際に録音を聞いた番組の一つとして挙げている。政治や経済から芸能、カルチャーまで、大事なことから大事じゃなさそうなことまでを扱う番組と紹介されている。","緑道散歩","https://note.com/beefbowl60/n/nedbedbb62894","2025-10-14","文脈"],["細野晴臣 デイジーホリデー","固有名詞","interFMで放送されている深夜の番組で、筆者が毎週聴いているものである。散歩中に聞いた回はゲストが高野寛で、怪しい話が多かったと一言添えている。音楽家の細野晴臣が古い音楽から新しい響きまでを笑いとともに紹介する番組である。","緑道散歩","https://note.com/beefbowl60/n/nedbedbb62894","2025-10-14","文脈"],["らじれこ","固有名詞","筆者がラジオ番組をローカルに保存するために使っているアプリである。散歩で聞く番組もこれで録音している。Windows版のソフトで、筆者はParallelsをほとんどこのソフトのために使っているようなものだと書き、ラジオ録音へのこだわりをのぞかせている。","緑道散歩","https://note.com/beefbowl60/n/nedbedbb62894","2025-10-14","文脈"],["小松崎茂","固有名詞","MIX-UPシリーズ全5枚のジャケットを描き下ろした、空想科学イラストの第一人者である。筆者は統一感のある絵柄がコレクション欲をそそると評価し、スリーブにプラモデルの組み立て説明図まで封入された徹底した凝り方に感嘆している。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["サブスク時代には、手の込んだCDのアートワークこそ稀有になる。","文","MIX-UPシリーズを揃えた筆者は、描き下ろしイラストやプラモデル風の説明図まで備えたパッケージに驚いた。サブスクに無数のDJミックスが溢れる今、これほど手間をかけた作りは珍しいと述べ、CDパッケージに予算がかけられた古き良き時代を懐かしんでいる。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["時代の空気の真空パック","概念","筆者が石野卓球によるMIX-UP Vol.1を評した言葉である。シリーズで群を抜いてポップなテクノミックスで、コミカルな声ネタは90年代の電気グルーヴを思わせる。その徹底したポップさが強烈な時代性を与え、今聴くとかえって新鮮に響くと述べている。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["ジェフ・ミルズ「MIX-UP Vol.2」","固有名詞","新宿リキッドルームでの夜をライブ録音した、ライブMIXの歴史的名盤である。筆者は良質とは言えない音が逆にフロアの熱気を伝えると評し、ハードバップのスリルや濃いブラックコーヒーのような中毒性を感じ取る。シリーズ随一の普遍性を持つ本物のテクノだとしている。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["「聴かせる」ミックス","概念","筆者がケン・イシイのMIX-UP Vol.3を形容した言葉である。愛するトラックをジャンル横断で丁寧に紡ぎ、彼のレコード棚を覗くような楽しさがあるという。ライブ感より楽曲の魅力を重視したシンプルな繋ぎで、アフリカ・バンバータから坂本龍一への繋ぎは発明だと称えている。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["田中フミヤ「MIX-UP Vol.4」","固有名詞","大阪のクラブ・ロケットでのライブ録音で、筆者は小さなクラブの熱気が直接伝わってくると評する。巨大なドリルで地中を進むようなジャケット通り、分割なしの1トラック仕様である。ジェフ・ミルズほどストイックでなく、どこかセクシーでノリやすいと述べている。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["デリック・メイ「MIX-UP Vol.5」","固有名詞","シリーズ最終作で、デトロイト・テクノのレジェンドによるミックスである。筆者は意外にもシリーズ随一のお洒落なハウス・テクノだと驚き、多彩なギミックでファンキーなビートを繋ぐ技と遊び心を堪能できると評している。「MAYDAY MIX」と同じ内容だという。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["その日の気分でベストの1枚を選べることは贅沢だ。","文","MIX-UPシリーズ5枚を合計4200円ほどで揃えた筆者は、内省したいときはジェフ・ミルズ、集中したいときは田中フミヤ、リラックスしたいときはケン・イシイかデリック・メイと聴き分けている。世界最高のDJたちが日々を彩ってくれると喜んでいる。","「MIX-UP」のある生活","https://note.com/beefbowl60/n/nc45897209f36","2025-10-15","文脈"],["4週間の柔軟チャレンジ","概念","体の柔軟性を上げたいと思い立った筆者が始めた取り組みである。目標はベターっと180度の開脚と、手の平がペターッと床に着く前屈の二つ。本には4週間でできるようになると書いてあるが果たしてと半信半疑のまま、毎日ストレッチをすると決めている。","体の柔軟UPに挑戦","https://note.com/beefbowl60/n/n59776af77acd","2025-10-18","文脈"],["どんなに体がかたい人でもベターッと開脚できるようになるすごい方法","固有名詞","体の柔軟性を上げたいと考えた筆者が、図書館で借りてきた2冊のうちの1冊である。180度の開脚を目標とする本で、4週間でできるようになると書かれている。筆者はその効果に半信半疑ながら、毎日ストレッチをして経過を報告すると宣言している。","体の柔軟UPに挑戦","https://note.com/beefbowl60/n/n59776af77acd","2025-10-18","文脈"],["どんなに体が硬くてもペターッと前屈できる本","固有名詞","筆者が開脚の本と合わせて図書館で借りてきた、前屈のための本である。手の平がペターッと床に着く前屈を目標に掲げている。体の柔軟性を上げたいという思いから、開脚と前屈の二本立てでストレッチに取り組むことにしたと記している。","体の柔軟UPに挑戦","https://note.com/beefbowl60/n/n59776af77acd","2025-10-18","文脈"],["結果を報告すると決めてから、新しい習慣を始める。","文","図書館で開脚と前屈の本を借りた筆者は、本の「4週間でできる」という言葉に半信半疑でいる。それでも毎日ストレッチをして、4週間後に経過を報告したいと記事の最後で宣言し、読者の前で取り組みの期限を区切っている。","体の柔軟UPに挑戦","https://note.com/beefbowl60/n/n59776af77acd","2025-10-18","文脈"],["お金持ちになれる黄金の羽根の拾い方","固有名詞","ウォーキングとストレッチに専念した週に、筆者が再読した本である。読み返してみて、自分の人生的にもかなり影響を受けていたことを実感したという。そのうえで今の自分のテーマは「FIのその先」だと述べ、本から受けた影響の次の段階に目を向けている。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["再読すると、その本から受けた影響の大きさに気づく。","文","週のまとめで、筆者は『お金持ちになれる黄金の羽根の拾い方』を読み返した。改めて読むと、自分の人生にかなりの影響を与えていた本だったと実感したと書く。初読のときには見えなかった自分との関わりが、時間をおいた再読で浮かび上がっている。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["FIのその先","概念","『お金持ちになれる黄金の羽根の拾い方』を再読した筆者が、今の自分のテーマとして掲げた言葉である。この本から人生的にかなり影響を受けたと実感したうえで、経済的自立を達成することそのものより、その後をどう生きるかに関心が移っていることがうかがえる。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["繰り返し聴くほど、味がしてくる音楽がある。","文","今週書いた記事を振り返る中で、筆者は今も毎日同じ作品だけを聴いていると報告している。飽きるどころか、聞けば聞くほど味がしてきていると書き、同じものを毎日繰り返し聴き込むことで楽しみが深まっていく感覚を記している。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["カフェワーク","概念","週の後半にやや調子が下降気味だったと振り返る筆者が、大事だと強調した過ごし方である。この週はベローチェやイタトマにも足を運んだという。ウォーキングやストレッチと並んで、場所を変えて作業することが日々の調子を支える習慣として挙げられている。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["ハイスクール！奇面組","固有名詞","筆者が週の時事メモに残したニュースの一つで、39年ぶりに完全新作のテレビアニメが制作され、来年1月からフジテレビ系のノイタミナ枠で放送されるという話題である。一堂零役の関智一らキャスト7人が発表されたと伝えている。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["同姓同名の世界最大の集まり","概念","筆者が時事メモに残したニュースの話題である。同姓同名の人の世界最大の集まりを目指して、全国から「タナカヒロカズ」さん150人が渋谷に集まったが、ギネス記録の更新はならなかったという。大谷翔平や連立政権の話題と並ぶ、ささやかな珍事である。","今週のまとめ(2025/10/19)","https://note.com/beefbowl60/n/nfd23113ff6cc","2025-10-19","文脈"],["AirPods Pro 3","固有名詞","音楽を聴く機会が増え、筆者が欲しくなったAppleのイヤホンである。4万円近い価格が心理的に重く、メルカリで何かを売って資金を作ろうと考えるが、出品の手間が面倒でジレンマに陥る。同時翻訳機能次第という迷いも残し、欲しい気持ちを転がして味わっている。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["心の収支","概念","AirPods Pro 3の購入を前に、筆者が持ち出した考え方である。財政の規律を保つため、不用品をメルカリで売ってお金が減るマイナス感を和らげようとする。実際の損得よりも、気持ちの上で出入りの帳尻を合わせることを重んじている。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["コメ活","概念","コメダ珈琲でコーヒーを飲みながら思索する筆者の習慣である。平日昼間の空いた店内で、一人で作業する他人をぼんやり眺めるのも楽しみの一つだという。この週はそこで2025年の記録を振り返り、今年の総括を始めた。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["記録があるから、今の自分と過去の自分を比べられる。","文","コメ活で2025年のノートを振り返った筆者は、改善は記録から始まると考えた。試しに10年前の記録を読むと環境も心境もまるで別人で、紆余曲折の中にも良くなった点が多く見つかり、現在の自分への肯定感が上がったと述べている。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["『ゆるい生き方』","固有名詞","筆者がブックオフで200円で入手した本である。時間、場所、人間関係、お金、服装、常識に縛られないことをゆるい生き方とする。筆者はすでに場所・人間関係・お金には縛られていないとし、次は時間と服装と常識の解放だと受け止めた。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["競争社会からは、隠れて忍んで紛れ込みながら逃げる。","文","『ゆるい生き方』を読んだ筆者は、効率を追うパラノ駆動型の競争社会からの離脱を前提としつつ、常識を切り捨てて世間と対立すればむしろハードになると考えた。暫定解として、内的に逃走しながら集合に紛れて生きることを選んでいる。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["ライカM EV1","固有名詞","筆者が今週気になったニュースとして挙げたカメラである。ライカMシリーズ初のEVF内蔵機で、ライブビュー撮影専用のMマウント機として発売されると報じられた。筆者はEVFを備えたMマウント機を使ってみたいと関心を示している。","今週のまとめ（2025/10/26）","https://note.com/beefbowl60/n/nc4fd63443858","2025-10-26","文脈"],["AirPods Pro 3","固有名詞","散々迷った末に筆者が約38,200円で購入したイヤホンである。それまで使っていた初代AirPods Proと比べ、やや大きく異物感はあるものの、低音の強さに最も進歩を感じた。毎日音楽を聴くのが楽しくなり、買ってよかったと満足している。","AirPods Pro3を購入した話","https://note.com/beefbowl60/n/ne424b5cbb4fe","2025-11-01","文脈"],["怖いくらいの静寂","概念","AirPods Pro 3のノイズキャンセリングを筆者が表した言葉である。カフェでは店内のBGMが消えて聴いている曲だけが残る状態になり良いと評価する。一方で周囲の気配が分からず、キーンとした感じや風圧への反応もあり、外では注意が要ると述べている。","AirPods Pro3を購入した話","https://note.com/beefbowl60/n/ne424b5cbb4fe","2025-11-01","文脈"],["会話感知","概念","AirPods Pro 3の機能で、喋り始めると自然に音量が下がり外の声が聞こえるようになる。Apple製品との連携の快適さに触れた流れで筆者が紹介したが、この機能にはまだ慣れていないと正直に書いており、評価は保留のままである。","AirPods Pro3を購入した話","https://note.com/beefbowl60/n/ne424b5cbb4fe","2025-11-01","文脈"],["ライブ翻訳","概念","筆者がAirPods Pro 3に期待を寄せる機能である。購入前から非日本語話者との会話に使えるかを気にしていたが、購入後も最終的な評価はこの機能の出来次第だとしている。使うにはiPhoneも新調しなければならないと付け加えている。","AirPods Pro3を購入した話","https://note.com/beefbowl60/n/ne424b5cbb4fe","2025-11-01","文脈"],["買い替えを遅らせると、数年分の進化をまとめて味わえる。","文","筆者は2019年頃の初代AirPods Proから最新のAirPods Pro 3へ買い替えた。そろそろ替え時だったかもしれないと振り返りつつ、使い心地、ノイズキャンセリング、音質と項目ごとに比べ、5年分の進化を体感して満喫していると書いている。","AirPods Pro3を購入した話","https://note.com/beefbowl60/n/ne424b5cbb4fe","2025-11-01","文脈"],["聴き直しの儀式","概念","AirPods Pro 3を買った筆者が、ヘッドフォンの新調につきものだと感じた行為である。今まで聞こえなかった音が聞こえると感動し、色々な曲をひとしきり聴いてみる。QOL爆上がりという月並みな感想しか出ないが、それも含めてそういうものだと受け止めている。","今週のまとめ（2025/11/02）","https://note.com/beefbowl60/n/n67a68c82e463","2025-11-02","文脈"],["新しいものを買うと、生活に小さな刺激と潤いが生まれる。","文","AirPods Pro 3の購入を振り返る中で筆者が書いた実感である。ライブ翻訳にはApple Intelligence対応のiPhoneが必要と知り、これを言い訳にiPhoneまで新しくしたい欲望が生まれた。買い物が次の欲望を呼ぶ連鎖も含めて楽しんでいる。","今週のまとめ（2025/11/02）","https://note.com/beefbowl60/n/n67a68c82e463","2025-11-02","文脈"],["iPad mini","固有名詞","カフェで隣の客がiPad miniを壁に無造作に立てかけ、Bluetoothキーボードで文章を作っていた姿を筆者はかっこいいと感じた。自分も真似したくなりキーボードを物色したが、軽くて丈夫で高品質なものが見つからず、時間をかけて探すことにしている。","今週のまとめ（2025/11/02）","https://note.com/beefbowl60/n/n67a68c82e463","2025-11-02","文脈"],["他人の何気ない作業姿が、次に欲しいものを連れてくる。","文","筆者はカフェで、iPad miniにキーボードをつないで文章を書く隣客の様子に惹かれ、すぐにキーボードを探し始めた。広告や評判ではなく、見知らぬ人の道具の使いこなしぶりが物欲のきっかけになった場面として記録されている。","今週のまとめ（2025/11/02）","https://note.com/beefbowl60/n/n67a68c82e463","2025-11-02","文脈"],["Audible","固有名詞","イヤホンを新調したタイミングで無料期間が発生していたため、筆者が再加入したサービスである。色々と再生してみたものの、実は朗読を聞くのは苦手で頭に入ってこないと告白しており、今回は続くかどうかと半信半疑のまま様子を見ている。","今週のまとめ（2025/11/02）","https://note.com/beefbowl60/n/n67a68c82e463","2025-11-02","文脈"],["米粒写経のガラパゴスイッチ","固有名詞","筆者がこの週に観たライブとして挙げている。ゲストに丸屋九兵衛を迎え、「FAST FOOD FANTASY」をテーマとしたトークが行われた回である。ネタコーナーにはマザー・テラサワも出演し、公式の告知によれば次回は新宿レフカダで開催される。","今週のまとめ（2025/11/02）","https://note.com/beefbowl60/n/n67a68c82e463","2025-11-02","文脈"],["『君たちはFIRE後どう生きるか』","固有名詞","筆者がKindle Unlimitedに加入して読んだ、FIREした20人の寄稿を集めた本である。資産額が公開されている点や、予想より分量が多い点を評価し、とても面白いと述べる。未来の働き方や暮らし方を考えるうえで大いに参考になったとまとめている。","FIRE後どう生きるか？","https://note.com/beefbowl60/n/na3e5618e3750","2025-11-03","文脈"],["FIRE後の生きがい","概念","『君たちはFIRE後どう生きるか』の中で、筆者が特にリアルで良いと感じた項目の一つである。「FIREに踏み切る際の気持ち」と並び、辞めた後に何を目標とし何に生きがいを見出すかという部分に、20人それぞれの実感が表れていると受け止めている。","FIRE後どう生きるか？","https://note.com/beefbowl60/n/na3e5618e3750","2025-11-03","文脈"],["早期リタイアへの道も、その後の暮らしも人それぞれだ。","文","20人のFIRE体験記を読んだ筆者の感想である。FIREに至る過程も、その後のことも人によって異なり、様々な視点から語られるため気づきが多かったという。一つの正解ではなく、多様な実例を並べて読めることに本の価値を見ている。","FIRE後どう生きるか？","https://note.com/beefbowl60/n/na3e5618e3750","2025-11-03","文脈"],["他人の実例集は、自分の将来の働き方を考える材料になる。","文","筆者はFIRE民20人の寄稿集を読み、FIREに踏み切る際の気持ちや資産額の公開といった具体的な記述にリアリティを感じた。そうした多様な実例に触れたことが、未来の働き方・暮らし方を考えるうえで大いに参考になったと読書を締めくくっている。","FIRE後どう生きるか？","https://note.com/beefbowl60/n/na3e5618e3750","2025-11-03","文脈"],["Apple Pencil Pro","固有名詞","筆者がiPad mini（A17）用に新調したものの、稼働率が著しく低いペンである。13インチのiPadではGoodnotesで手書きメモをしていたが、miniでは画面が小さく書きづらいことが原因とみる。使い方を模索し、不要なら処分も考えている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["リスタートとしてのRE","概念","『君たちはFIRE後どう生きるか』で、FIREの「RE」がリタイア・アーリーではなくリスタートと捉えられていることを筆者が紹介したもの。仕事を完全にやめた人は少数で、SNSや投資、YouTubeの収益化などで収入を得ている人が多いと読み取っている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["FIREへの道のりは様々でも、出口はそれほど多様ではない。","文","FIRE実録本を読んだ筆者の印象である。登場するのは平均して30〜40代、資産5千万〜1億円ほどで会社員をやめ、ネット事業などで独立した人たちだった。至る道は色々でも、辿り着く先は似通っていると筆者は感じている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["『いつまでもデブと思うなよ』","固有名詞","レコーディングダイエットを再開したのを機に筆者が再読した本である。カロリー管理アプリでは続かないと実感し、紙のノートで記録し始めたところ、今のところ順調に続いているという。紙の方が記録を振り返りやすいとも述べている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["記録は厳密にやるより、ラフにして続けるほうがいい。","文","レコーディングダイエットを紙のノートで再開した筆者の気づきである。カロリーの数値を厳密に管理しようとすると窮屈すぎて続かない。アプリで挫折した経験を踏まえ、ざっくりと記録して習慣を途切れさせないほうが良いのかもしれないと考えている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["下降の角度","概念","筆者は体重を表計算に手入力し、グラフを眺めること自体を楽しんでいる。スマホのアプリでは縦軸の範囲を設定できず、グラフに下降の角度がつかないため楽しくないという。数字の変化を目に見える傾きとして味わうことが、記録を続ける動機になっている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["『はじめての老い』","固有名詞","noteで連載されていた老いの体験エッセイをまとめた本で、筆者は一気読みした。まだ著者ほどの老いには達していないとしつつ、かなり面白く、文体やスタンスも好きだという。読後、科学未来館の「老いパーク」にも行ってみたくなったと書いている。","今週のまとめ（2025/11/09）","https://note.com/beefbowl60/n/n57dec52a9b81","2025-11-09","文脈"],["相場がどう動こうと、自分の航路を守って淡々と続ける。","文","株式市場が上昇基調の中、筆者は10月末の資産集計後にリバランスや円転、翌年のNISA枠に充てる資金の準備を進めていた。今後相場がどう変化してもやることは変わらないと述べ、自分の方針を淡々と継続する姿勢を示している。","役に立った投資本","https://note.com/beefbowl60/n/n91ddc1d2907e","2025-11-16","文脈"],["『ほったらかし投資術』","固有名詞","筆者の投資方針の土台となった山崎元の本である。低コストのインデックスファンドによるバイ・アンド・ホールド、「ドルコスト平均法は気休め」という考え、NISA成長投資枠は年始にまとめて買うのが合理的という点を、自己検証を経て取り入れている。","役に立った投資本","https://note.com/beefbowl60/n/n91ddc1d2907e","2025-11-16","文脈"],["精神的なほったらかし","概念","筆者がここ2〜3年で至った状態である。手続きだけでなく気持ちの面でも投資を完全にほったらかしにしており、資産が増えて喜んだり減って悲しんだりすることはもはやないという。一方で生活防衛資金やリスク許容度は個人差が大きく、一般論で語りきれない点にモヤモヤも残している。","役に立った投資本","https://note.com/beefbowl60/n/n91ddc1d2907e","2025-11-16","文脈"],["『新・臆病者のための株入門』","固有名詞","筆者が役に立った投資本の2冊目に挙げた本である。少し古い内容だが、インデックス投資がなぜ優れているのかに納得できたという。各社からオルカンが出て以降、筆者は投資先の5割ほどを全世界株式インデックスにしており、入金力がある人ほど向くと考えている。","役に立った投資本","https://note.com/beefbowl60/n/n91ddc1d2907e","2025-11-16","文脈"],["『格差と階級の未来』","固有名詞","資本主義社会のしくみを解説した本として筆者が3冊目に挙げたもの。株式投資でなぜ資産が増え、なぜ格差が拡がるのかが、学問的ではなく身も蓋もなく分かりやすく書かれているという。株式に大量の資金を投じる勇気と決断は、この本から得た部分が大きいと述べる。","役に立った投資本","https://note.com/beefbowl60/n/n91ddc1d2907e","2025-11-16","文脈"],["投資本を読んだことが、最大の投資だったのかもしれない。","文","何十冊も読んだ投資本の中から、筆者は運用実績を振り返って特に役立った3冊を選んだ。結果として運用益は本の値段の何万倍にもなったとし、読書こそが最も効率の良い投資だったのかもしれないと、感謝を込めて記事を締めくくっている。","役に立った投資本","https://note.com/beefbowl60/n/n91ddc1d2907e","2025-11-16","文脈"],["音の解像度が高いと、ただ聴くだけの時間が贅沢になる。","文","AirPods Pro 3を使い始めてしばらく経った筆者の実感である。通勤中や一息つきたいときに音楽やYouTubeを聴く中で、ノイズキャンセリングで雑音がすっと引き、自分のペースを取り戻せるという。生活の質を静かに押し上げる道具だと評している。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["急な成果より、続けて得られる安定感のほうが心地よい。","文","筆者は健康管理のためにレコーディングダイエットを淡々と続けている。数字として可視化されると選ぶ食べ物や量に意識が向き、カフェインやアルコールも控えるようになった。体重は緩やかに変化しており、開脚と前屈のストレッチにも進歩を感じている。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["前倒しの大掃除","概念","毎年のように慌ただしくなる年末の大掃除を避けるため、筆者が今年は早めに計画を立て始めたことを指す。どこをいつまでに片付けるかを書き出し、週末ごとに少しずつ進めるつもりだという。メルカリへの出品も大きなタスクとして挙げている。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["再読","概念","筆者は最近、昔買ったKindle本を読み返すことが増えた。以前は響かなかった箇所が今は腑に落ちる一方、時代遅れで恥ずかしくて読めないものもある。自分の経験や考え方の変化に気づける静かな学びの時間であり、積読の発見も小さな楽しみだという。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["『老人と海』","固有名詞","筆者がこの週に読んだ本である。延々と続く海の上のストイシズムと評したうえで、自分はベッドの上でMBAを操りながら小魚のような雑文を放流していると、自らの執筆生活を老漁師の孤独な闘いと対比して自嘲気味に描いている。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["FIRE後のヴィジョン","概念","『君たちはFIRE後どう生きるか３』を読んだ筆者が、自身に欠けていると認めたものである。巻が進むほど脱サラ・起業的な内容が増え、アグレッシブな人の多さに気圧されたという。自分も着々とFIREに近づいているが、その後の明確な像はまだ持てていないと正直に書いている。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["バルミューダ","固有名詞","今週気になったニュースとして筆者が挙げたデザイン家電のメーカーである。赤字が拡大するなか、55万円のランタンで起死回生を図ると報じられた。筆者はジョナサン・アイブがデザインを手がけた超高級路線に注目していると一言添えている。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["仲代達矢","固有名詞","92歳で死去したと報じられた俳優で、筆者が今週気になったニュースに挙げている。黒澤明ら名匠の作品に多数出演した人物である。筆者は『椿三十郎』で三船に斬られた姿を思い起こし、長生きされたと感慨を記している。","今週のまとめ（2025/11/16）","https://note.com/beefbowl60/n/nd48fd515a910","2025-11-16","文脈"],["外での執筆行為","概念","カフェなど家の外でiPad miniに向かって文章を書くことを、筆者はあえてかぎ括弧付きで「執筆行為」と呼ぶ。それをやってみたくて折りたたみキーボードとスタンドを購入し、プライベートでも仕事でも、旅先や出張先で使う場面を思い描いている。","iPad mini用のキーボード購入！","https://note.com/beefbowl60/n/n2c84518f3938","2025-11-21","文脈"],["Omikamo折りたたみキーボード","固有名詞","筆者がiPad mini用に購入したタッチパッド付きのBluetoothキーボードである。サイズ感や打鍵感、品質は事前にレビューで予想していた通りで満足している。ややお高めのモデルだがタッチパッド付きにして良かったとし、反応が悪いという評判も気にならなかったという。","iPad mini用のキーボード購入！","https://note.com/beefbowl60/n/n2c84518f3938","2025-11-21","文脈"],["「書いている自分」という概念","概念","キーボードとスタンドを揃えた筆者が、自分は何に対価を払ったのかを省みて出てきた言葉である。道具そのものよりも、それを使っているイメージや想像、つまり書いている自分の姿にお金を払ったような気がしないでもないと、半ば自嘲気味に振り返っている。","iPad mini用のキーボード購入！","https://note.com/beefbowl60/n/n2c84518f3938","2025-11-21","文脈"],["道具が先に揃うと、何を書くかは後から考えることになる。","文","iPad miniでの外出先執筆のためにキーボードを買った筆者は、いったい外で何を書くのかと自問する。日記や記録だろうかと候補を挙げつつも答えは定まらず、とにかく週末にこのセットを持って出かけてみようと、まず使うことを優先している。","iPad mini用のキーボード購入！","https://note.com/beefbowl60/n/n2c84518f3938","2025-11-21","文脈"],["Cosense","固有名詞","外で何を書くかを考えた筆者が候補に挙げたツールである。日記や記録に加えて、久しぶりにCosenseでアイデアメモをこねくり回すのも面白そうだと書いている。新しいキーボードが、しばらく離れていたアイデアメモの習慣を呼び戻すきっかけになりうると考えている。","iPad mini用のキーボード購入！","https://note.com/beefbowl60/n/n2c84518f3938","2025-11-21","文脈"],["AIに処方させる読書","概念","筆者が日頃感じている心理的課題をAIに入力し、分析させた上で推薦された本を買ったことを指す。挙がったのは三島由紀夫『命売ります』と國分功一郎『ドゥルーズの哲学原理』の2冊で、さっそく購入したものの、読み始めるのはもう少し先だとしている。","今週のまとめ（2025/11/23）","https://note.com/beefbowl60/n/na002e83cfb59","2025-11-23","文脈"],["『残像に口紅を』","固有名詞","筆者がこの週に読んだ本で、章が進むごとに「音」が消えていく小説と一言で紹介している。筒井康隆による長編で、使える文字（音）が一つずつ失われていく制約の中で物語が書き進められる実験的な作品として知られる。","今週のまとめ（2025/11/23）","https://note.com/beefbowl60/n/na002e83cfb59","2025-11-23","辞書"],["『「面白い！」を見つける』","固有名詞","デイリーポータルZの林さんによる、物事の見え方が変わる発想法の本である。筆者は世の中の面白がり方のヒントになると評価する一方で、読みながら、面白さを見つける営みはセンスが古いと言われることとの闘いのような気もすると感想を添えている。","今週のまとめ（2025/11/23）","https://note.com/beefbowl60/n/na002e83cfb59","2025-11-23","文脈"],["面白がる力は、センスの古さとの闘いでもある。","文","デイリーポータルZの林さんの発想法の本を読んだ筆者の感想から凝縮した。世の中を面白がるヒントを受け取りつつ、面白さの感覚はすぐに古びて「センスが古い」と言われかねないことに筆者は目を向け、面白がり続けることの難しさを感じ取っている。","今週のまとめ（2025/11/23）","https://note.com/beefbowl60/n/na002e83cfb59","2025-11-23","文脈"],["『社長問題！　私のお笑い繁盛記』","固有名詞","芸能事務所タイタンの創業から30年を綴った自伝本として筆者が今週読んだもの。筆者自身が少し接点を持っていたこともあり、感じるところが多くあったと書いている。短い紹介ながら、読書が個人的な記憶と結びついた一冊として挙げられている。","今週のまとめ（2025/11/23）","https://note.com/beefbowl60/n/na002e83cfb59","2025-11-23","文脈"],["写真欲","概念","写真美術館に行った筆者が、久々に高まってきたと感じたものである。興味のあるカメラもいくつかあるが、価格が高いためまったく踏ん切りはついていないという。展示に触れて撮りたい気持ちが戻ってくる一方、機材購入には慎重なままでいる。","今週のまとめ（2025/11/23）","https://note.com/beefbowl60/n/na002e83cfb59","2025-11-23","文脈"],["何もしなかったと感じる月にも、読書だけは続いていた。","文","11月を振り返った筆者は、今月は特に何もしていなかったと書き出す。それでも読書はしていたと付け加え、最近は努めて小説を読むようにしているという。成果の乏しさを感じる月の中で、続いていた習慣を一つ拾い上げる形で1ヶ月を総括している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n3b08d89be56c","2025-11-30","文脈"],["AIが決める積読の順番","概念","何冊もたまった積読をどう崩すかについて、筆者はGeminiに読む順番を決めてもらい、それに従って読み進めている。自分で選ぶ迷いを手放して順番をAIに委ねる方法であり、努めて小説を読むようにしている最近の読書習慣を支える仕組みになっている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n3b08d89be56c","2025-11-30","文脈"],["『命売ります』","固有名詞","筆者がこの週に読んだ本で、感想は別の記事に書いたとだけ触れている。三島由紀夫の長編小説で、自殺に失敗した男が新聞に「命売ります」という広告を出し、それに応じた依頼人たちとの奇妙な出来事に巻き込まれていく物語である。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n3b08d89be56c","2025-11-30","辞書"],["noteを始めて初めて、昔書いた記事が購入された。","文","11月の日記の中で、筆者が短く報告した出来事である。以前に書いた記事が売れたのはnoteを始めてから初めてのことで、筆者は簡潔に感謝の言葉を添えている。過去に書いたものが時間を置いて誰かに届いたことを、月の小さな出来事として記録している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n3b08d89be56c","2025-11-30","文脈"],["Nothing Ear (a)","固有名詞","Amazonのブラックフライデーで筆者がちょっと気になっていると挙げたノイズキャンセリング対応のワイヤレスイヤホンである。紹介された商品情報ではChatGPT対応や最大40.5時間の使用時間、ハイレゾ対応がうたわれており、筆者はイエローのモデルを取り上げている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n3b08d89be56c","2025-11-30","文脈"],["三島由紀夫『命売ります』","固有名詞","「残りの人生がすべて自由」という状況に合う本をGeminiに三島縛りで尋ね、薦められた作品である。筆者はブックオフで300円で入手して通読した。ハードボイルド風のドタバタした三文小説で、人物像にはあまり共感できなかったが、不意に現れる強い一節には惹かれたと述べている。","【読書メモ】命売ります","https://note.com/beefbowl60/n/ndc1aa726a09f","2025-11-30","文脈"],["自由という最大の不安","概念","残りの人生の時間がすべて自由であるという状況を、筆者は広大な自由であると同時に最大の不安でもあると捉えた。生きたいという感情は不自然ではないかという作中の問いを冒頭に引き、この不安をきっかけに本を探し始めたことが記事の出発点になっている。","【読書メモ】命売ります","https://note.com/beefbowl60/n/ndc1aa726a09f","2025-11-30","文脈"],["漂流（デリヴ）","概念","Geminiが『命売ります』を薦めた理由に挙げた「ドゥルーズ的・漂流的視点」の中の言葉である。いつ死んでもいいと思う主人公はあらゆる執着から解放され、目的なく漂流する感覚に近いという。筆者はこの推薦文を手がかりに作品を手に取った。","【読書メモ】命売ります","https://note.com/beefbowl60/n/ndc1aa726a09f","2025-11-30","文脈"],["浮薄な通俗小説も、三島が「あえて」書くと魅力に変わる。","文","筆者は『命売ります』を浮薄な三文小説と感じつつ、三島由紀夫があえて書いているから逆にいいという評判があることに触れた。読者もその方向にある程度ガイドされて読むことになると述べ、作品の評価が作者像に支えられている構造を指摘している。","【読書メモ】命売ります","https://note.com/beefbowl60/n/ndc1aa726a09f","2025-11-30","文脈"],["生きることが不安だという感覚は、生を回復したしるしだ。","文","筆者が『命売ります』から画像で引いた一節（p.219）に基づく。主人公は、生きることがすなわち不安だという感覚を長く忘れていたが、それを思い出したことが「生」の回復だと描かれる。冒頭で自由の不安を語った筆者の関心と響き合う箇所である。","【読書メモ】命売ります","https://note.com/beefbo
