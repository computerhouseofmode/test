<meta charset="utf-8">
<title>もーふの発想カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --desk: #DCE2E8;
  --desk-ink: #2B3440;
  --muted: #5F6B78;
  --paper: #FCFCFA;
  --rule: #C3D3E4;
  --red: #C8413A;
  --ink: #1D2631;
  --chip: #EEF2F6;
  --chip-on: #1D2631;
  --chip-on-ink: #FCFCFA;
  --shadow: 0 1px 0 rgba(29, 38, 49, .08), 0 8px 24px -12px rgba(29, 38, 49, .35);
  --focus: #2F6FB3;
  --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #161B21;
    --desk-ink: #DDE3EA;
    --muted: #93A0AE;
    --paper: #232A32;
    --rule: #34414F;
    --red: #E2665D;
    --ink: #E8ECF0;
    --chip: #232A32;
    --chip-on: #E8ECF0;
    --chip-on-ink: #161B21;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .8);
    --focus: #7FB0E6;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #161B21;
  --desk-ink: #DDE3EA;
  --muted: #93A0AE;
  --paper: #232A32;
  --rule: #34414F;
  --red: #E2665D;
  --ink: #E8ECF0;
  --chip: #232A32;
  --chip-on: #E8ECF0;
  --chip-on-ink: #161B21;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .8);
  --focus: #7FB0E6;
}

body {
  background: var(--desk);
  color: var(--desk-ink);
  font-family: var(--gothic);
  font-size: 15px;
  line-height: 1.7;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 48px;
  display: grid;
  gap: 22px;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 12px 24px;
}
h1 {
  margin: 0;
  font-family: var(--mincho);
  font-weight: 700;
  font-size: clamp(22px, 3.2vw, 30px);
  letter-spacing: .04em;
  text-wrap: balance;
}
.source {
  margin: 2px 0 0;
  font-size: 12.5px;
  color: var(--muted);
}
.source b { font-weight: 500; color: var(--desk-ink); }

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12.5px/1 var(--gothic);
  letter-spacing: .04em;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: var(--chip);
  color: var(--desk-ink);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.draw {
  font: 700 15px/1 var(--gothic);
  letter-spacing: .08em;
  padding: 13px 22px;
  border-radius: 6px;
  border: 0;
  background: var(--red);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.draw:active { transform: translateY(1px); box-shadow: none; }
.textbtn {
  font: 500 12.5px/1 var(--gothic);
  background: none;
  border: 0;
  padding: 8px 4px;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
button:focus-visible, a:focus-visible, label:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }

.spread {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  align-items: start;
}
@media (max-width: 820px) { .spread { grid-template-columns: 1fr; max-width: 520px; width: 100%; margin: 0 auto; } }

.slot { display: grid; gap: 8px; }
.card {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
  perspective: 1400px;
  border-radius: 4px;
}
.inner {
  display: grid;
  transition: transform .55s cubic-bezier(.2, .7, .2, 1);
  transform-style: preserve-3d;
}
.card[aria-pressed="true"] .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
  background-position: 0 58px;
  background-size: 100% calc(100% - 58px);
  background-repeat: no-repeat;
  border-radius: 4px;
  box-shadow: var(--shadow);
  min-height: 300px;
  padding: 16px 18px 18px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 10px;
  position: relative;
}
.face::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 46px;
  border-top: 1.5px solid var(--red);
}
.back { transform: rotateY(180deg); }
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  height: 22px;
  font: 500 11.5px/1 var(--mono);
  letter-spacing: .06em;
  color: var(--muted);
}
.type {
  font-family: var(--gothic);
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--red);
}
.word {
  align-self: center;
  margin: 18px 0 8px;
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 23px;
  line-height: 1.55;
  color: var(--ink);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.word.sentence { font-weight: 500; font-size: 19px; line-height: 1.75; }
.hint { font-size: 11.5px; color: var(--muted); }
.backword {
  font-family: var(--mincho);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.backtext {
  margin: 12px 0 0;
  font-size: 14px;
  line-height: 28px;
  color: var(--ink);
}
.dict {
  font: 700 10.5px/1 var(--gothic);
  letter-spacing: .08em;
  padding: 4px 6px;
  border: 1px solid var(--muted);
  border-radius: 3px;
}
.src {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 12.5px;
  color: var(--muted);
}
.src a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.src time { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.one {
  justify-self: end;
  font: 500 12px/1 var(--gothic);
  background: none;
  border: 0;
  padding: 6px 2px;
  color: var(--muted);
  cursor: pointer;
}
.one:hover, .textbtn:hover { color: var(--desk-ink); }

.foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  font-size: 12.5px;
  color: var(--muted);
  border-top: 1px solid var(--rule);
  padding-top: 16px;
}
.foot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.foot label { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--desk-ink); }
.msg { color: var(--desk-ink); }
.msg.err { color: var(--red); }
.empty { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>もーふの発想カード</h1>
      <p class="source" id="source"></p>
    </div>
    <div class="controls">
      <div class="chips" role="group" aria-label="種別で絞り込む">
        <button class="chip" id="f-all" data-type="" aria-pressed="true">すべて</button>
        <button class="chip" id="f-noun" data-type="固有名詞" aria-pressed="false">固有名詞</button>
        <button class="chip" id="f-concept" data-type="概念" aria-pressed="false">概念</button>
        <button class="chip" id="f-sentence" data-type="文" aria-pressed="false">文</button>
      </div>
      <button class="draw" id="draw">3枚引く</button>
    </div>
  </header>

  <main class="spread" id="spread" aria-live="polite"></main>

  <div class="foot">
    <button class="textbtn" id="flipall">すべて裏返す</button>
    <span>カードをタップで裏返し ・ スペースキーで引き直し</span>
    <span style="flex:1"></span>
    <label for="csv">cards.csv を読み込む</label>
    <input type="file" id="csv" accept=".csv,text/csv">
    <button class="textbtn" id="reset" hidden>埋め込みの候補に戻す</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
// [ワード, 種別, 裏面テキスト, 出典タイトル, URL, 公開日, 裏面の種類]
const EMBEDDED = [["どこでも同じ環境で作業できることが快適さを生む。","文","筆者は27インチiMacを処分し、MacBook Air（M2）で完全なノート環境に移行した。家の中でも近所のコメダ珈琲でも同じ環境で作業できることを何よりの快適さとして挙げ、薄さ軽さやミッドナイトの色と質感も気に入っていると振り返っている。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["ScanSnap iX1300","固有名詞","以前のScanSnapが最新macOSに非対応となり筆者が買い替えたスキャナーである。書類に加えて仕事で使い終えた手書きノートを大量にスキャンし、年末の捨て活動がかなり捗ったという。厚手の紙やカードも読める手前側のフィーダーを秀逸と評している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["シャチハタ 日付スタンプ","固有名詞","筆者が毎日多用している回転式の日付印である。ノートに日付を書く手間が省けるうえ、押すこと自体が楽しいという。学習の進捗管理メモにも役立つとし、サイズ違いを用意して青インクと赤インクを使い分けるという自分なりの運用も紹介している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["リングが柔らかいだけで、ノートの心地よさは大きく変わる。","文","かつてロルバーンなどを使っていた筆者が、今ではリングノートをすべてコクヨのソフトリングノートに切り替えたという話である。違いはリングが柔らかいという一点だけだが、書くときの心地よさには大きな差があると述べ、小さな仕様の違いを評価している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["夢診断","概念","筆者がChatGPT Plusを仕事以外で活用している使い道の一つである。GPT-4を使うために月額20ドルで課金しており、その日に見た夢の内容をAIに分析させて楽しんでいるという。道具としてのAIを、日常の遊びや内省にも持ち込んでいる例として紹介している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["ゼロ秒思考","固有名詞","筆者がGoodNotes 6での手書きノートの参考にしている本で、「バレットジャーナル」と並べて挙げている。頭に思ったことをただひたすら書いていくという考え方を取り入れ、iPadで作った手書きノートをiPhoneで読み返すという使い方をしていると紹介している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["強制リーディング","概念","Kindleで活字を目で追いながら、Audibleを2.5倍速くらいで同時に聴くという筆者の読書法である。耳から読む速度を強制されることで積読の解消に役立ったという。Audibleはインターバルウォーキング中に聴くなど、読書以外の時間にも活用している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["Day One Journal","固有名詞","筆者がメインに使っている日記アプリで、5年間欠かさず継続中だという。長く無料版で済ませてきたが、使い勝手を考えて年額のプレミアムを購入した。書くネタがない日はYahoo!ニュースのスクショを貼るなど、続けるための緩い工夫も紹介している。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["語釈の読み比べ","概念","物書堂の辞書アプリで、明鏡・新明解・三省堂国語辞典・大辞林・大辞泉などを大人買いした筆者の楽しみ方である。気になった言葉を串刺し検索し、辞書ごとの説明の違いを簡単に読み比べられる点を素晴らしいと評価し、遊びとして味わっている。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["モノは最小限に、生活を豊かにするサービスに投資する。","文","2023年に買ってよかったものをモノ編と課金サービス編に分けて振り返った筆者の総括である。ChatGPT、Audible、日記アプリ、動画配信、辞書アプリなどを並べたうえで、モノの量は最小限にしつつ、生活を快適にするサービスへ多く投資した一年だったとまとめている。","2023年買ってよかったもの","https://note.com/beefbowl60/n/n8c50919a9104","2024-01-21","文脈"],["鶴見済『人間関係を半分降りる』","固有名詞","「無理をしない」という抱負の中で、筆者が人間関係の行動指針として参考にしている本である。挨拶や返事はしつつも話を広げず短く切り上げる、SNSのいいねは控えるといった距離の取り方を引用し、嫌な人との付き合いを少しずつ減らしていきたいと述べている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["多動から寡動へ","概念","思いつきで語学や資格、趣味などを次々と始めてきた筆者が、2024年に掲げた方針である。「多動力」がもてはやされた風潮を振り返りつつ、始めたことに埋め尽くされて疲れては元も子もないとし、限りある時間の中で本当に必要なことを吟味して選ぶと決めている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["吉永賢一『頭が良くなる思考法』","固有名詞","「思いつきで行動しない」の項で筆者が引用した本である。問題を「見抜く」ステップを省くと、たまたま思いついたことに取りかかってしまい、本当に大切なことを見逃すという一節を挙げ、立ち止まって行動を選ぶという自身の方針の裏付けにしている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["続かないルールは緩め、マインドだけを持ち続ける。","文","早起きやレコーディングダイエットがどうにも続かなかった筆者は、自分に課すルールや義務を極力緩くすることにした。気が乗ったときに朝活する、食事は我慢しないなど、継続性や厳密性を義務にせず、心構えだけは手放さないという習慣との付き合い方を選んでいる。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["読書冊数のように量で決めた目標には、もう意味がない。","文","筆者はこれまで読書100冊、映画50本のように目標を量で決めてきたが、今年は冊数の目標を立てないことにした。多動的な試行錯誤を経て自分のことがよく分かってきたとし、義務としての読書より意味のある読書を、量より質をという考えに行き着いている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["筋トレしないで筋トレする","概念","筆者が「ルールや義務を増やさない」の項で引用した、千葉雅也らの『ライティングの哲学』の一節に出てくる言い方である。メニューを順にこなそうとせず、なんとなくのノリで始めるとスムーズに入れるという撞着的な発想を、義務を緩める自身の方針に重ねている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["空っぽの時間","概念","無理をせず、思いつきで動かず、ルールを増やさないことで生まれる「やることのない時間」を筆者はこう呼ぶ。知人のSNSのフォローを外すなどして増えたその時間を、動画やコンテンツで埋めず、情報なしで街を歩くなど直感に任せて楽しみたいと述べている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["pha『しないことリスト』","固有名詞","「空っぽの時間を楽しむ」の項で筆者が引用した本である。「しなきゃいけないこと」の99％は本当は別にしなくてもいいことだ、という一節を挙げ、「しなくていいこと」をなるべくしない日々にしたいという、のんびり生きる一年の締めくくりの言葉につなげている。","今年の抱負 のんびり生きる","https://note.com/beefbowl60/n/n97d8a46bbeff","2024-01-26","文脈"],["倉下忠憲『考えの育て方』","固有名詞","筆者が数年放置していたScrapbox（Cosense）を再び使い始めるきっかけになった本である。副題は「知的生産のデジタルカード法」。この本を読んだことを機に約半年の試行錯誤を重ね、自分なりのメモ運用スタイルを固めたと振り返っている。","アイデアメモはCosenseで","https://note.com/beefbowl60/n/n24f0bcd16526","2024-01-28","文脈"],["Cosense（Scrapbox）","固有名詞","筆者がアイデアメモに使うカード型のツールである。ひらめきを1ネタ1ページで書き、一覧をパラパラめくる感覚で眺められる点を評価し、思考の外部化に最適だと結論づけた。頭がすっきりし、日常の質が底上げされたと実感している。","アイデアメモはCosenseで","https://note.com/beefbowl60/n/n24f0bcd16526","2024-01-28","文脈"],["タイトルに結論を書く","概念","Cosense運用で筆者が定めたルールの一つである。思いついたことをそのままページタイトルにすると、一覧で内容を把握でき、スマホでもページを開く手間が減った。本文は後から追記し、タグは気が向いたら付ける程度の緩さで運用している。","アイデアメモはCosenseで","https://note.com/beefbowl60/n/n24f0bcd16526","2024-01-28","文脈"],["アイデアメモには自分の頭で生まれた言葉だけを置く。","文","筆者は読書メモや客観的なデータをiPhoneのメモアプリに分け、Cosenseには自分の頭から生まれた文章だけを残すことにした。そう切り分けるとしっくりきたと述べ、ライフログよりも主観をカード化するほうが生活の質の向上に直結したと実感している。","アイデアメモはCosenseで","https://note.com/beefbowl60/n/n24f0bcd16526","2024-01-28","文脈"],["重複思考のクセ","概念","取るに足らないメモまで書き出した結果、同じ日に同じアイデアを書いていることに筆者が気づいた現象である。何度も同じことを考えている自分が可視化され、頭の棚卸しによって思考の渋滞が解消し、不安や悩みのループも減ったと振り返っている。","アイデアメモはCosenseで","https://note.com/beefbowl60/n/n24f0bcd16526","2024-01-28","文脈"],["思いついた日付が、後になって効いてくる。","文","Cosenseの使い方として、筆者はページ冒頭に必ず日付を書き残すことにしている。内容の整理やタグ付けは緩く運用する一方で、「いつ思いついたか」だけは後で効いてくるとして、日付の記録だけは欠かさない方針をとっている。","アイデアメモはCosenseで","https://note.com/beefbowl60/n/n24f0bcd16526","2024-01-28","文脈"],["思い出本","概念","本を約100冊処分した筆者が、手元に残した本を仕事本・愛着本・稀少本・思い出本の4つに分けたうちの一つである。主に学生時代に買った「腐れ縁のような本」を指す。箱にしまったまま使われていなかったこうした本も、電子化で活用しやすくなったと述べている。","本の断捨離","https://note.com/beefbowl60/n/nace3b304baf7","2024-02-01","文脈"],["スキャンピー","固有名詞","筆者が本のデジタル化を依頼しているスキャン代行業者である。1冊200〜250円ほどで、スキャン品質にはかなり満足しており、自分でやる手間を考えると安いと評価している。高価な本はメルカリで売り、それ以外はこうした電子化に回したという。","本の断捨離","https://note.com/beefbowl60/n/nace3b304baf7","2024-02-01","文脈"],["本を電子化すると、実質的に本の数が増えたのと同じになる。","文","裁断されてデータ化されることに寂しさや仄かな罪悪感を覚えつつも、筆者は大きな利点を感じた。特に仕事用の書籍は職場でも家でも開けるようになり、ディスプレイで見たほうが文字も大きいという。物としての本を手放して利便性がかえって増したと述べている。","本の断捨離","https://note.com/beefbowl60/n/nace3b304baf7","2024-02-01","文脈"],["電子データになっても、本が思い出を呼び起こす力は変わらない。","文","愛着本や思い出本まで電子化した筆者の実感である。本という物質でなくなれば愛着も薄れるかと思いきや、電子データであっても愛着や思い出を想起させてくれる力は変わらなかったという。物への執着と、記憶や感情の拠り所とを切り分けて捉え直している。","本の断捨離","https://note.com/beefbowl60/n/nace3b304baf7","2024-02-01","文脈"],["執着からの解放","概念","ほとんどライフワークになっている断捨離について、筆者がたどり着いた感覚である。本を100冊ほど手放して電子化したことで、断捨離は物理的なスペースだけでなく心の余裕にもつながると述べ、また一つ執着から解放された気分になったと結んでいる。","本の断捨離","https://note.com/beefbowl60/n/nace3b304baf7","2024-02-01","文脈"],["曲への愛着と、レコード盤への愛着は一致しないことがある。","文","趣味で集めた約100枚のレコードを数十枚手放した筆者が、その理由の一つとして挙げた気づきである。アナログ再生はデジタルより優れて聴こえる曲もあれば、音質がしっくりこない曲もある。そのため好きな曲でも盤そのものには愛着が湧かない場合があると述べている。","レコードの断捨離","https://note.com/beefbowl60/n/n1d6660ba67a9","2024-03-16","文脈"],["所有のストレス","概念","レコードは場所を取り、保管にも気を遣う。筆者はこうした持つことに伴う負担を軽減するため、聴く頻度の低い盤を中心に保有枚数を減らすと決めた。昨年末から数か月かけて行ったレコードの断捨離の、根本的な動機として語られている。","レコードの断捨離","https://note.com/beefbowl60/n/n1d6660ba67a9","2024-03-16","文脈"],["アナログブーム","概念","筆者がレコードを手放す際に追い風になった状況である。ブックオフなど買取店も増えているが、メルカリで個別に売るほうが高値になりやすく、安いもので5000円、高いものは2万円程度で売れたという。ブームの影響で売却価格が上がっていると実感している。","レコードの断捨離","https://note.com/beefbowl60/n/n1d6660ba67a9","2024-03-16","文脈"],["VillageBox LPレコード用ダンボール","固有名詞","筆者がメルカリでレコードを売る際に使った、LP・12インチレコード専用の梱包用ダンボールである。1枚から10枚程度までをしっかり梱包できたと紹介している。個人でレコードを売るときの実用的な道具として、25枚セットの商品を挙げている。","レコードの断捨離","https://note.com/beefbowl60/n/n1d6660ba67a9","2024-03-16","文脈"],["タワーレコード渋谷店","固有名詞","ヴァイナルストアを拡張した店として、筆者がアナログの盛り上がりの例に挙げた店舗である。微妙にアナログが盛り上がってきている今こそレコードを整理するのにうってつけの時期だと述べ、読者に「ナイス断捨離ライフを」と呼びかけて記事を結んでいる。","レコードの断捨離","https://note.com/beefbowl60/n/n1d6660ba67a9","2024-03-16","文脈"],["モレスキン","固有名詞","筆者が読書メモを紙のノートに取っていた頃を振り返る中で、2010年代に流行した紙のノート術の象徴として挙げたノートである。堀正岳らの『モレスキン「伝説のノート」活用術』を紹介しつつ、当時はモレスキンがノート術ブームの中心にあったと記憶している。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["紙の呪術性","概念","メモ術やノート術は常に自己啓発的な側面を含む、と考える筆者の言葉である。紙そのものが持つ呪術性がスピリチュアルな要素を引き寄せているとし、読書からメモ、改善、小さな幸福、やがて有意義な人生へという期待と展望がノート術にはあると分析している。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["佐藤優『読書の技法』","固有名詞","紙ノート時代の筆者が影響を受けた読書術の本である。その影響で覚えておきたい内容を写経のようにノートへ書き写していた時期もあったが、たいへん過ぎてすぐにやめたという。読書メモの試行錯誤の歴史の一幕として振り返っている。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["Evernote","固有名詞","1冊分のメモを1ノートに記録するというデジタル時代の読書メモの原点だと筆者が考えるサービスである。夢と希望があったと述べる一方、生活の雑多な書類も一緒に保存していたため、読書メモを取り出して再読しにくくなり、いつしか離れてしまったという。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["カード形式のメモは、発想術と読書メモでは相性が違う。","文","筆者は倉下忠憲の本などをきっかけに、読書メモをScrapboxに移した時期があった。カード形式は発想術としては役立ちそうだが、自分の読書メモの使い方とは相性がよくないと分かったという。現在は思いつきやアイデアの断片だけをScrapboxで管理している。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["メモは所詮メモなので、ツールが変わることは受け入れる。","文","紙ノート、Evernote、Scrapbox、京大カード、Notionと渡り歩いた筆者が、今はiPhone標準のメモアプリに落ち着いた。シンプルで起動が速い点を気に入りつつ、いつまで続くかは不明で、ツールの変更は避けられない現実だと受け止め、手軽に取れれば十分だとしている。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["読書メモは手段にすぎず、読書にはその先の目的がある。","文","読書メモの方法を振り返った記事の結びで、筆者が示した考えである。さまざまなツールを試してきたが、メモを取ること自体は手段であり、読書にはそれを超えた何か目的のようなものがあるはずだとして、今後はその結果のほうに集中していきたいと述べている。","最近の読書メモ","https://note.com/beefbowl60/n/n2441fd729a0c","2024-05-01","文脈"],["ニコン 双眼鏡「遊」4X10D","固有名詞","筆者がライブ鑑賞にベストだと断言する小型の双眼鏡である。「遊」という前世紀のような製品名に反して時代遅れではなく、旅先の自然観察や動物園でも活躍しているという。この製品をつくったニコンに最大限の賛辞を送りたいとまで評価している。","ライブ鑑賞にベストな双眼鏡","https://note.com/beefbowl60/n/nbd3b05ed5cb6","2024-05-01","文脈"],["日本武道館","固有名詞","筆者が双眼鏡「遊」の実力を示すために挙げた会場の一つで、2階席からでも満足できる鑑賞ができたという。国際フォーラムやNHKホールの上階席、ビルボードライブ東京、ブルーノート、コットンクラブの席からも、この双眼鏡ひとつで十分だったと述べている。","ライブ鑑賞にベストな双眼鏡","https://note.com/beefbowl60/n/nbd3b05ed5cb6","2024-05-01","文脈"],["小さな双眼鏡でも、見え方はオモチャとは段違いに鮮明になる。","文","筆者が双眼鏡「遊」の特徴として真っ先に挙げたのが、とにかく小さくて軽いことだった。そのうえでサイズからは想像できないほどクッキリ鮮明に見え、オモチャのような小型双眼鏡とはレベルが違うという。大型双眼鏡のような大げさ感がない点も評価している。","ライブ鑑賞にベストな双眼鏡","https://note.com/beefbowl60/n/nbd3b05ed5cb6","2024-05-01","文脈"],["片手鑑賞","概念","小さく軽い双眼鏡だからこそ可能になった、筆者のライブの観方である。ライブ中は首からぶら下げておき、よく見たいときだけ片手で双眼鏡越しに眺める。さり気なく演者の表情をチェックできるこのスタイルを、ライブ鑑賞に最適だと感じている。","ライブ鑑賞にベストな双眼鏡","https://note.com/beefbowl60/n/nbd3b05ed5cb6","2024-05-01","文脈"],["ライブ鑑賞の双眼鏡は、4倍くらいの倍率がちょうどいい。","文","倍率4倍は少なく感じるかもしれないが、筆者は逆にこのくらいが観やすいと分かったという。6倍以上だとアップになりすぎ、手ブレしやすいため両手でしっかり支える必要がある。ほどよいズームアップだからこそ片手で気軽に使えると述べている。","ライブ鑑賞にベストな双眼鏡","https://note.com/beefbowl60/n/nbd3b05ed5cb6","2024-05-01","文脈"],["双眼鏡の性能は、文字ではまったく伝わらない。","文","双眼鏡「遊」を絶賛した記事の結びで、筆者が歯がゆさとして述べたことである。見え方の良さは文章で説明しても伝わらないため、ヨドバシやビックカメラなど家電量販店の店頭で実際に手に持って試してみてほしいと、読者に体験を勧めている。","ライブ鑑賞にベストな双眼鏡","https://note.com/beefbowl60/n/nbd3b05ed5cb6","2024-05-01","文脈"],["ロイヒトトゥルム ポケット手帳（A6）","固有名詞","筆者が最近気に入って使っているハードカバーの手帳で、同じタイプの色違いをリピート購入した。書く内容の8割はデスクでの仕事に関するメモ、2割は週末の計画だという。手帳としては値が張るが、カバーの肌触りと紙のペン滑りの良さを評価している。","最近、気に入っている手帳","https://note.com/beefbowl60/n/nccaeedcf3819","2024-06-07","文脈"],["カバーや紙質の細かな満足度が、メモする意欲を支える。","文","少し高価なロイヒトトゥルムの手帳をリピートした理由として、筆者が述べた考えである。ハードカバーの肌触りや紙のペン滑りといった細部の心地よさは、メモのモチベーションを上げるために重要だとし、道具の満足度を軽視しない姿勢を示している。","最近、気に入っている手帳","https://note.com/beefbowl60/n/nccaeedcf3819","2024-06-07","文脈"],["時系列メモ","概念","筆者の手帳の使い方である。各ページにシャチハタの日付スタンプで日付を押し、思いついたことを時系列で書き込んでいく。これを繰り返すだけという単純な方法で、分類や整理はせず、日付を軸にメモを積み重ねていくスタイルをとっている。","最近、気に入っている手帳","https://note.com/beefbowl60/n/nccaeedcf3819","2024-06-07","文脈"],["日付を頼りに過去を振り返ると、また新しいメモが生まれる。","文","筆者は手帳に押した日付を手がかりに、頻繁に過去のメモを読み返している。1週間前や1か月前の状況を把握し、そこで思い浮かんだことをまた書き足すという。書いて終わりではなく、振り返りが次のメモを呼ぶ循環が手帳の使い方の核になっている。","最近、気に入っている手帳","https://note.com/beefbowl60/n/nccaeedcf3819","2024-06-07","文脈"],["使い終えた手帳の裁断スキャン","概念","時系列でメモを書き込んだロイヒトトゥルムの手帳を、筆者は使い終わってしばらく経ったら裁断してスキャンしている。紙の手帳の書き心地を楽しみつつ、物としては手元に残さず、内容だけをデータとして保存するという扱い方をしている。","最近、気に入っている手帳","https://note.com/beefbowl60/n/nccaeedcf3819","2024-06-07","文脈"],["PILOT アクロボール4","固有名詞","筆者が渋谷のハンズをうろうろしていて見つけた、黒・赤・青・緑のノック式4色ボールペンである。緑が入っている点をポイントが高いと評価し、特に0.7mmがなめらかで書き心地がよかったという。書きやすいペンとして記事の中心で紹介している。","書きやすいペン","https://note.com/beefbowl60/n/nad9ba7fd271e","2024-06-08","文脈"],["『三色ボールペン情報活用術』","固有名詞","色を変えてラインを引き分けながら読む読書術の本として、筆者が紹介している一冊である。アクロボール4を手に入れたことで、この三色ボールペンの読書術を実践できるようになったと述べている。ただし最近は紙の本を読むこと自体が減ったとも付け加えている。","書きやすいペン","https://note.com/beefbowl60/n/nad9ba7fd271e","2024-06-08","文脈"],["紙の本を読まなくなると、線を引く読書術も出番を失う。","文","4色ボールペンを手に入れて三色ボールペンの読書術ができるようになった筆者が、同時に漏らした本音である。道具はそろったものの、最近は紙の本を読むこと自体が減ってしまったという。読書のデジタル化が、手を動かす読書法の居場所を狭めている様子がうかがえる。","書きやすいペン","https://note.com/beefbowl60/n/nad9ba7fd271e","2024-06-08","文脈"],["愛用のペンを離れて、別のペンに浮気するのも悪くない。","文","これまで頑なにジェットストリーム派だった筆者が、アクロボール4の書きやすさに触れて抱いた感想である。こだわりの道具を決めていても、店頭で偶然出会ったペンを試してみることで新しい書き心地に出会えると気づき、他のペンへの浮気を前向きに捉えている。","書きやすいペン","https://note.com/beefbowl60/n/nad9ba7fd271e","2024-06-08","文脈"],["HUAWEI FreeClip","固有名詞","筆者が2024年7月にセールで購入したイヤーカフ型のオープンイヤーイヤホンである。想像以上に快適で、家事中やオフィスでの仕事中はこれ一択になった。1年後の後記でも毎日使い続けており、壊れたらまた同じものを買うほど自分に合う製品だと評価している。","Huawei FreeClipが快適すぎる (Airpods Proと比較)","https://note.com/beefbowl60/n/nb23a43677032","2024-11-17","文脈"],["外の音が聞こえる便利さは、実際に使うまで分からない。","文","オープンイヤー型イヤホンを使い始めた筆者が、最大のメリットとして挙げた気づきである。周囲と会話するたびに外したり操作したりせず、付けたまま音量を下げればよいことがとても快適だったという。耳を塞がないことの価値を、体験して初めて実感している。","Huawei FreeClipが快適すぎる (Airpods Proと比較)","https://note.com/beefbowl60/n/nb23a43677032","2024-11-17","文脈"],["咀嚼音が気にならない装着感","概念","筆者がFreeClipの装着感の良さとして挙げた点の一つである。軽量でほとんど着けている感覚がなく、カナル型のように耳の中が蒸れない。左右どちらの耳にも使える対称設計に加え、食事中に自分の咀嚼音が気にならないことも何気に良いと述べている。","Huawei FreeClipが快適すぎる (Airpods Proと比較)","https://note.com/beefbowl60/n/nb23a43677032","2024-11-17","文脈"],["バッテリーのストレス","概念","連続2時間ほどしかもたないAirPods Proを使っていた頃、筆者が常に感じていた気遣いである。FreeClipは連続8時間で、実質的に充電を気にせず1日中着けていられるため、そのストレスから解放されたのは大きいと評価している。","Huawei FreeClipが快適すぎる (Airpods Proと比較)","https://note.com/beefbowl60/n/nb23a43677032","2024-11-17","文脈"],["装着感がなさすぎると、落としても気づけない。","文","FreeClipのよくないところとして筆者が挙げた点である。耳たぶに挟む形なので引っかけて落としやすく、音を再生していないときに落とすと気づけずに詰むという。「探す」機能にも非対応のため室内利用を中心にしていたが、1年間で一度も落とさなかったと後記している。","Huawei FreeClipが快適すぎる (Airpods Proと比較)","https://note.com/beefbowl60/n/nb23a43677032","2024-11-17","文脈"],["AirPods Pro","固有名詞","筆者がFreeClipとの比較対象にしたイヤホンである。空間オーディオやデバイス間の自動切替などApple製品との連携では勝り、電車内のようなうるさい場所ではノイズキャンセルが向く。購入1年後には、AirPods Proを使うのは電車に乗るときだけになったという。","Huawei FreeClipが快適すぎる (Airpods Proと比較)","https://note.com/beefbowl60/n/nb23a43677032","2024-11-17","文脈"],["iPad mini (A17)","固有名詞","前年の第6世代に続いて筆者が2024年にも購入したiPad miniである。タブレットは何台あっても困らないと述べる一方、このモデルからApple Pencil 2に対応せずApple Pencil Pro対応となり、前の世代のminiとペンを共有できなくなったのは痛いと嘆いている。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["SwitchBot 防犯カメラ","固有名詞","筆者が何気なく買って玄関に設置したところ、思いのほか便利だったカメラである。家族の出入りを確認できる安心感は絶大だといい、外出先で「家の鍵がかかっているのか」と気になる問題もこれ1台で解決できたと評価している。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["自分の血糖値パターン","概念","低血糖気味で辛いときがある筆者が、体に装着して血糖値をリアルタイムで測れるフリースタイルリブレ2を試して得たものである。少し高価だが一度データを取ってみると自分のパターンが分かり、食事の仕方や運動の改善に役立ったかもしれないと振り返っている。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["失くし物が家にあるかどうか分かるだけで、安心感が違う。","文","筆者はAirTagのカード版といえるAnkerの紛失防止トラッカーを、もしもの備えとして財布に入れている。たとえ見つからない場合でも、少なくとも家の中にあるのかどうかは分かるので安心感がまったく違うと述べ、備えとしての価値を評価している。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["スマホ連携が面倒になると、多機能な体重計もただの体重計に戻る。","文","Ankerの安価な体組成計Eufy Smart Scale A1について、筆者は軽量コンパクトで測定が速い点を気に入っている。しかしアプリ連携のたびにスマホを起動するのが面倒で、最近はもっぱら普通の体重計として使っていると正直に明かしている。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["2か月を同時に見渡せると、先の先まで計画を立てられる。","文","筆者が2025年用に選んだ、2か月分を同時に表示できるNOLTYの壁掛けカレンダーについての感想である。数字の小さい月が上になる仕掛けを気に入っており、先の先まで見通して計画を立てられるのは良いものだと、カレンダーの見せ方の効用を語っている。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["バリ山行","固有名詞","松永K三蔵の小説で、芥川賞受賞作である。筆者は2024年に買ってよかったものの一つとしてこの本を挙げ、「バリエーション山行。日常風景の中で非日常的に生きる。」とだけ短く添えている。日常の中に非日常を見出す物語として受け止めたことがうかがえる。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","辞書"],["PATRICK STADIUM","固有名詞","長年パトリックのスニーカーを履いてきた筆者が、2024年にSHULLYから乗り換えたモデルである。筆者はこれを「宗旨替え」と表現し、購入にあたっては取扱店のショップに世話になったと記している。長く愛用するブランドの中でも好みが移り変わることを示している。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["テクノロジーで安心を得る","概念","筆者が2024年の買い物全体を振り返ってまとめた傾向である。玄関の防犯カメラ、財布に入れた紛失防止トラッカー、血糖値を測るセンサーなど、テクノロジーによって不安を減らし安心を手に入れる系の買い物が多かった1年だったと総括している。","2024年買ってよかったもの","https://note.com/beefbowl60/n/naa11ed4efc96","2024-12-25","文脈"],["金のフレーズ","固有名詞","筆者がTOEIC800点から900点を目指す際に語彙対策として使った単語本である。本ではなくAnkiアプリで英語→日本語のデッキを限りなく正答率100%になるまで回し続けた。915点到達の半分くらいはこの本のおかげだと振り返っている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["Anki","固有名詞","筆者が「金のフレーズ」の語彙を覚えるために使った暗記カードアプリである。紙の本をめくる代わりに英語→日本語のデッキをひたすら回し、ほぼ完璧になるまで繰り返した。単語学習の中心をこのアプリに置いたことが900点突破の大きな要因だったとみている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["スタディサプリ","固有名詞","筆者がリスニングとPart5対策として2か月ほど課金したオンライン英語学習サービスである。スキマ時間の活用や基礎力の底上げには役立ったと評価する一方、公式とは傾向やクセが微妙に違うため、本番前は公式問題集に注力すべきだと述べている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["TOEIC対策は公式問題集に始まり公式問題集に終わる。","文","筆者は公式問題集のVol.7〜9を使い、マークシートを大量にコピーして日ごとにパートを変えながら、ほぼ満点が取れるまで同じ問題を繰り返した。800点に達した人なら公式を繰り返すだけで十分で、非公式の模試は勘が鈍るので避けるべきだと結論づけている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["時計2本体制","概念","筆者が「TOEIC最重要アイテム」と呼ぶ時計を本番で2本用意する方法である。残り時間が直感的にわかるアナログ時計を机の右前に置き、予備を腕に巻いて、どちらも時刻を正確に合わせておく。自宅練習でも極力同じ時計を使うようにしていた。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["リスニングでは迷わず音源に近い席へ移動する。","文","試験会場での準備として、筆者は着席後にスピーカーとの距離や机の異常を確認していた。音源が遠い場合や気が散る人が近くにいる場合は、音声チェック後に挙手して前の席に移ればよいと述べ、事前に空席の当たりをつけておくことまで勧めている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["マークのルール","概念","Part2で迷いを引きずらないために筆者が決めていた判断基準である。B、Cが違うと思えば確信がなくてもAを塗り、悩んだら手前の選択肢を選び、最後は直感を信じる。難問と聞き取れなかった問題は問題用紙の左右に分けてチェックしていた。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["通過タイム","概念","筆者がPart7で10問ごとに厳密に設定していた時間の目安である。最後の4題20問に20分を残せるよう進め、比較的簡単なマルチパッセージは全問きちんと解くことを必須とした。分からない問題は長考せず、時間を優先してマークする方針をとっている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["TOEIC900点は越えてみれば案外高い壁ではなかった。","文","915点を取った筆者は、果てしなく遠く見えた目標が越えてみると高くなかったと振り返る。ただしそれは自分の正味の英語力が高くないからで、生のニュースは4〜6割しか聞き取れず、満足できる能力には至っていないと冷静に自己評価している。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["正解数の最大化からの逆算","概念","筆者が学習全体を振り返って最も効果的だったとする考え方である。本番でいかに正解数を増やすかから逆算して学習と時間管理の練習をすることが大切で、800〜900点前半のレベルでは本番での時間管理と解き方こそが重要だとまとめている。","弱者のTOEIC攻略 〜 800点→900点の勉強法","https://note.com/beefbowl60/n/n34a52097b618","2025-01-13","文脈"],["iPad mini","固有名詞","筆者は買ってしばらく傷を避けるためにサードパーティ製の保護カバーを付けていた。ある時むき出しで使ってみると、軽く持ち運びやすく、さっと起動できて快適だったため、それ以来カバーをやめ、使う頻度も増えたと述べている。","iPad miniはカバーを付けずに使う","https://note.com/beefbowl60/n/nacc8b11e2618","2025-04-24","文脈"],["使い潰すくらいの感覚","概念","カバーを外したiPad miniについて筆者が行き着いた付き合い方である。たとえ傷がついてもかまわず、無造作にポケットに入れて持ち出すほうが気持ちいいのではないかと考え、本来ガジェットはそういう使い方をするためのものだったはずだと述べている。","iPad miniはカバーを付けずに使う","https://note.com/beefbowl60/n/nacc8b11e2618","2025-04-24","文脈"],["高城剛","固有名詞","筆者がガジェットを使い倒す姿勢の例として挙げたクリエイターである。スーツのズボンにiPad Pro 11インチが入るポケットを自作で付け、AppleCareにも入っていないという。筆者はこの話を、道具をむき出しで持ち歩く考え方の裏付けとして紹介している。","iPad miniはカバーを付けずに使う","https://note.com/beefbowl60/n/nacc8b11e2618","2025-04-24","文脈"],["LIFE PACKING 60","固有名詞","高城剛の著書で、筆者が彼のiPadの持ち歩き方を紹介する際に出典として挙げた本である。ズボンにiPad用ポケットを自作し、AppleCareにも入らないというエピソードの出どころで、筆者がカバーなし運用に自信を深める材料になっている。","iPad miniはカバーを付けずに使う","https://note.com/beefbowl60/n/nacc8b11e2618","2025-04-24","文脈"],["道具はいつかの誰かではなく今の自分のために使う。","文","傷を恐れて保護カバーを付けていたiPadを、むき出しで使うようにした経験から筆者がたどり着いた考えである。きれいに保つことより今どんどん使うほうが大事だとして、iPad Proのカバーもやめ、もうiPadにケースはいらないと言い切っている。","iPad miniはカバーを付けずに使う","https://note.com/beefbowl60/n/nacc8b11e2618","2025-04-24","文脈"],["米粒写経のガラパゴスイッチ","固有名詞","筆者が2か月に一度の楽しみにしているお笑いライブで、2025年4月25日回をへりくつオンラインショップの配信で観た。最近は配信期間が1週間になり、何度もゆっくり楽しめるようになったと喜んでいる。前半トークでは居島さんが巻き込まれかけた事件の話があった。","米粒写経のガラパゴスイッチを観た4/25","https://note.com/beefbowl60/n/ne056f34b294b","2025-04-27","文脈"],["インコさん","固有名詞","ガラパゴスイッチの漫談枠に3回目の出演となった芸人である。筆者は今回も安定した面白さで話に引き込まれたと評価し、単独ライブにも行ってみようかと考えている。ネタには牡蠣フェスやエスプレッソ、キテレツ大百科などの話題が並んだ。","米粒写経のガラパゴスイッチを観た4/25","https://note.com/beefbowl60/n/ne056f34b294b","2025-04-27","文脈"],["立川寸志","固有名詞","ガラパゴスイッチのトークゲストとして登場した立川流の落語家である。出版系の会社で20年編集者を務め、大学で日本史を専攻し、44歳で入門した異色の経歴を持つと筆者は紹介している。一席のあとの歴史トークを筆者は面白いと絶賛した。","米粒写経のガラパゴスイッチを観た4/25","https://note.com/beefbowl60/n/ne056f34b294b","2025-04-27","文脈"],["岸柳島","固有名詞","立川寸志がガラパゴスイッチで披露した落語の演目である。一席のあとのトークコーナーでは、噺の舞台となった江戸の地理や武士の暮らしが考察され、筆者はそこから噺の見え方が広がっていく展開を楽しんでいる。","米粒写経のガラパゴスイッチを観た4/25","https://note.com/beefbowl60/n/ne056f34b294b","2025-04-27","文脈"],["登場人物のプロファイリング","概念","立川寸志を迎えたトークコーナーで行われた噺の楽しみ方である。「岸柳島」の舞台となった江戸の地理や武士の暮らしを考察し、そこから登場人物の素性を推理していく。筆者はこの歴史的なアプローチを面白いと強く評価している。","米粒写経のガラパゴスイッチを観た4/25","https://note.com/beefbowl60/n/ne056f34b294b","2025-04-27","文脈"],["噺の舞台の地理を知ると登場人物の素性が見えてくる。","文","ガラパゴスイッチのトークコーナーで、日本史専攻の元編集者である立川寸志が「岸柳島」の舞台となった江戸の地理や武士の暮らしを掘り下げた場面から得た気づきである。筆者は背景を知ることで噺の人物像が立体的になる面白さを味わっている。","米粒写経のガラパゴスイッチを観た4/25","https://note.com/beefbowl60/n/ne056f34b294b","2025-04-27","文脈"],["和モノのアンビエント","概念","筆者がここ1年ほど豊作だと感じている日本のアーティストによるアンビエント作品群である。散歩中や読書中、寝る前によく聴いているとして、COMPUMAやOE、岡田拓郎、草刈愛美らの作品をメモ代わりに紹介し、随時更新するとしている。","最近聴いているアンビエント作品","https://note.com/beefbowl60/n/n2e0305d331b3","2025-04-28","文脈"],["COMPUMA 'horizons'","固有名詞","2024年のリリース以来、筆者がずっと聴き続けているアンビエント作品である。散歩のBGMにしており、3月にはWWWでのライブにも足を運んだ。源流的な2022年の作品'A View'もよいと述べ、両作のリリース時のインタビュー記事も参考に挙げている。","最近聴いているアンビエント作品","https://note.com/beefbowl60/n/n2e0305d331b3","2025-04-28","文脈"],["反復する言葉を聴きながら歩くと体が整う気がする。","文","COMPUMAの'horizons'を散歩のBGMとして聴き続けている筆者の実感である。作品の中で反復される詞を聞いていると健康になってくる気がすると述べ、アンビエントを散歩や読書、寝る前といった日常の時間に溶け込ませて楽しんでいる。","最近聴いているアンビエント作品","https://note.com/beefbowl60/n/n2e0305d331b3","2025-04-28","文脈"],["OE 'Moment of Now (Suchness 5)'","固有名詞","Captain FunkことTatsuya OeによるOE名義の作品である。筆者はビート感が強めの点を挙げ、Suchnessシリーズの中で一番聴いていると述べている。アルバム解説のページも参考として紹介し、和モノアンビエントの豊作ぶりを示す一枚に数えている。","最近聴いているアンビエント作品","https://note.com/beefbowl60/n/n2e0305d331b3","2025-04-28","文脈"],["岡田拓郎 'The Near End, The Dark Night, The County'","固有名詞","柴田聡子のバンドでも活躍する岡田拓郎の、静かで繊細な作品だと筆者は紹介している。過去10年間に自宅で録り貯めた音源から、ギター演奏に焦点を当てて編んだコンピレーション・アルバムだという。本人のインタビュー記事も参考に挙げている。","最近聴いているアンビエント作品","https://note.com/beefbowl60/n/n2e0305d331b3","2025-04-28","文脈"],["草刈愛美 'Garden Studies'","固有名詞","サカナクションのベーシスト草刈愛美によるアンビエント作品である。筆者は繊細なサウンドが美しく、休日の午後に最適だと評している。Dolby Atmosミックスに挑んだ制作秘話の記事も紹介し、新作はアンビエント専門店で探すのがおすすめだと添えている。","最近聴いているアンビエント作品","https://note.com/beefbowl60/n/n2e0305d331b3","2025-04-28","文脈"],["カミュ『異邦人』","固有名詞","筆者が新潮文庫の窪田啓作訳で読んだ、アルベール・カミュの1942年の小説である。読書ノートでは、生と死の間を滑走する人生の徹底的な不条理性をガツンと浴びせかけてくる作品だと受け止め、死をめぐる主人公の独白を2か所引用している。","【読書ノート】カミュ「異邦人」","https://note.com/beefbowl60/n/n7c1b501d19d8","2025-04-28","文脈"],["暑さと太陽","概念","筆者が『異邦人』を読んでまず印象に残った、作中に横溢する風景描写である。筆者はこの濃密な暑さと太陽の描写を入り口として、意味や目的があるように思える生と、不安や倦怠としてしか現れない死との間にある不条理を読み取っている。","【読書ノート】カミュ「異邦人」","https://note.com/beefbowl60/n/n7c1b501d19d8","2025-04-28","文脈"],["目的に向かって進んでいると思えるうちは生は幸福だ。","文","『異邦人』を今的に読んだ筆者の解釈である。意味や有用性が計画によって充填され、何かに向かって前進していると思えているうちは生は幸福だが、その裏で死は不安や倦怠としてしか日常に現れない。その二つの間を滑走する人生の不条理を作品に見ている。","【読書ノート】カミュ「異邦人」","https://note.com/beefbowl60/n/n7c1b501d19d8","2025-04-28","文脈"],["不条理","概念","筆者が『異邦人』から受け取った中心的なテーマである。広く当然と信じられている様々な善きことに、真っ向から抵抗し否定し逸脱する者がいたとしたらどうなるか。筆者はその問いを通して、人生の徹底的な不合理・不条理性を浴びせられる読書体験だったと記している。","【読書ノート】カミュ「異邦人」","https://note.com/beefbowl60/n/n7c1b501d19d8","2025-04-28","文脈"],["死を前にすれば人生の長さの違いに大した意味はない。","文","筆者が読書ノートに引用した『異邦人』終盤の主人公の独白から凝縮した一文である。三十歳で死のうが七十歳で死のうが違いはなく、未来から立ち上る暗い息吹が他人の死や母の愛、神や宿命までをも等しなみにしてしまうという箇所を書き留めている。","【読書ノート】カミュ「異邦人」","https://note.com/beefbowl60/n/n7c1b501d19d8","2025-04-28","文脈"],["ほったらかし投資術","固有名詞","山崎元と水瀬ケンイチによる長期投資本の定番で、筆者は株価下落時に読みたい本の筆頭に挙げている。読みやすさと値段で最もコスパがいい一冊だとしてイチオシし、暴落時の心構えとして「上げ相場にも下げ相場にも全て付き合う」という一節を引用している。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["上げ相場にも下げ相場にもすべて付き合うと決めておく。","文","『ほったらかし投資術』から筆者が暴落時の心構えとして引いた考え方である。自分が他人より優れた情報や解釈能力を持っていないと自覚する賢い投資家は、相場の上下を読もうとせず市場に居続けるべきだという主張を、筆者は安心を取り戻す拠り所として紹介している。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["JUST KEEP BUYING","固有名詞","どんな時でも買い続けろと説く投資本で、筆者は長期積立投資を一言で言い切ったタイトルがすべてだと評している。投資の不運を軽減する方法として、低リスク資産への分散、低迷時の取り崩し率の抑制、パートタイムの仕事での収入補填の3つを抜き出している。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["稲妻が輝く瞬間","概念","筆者が長期投資の古典・聖典と呼ぶ『ウォール街のランダム・ウォーカー』で説かれる考え方である。暴落時でも市場に居続けることで、大きく上昇する瞬間を逃すなという教えを紹介している。分量が多いので読み終える頃には相場の風向きも変わっているかもしれないと茶化している。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["ジェイソン流お金の増やし方","固有名詞","厚切りジェイソンによる数年前の大ヒット投資本で、新NISA対応の改訂版が出ている。筆者は暴落時の対処を綴った「ぼくのコロナショック体験談」が参考になるとし、モンテカルロ法を使った資産変動のシミュレーションの話も面白いと紹介している。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["狼狽売りの苦い経験","概念","『ジェイソン流お金の増やし方』から筆者が引用した一節に出てくる話である。著者がどんな局面でも投資スタイルを曲げずに来られたのは、父がリーマン・ショック時に狼狽売りした経験談を知っていたことと、納得いくまで市場と過去のデータを分析していたからだという。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["株価下落の「嫌な感じ」","概念","山崎元のトウシル記事「下落相場に負けない個人投資家になるための8つの法則」の一項目に出てくる言葉である。筆者はこの記事を決定版的な内容と評し、株価下落の「嫌な感じ」こそが投資の儲けの源泉だという言葉が刺さると述べている。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["暴落時は100年チャートを眺めていつもどおり暮らす。","文","株価下落時に読みたい本を紹介し終えた筆者の締めくくりの提案である。読書で気持ちを落ち着かせたあとは、アメリカ市場の100年チャートでも眺めて株価のことは一旦忘れ、いつもと同じように生活するのがよいと述べ、一喜一憂しない姿勢を勧めている。","株価下落時に読みたい本リスト","https://note.com/beefbowl60/n/nba942266bb6d","2025-04-29","文脈"],["休日に一度は体を動かすと平日の疲れが減る。","文","土日を家で体を動かさずに過ごすと、その後の平日のほうがかえって疲れていることに筆者が気づいた経験から来ている。経験上、休日のどちらかに運動をしたほうが平日に疲れないと述べ、その実感を裏付ける考え方を『休養学』に見つけている。","動くことで身体を休める","https://note.com/beefbowl60/n/ned71a25a369b","2025-05-01","文脈"],["休養学","固有名詞","片野秀樹による本で、筆者が「動くことで身体を休める」という実感の裏付けとして紹介している。休日に動いたほうが平日に疲れないという経験を、この本では「攻めの休養」と呼ぶらしいと知り、活動・疲労・休養に活力を加えるサイクルを勧める内容に納得している。","動くことで身体を休める","https://note.com/beefbowl60/n/ned71a25a369b","2025-05-01","文脈"],["攻めの休養","概念","『休養学』で紹介されている、あえて体を動かすことで休む考え方である。筆者は、休日に家でじっとしているより運動したほうが平日に疲れないという自分の経験がまさにこれに当たると知り、確かに実感と一致すると受け止めている。","動くことで身体を休める","https://note.com/beefbowl60/n/ned71a25a369b","2025-05-01","文脈"],["活力のサイクル","概念","『休養学』が勧める、活動→疲労→休養で終わらせず、そのあとに「活力」を加える循環である。活力とは少し負荷のある行動をとることで、ソファで寝ているより体を動かしたほうが基礎体力が上がり次の活動につながる。筆者はGWにこれを意識したいと述べている。","動くことで身体を休める","https://note.com/beefbowl60/n/ned71a25a369b","2025-05-01","文脈"],["ジムは鍛える場所ではなく体を整える場所だ。","文","攻めの休養の考え方が実感と一致すると述べたあと、筆者は最近ジムで体を動かしていることに触れている。筆者にとってジム通いは体を鍛え上げるためというより、体のメンテナンスのような目的で続けているものであり、休養の一部として位置づけている。","動くことで身体を休める","https://note.com/beefbowl60/n/ned71a25a369b","2025-05-01","文脈"],["永井均『〈子ども〉のための哲学』","固有名詞","筆者が読書ノートを付けた講談社現代新書の哲学入門書である。他人の思想をなぞらず、自分自身の疑問から思考を深めることを勧める本当の哲学の入門書だと評する。言葉で説明しにくいテーマを子どもにも分かるように言語化しきっていることに感心している。","【読書ノート】永井均「＜子ども＞のための哲学」","https://note.com/beefbowl60/n/n9d4c0d8fdaf1","2025-05-02","文脈"],["哲学は他人の思想をなぞらず自分の疑問から始めるものだ。","文","『〈子ども〉のための哲学』で繰り返し述べられていると筆者が読み取った主張である。その意味で本書は著者自身の哲学を説いたもので読者の哲学ではないと筆者は指摘し、「子ども」が山括弧付きなのは年齢の意味ではないことを示していると解釈している。","【読書ノート】永井均「＜子ども＞のための哲学」","https://note.com/beefbowl60/n/n9d4c0d8fdaf1","2025-05-02","文脈"],["大人の哲学","概念","本書が「子どもの哲学」に対して示す「青年の哲学」「大人の哲学」「老人の哲学」という区分の一つである。筆者はこの区分けを興味深いとし、今の自分は「大人の哲学」期にいると考えた。過去の経験に規定された自己認識に安住していると痛感している。","【読書ノート】永井均「＜子ども＞のための哲学」","https://note.com/beefbowl60/n/n9d4c0d8fdaf1","2025-05-02","文脈"],["上げ底生活","概念","筆者が「大人の哲学」期にいる自分の暮らしを振り返って使った言葉である。「うそ」にまみれた上げ底の生活に安住してしまっていると痛感し、それは自己認識が過去の個人的経験に規定され、何者でもなく自分が存在する感覚が薄れたことと関係している気がすると述べている。","【読書ノート】永井均「＜子ども＞のための哲学」","https://note.com/beefbowl60/n/n9d4c0d8fdaf1","2025-05-02","文脈"],["生活を回すことにかまけると子どもの疑問は顧みられない。","文","『〈子ども〉のための哲学』を読んだ筆者の自己省察である。過去の蓄積の結果としての日々の生活を回すことに追われ、素朴な〈子ども〉の疑問に立ち返る機会は皆無と言ってよいと述べ、大人になった自分の思考のあり方に疑問を投げかけている。","【読書ノート】永井均「＜子ども＞のための哲学」","https://note.com/beefbowl60/n/n9d4c0d8fdaf1","2025-05-02","文脈"],["世界が開けていることの〈奇跡〉","概念","本書を読んで筆者が向き合った問いの核である。今、ここに自分の世界が開けていることの〈奇跡〉に驚き続けることなど、生活に追われる大人に果たしてできるのだろうかと筆者は自問し、答えを出さないまま問いとして残している。","【読書ノート】永井均「＜子ども＞のための哲学」","https://note.com/beefbowl60/n/n9d4c0d8fdaf1","2025-05-02","文脈"],["坂本龍一『音楽は自由にする』","固有名詞","誕生から2000年代のYMO再々結成の頃までを語りおろした坂本龍一の自伝である。筆者はYMOでの脚光からアカデミー賞受賞、バルセロナ五輪での作曲指揮まで、わずか10年余りで大きなキャリアを積み上げた時期の話が特に興味深いと述べている。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["細野晴臣","固有名詞","筆者が『音楽は自由にする』を読み、坂本龍一のキャリアの起点として改めて意識した人物である。振り返ればこの人もまた細野晴臣と出会ったことがすべての始まりだったのだと感じている。私家版索引でも高橋幸宏と並び、全編を通じて頻繁に登場する。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["私家版索引","概念","筆者が『音楽は自由にする』を読みながら自作した人名と作品名の索引である。索引を作ったことで、YMOのメンバーに加えてドビュッシーやジョン・ケージが全編に渡って言及されていることが見えてきたと述べ、読み方の道具として活用している。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["ドビュッシー","固有名詞","私家版索引から、坂本龍一が全編に渡って言及していると筆者が気づいた作曲家である。筆者は西洋音楽、民族音楽、実験音楽、ポピュラー音楽の混ざり合いが彼の創作の原点にあったのではないかと感じ、その西洋音楽側の柱としてドビュッシーを位置づけている。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["表現は個の痛みを失う代わりに他者への通路を得る。","文","筆者が『音楽は自由にする』の音楽論から引用した一節の要点である。表現は他者と共有できる形でないと成立せず、抽象化の過程で個的な痛みや喜びが抜け落ちる欠損感がある。だがその限界と引き換えに、別の世界の人と理解し合える通路ができるという。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["解体の時代","概念","坂本龍一が高校時代に現代音楽と出合った1960年代後半を振り返って語った言葉として、筆者が引用している。西洋音楽は行き詰まり、従来の音楽でブロックされた耳を解放しなければならないと考えていた時期であり、西洋音楽の歴史と自分の時代が交わった瞬間だったという。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["ポップ・ミュージックという共通の基盤","概念","筆者が引用した、音楽が「わかる」とはどういうことかをめぐる一節に出てくる考え方である。文化的背景の違う音楽はほとんど理解できないが、ロンドンの聴衆がYMOを異質と感じつつ心や体を揺さぶられたのは、この共通の基盤があったからだと坂本は語っている。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["共同体が培ってきた音楽には、どんな天才も敵わない。","文","坂本龍一が10代で民族音楽に興味を持った頃から感じていたこととして、筆者が引用した一節の要点である。長い時間をかけて共同体が育てた音楽には、モーツァルトやドビュッシーでも勝てないという。筆者は民族音楽を彼の創作の原点の一つと見ている。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["否定したい文化でも、それしか自分の言語はない。","文","筆者が引用した坂本龍一の述懐の要点である。クラシック音楽はヨーロッパの覇権や植民地主義あってこその形であり、それをありがたがってきた自分を全否定したい。ドビュッシーもビートルズも幻想だったと思いつつ、自分が持つ言語はそれしかないと認めている。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["ジョン・ケージ","固有名詞","私家版索引で全編に渡る言及が確認できると筆者が指摘した作曲家である。引用の最後では、音楽を論理的に操作しようとする流れが1950年代のブーレーズで頂点に達した頃、ケージが操作を加えず偶然に任せる音楽を提示したという坂本の歴史観が語られている。","【読書ノート】坂本龍一「音楽は自由にする」","https://note.com/beefbowl60/n/nf242adde0fed","2025-05-03","文脈"],["かもめのジョナサン 完成版","固有名詞","リチャード・バックの1974年の大ベストセラーに、未発表だった第4章を加えて刊行された版で、筆者は五木寛之の創訳による新潮文庫で読んだ。一羽のカモメを通して生きる意味を探す物語だが、50年前の作品ゆえか宗教的寓話のような読みに引っ張られたと述べている。","【読書ノート】リチャード・バック「かもめのジョナサン 完成版」","https://note.com/beefbowl60/n/n647789cd8d5e","2025-05-04","文脈"],["神秘体験の権力化","概念","筆者が『かもめのジョナサン』に感じた危うさである。時速340km以上で飛ぶという限界突破は主観ではないかと疑い、この種の神秘体験は批判に強いがゆえに絶対的な価値となり権力化すると指摘する。以後、超越者の目線で世界が解釈し直される危険な香りを嗅ぎ取っている。","【読書ノート】リチャード・バック「かもめのジョナサン 完成版」","https://note.com/beefbowl60/n/n647789cd8d5e","2025-05-04","文脈"],["異端の回収","概念","完成版で新たに加えられた第4章について筆者が読み取った構図である。ジョナサンの体験が神格化され、やがて形骸化していく流れのあとに異端が登場するが、それもまた結局「奇跡」の側に回収されてしまうと述べ、物語が批判の外側に閉じていく点を問題視している。","【読書ノート】リチャード・バック「かもめのジョナサン 完成版」","https://note.com/beefbowl60/n/n647789cd8d5e","2025-05-04","文脈"],["人から教わる場では、特殊な体験が神格化されやすい。","文","『かもめのジョナサン』の構図を筆者が身近な場面に引き寄せた考察である。他者から何かを習うとき、特殊な体験の一般化、神格化、形骸化が起こり、周りはただ信奉するだけになる。ごく小さな範囲でも起こりうるので、自分が何を求めるかを注意深く内省すべきだとしている。","【読書ノート】リチャード・バック「かもめのジョナサン 完成版」","https://note.com/beefbowl60/n/n647789cd8d5e","2025-05-04","文脈"],["一生を短くするのは、退屈と恐怖と怒りだ。","文","筆者が『かもめのジョナサン』から書き留めた引用の一つを凝縮したものである。ジョナサンは、カモメの一生があれほど短いのは退屈と恐怖と怒りのせいだと発見するに至る。筆者は作品の宗教的な色合いに批判的でありつつ、印象に残る言葉として記録している。","【読書ノート】リチャード・バック「かもめのジョナサン 完成版」","https://note.com/beefbowl60/n/n647789cd8d5e","2025-05-04","文脈"],["完全なる境地","概念","筆者が『かもめのジョナサン』から引用した、天国とは場所でも時間でもなく完全なる境地のことだという一節に出てくる言葉である。空間を克服すればここだけが、時間を征服すればいまだけが残るという引用とあわせて、作品の超越的な世界観を示す言葉として書き留めている。","【読書ノート】リチャード・バック「かもめのジョナサン 完成版」","https://note.com/beefbowl60/n/n647789cd8d5e","2025-05-04","文脈"],["千葉雅也『勉強の哲学』","固有名詞","筆者が文庫の増補版で再読した本である。具体的な勉強の手法を述べた部分が「役立ちすぎる」と評し、とくに「勉強を続けるとは、読書ノートをつけ続けること」という明言に強く影響を受けた。最後には勉強しながら制作する暮らしの楽しさを語る一節も引用している。","【読書ノート】千葉雅也「勉強の哲学」","https://note.com/beefbowl60/n/n7d8126d50c94","2025-05-05","文脈"],["出典つきの読書ノート","概念","『勉強の哲学』が勧めるノート術で、文献名・ページ数・出版年を明記した引用と自分の理解を区別して書き残すものである。筆者はこの引用を読み、知識を出典に紐づけることの重要性を受け止め、ノートのない読書など無意味だという気さえしてくると述べている。","【読書ノート】千葉雅也「勉強の哲学」","https://note.com/beefbowl60/n/n7d8126d50c94","2025-05-05","文脈"],["他人の考えと自分の考えの境目を意識すると、個性が育つ。","文","読み散らかすだけでは、どこかで読んだことと自分で考えたことが混ざり、気づかないうちにパクリになりかねないという『勉強の哲学』の指摘を筆者は引用した。その区別こそが個性的なアイデアを育む上で大事だという点に、筆者は共感を示している。","【読書ノート】千葉雅也「勉強の哲学」","https://note.com/beefbowl60/n/n7d8126d50c94","2025-05-05","文脈"],["勉強のタイムライン","概念","『勉強の哲学』で、勉強用のノートを生活とは別のタイムラインそのものとして捉える考え方である。ノートは自分の新たな可能性を考えるための特別な場所だとされる。筆者はこの一節を引き、ノートを作り維持することの意味を確認している。","【読書ノート】千葉雅也「勉強の哲学」","https://note.com/beefbowl60/n/n7d8126d50c94","2025-05-05","文脈"],["勉強＝インプット＋ノート","概念","『勉強の哲学』を読んだ筆者が自分なりに立てた等式である。最初は「勉強＝読書＋ノート」と書き、勉強は技芸など読書に限らないことから読書をインプット全般に言い換えた。つまりノートが大事だというのが、筆者がこの本から引き出した結論である。","【読書ノート】千葉雅也「勉強の哲学」","https://note.com/beefbowl60/n/n7d8126d50c94","2025-05-05","文脈"],["誰かに読まれる前提で書くと、ノートの考えは深まる。","文","筆者は『勉強の哲学』の影響で、読書の記録をnoteに記事化するようになった。自分しか見ないノートは書き方が雑になり考えが深まらないが、主に未来の自分に読まれることを前提にすれば読める形で考えを残せるとして、noteのような装置が適していると感じている。","【読書ノート】千葉雅也「勉強の哲学」","https://note.com/beefbowl60/n/n7d8126d50c94","2025-05-05","文脈"],["画角の違う2台を左右のポケットに入れて使い分ける。","文","筆者はリコーのGRIIIとGRIIIxという画角の違う2台を持ち、その日の気分で使い分けている。旅行では2台を左右のポケットに入れ、状況に応じて持ち替える。個性の違いを楽しむための2台持ちは本当におすすめだと述べている。","わたしのGRⅢとGRⅢx","https://note.com/beefbowl60/n/nae1d0fa9ca92","2025-05-06","文脈"],["GRIII","固有名詞","筆者が持つ換算28mmのリコーのカメラで、ダークグレーの純正リングを付けている。使い比べた印象を、万能でどんなシーンにも対応するが散漫になりがちで工夫が必要、パースが強調されスケール感が出る、速射性があり記録的、などと列挙している。","わたしのGRⅢとGRⅢx","https://note.com/beefbowl60/n/nae1d0fa9ca92","2025-05-06","文脈"],["GRIIIx","固有名詞","筆者が持つ換算40mmのリコーのカメラで、初回購入特典のパープルのリングキャップを付けている。遠近圧縮が効き、ボケを作りやすく歪みのない端正な写りと評する。スマホがある前提で1台だけ持つならこちらだと結論づけている。","わたしのGRⅢとGRⅢx","https://note.com/beefbowl60/n/nae1d0fa9ca92","2025-05-06","文脈"],["切り取る覚悟","概念","筆者がGRIIIx（40mm）を使ってみての感想として最初に挙げた言葉である。28mmより画角が狭く、被写体から離れて構図を切り取る必要があるため、撮る側に覚悟が求められる。そのぶん「より写真的」になると筆者は感じている。","わたしのGRⅢとGRⅢx","https://note.com/beefbowl60/n/nae1d0fa9ca92","2025-05-06","文脈"],["記録的な28mm、記憶的な40mm","概念","GRIIIとGRIIIxを使い比べた筆者の主観的な対比である。28mmは被写体に近づき遠近感やスケール感が出る記録的な写り、40mmは距離が近く感じられる記憶的な写りだと整理した。どちらが良いかは甲乙つけがたいとしている。","わたしのGRⅢとGRⅢx","https://note.com/beefbowl60/n/nae1d0fa9ca92","2025-05-06","文脈"],["Kindle","固有名詞","筆者が約10年、ほぼ一択で使ってきた電子書籍である。紙の本に回帰した今も不要になったわけではなく、圧倒的な軽さと何百冊も持ち歩ける利便性、昔読んだ本をすぐ検索して読み返せる点は紙では真似できないと評価し続けている。","紙の本に帰ってきた　10年Kindle派が再び紙に戻る","https://note.com/beefbowl60/n/n1a62878ec9e3","2025-05-07","文脈"],["自炊","概念","紙の本を自分でスキャンして電子化することで、筆者はKindle一択だった時期に次々と本を自炊し、場所を取る紙の本を思い切って手放した。当時は紙の本に戻ることはもうないと本気で思っていたと振り返っている。","紙の本に帰ってきた　10年Kindle派が再び紙に戻る","https://note.com/beefbowl60/n/n1a62878ec9e3","2025-05-07","文脈"],["紙の本への回帰","概念","ここ数ヶ月で心境が変わり、筆者の部屋に紙の本が少しずつ増え始めた現象を指す。理由は単純に読みやすいからで、ページをめくって目当ての箇所を探すのが早く、再読もしやすい。10年のKindle生活を経てようやく良さに気づけたのかもしれないとしている。","紙の本に帰ってきた　10年Kindle派が再び紙に戻る","https://note.com/beefbowl60/n/n1a62878ec9e3","2025-05-07","文脈"],["余白への書き込み","概念","筆者が紙の本の大きな魅力として挙げる点である。線を引いたり、欄外にメモを書いたり、ときには簡単な図を描いたりすることで、読みながら考えを整理でき、内容への理解も深まると述べている。電子書籍にはない紙ならではの自由さとして捉えている。","紙の本に帰ってきた　10年Kindle派が再び紙に戻る","https://note.com/beefbowl60/n/n1a62878ec9e3","2025-05-07","文脈"],["気に入った本は、紙と電子書籍の両方で持っておく。","文","紙の本に戻りつつもKindleを手放せない筆者が落ち着いた、少し贅沢な読書スタイルである。移動中や外出先ではKindleで手軽に読み、腰を据えて読み込みたいときは紙の本を開く。用途に応じた使い分けで読書の楽しみ方が深まったと感じている。","紙の本に帰ってきた　10年Kindle派が再び紙に戻る","https://note.com/beefbowl60/n/n1a62878ec9e3","2025-05-07","文脈"],["じっくり熟読するなら、やはり紙の本が一番だ。","文","10年のKindle生活を経て筆者があらためて実感した結論である。根拠としてページをめくる感触、書き込みの自由さ、本棚からさっと取り出してパラパラと再読できる手軽さを挙げ、電子書籍の便利さとは別の価値として紙の良さを見直している。","紙の本に帰ってきた　10年Kindle派が再び紙に戻る","https://note.com/beefbowl60/n/n1a62878ec9e3","2025-05-07","文脈"],["カバーを外して読む文庫本","概念","古本屋でカバーのない文庫本を見るとテンションが下がっていた筆者が、あえて意識的にカバーを外して読み始めた習慣である。カバーが滑ったりズレたりするストレスがなく、ページをめくる感触が直に手に伝わり、案外快適だったことに驚いている。","文庫本のカバーを外してみる","https://note.com/beefbowl60/n/nd2af6cb6df83","2025-05-08","文脈"],["静かにある本","概念","カバーを外した文庫本の利点として筆者が挙げた姿である。シンプルな背表紙や質感が部屋の雰囲気を邪魔せずインテリアに馴染み、静かに佇んでくれるという。誰に見せるわけでもないのに本好きの通っぽさが漂い、自己満足的な気持ちよさもあると述べる。","文庫本のカバーを外してみる","https://note.com/beefbowl60/n/nd2af6cb6df83","2025-05-08","文脈"],["カバーを外すと、装丁の先入観なしに中身と向き合える。","文","カバーを外して読むことで筆者が気づいた意外な利点の一つである。派手な装丁やキャッチコピーに惑わされず、よりピュアに内容と向き合える気がするという。装丁が気に入った本のカバーだけはクリアファイルにまとめて保管している。","文庫本のカバーを外してみる","https://note.com/beefbowl60/n/nd2af6cb6df83","2025-05-08","文脈"],["本は売らないという覚悟","概念","筆者はいくつかの文庫本のカバーを捨て、売らない覚悟を決めた。古本屋に売ってもせいぜい数十円から数百円で、それより繰り返し読み込んで血肉にしたほうがはるかに価値があると考える。そう決めたことで読書の姿勢そのものが変わったという。","文庫本のカバーを外してみる","https://note.com/beefbowl60/n/nd2af6cb6df83","2025-05-08","文脈"],["本とは、読み終えてから本当の付き合いが始まる。","文","本を売らないと決めた筆者が実感した読書の変化である。読み終えた後にメモを書き込んだり線を引いたりして本との対話が始まり、再読するたびにまったく別の顔を見せてくれるようになったと述べている。","文庫本のカバーを外してみる","https://note.com/beefbowl60/n/nd2af6cb6df83","2025-05-08","文脈"],["所有物から相棒へ","概念","売らずに書き込みと再読を重ねるうちに、本の位置づけが変わっていくことを表した筆者の言葉である。カバーを外すという小さな習慣が読書体験に大きな違いをもたらしたとし、本ともっと親密に付き合う方法として読者にも勧めている。","文庫本のカバーを外してみる","https://note.com/beefbowl60/n/nd2af6cb6df83","2025-05-08","文脈"],["カフカ鼾","固有名詞","ジム・オルーク（ベース、シンセ）、石橋英子（キーボード、ピアノ）、山本達久（ドラム）の3人によるバンドで、筆者は2025年5月9日に新宿ピットインで2日公演の初日を聴いた。2曲の後に休憩を挟み、後半と短いアンコールという構成だった。","カフカ鼾＠新宿PIT INNへ行った","https://note.com/beefbowl60/n/nf20d4fb8bc52","2025-05-10","文脈"],["即興の対話","概念","カフカ鼾の演奏を聴いた筆者が感じた音楽のあり方である。音が交わって対話が生まれ、3人の演奏がひとつのうねりになっていく。筆者はその様子を英語と日本語の両方で書き留め、自分はその瞬間に立ち会っていたと記している。","カフカ鼾＠新宿PIT INNへ行った","https://note.com/beefbowl60/n/nf20d4fb8bc52","2025-05-10","文脈"],["音楽が生まれて消える瞬間に、ただ身を浸す。","文","カフカ鼾のライブで、今この場で音楽が生まれ、同時に消えていくのを筆者は体験した。その瞬間ごとに身を浸す心地よさを味わい、森の中で無心になっているような感覚だったと振り返っている。","カフカ鼾＠新宿PIT INNへ行った","https://note.com/beefbowl60/n/nf20d4fb8bc52","2025-05-10","文脈"],["温泉のような身体的享楽","概念","カフカ鼾の即興演奏を聴いたときの感覚を、筆者は温泉に浸かっているような身体的享楽と表現した。頭で理解する音楽というより、うねりに身体ごと浸る快さとして受け止めている。森の中で無心になる感覚とも重ねている。","カフカ鼾＠新宿PIT INNへ行った","https://note.com/beefbowl60/n/nf20d4fb8bc52","2025-05-10","文脈"],["新宿PIT INN","固有名詞","筆者が久しぶりに訪れた新宿のジャズクラブである。チケット代に1ドリンクが含まれているのは良心的で、スタッフの配慮も全体的に良かったと評価している。この日の客の入りは8〜9割ほどで、休憩時間には出演者によるTシャツ物販もあった。","カフカ鼾＠新宿PIT INNへ行った","https://note.com/beefbowl60/n/nf20d4fb8bc52","2025-05-10","文脈"],["名前を読み上げる入場","概念","新宿ピットインで筆者が体験した、予約時の氏名を読み上げて入場させる独特のシステムである。呼ばれるのを聞き逃さないよう、かなり注意深く待たなければならなかったという。ライブ会場ごとの作法の違いとして印象に残っている。","カフカ鼾＠新宿PIT INNへ行った","https://note.com/beefbowl60/n/nf20d4fb8bc52","2025-05-10","文脈"],["書き込み派への転向","概念","書き込みに罪悪感と気恥ずかしさを覚え「書き込まない派」だった筆者が、練習用に買った100〜200円の文庫本をきっかけに転向したことを指す。最初の一筆は背徳的だったが、再読時に重要箇所へ一直線に戻れる快適さを知り、書き込みは加速度的に増えていった。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["世界で一冊しかない自分ノート","概念","書き込んだ本を筆者はこう呼ぶ。書き込み本は当然売れないため売らないと決め、その一冊を再読・熟読して深めていく方針にした。本が汚れる、売れなくなるという躊躇いもしばらくあったが、本は読むためのものだと考えて落ち着いたという。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["本はきれいに残すより、血肉にすることに価値がある。","文","筆者が共感したブログ記事「本は汚く読んだ方がいい」の主張である。自分のために残すだけの本なら、きれいなまま残ることに本質的な価値はなく、死ぬときまでにどれだけ血肉になったかが大切だという。書き込みに迷っていた筆者の背中を押した考え方である。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["『マルジナリアでつかまえて』","固有名詞","本への書き込み、すなわち「マルジナリア」の世界を存分に楽しませてくれる名著として筆者が挙げた本である。書き込み派の先達を探して参考文献を集めた際の筆頭に置いている。筆者は歴史的な本よりも、著者自身の書き込み本のほうに興味が湧いたと述べる。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["書き込みながら読むと、受け身の読書が著者との対話に変わる。","文","本を汚さずに読むときは講義を受けているような受け身の状態だが、書き込みながら読むと著者に相づちや突っ込みを入れる積極的な姿勢になれる、というブログの一節を筆者は引用した。中古本を売っても合計230円だったという話とあわせて紹介している。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["傍線を引くのは効率のためではなく、理解のためだ。","文","筆者が参考にしたYahoo!知恵袋の回答者の考えである。読書は効率を超えたものだとし、難解な理論書では論の展開をつかむためにキーワードにマーキングを続けてきたという。読後にメモから書き抜いて感想を付ける方法も、筆者は太字で強調して紹介している。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["齋藤孝『三色ボールペン情報活用術』","固有名詞","三色のボールペンを使い分ける読書術の本として筆者が紹介した。赤は客観的に最も重要な箇所、青はまあ重要な箇所、緑は主観的に面白いと感じた箇所に引くという。ただし筆者自身は、基本的に赤一色だけでマーキングしていると書いている。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["『アウトプット大全』","固有名詞","「絶対に書き込みをしながら読むこと」を推奨している本として筆者が引用した。書き込むことで理解が深まり記憶にも残りやすくなり、「読む」という行為を一瞬でアウトプットに変えられるという。受け身の読書が攻めの読書に変わるという主張を紹介している。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["倉下忠憲『すべてはノートからはじまる』","固有名詞","「本＝ノート」という考えを提唱する本として筆者が引用した。本はあらかじめ情報が書き込まれたノートとみなせ、赤線を引いたり余白に疑問をメモしたりすれば、読み手にとっても本は自分のノートの延長線上にあるという。書き込み本を自分ノートと呼ぶ筆者の考えと響き合う。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["3回読み読書術","概念","山口周『読書を仕事につなげる技術』で提唱される読み方として筆者が紹介した。1回目は赤ペンで冒頭から末尾までしっかり線を引き、2回目に面白かった箇所を5つ選び、3回目にPCなどのノートへ転記して、ひらめきの示唆と具体的な行動も書き添える。","本に書き込みをする人たち","https://note.com/beefbowl60/n/nf9062273bf76","2025-05-11","文脈"],["アガサ・クリスティ『カーテン』","固有名詞","ポアロシリーズ最後の作品で、筆者がずっと気になっていながらようやく読んだ名作である。物語の展開には大いに揺さぶられて楽しんだが、ラストには思ったより感情移入できなかったという。それでも最終作らしく全体に漂う終わりの雰囲気は印象に残った。","【読書ノート】アガサ・クリスティ「カーテン」","https://note.com/beefbowl60/n/nb8de5657b9a9","2025-05-13","文脈"],["エルキュール・ポアロ","固有名詞","『カーテン』で最後の事件に臨む名探偵である。筆者は、かつて輝かしい栄光に包まれたポアロでさえ起居もままならぬ老人になってしまった、と語り手が嘆く一節を引用した。灰色の頭、灰色の心、灰色の夢という言葉とともに、人生の黄昏を印象づける存在である。","【読書ノート】アガサ・クリスティ「カーテン」","https://note.com/beefbowl60/n/nb8de5657b9a9","2025-05-13","文脈"],["時代感覚のギャップ","概念","『カーテン』のラストに筆者が感情移入しきれなかった理由として挙げた推測である。1943年に執筆された作品で、日本で言えば横溝正史『本陣殺人事件』と同じくらいの時代にあたる。その隔たりが読後感に影響したのだろうかと、結論は保留している。","【読書ノート】アガサ・クリスティ「カーテン」","https://note.com/beefbowl60/n/nb8de5657b9a9","2025-05-13","文脈"],["名探偵の最終作には、老いと死へのまなざしが漂う。","文","『カーテン』を読んだ筆者がもっとも印象に残ったと述べる点である。展開やラスト以上に、最終作にふさわしい終わりの雰囲気と、誰もが避けられない運命としての老いと死を見つめる視線に心を留め、黄昏を嘆く一節を引用している。","【読書ノート】アガサ・クリスティ「カーテン」","https://note.com/beefbowl60/n/nb8de5657b9a9","2025-05-13","文脈"],["戦時下に書かれた最終作に、古き良き時代の終焉を感じる。","文","『カーテン』の執筆は第二次大戦下、ナチスドイツがヨーロッパで戦線を拡大した年のイギリスで、作者は53歳だった。公開は1975年まで待たれた。筆者はこの執筆背景に目を向け、作品から古き良き時代の終わりのようなものを感じ取っている。","【読書ノート】アガサ・クリスティ「カーテン」","https://note.com/beefbowl60/n/nb8de5657b9a9","2025-05-13","文脈"],["キヤノンギャラリーS","固有名詞","筆者が佐藤健寿の写真展を見に訪れた、品川のキヤノンマーケティングジャパンのビル1階にあるギャラリーである。JR品川駅から徒歩10分ほどで入場無料。スペースはそれほど広くないが十分に見応えがあり、受付のパンフレットも充実していたと評価している。","佐藤健寿 写真展「U.F.O」へ行きました","https://note.com/beefbowl60/n/n0593881d3cfb","2025-05-15","文脈"],["佐藤健寿","固有名詞","筆者が写真展を見に行った写真家である。世界各地の辺境を旅して撮影してきた人として紹介され、筆者はライカやソニーαのイメージを持っていたが、最近はキヤノンのEOS Rで撮影しているようだと記している。会期中にもう一度再訪したいと述べている。","佐藤健寿 写真展「U.F.O」へ行きました","https://note.com/beefbowl60/n/n0593881d3cfb","2025-05-15","文脈"],["写真展「U.F.O」","固有名詞","佐藤健寿の写真展で、謎めいた名前はUnknown（未知のもの）、Forgotten（忘却したもの）、Overlooked（見過ごしたもの）の頭文字だという。直近20年間に世界各地で撮られた写真が並び、筆者は旅の詳細が綴られたハンドアウトも含めて充実した展示だったと感じた。","佐藤健寿 写真展「U.F.O」へ行きました","https://note.com/beefbowl60/n/n0593881d3cfb","2025-05-15","文脈"],["映像を先に観ると、写真の展示がより躍動的に見える。","文","写真展「U.F.O」で筆者がとくに印象に残ったのは映像作品だった。これを最初に観ておくと、その後の写真展示がより躍動的に感じられるかもしれないと述べ、展示の回り方の順番によって写真の見え方が変わることに気づいている。","佐藤健寿 写真展「U.F.O」へ行きました","https://note.com/beefbowl60/n/n0593881d3cfb","2025-05-15","文脈"],["辺境の写真を浴びると、カメラを持って旅に出たくなる。","文","佐藤健寿の映像作品と写真を見た筆者は、まるで世界の辺境地を旅した気分になったという。その結果、今すぐカメラを持って旅に出たいという気持ちが高まった。写真展が撮る側の意欲を刺激する体験として書き留めている。","佐藤健寿 写真展「U.F.O」へ行きました","https://note.com/beefbowl60/n/n0593881d3cfb","2025-05-15","文脈"],["旅の遡行","概念","写真展「U.F.O」について、佐藤健寿本人が告知で述べた展示の組み立て方である。過去20年余りの自分の旅を遡りながら、写真を時系列的に集成したものだという。筆者はこの告知を記事内に引用し、展示の性格を伝えている。","佐藤健寿 写真展「U.F.O」へ行きました","https://note.com/beefbowl60/n/n0593881d3cfb","2025-05-15","文脈"],["体術","概念","筆者が習い始めた身体の技である。始めてから、これまでいかに自分の身体に無関心だったかを痛感するようになったという。健康な五体がありながら全く使いこなせてこなかったと振り返り、身体の動きをこれから磨き続けていきたいと述べている。","体を動かす・体を観る","https://note.com/beefbowl60/n/n906f9904e051","2025-05-15","文脈"],["無意識の所作から意識の対象へ","概念","体術を習う中で筆者が感じている変化である。歩く、立つ、構える、受け身を取るといった動作のすべてが意識の対象になり、腕の角度や足裏の重心に気づくたび、自分という存在を外から観察しているような不思議な感覚に包まれるという。","体を動かす・体を観る","https://note.com/beefbowl60/n/n906f9904e051","2025-05-15","文脈"],["体を観る","概念","体術を通じて筆者の中に芽生えた感覚を表す言葉で、記事のタイトルにも使われている。自分の身体を外から観察するように意識することで、身体と心は切り離せないものだと気づかされたと述べている。動かすことと観ることを対にして捉えている。","体を動かす・体を観る","https://note.com/beefbowl60/n/n906f9904e051","2025-05-15","文脈"],["頭で考えるのではなく、体で感じる回路を開いていく。","文","体術を習い「体を観る」感覚が芽生えた筆者が、いまの日々をこう表現した。身体の細部に気づくたびに、身体と心が切り離せないと実感し、思考より先に身体で感じ取る回路が少しずつ開いていく過程にあると捉えている。","体を動かす・体を観る","https://note.com/beefbowl60/n/n906f9904e051","2025-05-15","文脈"],["AIが進化する時代ほど、固有の身体感覚が重要になる。","文","体術についての短い記事の結びで筆者が述べた直感である。情報や人工知能の能力が爆発的に進化する時代にあって、自分固有の身体感覚はより重要になるのではないかと考え、そうした将来に向けて身体の動きを磨き続けたいとしている。","体を動かす・体を観る","https://note.com/beefbowl60/n/n906f9904e051","2025-05-15","文脈"],["集中が淡々と持続する選曲","概念","筆者が通勤時間や仕事中に聴くDJ MIXを選ぶときの基準である。ミドルテンポで派手な展開がないものを好んで選んでいる。ハウス、テクノ、ミニマル、音響系、ジャジーなものまで幅はあるが、いずれも作業の邪魔をせず集中を保てるものとして挙げている。","よく聴くDJ MIXリスト","https://note.com/beefbowl60/n/ne106fa8a6698","2025-05-17","文脈"],["聴いた音楽は履歴に埋もれるので、自分でリストにまとめる。","文","筆者はDJ MIXのプレイリストをよく聴くが、Apple Musicの履歴ではすぐ埋もれてしまうため、noteの記事にリスト化してまとめることにした。お気に入りのMIXに短い感想を添え、後から聴き返せる自分用の索引として記事を使っている。","よく聴くDJ MIXリスト","https://note.com/beefbowl60/n/ne106fa8a6698","2025-05-17","文脈"],["Compuma","固有名詞","筆者のDJ MIXリストに挙がった、コンピューマこと熊本出身の松永耕一氏である。筆者はそのMIXを音響系と評し、聴いていると遠くへ連れて行かれる感じがすると書いている。集中して作業するときに流すMIXの一つとして選んでいる。","よく聴くDJ MIXリスト","https://note.com/beefbowl60/n/ne106fa8a6698","2025-05-17","文脈"],["machina","固有名詞","筆者のDJ MIXリストで「Tresor 30 x machina」として挙げられた、韓国人アーティストのマキーナである。ポリリズムや変拍子が多くてすごいと評し、集中したいときに最適だと述べている。派手さではなく複雑なリズムが集中を支える例として紹介している。","よく聴くDJ MIXリスト","https://note.com/beefbowl60/n/ne106fa8a6698","2025-05-17","文脈"],["ソニー SRS-XB100","固有名詞","筆者がDJ MIXを聴くのに使っているモノラルのBluetoothスピーカーである。指向性が低いことと、低音が響きすぎない点を気に入っている。あまり大きな音量では聴かず、作業の背景に音楽を淡々と流すための道具として紹介している。","よく聴くDJ MIXリスト","https://note.com/beefbowl60/n/ne106fa8a6698","2025-05-17","文脈"],["伊集院光深夜の馬鹿力","固有名詞","TBSラジオの深夜番組で、筆者が漫画「オーイ！とんぼ」を知るきっかけになった。番組で勧められているのを聞いて読み始めたものの、当初はのめり込めず1年ほど放置していたと振り返っている。ラジオ経由の偶然の出会いが、後の熱中につながった例である。","漫画「オーイ！とんぼ」が面白い","https://note.com/beefbowl60/n/nda5ce9804f8b","2025-05-22","文脈"],["オーイ！とんぼ","固有名詞","「週刊ゴルフダイジェスト」で連載中のゴルフ漫画である。筆者はKindleで10巻まで読んだところで物語が急に加速したと感じた。主人公がトカラの島を出て熊本のジュニア大会に挑むあたりから一気に引き込まれ、50巻以上ある続きを楽しみにしている。","漫画「オーイ！とんぼ」が面白い","https://note.com/beefbowl60/n/nda5ce9804f8b","2025-05-22","文脈"],["積んでいた本は、読むタイミング次第で急に面白くなる。","文","以前はのめり込めず放置していた「オーイ！とんぼ」を再び読み始めたところ、急に面白くなった体験から筆者が得た気づきである。作品の側ではなく、自分が読むタイミングや心の状態も面白さに関係していそうだと考えている。","漫画「オーイ！とんぼ」が面白い","https://note.com/beefbowl60/n/nda5ce9804f8b","2025-05-22","文脈"],["かわさき健","固有名詞","「オーイ！とんぼ」の原作者で、プロゴルファー志望から漫画原作者に転向した人物である。父は「巨人の星」で知られる漫画家の川崎のぼる。筆者はゴルフ経験に裏打ちされた作中の技術論の説得力に感心している。","漫画「オーイ！とんぼ」が面白い","https://note.com/beefbowl60/n/nda5ce9804f8b","2025-05-22","文脈"],["競技経験に裏打ちされた技術論は、漫画に説得力を与える。","文","筆者は「オーイ！とんぼ」の技術論の説得力を高く評価し、その背景として原作者かわさき健がプロゴルファーを目指していた経歴に触れている。曲芸のようなゴルフをリアルに描けるのは、作り手自身の競技経験があるからだと読める。","漫画「オーイ！とんぼ」が面白い","https://note.com/beefbowl60/n/nda5ce9804f8b","2025-05-22","文脈"],["RICOH GR IV","固有名詞","リコーが2025年秋発売を目指して開発を発表したGRシリーズ最新機種である。28mm/F2.8のスペックはそのままにレンズを新規設計した。筆者は解像度の改善や起動・AF速度に関心を寄せつつ、撮影体験の劇的な変化はなさそうだとしてGRIIIを使い続けるとした。","GRⅣとX halfの発表","https://note.com/beefbowl60/n/n9fc466ec88ca","2025-05-23","文脈"],["新モデルが存在する安心感","概念","GR IVの開発発表を受けて筆者が抱いた感覚である。すぐに買い替えるつもりはなくても、愛用するシリーズの新機種が世に出ること自体が安心につながると述べる。あわせて生産体制や流通量の改善にも期待を寄せている。","GRⅣとX halfの発表","https://note.com/beefbowl60/n/n9fc466ec88ca","2025-05-23","文脈"],["FUJIFILM X half","固有名詞","富士フイルムが発表したコンパクトデジタルカメラで、1インチセンサーを縦撮り配置し、フィルムライクな操作体験を特徴とする。予想外の三色展開もあり、筆者は手に取って試したいと強く惹かれ、買ってしまいそうだと書いている。","GRⅣとX halfの発表","https://note.com/beefbowl60/n/n9fc466ec88ca","2025-05-23","文脈"],["スペック表に表れない新しさが、使ってみたい気持ちをくすぐる。","文","X halfの発表を見た筆者は、数字だけでは測れない新しい概念や要素が多い点に惹かれた。縦撮り配置やフィルムライクな体験といった仕掛けが、スペック比較とは別の次元で、実際に触ってみたいという欲求を生んでいると感じている。","GRⅣとX halfの発表","https://note.com/beefbowl60/n/n9fc466ec88ca","2025-05-23","文脈"],["スマホに画質で及ばなくても、欲しいと思わせるカメラはある。","文","筆者はX halfについて、夜景や手ぶれ補正、画像処理では最新スマホに劣るのではと考えた。それでも、そういう役割のカメラではないと理解したうえで欲しいと思わせる点に、メーカーの巧さを見ている。","GRⅣとX halfの発表","https://note.com/beefbowl60/n/n9fc466ec88ca","2025-05-23","文脈"],["DPReview","固有名詞","筆者がX halfのサンプル画像を確認したカメラ情報サイトである。発表直後は購入に傾いていたが、後日の追記で、掲載された試作機の作例を見て画像処理の雰囲気が好みと合わず、購買意欲がだいぶ下がったと記している。","GRⅣとX halfの発表","https://note.com/beefbowl60/n/n9fc466ec88ca","2025-05-23","文脈"],["淡々と続ける","概念","習い事やスポーツを長く続けるコツとして筆者が第一に挙げた姿勢である。意気込みすぎると倦怠期が早く訪れるという経験から、始めた時点から、それをやっているのが日常であるかのような気持ちで取り組むのがよいと考えている。まとめでも無理に力まないことを強調している。","長く続けるコツ","https://note.com/beefbowl60/n/n99c18703d9c5","2025-05-24","文脈"],["成長の言語化","概念","筆者が続けるために実践している習慣で、セッションごとに感じた変化や成長をスマホのメモ帳に写真を添えて記録する。自分の感覚はすぐ忘れ、続けるほど成長は微妙になるため、書き留めて時々振り返ることに効果があると感じている。","長く続けるコツ","https://note.com/beefbowl60/n/n99c18703d9c5","2025-05-24","文脈"],["飽きの正体は、変化を感じられなくなることにある。","文","筆者は、続けているうちに訪れる倦怠感の原因を考え、変化を感じなくなるからではないかと推測した。そこから、自分の成長を意識的に拾い上げて記録し、振り返るという対策を導き出している。","長く続けるコツ","https://note.com/beefbowl60/n/n99c18703d9c5","2025-05-24","文脈"],["開き直り","概念","人と較べないための心構えとして筆者が挙げた態度である。他人への敗北感は挫折につながりやすいため、見栄を張らず、できないことも含めて自分に嘘をつかずに受け入れることが大切だとする。落ち込まずに開き直る気持ちを持つよう勧めている。","長く続けるコツ","https://note.com/beefbowl60/n/n99c18703d9c5","2025-05-24","文脈"],["続ける意味を問い始めたら、目の前の小さな課題に集中する。","文","少し飽きてくると「何の為にやっているのか」という疑問が芽生えがちで、筆者はこれを大敵とみなした。疑問を抱いても緩く続け、楽器ならあるコードを弾くといった中身の課題に集中するのが続けるコツだと述べている。","長く続けるコツ","https://note.com/beefbowl60/n/n99c18703d9c5","2025-05-24","文脈"],["中断しても再開すれば、ただ少し休んでいただけになる。","文","人は「やめる＝失敗」と受け取り、続けられなかったことでかえって遠ざけてしまいがちだと筆者は指摘する。また始めればよく、再開さえすれば自分に言い訳ができるとして、中断を極端に否定的に捉えない姿勢を持ちたいとまとめている。","長く続けるコツ","https://note.com/beefbowl60/n/n99c18703d9c5","2025-05-24","文脈"],["無印良品 木製ベッドフレーム（オーク材突板）","固有名詞","床にマットレスを敷く生活から起き上がりの面倒さを解消するため、筆者が購入したベッドフレームである。自分で1時間ほどかけて組み立てた。梁構造でバネのような弾力があり、強度に不安は残るものの、普通に寝る分には問題ないと評価している。","無印良品のベッドを購入した話","https://note.com/beefbowl60/n/na888c76313ca","2025-05-26","文脈"],["寝返りしやすく通気性のよいマットレス","固有名詞","無印良品の超高密度ポケットコイルのマットレスで、筆者が硬さの違いで大いに迷った末に選んだ。空気の抜けがよく夏は蒸れないが、冬は寒いかもしれないと感じている。今は満足しつつも、安い普通の硬さでもよかったかもと振り返る。","無印良品のベッドを購入した話","https://note.com/beefbowl60/n/na888c76313ca","2025-05-26","文脈"],["迷ったら硬め","概念","マットレス選びで筆者が頼りにした言説である。店頭に何度も通っても硬さの違いを決めきれず、最終的にこの言葉を信じて、少し高価な硬めのモデルを選んだ。結果には満足しているが、普通の硬さでもよかったかもしれないと迷いを残している。","無印良品のベッドを購入した話","https://note.com/beefbowl60/n/na888c76313ca","2025-05-26","文脈"],["エアウィーブ","固有名詞","筆者が購入したマットレスのクッション素材の感触をたとえた名前である。実際に使ってみると、エアウィーブのような素材で少しゴワゴワする点が気になったという。一方で空気の抜けがよく、夏場は蒸れずに快適だと評価している。","無印良品のベッドを購入した話","https://note.com/beefbowl60/n/na888c76313ca","2025-05-26","文脈"],["寝心地の本当の良し悪しは、使ってみるまで分からない。","文","マットレスの硬さで迷った筆者は、店頭に通って何度も確かめたが決めきれなかった。購入後も別の選択肢でもよかったかもと感じており、記事の結論として、ベッド選びは賭けであり難しいと締めくくっている。","無印良品のベッドを購入した話","https://note.com/beefbowl60/n/na888c76313ca","2025-05-26","文脈"],["毎日何年も使うものなら、高い買い物でもモトは取れる。","文","ベッドフレームとマットレスは送料を含めて12万円を超えた。筆者は安くはないと認めつつも、何年も毎日使う寝具であることを理由に、きっと元は取れるはずだと自分を納得させている。","無印良品のベッドを購入した話","https://note.com/beefbowl60/n/na888c76313ca","2025-05-26","文脈"],["自分用のメモとしてのnote","概念","筆者が自己紹介の固定記事で示した、noteの基本的な位置づけである。撮った写真、読書ノート、ライブの感想、音楽、雑貨やデジタル家電、旅行の記録、どうでもいい日記まで、読者向けというより自分のための記録として幅広く書いていくと宣言している。","自己紹介的な固定記事","https://note.com/beefbowl60/n/n1bfc8f710819","2025-05-28","文脈"],["ブックオフ","固有名詞","日本各地に店舗を展開する古本・中古品のリサイクルチェーンである。筆者は自己紹介記事で、ブックオフを含む古本屋で見つけた本などの成果を報告することを、noteで書くテーマの一つとして挙げている。","自己紹介的な固定記事","https://note.com/beefbowl60/n/n1bfc8f710819","2025-05-28","辞書"],["仕事をやめたら◯◯したい","概念","筆者がnoteで扱うテーマについて示した線引きである。仕事そのものについては書かないが、仕事をやめたらしたいことについては書くとしている。現在の仕事とは切り離しつつ、その先の暮らしや願望は記録の対象にするという姿勢が読み取れる。","自己紹介的な固定記事","https://note.com/beefbowl60/n/n1bfc8f710819","2025-05-28","文脈"],["儲け話や成功法ではなく、自分の関心の記録を書く。","文","筆者は固定記事で、お金儲けの話や成功のための役立つ話はきっとないと明言し、アフィリエイトもしていないと書いた。そのうえで写真、読書、音楽、武術、クイズなど自分の興味の対象を並べ、関心の記録に徹する姿勢を示している。","自己紹介的な固定記事","https://note.com/beefbowl60/n/n1bfc8f710819","2025-05-28","文脈"],["本の読み方・手帳術・ノート術","概念","筆者が自己紹介記事で、写真やカメラと並ぶ関心分野として挙げたテーマである。勉強法も含め、読む・書く・記録する技法への関心がこれまでの記事に通じていることを示しており、noteそのものを自分用のメモと位置づける姿勢ともつながっている。","自己紹介的な固定記事","https://note.com/beefbowl60/n/n1bfc8f710819","2025-05-28","文脈"],["Dyson V8 Slim Fluffy","固有名詞","筆者が5年ぶりに買い替えたコードレス掃除機である。以前使っていた同じ機種のヘッドが壊れたため同じものを選んだ。Amazonで29,800円と5年前より2万円以上安く、使用感も変わらず不自由はないが、ちょっと失敗したかもと感じている。","新しいダイソン掃除機を買った","https://note.com/beefbowl60/n/na014e5e1781d","2025-05-28","文脈"],["新しい家電のワクワク感","概念","同じ機種に買い替えた筆者が、まったく得られなかったと気づいた感覚である。機能面では何の不満もないのに、新しいものを手にした高揚がないことでモヤモヤが残った。買い物の満足は使い勝手だけでは決まらないことがうかがえる。","新しいダイソン掃除機を買った","https://note.com/beefbowl60/n/na014e5e1781d","2025-05-28","文脈"],["買い替えるなら、少し高くても新しい機種を選ぶ。","文","壊れた掃除機を安さと慣れから同じ機種で買い替えた筆者は、使い勝手に不満はないものの気持ちが晴れなかった。少しくらい高くても新しめの機種を買えばよかったと振り返り、「買い替えるなら新機種」を今日の教訓としてまとめている。","新しいダイソン掃除機を買った","https://note.com/beefbowl60/n/na014e5e1781d","2025-05-28","文脈"],["家電の買い替えは、次の買い替えの頃の未来を思わせる。","文","掃除機を買い替えた筆者は、これを5年使うと2030年になるのかと、遠い未来に思いを巡らせた。新鮮味のない買い物のモヤモヤと重なり、全体的に気持ちにモヤがかかっていると記している。","新しいダイソン掃除機を買った","https://note.com/beefbowl60/n/na014e5e1781d","2025-05-28","文脈"],["筒井康隆「ロートレック荘事件」","固有名詞","1990年初出の長編ミステリーで、筆者は新潮文庫で読んだ。複数の殺人という王道の展開の中に違和感として散りばめられたヒントが終盤で一気に回収される快感を評価し、一人称視点を使った仕掛けが巧妙だったと感想を記している。","【読書ノート】筒井康隆「ロートレック荘事件」","https://note.com/beefbowl60/n/n4df6a183b511","2025-05-30","文脈"],["パネルクイズ アタック25","固有名詞","BS10で放送されているクイズ番組で、その「ミステリー好き大会」で出場者が紹介していたのが本書を知るきっかけだった。ただ番組で叙述ものだと紹介されていたため、筆者は読みながら意識してしまい、途中でタネに気づいてしまったという。","【読書ノート】筒井康隆「ロートレック荘事件」","https://note.com/beefbowl60/n/n4df6a183b511","2025-05-30","文脈"],["ミステリーは紙の本で読むのが健全な気がする。","文","筆者は、ミステリーをKindleで読むのは倫理にもとる、不健康で不徳な気がするとして、久しぶりにAmazonで紙の新品本を買った。理由は明言されていないが、ジャンルによって読む媒体を選ぶ感覚がうかがえる。","【読書ノート】筒井康隆「ロートレック荘事件」","https://note.com/beefbowl60/n/n4df6a183b511","2025-05-30","文脈"],["叙述トリック","概念","読み手の思い込みを逆手に取る仕掛けとして、筆者が「ロートレック荘事件」で巧妙だと感じた技法である。一人称の視点に秘密があり、読了後に思わず最初から読み返したくなる。挿絵のロートレックの絵もミスリードとして機能していたのかもしれないと考えている。","【読書ノート】筒井康隆「ロートレック荘事件」","https://note.com/beefbowl60/n/n4df6a183b511","2025-05-30","文脈"],["仕掛けがあると知って読むと、驚きは薄れてしまう。","文","クイズ番組で「叙述もの」「読み終わった後に最初から読むと」と紹介されていたため、筆者はそれを意識しながら読み進め、途中でなんとなくタネが分かってしまった。事前の情報が読書体験を左右することを実感している。","【読書ノート】筒井康隆「ロートレック荘事件」","https://note.com/beefbowl60/n/n4df6a183b511","2025-05-30","文脈"],["常識と偏見","概念","「ロートレック荘事件」の犯人像と犯行動機から筆者が受け取ったメッセージである。単なる謎解きを超えて、何が常識なのか、そこに偏見があるのではないかと読者自身が問われているように感じた。もう一度読んで作者の工夫と苦労を感じ取りたいとしている。","【読書ノート】筒井康隆「ロートレック荘事件」","https://note.com/beefbowl60/n/n4df6a183b511","2025-05-30","文脈"],["ロジャー・ニコルス","固有名詞","ソフトロックや渋谷系音楽の象徴的存在だった「ロジャー・ニコルス & ザ・スモール・サークル・オブ・フレンズ」で知られる音楽家である。筆者は週のまとめで訃報を取り上げ、TBSラジオ「ジェーン・スー生活は踊る」の追悼特集を聴いたと記している。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["MUSIC AWARDS JAPAN 2025","固有名詞","国内最大規模の国際音楽賞として開催された授賞式である。筆者は冒頭の細野晴臣のスピーチと、YMOオマージュのオープニングショー「RYDEEN REBOOT」が話題になったことに触れ、その準備を綴った高野寛のnote記事が印象に残ったと書いている。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["ステレオラブ『Instant Holograms On Metal Film』","固有名詞","ロンドンのオルタナティヴバンド、ステレオラブが15年ぶりに発表したアルバムである。筆者は週のまとめで新作のリリースを取り上げ、往年の味が感じられる仕上がりで、なかなか好みだと短く感想を記している。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["長年頼ったウェブサービスも、環境の変化で消えていく。","文","「あとで読む」サービスのPocketが2025年7月で終了するというニュースに、筆者は長年便利に使っていたので困ると反応した。終了の背景をウェブ環境の変化ではないかと推し量り、使い慣れた道具が失われることへの戸惑いを記している。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["フィルム写真は、1枚あたり200円以上かかるものになった。","文","富士フイルムが「写ルンです」の現像からデータ受け取りまでをスマホで完結できる新サービスを始めたニュースを受けて、筆者は1本あたりの現像料2,420円とフィルム代を合わせた費用を計算し、写真1枚のコストに注目している。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["通信と金融の融合","概念","NTTとSBIホールディングスの資本業務提携や、NTTドコモによる住信SBIネット銀行の買収のニュースから筆者が読み取った流れである。通信会社が経済圏を広げる動きを確認しつつ、自分はd経済圏のサービスを使っていないので不安があると述べている。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["超知能の定点観測","概念","AIが数年内に人類を超えるという日経の連載企画の予告を受けて、筆者が示した姿勢である。AI新法の成立やエヌビディアの決算などAI関連の話題を並べ、AGIに関わる動きを継続的に見守っていると記している。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["スモモモモモモモモ","固有名詞","浦和競馬のルーキー騎手が初勝利を挙げた際に騎乗していた競走馬の名前である。筆者は「モ」が8個であることを確かめ、クイズに出そうだと書き留めている。ニュースの中からクイズの題材になりそうな話題を拾う視点がうかがえる。","【記録】今週のまとめ#2025/06/01","https://note.com/beefbowl60/n/n1235cd5a4879","2025-06-01","文脈"],["細野晴臣「アンビエント・ドライヴァー」","固有名詞","2006年初出、ちくま文庫版で筆者が再読したエッセイ集である。90年代の精神世界への傾倒や神秘体験から、後半は日常へと語りが移っていく。筆者は年齢を重ねた今の細野の方が活動量が多く見える点に注目し、再評価とともに訪れた創造への衝動を推し量っている。","【読書ノート】細野晴臣「アンビエント・ドライヴァー」","https://note.com/beefbowl60/n/nceba258cccec","2025-06-02","文脈"],["再読は、本よりも自分自身の変化を映し出す。","文","細野晴臣のエッセイを読み返した筆者は、再読には単なる確認や懐古を超えて自分自身の変化を照射する側面があると述べた。今回の読書体験を「自己との対話」と位置づけ、かつての自分の受け止め方をあらためて見つめ直している。","【読書ノート】細野晴臣「アンビエント・ドライヴァー」","https://note.com/beefbowl60/n/nceba258cccec","2025-06-02","文脈"],["言葉が響くのは、受け取る側に準備ができているからだ。","文","再読を通じて筆者は、かつて細野晴臣の言葉が貴重に思えたのは、言葉そのものより、自分がそれを貴重として受け取る準備ができていたからかもしれないと考えた。読み手の側にも神秘性を読み込む素地があったと振り返っている。","【読書ノート】細野晴臣「アンビエント・ドライヴァー」","https://note.com/beefbowl60/n/nceba258cccec","2025-06-02","文脈"],["ドン・ファン","固有名詞","ネイティブ・アメリカンと並んで、細野晴臣が関心を寄せた対象として筆者が挙げた存在である。筆者はそれらを単なる異文化趣味ではなく細野の内面を映す鏡と捉え、90年代のニューエイジ的な傾倒を、時代の空気と個人史の交差点に生まれた感受性の結晶だと評している。","【読書ノート】細野晴臣「アンビエント・ドライヴァー」","https://note.com/beefbowl60/n/nceba258cccec","2025-06-02","文脈"],["言語化された神秘","概念","細野晴臣の神秘体験の描写について筆者が指摘した矛盾である。神秘を言葉にすること自体が本質的な矛盾を孕むが、細野はそれを誠実に抱えたまま言葉を尽くそうとしている。筆者はそこに、音楽家の枠を越えた表現者としての真価を見ている。","【読書ノート】細野晴臣「アンビエント・ドライヴァー」","https://note.com/beefbowl60/n/nceba258cccec","2025-06-02","文脈"],["精神の漂流からの回帰","概念","「アンビエント・ドライヴァー」後半の語りについて筆者が見いだした動きである。日常のエピソードやスケッチ・ショー時代の創作秘話、ときおり挟まれる孫の話が、精神世界から身体性と時間の現実へと戻る運動のように、静かにあるがままを伝えていると述べている。","【読書ノート】細野晴臣「アンビエント・ドライヴァー」","https://note.com/beefbowl60/n/nceba258cccec","2025-06-02","文脈"],["晴れたら空に豆まいて","固有名詞","筆者がシャッポのリリースツアー東京公演を観た代官山のライブハウスである。店は地下にあり、整理番号順に入場してドリンク代を払う仕組みだった。スタンディング仕様のフロアは演奏中満員で、筆者はオリオンビールを飲みながら楽しんだと写真付きで記録している。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["シャッポ（Chappo）","固有名詞","2000年生まれの福原音と細野悠太による2人組のインストゥルメンタル・バンドで、2019年に結成された。バンド名は細野晴臣の命名である。筆者はツアー東京公演に足を運び、セットリストや会場の様子に加え、インタビュー記事をもとに結成の経緯をまとめている。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["a one & a two","固有名詞","シャッポの1stアルバムで、筆者が観たリリースツアーではこのアルバムの曲を中心に、細野晴臣のカバー「AIWOIWAIAOU」なども演奏された。筆者はセットリストを書き留め、アルバム発売を機に出た複数のインタビュー記事を参考文献として並べている。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["1940年代の大衆音楽","概念","シャッポの福原音が強く惹かれている音楽である。筆者のまとめによれば、福原はこの話をするために細野晴臣の事務所を突然訪ねて意気投合し、それが細野の孫である細野悠太と出会う間接的なきっかけになった。バンドの音楽性の根にある関心でもある。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["尊敬する先達の何気ない一言が、バンド結成の引き金になる。","文","2019年の細野晴臣の音楽活動50周年イベントで、細野は孫の悠太と福原音と初めて人前で演奏した。その後「2人で続けたら？」と声をかけたことがシャッポ結成の大きな契機となり、福原は「やらねば！」とスイッチが入ったという。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["祖父の音楽を学ぶ勉強会","概念","福原音が細野悠太に細野晴臣の音楽を教えた場である。それまで祖父の曲をあまり聴いていなかった悠太は、歴史の授業のように祖父の仕事と影響を学び、過去作をきちんと聴くようになった。筆者はこれを細野晴臣の影響の一つとしてまとめている。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["先達の姿勢から、音楽は自由にやっていいものだと学べる。","文","筆者が整理した細野晴臣からシャッポへの影響の一つである。曲ができるたびに細野に聴かせて意見をもらい、ときに厳しく指摘されながらも、福原音は細野の姿勢を通じて、音楽は自由にやっていいものだと感じるようになったと語っている。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["カクバリズム","固有名詞","シャッポがデビューしたインディー・レーベルである。筆者のまとめでは、細野晴臣が自身のラジオ番組「Daisy Holiday!」の現場で代表の角張渉にシャッポの話をしたことが、角張が音源を聴くきっかけになった。デビューへの間接的な橋渡しとして紹介されている。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["敬愛する人の「面白かった」の一言が、作り手の自信を育てる。","文","シャッポが1stシングル「ふきだし」をリリースした際、細野晴臣が曲を聴いて「面白かった」と褒めたという。細野悠太はそれで少し自信がついたかもしれないと述べており、筆者は細野の存在が二人の活動に深く関わる一例として挙げている。","シャッポのライブへ行きました","https://note.com/beefbowl60/n/n85bbc93220b7","2025-06-03","文脈"],["WORLD HAPPINESS","固有名詞","高橋幸宏がキュレーターを務めた音楽フェスで、2008〜2017年と2019年に計11回開催された。筆者はそのライブボックス（Blu-ray1枚とCD4枚）を高橋幸宏の誕生日に受け取り、テーブルを片付けてから開封した。自分も足を運んだ年があり、思い出深いフェスとして振り返っている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["高橋幸宏","固有名詞","WORLD HAPPINESSの主催者でありキュレーターである。筆者の手元にライブボックスが届いた6月6日は奇しくも彼の誕生日だった。pupa、HASYMO、YMO、THE BEATNIKS、METAFIVEなど、彼が参加した多くのバンドの演奏が収録されていることに筆者は注目している。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["pupa","固有名詞","高橋幸宏が参加したバンドの一つで、ボックスのDISC1の大半を占める。筆者は収録内容のなかでも、2008年のWORLD HAPPINESSでのpupaの映像がBlu-rayに入っている点を特に楽しみにしており、観るのがとても楽しみだと期待を綴っている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["HASYMO","固有名詞","WORLD HAPPINESS 2008に出演したユニットで、ボックスのDISC3冒頭とBlu-rayに演奏が収められている。筆者は高橋幸宏が参加したバンドの一つとして名前を挙げ、同じ年の初回開催をフィーチャーしたビジュアルとともに、フェスの始まりを振り返る材料にしている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["Yellow Magic Orchestra","固有名詞","ボックスのCD4枚のうち2枚がYMOのパートにあてられており、2009〜2012年の演奏が収録されている。筆者は高橋幸宏が参加したバンドの中心的存在として挙げ、フェスにおけるYMOの存在の大きさを収録構成からも感じ取っている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["THE BEATNIKS","固有名詞","高橋幸宏が参加したバンドの一つとして筆者が挙げたもので、WORLD HAPPINESS 2011年・2012年の演奏がボックスのDISC2やBlu-rayに収められている。筆者は収録曲を一覧で示しながら、フェスを彩った顔ぶれの一つとして紹介している。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["METAFIVE","固有名詞","高橋幸宏が参加したバンドの一つで、WORLD HAPPINESSの2015年と2016年の演奏がボックスに収められている。筆者は参加バンドの一覧の最後に名前を挙げ、フェスの後期を担った存在として収録内容とともに紹介している。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["行ったライブの写真を見返すと、しんみりした気分になる。","文","ボックスには懐かしいビジュアルやポスター、充実したフォトブックが同梱されていた。筆者は自分も実際に行った思い出深い年の写真を眺めるうちにしんみりした気分になったと述べ、音源より先に写真から当時の記憶がよみがえる体験を綴っている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["初回のシロクマ","概念","ボックスのビジュアルでフィーチャーされていた、2008年の初回WORLD HAPPINESSを象徴するモチーフである。筆者は画像で紹介し、懐かしいビジュアルの数々とともにフェスの始まりを思い起こさせるものとして、写真を見ながら当時を振り返っている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["信藤三雄","固有名詞","筆者が画像キャプションで「初回のキュレーター」として高橋幸宏と並べて名前を挙げた人物である。ボックスのフォトブックやポスターを眺めながら、2008年の初回開催を形づくった顔ぶれとして記録にとどめ、フェスの原点を振り返っている。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["日本の音楽の縮図","概念","筆者が記事の最後に紹介したMikikiの記事の見出しにある言葉で、WORLD HAPPINESSを評した表現である。鈴木慶一とゴンドウトモヒコがフェスやYMOの思い出を語る記事で、多くの歴史が交差した場としてのフェスの意味を、筆者は参照先として示している。","WORLD HAPPINESS ボックスセットが届きました","https://note.com/beefbowl60/n/n440a077c4412","2025-06-06","文脈"],["企画展『細野さんと晴臣くん』","固有名詞","細野晴臣のデビュー55周年を記念し、母校の立教大学で開かれた企画展である。入場無料でPeatixによる時間指定制だった。筆者は展示品こそ既視のものが多かったが、洋館の空間と展示方式の趣向によって時空を忘れるような体験になり、とても良かったと評している。","企画展『細野さんと晴臣くん』へ行きました","https://note.com/beefbowl60/n/n136baed62c1a","2025-06-07","文脈"],["ライフスナイダー館","固有名詞","企画展の会場となった立教大学池袋キャンパスの洋館で、1926〜27年に当時の立教学院総理の邸宅として建てられたという。筆者は大学の片隅にある趣ある建物と異国情緒ある雰囲気に惹かれ、洋室三間を使った展示空間そのものを体験の核として写真で紹介している。","企画展『細野さんと晴臣くん』へ行きました","https://note.com/beefbowl60/n/n136baed62c1a","2025-06-07","文脈"],["細野観光","固有名詞","数年前に開かれた細野晴臣の展覧会で、筆者も訪れていた。今回の企画展の展示品はそこで見たものも多かったと筆者は述べる。それでも見せる空間や方式が違うことで新鮮な体験になったと評価し、前回の展示との比較の基準として持ち出している。","企画展『細野さんと晴臣くん』へ行きました","https://note.com/beefbowl60/n/n136baed62c1a","2025-06-07","文脈"],["耳を付けると音が聞こえる机","概念","企画展で筆者が写真に収めた展示什器である。机に耳を当てると音が聞こえる仕掛けや、展示資料に合わせてくり抜かれた机、音の鳴る箱などが並んでいた。筆者は資料を見るだけでなく身体で聴かせる展示方式の工夫を、この企画展の魅力として挙げている。","企画展『細野さんと晴臣くん』へ行きました","https://note.com/beefbowl60/n/n136baed62c1a","2025-06-07","文脈"],["Smile（カバー）","固有名詞","企画展の会場で色々な曲を聴ける展示があり、そのなかで筆者が特に感動したと記した曲である。細野晴臣によるカバーとして紹介されている。筆者は画像キャプションで短く触れるのみだが、展示を巡るなかで音楽そのものに心を動かされた瞬間として残している。","企画展『細野さんと晴臣くん』へ行きました","https://note.com/beefbowl60/n/n136baed62c1a","2025-06-07","文脈"],["見たことのある展示品も、見せ方次第で新しい体験になる。","文","筆者は今回の展示品の多くを数年前の「細野観光」で既に見ていた。それでも1920年代の洋館という空間や、資料に合わせてくり抜かれた机などの趣向が凝らされていたことで、時空を忘れるような体験になったと述べ、展示空間の力を実感している。","企画展『細野さんと晴臣くん』へ行きました","https://note.com/beefbowl60/n/n136baed62c1a","2025-06-07","文脈"],["アンビエント・ドライヴァー","固有名詞","筆者が秋葉原のブックオフでちくま文庫版を見つけて購入し、再読した本である。その影響でこの週は色々なアンビエント音楽をよく聴いていたと振り返っている。YMO関連の投稿が多かった一週間の、音楽的な気分を方向づけた一冊として記録されている。","【記録】今週のまとめ #2025/06/08","https://note.com/beefbowl60/n/nd2dd21cbe19a","2025-06-08","文脈"],["シャッポ","固有名詞","筆者が月曜日に初めてライブを観に行ったバンドで、細野晴臣の孫と小山田圭吾の子がメンバーとして参加している。YMO周辺の音楽を長く聴いてきた筆者が、次の世代の演奏に触れた体験として週のまとめに記し、若い人の音楽から受ける刺激に言及している。","【記録】今週のまとめ #2025/06/08","https://note.com/beefbowl60/n/nd2dd21cbe19a","2025-06-08","文脈"],["若い世代の音楽は、ときに聴き手へ大きな刺激を与える。","文","筆者は細野晴臣の孫らによるバンド、シャッポのライブに初めて足を運んだ。YMOやアンビエントなど長年親しんだ音楽を振り返ることの多い一週間のなかで、若い演奏者の音楽に触れたことが大きな刺激になったと短く書き留めている。","【記録】今週のまとめ #2025/06/08","https://note.com/beefbowl60/n/nd2dd21cbe19a","2025-06-08","文脈"],["幸せな時間だったと分かるのは、後から振り返ったときだ。","文","4月に注文していたWORLD HAPPINESSのボックスセットが6月6日に届き、筆者は収録映像や写真を通じてフェスに通った日々を思い返した。あの日々が幸せな時間だったと今になって分かると述べ、このボックスをそういう記録として受け止めている。","【記録】今週のまとめ #2025/06/08","https://note.com/beefbowl60/n/nd2dd21cbe19a","2025-06-08","文脈"],["ユキヒロトロニカ","概念","ワーハピのボックスセットで筆者が特に好きな曲として「At dawn」と「Wonderful to me」を挙げたときに使った言葉で、高橋幸宏のエレクトロニカ寄りの音楽を指す呼び方である。改めて聴いて、やはりこの路線が大好きなのだと自覚したと述べている。","【記録】今週のまとめ #2025/06/08","https://note.com/beefbowl60/n/nd2dd21cbe19a","2025-06-08","文脈"],["アンビエント期の細野晴臣","概念","立教大学の細野晴臣企画展を訪れた感想として、筆者があえて付け加えた視点である。『アンビエント・ドライヴァー』の再読でアンビエントをよく聴いていた週でもあり、細野のキャリアのうちアンビエントに傾いた時期がもっと評価されてほしいと願っている。","【記録】今週のまとめ #2025/06/08","https://note.com/beefbowl60/n/nd2dd21cbe19a","2025-06-08","文脈"],["『人生は１冊のノートにまとめなさい』","固有名詞","一元化ノートにライフログをつけて「体験のダダ漏れ」を防ぐことを説いた本である。筆者は「1冊のノートにまとめなさい」シリーズが少し古いがわりと好きで、たまに読み返すという。この本の考え方を手がかりに、自分のnoteをライフログとして使う意義を整理している。","ライフログとしてのnote","https://note.com/beefbowl60/n/needca5c4a72c","2025-06-11","文脈"],["体験のダダ漏れ","概念","『人生は１冊のノートにまとめなさい』で語られている言葉で、体験を記録せずに流してしまうことを指す。筆者はこれを防ぐためにライフログをつけるという考え方を紹介し、自分のnoteの使い方の8割ほどをライフログにあてたいという方針の根拠にしている。","ライフログとしてのnote","https://note.com/beefbowl60/n/needca5c4a72c","2025-06-11","文脈"],["確固とした体験","概念","ライフログとして残す対象を指す言葉である。筆者によれば、こうした体験を記録していくと資産になり、その後の人生で楽しい時間を思い出したり、貴重な経験から学びを得たりできるという。本の考え方を受けて、記録することの長期的な価値を捉えている。","ライフログとしてのnote","https://note.com/beefbowl60/n/needca5c4a72c","2025-06-11","文脈"],["人に読まれる前提があると、記録は客観的に整う。","文","筆者は私的な記録を手元のノートや日記にもつけている。そのうえでnoteのように誰かに読まれる前提があると、ある程度客観的にきちんと書こう、写真も整理して添えようという動機が生まれると述べ、公開する場ならではの記録の質の違いに気づいている。","ライフログとしてのnote","https://note.com/beefbowl60/n/needca5c4a72c","2025-06-11","文脈"],["体験のパッケージ化","概念","noteに記事を書くことで得られる効果として筆者が挙げた表現である。読まれる前提で文章を整え写真を添えるうちに、結果として体験がひとまとまりの形になると感じている。記事を積み上げることで、自分の考えがまとまり整理されていくことにも期待している。","ライフログとしてのnote","https://note.com/beefbowl60/n/needca5c4a72c","2025-06-11","文脈"],["1か月前の自分の記事は、他人の投稿のように読める。","文","筆者は1か月前に書いた記事でもあまり記憶に残っておらず、読み返すと他人の投稿を読んでいる感覚になるときがあるという。そのうえで、自分自身の変化による違いを知るためにも、noteをライフログとして使うことは役に立つと結論づけている。","ライフログとしてのnote","https://note.com/beefbowl60/n/needca5c4a72c","2025-06-11","文脈"],["ブライアン・ウィルソン","固有名詞","ビーチ・ボーイズの共同創設者で、82歳での訃報が筆者の週のまとめに記された。筆者は最近『Pet Sounds』を聴き直し彼のことを漠然と考えていた矢先だったため、この訃報は堪えたと述べ、新作に狂喜しライブに何度も通った思い出を振り返っている。","【記録】今週のまとめ #2025/06/15","https://note.com/beefbowl60/n/n78ed9c09ce6e","2025-06-14","文脈"],["作品から受け取った慰めの分だけ、訃報の喪失感は深くなる。","文","ブライアン・ウィルソンの訃報に触れた筆者は「何という喪失感」と記した。過去にアルバムの新作に狂喜し、ライブにも何度も足を運び、その作品から多くの慰めや励ましを受け取ってきた思い出が尽きないことが、喪失感の大きさの裏づけとして語られている。","【記録】今週のまとめ #2025/06/15","https://note.com/beefbowl60/n/n78ed9c09ce6e","2025-06-14","文脈"],["神に捧げるティーンエイジシンフォニー","概念","ブライアン・ウィルソンのサウンドを讃えた言葉として筆者が引用した表現である。訃報に深い喪失感を覚えながらも、筆者はこの言葉で讃えられたサウンドは永遠に不滅だと述べ、作り手がいなくなっても音楽そのものは残り続けるという思いで締めくくっている。","【記録】今週のまとめ #2025/06/15","https://note.com/beefbowl60/n/n78ed9c09ce6e","2025-06-14","文脈"],["相次ぐ訃報に触れると、自分のポップスの原点を聴き返したくなる。","文","ブライアン・ウィルソンに続き、数日前にはスライ・ストーンも亡くなった。連続して訃報に触れた筆者は、フリッパーズ・ギターの『ヘッド博士の世界塔』が無性に聴きたくなったと述べ、喪失の感情が特定のアルバムへの渇望として表れたことを記している。","【記録】今週のまとめ #2025/06/15","https://note.com/beefbowl60/n/n78ed9c09ce6e","2025-06-14","文脈"],["ヘッド博士の世界塔","固有名詞","フリッパーズ・ギターのアルバムである。ブライアン・ウィルソンやスライ・ストーンの訃報が続いた週に、筆者が無性に聴きたくなった作品として挙げた。あらためて本当にすごいアルバムで、ポップスファンの夢を具現化したような音楽だと評価している。","【記録】今週のまとめ #2025/06/15","https://note.com/beefbowl60/n/n78ed9c09ce6e","2025-06-14","文脈"],["経県値","固有名詞","筆者が訪れた都道府県を点数化して記録しているとみられる指標で、鹿児島県に初めて着地したことでスコアが148点に上がったと記している。一人旅の冒頭で真っ先に触れており、新しい土地に足を踏み入れたこと自体を記録として残す楽しみ方がうかがえる。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["桜島","固有名詞","筆者は鹿児島港から片道250円のフェリーで渡った。当初は山の中腹まで登るつもりだったが、スケール感を見誤っており、こんなに大きい島とは思わなかったとしてあっさり断念した。島内を少し散歩し、お土産屋で用途未定の溶岩の石を自分用に一つ買っている。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["旅のテンションと背徳感","概念","一人旅の初日、夜遅めに入った「黒豚ふくや」でロースカツ定食を食べたときの筆者の表現である。遅い時間の揚げ物だったが、旅のテンションや背徳感も加わって言いようもなく美味しかったと述べ、カロリーのことはひとまず置いておくことにしている。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["シネ漫談","固有名詞","旅の2日目、筆者が鹿児島の映画館ガーデンズシネマで観た、映画作品を題材にした漫談ライブである。上演時間は1時間ちょっとと短めだったが内容は濃く満足したという。前夜に観たトークライブと比べると、ネタ自体はわりと穏当だったと評している。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["写真を撮りながら、ただの知識を生きた知識に変えていく。","文","旅の2日目、特に予定のなかった筆者は鹿児島中央駅まで足を伸ばした。日本最南端の新幹線駅で、ビルの上に観覧車がある。知識として知っていたことを実際に見て写真に収める行為を、知識を生きたものに変える営みとして捉えている。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["密集・密着のストレス","概念","鹿児島の繁華街でほとんど日本人しか見かけなかったことから、筆者が気づいた日常の負荷である。昔の日本はこんな感じだったのかと思いつつ、普段いかにオーバーツーリズムと混雑にさらされているかを感じた。外国人観光客が嫌なわけではないと断っている。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["日常の考えごとから離れ、一瞬でも悩みを忘れる時間が大切だ。","文","一人旅の筆者は、予定を詰めずにカフェで写真を整理しノートに旅の記録をまとめて過ごした。行きたい店の半分も回れなかったが、日常の考えごとから少し距離を置けたことを良かったと述べ、特別な出来事のない時間こそが大事だと感じている。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["休み2日と3万円があれば、全国各地で旅を楽しめる。","文","筆者は鹿児島一人旅の旅費を、マイルでの往復と宿泊・食事・交通・土産の概算として整理した。1泊2日の旅がおよそこの範囲に収まったことから、休みが2日と3万円ほどあれば全国各地で楽しめそうだと分かってきたと、今後の旅の目安を得ている。","鹿児島旅行2025","https://note.com/beefbowl60/n/n66d09f34f3e0","2025-06-16","文脈"],["NotebookLM","固有名詞","Googleが提供するAIベースのリサーチ支援ツールで、読み込ませたソースを前提に対話してくれる点が特徴だと筆者は説明する。学会の予稿集をアップロードし要約や抽出、質問づくりを指示した結果、これまでの10分の1ほどの時間で内容を理解できる印象を得た。","NotebookLMと学会準備","https://note.com/beefbowl60/n/n28d87d34fd9e","2025-06-18","文脈"],["ちゃんと手を抜く","概念","PDFを渡されたらまずNotebookLMに読ませるという筆者の習慣を言い表した言葉である。専門的で数の多い学会の予稿集を全部読み込むのは時間的にも認知的にも厳しい。筆者はAIに任せるのを楽をするためではなく、理にかなった手の抜き方だと位置づけている。","NotebookLMと学会準備","https://note.com/beefbowl60/n/n28d87d34fd9e","2025-06-18","文脈"],["オーガニックな文章","概念","生身の人間が書いた文章を指して筆者が使った言葉である。AIの要約は短いだけでなく論理構成がきれいで読みやすいと感じた筆者は、今や人間作の文章をAIに構造化・要約してもらわないととても読む気になれなくなってきていると、自分の変化を半ば驚きとともに記している。","NotebookLMと学会準備","https://note.com/beefbowl60/n/n28d87d34fd9e","2025-06-18","文脈"],["要約のポッドキャスト化","概念","NotebookLMの新機能で、要約内容を男女の会話形式の音声にしてくれるものである。筆者は最初「誰？この二人？」と戸惑ったが、下手な発表より頭に入り面白いと評価した。移動中に聞くだけで予習になる点を、けっこう革命ではないかと捉えている。","NotebookLMと学会準備","https://note.com/beefbowl60/n/n28d87d34fd9e","2025-06-18","文脈"],["事前に内容を把握すれば、面倒な学会にも前向きになれる。","文","NotebookLMで予稿集を整理したことで、筆者はちょっと面倒だと思っていた学会参加に少し前向きになった。事前に把握しておけば現地の議論に余裕が持て、質のいい質問もできそうだという。有料プランも必要経費ではないかと考え始めている。","NotebookLMと学会準備","https://note.com/beefbowl60/n/n28d87d34fd9e","2025-06-18","文脈"],["レジ
