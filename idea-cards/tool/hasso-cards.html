wl60/n/ndc1aa726a09f","2025-11-30","文脈"],["逃走論","固有名詞","筆者は『命売ります』を三島版「逃走論」のようにも読めると評した。ところどころに不意に出てくる強力なライン、特に目的を持って生きることへの絶望感に惹かれたといい、再読して断片的なものを統合していきたいと、読みを保留したまま記事を結んでいる。","【読書メモ】命売ります","https://note.com/beefbowl60/n/ndc1aa726a09f","2025-11-30","文脈"],["ドミニック・ローホー『シンプルに生きる』","固有名詞","筆者がブックオフの220円棚でなんとなく選び、コメダ珈琲に4時間こもって読み終えた本である。主に女性向けのミニマリスト生活指南書で、初版が2005年と古いため期待していなかったが、意外と面白くてためになったと述べ、多くの抜き書きを残している。","【読書メモ】シンプルに生きる","https://note.com/beefbowl60/n/n1b1ca1a88b57","2025-12-03","文脈"],["Back To The Basic感","概念","筆者が『シンプルに生きる』全体から受けた印象を表した言葉である。書いてあることは今となっては普通だが、丁寧にしっかりやろうという基本に立ち返らせる感覚があると述べた。目新しさよりも当たり前を徹底する点に価値を見いだしている。","【読書メモ】シンプルに生きる","https://note.com/beefbowl60/n/n1b1ca1a88b57","2025-12-03","文脈"],["細々としたガラクタ買いは、高い買い物より高くつく。","文","筆者が『シンプルに生きる』から抜き書きした言葉の一つに基づく。倹約の大敵は無思慮・無計画な細々とした出費の積み重ねだという一節も併せて書き留めており、物を少なく持つことが人を豊かにするという本の主張の中で拾われた金銭感覚である。","【読書メモ】シンプルに生きる","https://note.com/beefbowl60/n/n1b1ca1a88b57","2025-12-03","文脈"],["儀式","概念","『シンプルに生きる』の抜き書きにある「何でも儀式と考えて取り組む」という考え方である。倦怠感に打ち勝つ方法として決められた作法に則って物事を行うことや、バスタイムの準備の手順なども筆者は書き留めており、日常を作法化する発想として拾われている。","【読書メモ】シンプルに生きる","https://note.com/beefbowl60/n/n1b1ca1a88b57","2025-12-03","文脈"],["孤独は、私たち人間にとっての基本的な存在条件である。","文","筆者が『シンプルに生きる』から抜き書きした一節に基づく。交友関係を整理する、批判したくなる人との付き合いをやめる、他人を変えようとしないといった人間関係の項目が並ぶ中に置かれており、筆者は嫌な人との付き合いを絶ちたいという点が響いたと述べている。","【読書メモ】シンプルに生きる","https://note.com/beefbowl60/n/n1b1ca1a88b57","2025-12-03","文脈"],["静と動の中間","概念","『シンプルに生きる』の抜き書きの最後に置かれた「静と動の中間を生きること」という言葉である。その直前には、一度全てを放棄し何にも依存しない恩恵に身を委ねるという一節が並ぶ。筆者はこの本を片付けと人付き合いの整理の本として受け取っている。","【読書メモ】シンプルに生きる","https://note.com/beefbowl60/n/n1b1ca1a88b57","2025-12-03","文脈"],["デエビゴ","固有名詞","筆者が試した新しい薬である。飲むと信じられないくらいビビッドでリアリティのある夢を次から次に見せられ、朝にはぐったり疲弊していたという。筆者はこれを、とても時間のある時に遊びとして使おうと、半ば冗談めかして受け止めている。","新しい薬","https://note.com/beefbowl60/n/nb0188e816933","2025-12-03","文脈"],["永井均","固有名詞","筆者が薬の夢について書いていたところ、哲学者の永井均が同じ薬で悪夢を見るのが好きだとポストしていたと紹介している。永井は、悪夢というより夢らしい夢であり、その世界観と雰囲気をどっぷり味わえるが夢疲れはすると述べていた。","新しい薬","https://note.com/beefbowl60/n/nb0188e816933","2025-12-03","文脈"],["夢疲れ","概念","鮮明な夢を見続けて朝に疲弊する状態を指す、筆者が引用した永井均のポストの言葉である。筆者自身も新しい薬で夢を次々と見せられてぐったりしており、同じ体験を哲学者が面白がっていたことに共感を寄せる形で記事を結んでいる。","新しい薬","https://note.com/beefbowl60/n/nb0188e816933","2025-12-03","文脈"],["夢らしい夢","概念","筆者が引いた永井均のポストで、薬で見る夢は悪夢というより「いかにも夢らしい夢」だと表現されたもの。フロイト的に解釈可能な分節化を備えており、その世界観にどっぷり浸れるという。筆者の見たビビッドでリアルな夢の体験と重ねて紹介されている。","新しい薬","https://note.com/beefbowl60/n/nb0188e816933","2025-12-03","文脈"],["鮮明すぎる夢は、暇な時の遊びとしてとっておく。","文","新しい薬を試したところ、ビビッドでリアリティのある夢を次々に見て朝には疲れ切っていた経験から、筆者が出した結論である。常用は避けたいが、とても時間のある時なら遊びとして楽しめるとし、夢を一種の娯楽として捉え直している。","新しい薬","https://note.com/beefbowl60/n/nb0188e816933","2025-12-03","文脈"],["今年の新語2025","固有名詞","三省堂が毎年選ぶ「辞書を編む人が選ぶ今年の新語」の2025年版で、筆者はその選考発表会をツイキャス配信で視聴した。ベスト10の言葉を、各辞典が収録したらという想定の語釈とともに発表する。筆者は一つ一つ見ていくと今年の世相が分かるようでいいと述べている。","【鑑賞メモ】今年の新語2025＆国語辞典ナイト","https://note.com/beefbowl60/n/n7d9dff43da64","2025-12-06","文脈"],["国語辞典ナイト","固有名詞","東京カルチャーカルチャーの人気イベントで、今年の新語の選考発表会とコラボした第2部として筆者が配信で楽しんだ。テーマは「へんな言葉ずかん」で、辞書を熟読する登壇者たちがヘンテコな言葉を紹介した。筆者は専門家の話す専門的な話は面白いと感想を残している。","【鑑賞メモ】今年の新語2025＆国語辞典ナイト","https://note.com/beefbowl60/n/n7d9dff43da64","2025-12-06","文脈"],["ビジュ","概念","「今年の新語2025」で大賞に選ばれた言葉である。筆者は「今日、ビジュいいね」という用例を挙げ、読者に使っているかと問いかけている。各言葉の選評は特設サイトに詳しく、筆者は選ばれた言葉を通して今年の世相が見えることを楽しんでいる。","【鑑賞メモ】今年の新語2025＆国語辞典ナイト","https://note.com/beefbowl60/n/n7d9dff43da64","2025-12-06","文脈"],["両面語","概念","国語辞典ナイトで見坊行徳氏が発表した「両面語図鑑」のテーマである。例として天地無用、雇用者、すこぶるといった言葉が挙げられた。筆者は発表者ごとの題目と例語を書き留め、辞書を熟読する専門家ならではの切り口を楽しんだと記している。","【鑑賞メモ】今年の新語2025＆国語辞典ナイト","https://note.com/beefbowl60/n/n7d9dff43da64","2025-12-06","文脈"],["街なか用例採集","概念","国語辞典ナイトで稲川智樹氏が「辞書を捨てよ、街へ出よう」と題して紹介した、町で見かけた変な言葉を集める試みである。祝前や略字、旬菜、丼ぶりといった誤字の仲間などが並んだ。筆者はイベントの中でもこの発表が良かったと特に挙げている。","【鑑賞メモ】今年の新語2025＆国語辞典ナイト","https://note.com/beefbowl60/n/n7d9dff43da64","2025-12-06","文脈"],["専門家が話す専門的な話は、それだけで面白い。","文","今年の新語の選考発表会と国語辞典ナイトを配信で見た筆者の感想である。辞書の編集委員や国語辞典マニアが、語釈やへんな言葉を題材に語る2時間を楽しみ、その道に詳しい人が自分の領域の話をすること自体が娯楽になると実感している。","【鑑賞メモ】今年の新語2025＆国語辞典ナイト","https://note.com/beefbowl60/n/n7d9dff43da64","2025-12-06","文脈"],["Quiet Spark vol.4","固有名詞","KAKUBARHYTHMが渋谷WWWで開いたライブイベントで、筆者はmei eharaと安部勇磨のツーマンを観に行った。急遽企画されたらしく会場は比較的空いており、ステージ前が座席仕様だったため見やすくてよかったという。前後と幕間はDJタイムだった。","【鑑賞メモ】安倍勇磨、mei eharaライブ","https://note.com/beefbowl60/n/n1d33f36fcaad","2025-12-07","文脈"],["mei ehara","固有名詞","筆者が渋谷のツーマンライブで初めて生で観たミュージシャンである。シンプルな弾き語りのソロセットでトーク多めだった。筆者はそれまでレコードで聴いて抱いていたイメージと、弾き語りで伝わる音楽性や人柄との間にギャップがあって面白かったと述べている。","【鑑賞メモ】安倍勇磨、mei eharaライブ","https://note.com/beefbowl60/n/n1d33f36fcaad","2025-12-07","文脈"],["安部勇磨","固有名詞","never young beachの安部勇磨で、筆者が渋谷のツーマンライブで初めて生で観たミュージシャンである。mei eharaと同じくシンプルな弾き語りのソロセットでトークが多かった。レコードで聴いていたイメージとのギャップを筆者は面白がっている。","【鑑賞メモ】安倍勇磨、mei eharaライブ","https://note.com/beefbowl60/n/n1d33f36fcaad","2025-12-07","文脈"],["弾き語り","概念","筆者は、弾き語りはミュージシャンの音楽性や人柄がストレートに伝わってくる形式だと捉えた。mei eharaと安部勇磨をどちらも初めてライブで観て、それまでレコードで聴いていたイメージとそれぞれにギャップがあったことを面白さとして受け止めている。","【鑑賞メモ】安倍勇磨、mei eharaライブ","https://note.com/beefbowl60/n/n1d33f36fcaad","2025-12-07","文脈"],["糖分と音楽が合わさると、ライブは最高になる。","文","ライブの途中でお腹が空いた筆者は、品川駅で買ったチョコチップクッキーを食べながら弾き語りを鑑賞した。ステージ前が座席仕様の空いた会場だったこともあり、糖分と音楽で最高な感じだったと、くつろいだ鑑賞体験を振り返っている。","【鑑賞メモ】安倍勇磨、mei eharaライブ","https://note.com/beefbowl60/n/n1d33f36fcaad","2025-12-07","文脈"],["Ryuichi Sakamoto: Diaries","固有名詞","坂本龍一の癌宣告から死までの日記を元にした朗読とプライベート映像を組み合わせたドキュメンタリー映画で、筆者は新宿で観た。内容はNHKスペシャルで観た記憶があったが編集は異なる。最期まで音楽に向き合う姿に本質的なかっこよさを感じたと述べている。","新宿で坂本龍一の映画を観た","https://note.com/beefbowl60/n/n535416c0cd04","2025-12-07","文脈"],["109シネマズプレミアム新宿","固有名詞","歌舞伎町タワーにある、坂本龍一が音響監修を行ったシアターである。筆者は本人の音をこの場で聴いてみたくてここを選び、奮発してS席にした。上映後はS席専用ラウンジで日没を見ながら余韻に浸り、それだけでお値段以上の感動があったという。","新宿で坂本龍一の映画を観た","https://note.com/beefbowl60/n/n535416c0cd04","2025-12-07","文脈"],["『音楽は自由にする』","固有名詞","坂本龍一の自伝で、筆者は映画の直前までラウンジでアルバム『千のナイフ』を聴きながら読んでいた。かなり読み込んだ文庫本だという。これで若い頃の坂本のイメージを保ったまま、その人の生老病死を見つめる体験ができたと振り返っている。","新宿で坂本龍一の映画を観た","https://note.com/beefbowl60/n/n535416c0cd04","2025-12-07","文脈"],["若い頃の姿を心に置いて観ると、その人の生老病死が見える。","文","坂本龍一の最期を追う映画を観る前、筆者はデビュー作のアルバムを聴き、自伝を読んで若い頃のイメージを頭に入れておいた。そのおかげで、晩年の日記と映像をただの闘病記録としてではなく、一人の人間の生涯として見つめる体験になったと述べている。","新宿で坂本龍一の映画を観た","https://note.com/beefbowl60/n/n535416c0cd04","2025-12-07","文脈"],["本質的なかっこよさ","概念","映画で描かれた坂本龍一の、最期まで音楽に向き合う姿から筆者が感じ取ったものである。ダンディズムというのか、と言葉を探しながら表現している。癌宣告から死までを追う内容でありながら、筆者はそこに悲しみよりもかっこよさを見て、良かったと結んでいる。","新宿で坂本龍一の映画を観た","https://note.com/beefbowl60/n/n535416c0cd04","2025-12-07","文脈"],["作り手が音を監修した劇場で、その人の音を聴きに行く。","文","筆者が坂本龍一の映画を観る劇場に、本人が音響監修したシアターを選んだ理由である。上映後のラウンジでも代表曲のピアノ版が静かに流れていてぐっと来たといい、作品の中身だけでなく、観る場所そのものに作り手の痕跡を求める鑑賞のしかたをとっている。","新宿で坂本龍一の映画を観た","https://note.com/beefbowl60/n/n535416c0cd04","2025-12-07","文脈"],["移動と記録","概念","筆者が最近の自分のテーマだと感じている言葉である。ただし記録の方がなかなか追いついていないと認めている。この週も土曜日に新宿と渋谷へ映画とライブのために出かけ、街の写真を撮りためており、移動は増えても記録が遅れがちな現状を振り返っている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nf61a9238d07f","2025-12-07","文脈"],["生活タイムライン","概念","プライベートでやや大きな転換があったことで、筆者の一日の過ごし方が変わったことを表す言葉である。端的にヒマになったといい、その結果として土曜日は映画とライブのために外出し、日曜日はたくさん寝て掃除と風呂だけで過ごす週になったと記している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nf61a9238d07f","2025-12-07","文脈"],["倍音を流していると、片付けをきちんとやりたくなる。","文","何もしない日曜日、筆者は部屋でもお風呂場でも倍音のYouTubeを流していた。するとなんだか心が整い、片付けなどをきちんとやりたくなってくると述べている。音が気分を整え、身の回りの行動にまで影響するという実感を書き留めている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nf61a9238d07f","2025-12-07","文脈"],["SRS-XB100","固有名詞","筆者が部屋やお風呂場で倍音のYouTubeを流すのに使っているソニーのワイヤレススピーカーである。記事では防水・防塵対応の製品として紹介されている。心を整える音を生活のあらゆる場所に持ち込む道具として、日記の中で取り上げられている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nf61a9238d07f","2025-12-07","文脈"],["ネットフリックスのワーナー買収","固有名詞","筆者が今週気になったニュースとして挙げた出来事である。米動画配信大手のネットフリックスが、米メディア大手ワーナー・ブラザース・ディスカバリーの映画など主要部門を11兆円で買収すると報じられた。筆者は記事のリンクを貼るにとどめ、感想は書いていない。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nf61a9238d07f","2025-12-07","文脈"],["『探偵物語』","固有名詞","俳優の中島ゆたかの訃報を今週気になったニュースに挙げた筆者が、印象に残る出演作として触れたドラマである。第2話「サーフィシティブルース」での麗しい姿が印象的だったと記し、ニュースをきっかけに過去の作品の記憶を呼び起こしている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nf61a9238d07f","2025-12-07","文脈"],["Gemini","固有名詞","3年使ったiPhoneのバッテリーが劣化し、機種変更か交換かで悩んでいた筆者が相談を繰り返した相手である。あと2年延命すれば1日20円とコスパが良いとして交換を強く勧められ、それなら早いほどお得だと判断して、筆者はすぐにストアへ向かった。","iPhoneバッテリー交換は1日20円の投資","https://note.com/beefbowl60/n/n17b1bafb2b51","2025-12-12","文脈"],["1日20円の投資","概念","バッテリー交換費用15,800円を、あと2年使う前提で日割りした考え方である。筆者はこれをほとんどタダみたいなものと捉えて自分を納得させ、もっと早く交換すればよかったとも思った。教訓として、悩むよりもまずはバッテリー交換だとまとめている。","iPhoneバッテリー交換は1日20円の投資","https://note.com/beefbowl60/n/n17b1bafb2b51","2025-12-12","文脈"],["Apple Store渋谷","固有名詞","筆者がバッテリー交換のために前日にアプリで予約して訪れた店舗である。3階のジーニアスバーで手続きをしたが、パスワードを思い出せず1時間待つことになり、さらに交換に3時間半かかると告げられた。最終的にトラブルなく交換は完了したという。","iPhoneバッテリー交換は1日20円の投資","https://note.com/beefbowl60/n/n17b1bafb2b51","2025-12-12","文脈"],["「iPhoneを探す」の解除は、家で済ませてから店へ行く。","文","バックアップはしていたが「iPhoneを探す」を解除しないままストアに行った筆者は、Apple IDのパスワードを思い出せず、ロック解除のために1時間待たされた。この失敗から、後進への重要な教訓として記事の最後にも書き残している。","iPhoneバッテリー交換は1日20円の投資","https://note.com/beefbowl60/n/n17b1bafb2b51","2025-12-12","文脈"],["装備ゼロ状態","概念","バッテリー交換の3時間半、スマホなしで渋谷の街を放浪した筆者が陥った状態である。音楽も聞けず地図も見られず、ソワソワしたという。普段いかにスマホに頼って街を歩いているかが、手元から取り上げられたことで浮き彫りになった場面である。","iPhoneバッテリー交換は1日20円の投資","https://note.com/beefbowl60/n/n17b1bafb2b51","2025-12-12","文脈"],["自分を納得させる理由があれば、待ち時間も出費も受け入れられる。","文","交換に3時間半かかると聞いた筆者は、ちょうど渋谷で買い物がしたかったのでむしろ好都合だと自分を納得させた。費用15,800円も1日20円ならほとんどタダだとまた納得させており、理由づけで不満を乗り越える様子が繰り返し描かれている。","iPhoneバッテリー交換は1日20円の投資","https://note.com/beefbowl60/n/n17b1bafb2b51","2025-12-12","文脈"],["描く人、安彦良和","固有名詞","渋谷区立松濤美術館で開催中の安彦良和の回顧展である。アニメ制作資料やカラーイラスト、約50年にわたる漫画原稿が並ぶ。筆者はガンダムの作者という曖昧な認識で観に行ったが、展示内容が充実していてとても満足したと述べている。","【鑑賞メモ】安彦良和展","https://note.com/beefbowl60/n/n8ac5f606ae30","2025-12-14","文脈"],["渋谷区立松濤美術館","固有名詞","安彦良和の回顧展の会場である。記事に引用された展覧会の紹介文では、様々なサブカルの発信地である渋谷で開催することが、日本の文化資源となったその豊饒さと混沌、多様性をふり返り、明日への道を探る機会になると位置づけられている。","【鑑賞メモ】安彦良和展","https://note.com/beefbowl60/n/n8ac5f606ae30","2025-12-14","文脈"],["学生運動から10年でガンダムへ、時代の転換は激しすぎる。","文","展示でまず筆者の興味を引いたのは、アニメクリエイターになる前の弘前大学での全共闘運動の資料だった。学生運動のリーダーで逮捕歴もある人物が、その10年後に機動戦士ガンダムで脚光を浴びるという経歴に、筆者は時代の変わり方の激しさを感じている。","【鑑賞メモ】安彦良和展","https://note.com/beefbowl60/n/n8ac5f606ae30","2025-12-14","文脈"],["『坂本図書』","固有名詞","筆者が安彦良和の名前をはっきり認識するきっかけになった書籍で、坂本龍一との対談が収められていた。展示を観て、二人とも学生運動から80年代サブカルチャーへという流れに共通点があると気づき、筆者はこのつながりをおいおい深掘りしたいと考えている。","【鑑賞メモ】安彦良和展","https://note.com/beefbowl60/n/n8ac5f606ae30","2025-12-14","文脈"],["学生運動から80年代サブカルチャーへ","概念","筆者が安彦良和と坂本龍一の歩みに見いだした共通の流れである。安彦氏は今も積極的に当時の話をしているため、その辺りを深掘りしていきたいと述べている。戦後日本の社会と文化の変化を、一人の作り手の経歴から読み解く視点として残されている。","【鑑賞メモ】安彦良和展","https://note.com/beefbowl60/n/n8ac5f606ae30","2025-12-14","文脈"],["絵コンテの描線","概念","安彦良和展で筆者が思わず感動したものである。とにかく絵がうまいと述べ、完成した水彩などの作品の迫力もさることながら、アニメ用の絵コンテの描線を見て心を動かされたという。完成品よりも途中段階の線に画力の凄みを感じ取っている。","【鑑賞メモ】安彦良和展","https://note.com/beefbowl60/n/n8ac5f606ae30","2025-12-14","文脈"],["中村至男 オン グラフィック","固有名詞","ギンザ・グラフィック・ギャラリーで開かれたグラフィックデザイナー中村至男の企画展で、筆者は土曜日に訪れた。それほど広くない会場に多くの作品がところ狭しと並び、ついつい写真に撮りたくなる作品が多いと述べ、夕方の来場者の多さにも触れている。","【鑑賞メモ】中村至男展","https://note.com/beefbowl60/n/nb78789ea33d2","2025-12-14","文脈"],["明和電機","固有名詞","中村至男が1990年代にグラフィックを手がけたアートユニットである。筆者はその関わりを展示で初めて知り、会場に置かれていた冊子を熟読した。中村が当時勤めていたソニー・ミュージックのロゴを好きだったという話が印象に残ったと記している。","【鑑賞メモ】中村至男展","https://note.com/beefbowl60/n/nb78789ea33d2","2025-12-14","文脈"],["目玉ロゴ","固有名詞","中村至男が当時勤めていたソニー・ミュージックのロゴで、中村が好きだったという話を筆者は明和電機の冊子で読んだ。展示を通して、デザイナーが勤め先のロゴを好んでいたという個人的なエピソードに触れ、作品の背景にある感覚に関心を寄せている。","【鑑賞メモ】中村至男展","https://note.com/beefbowl60/n/nb78789ea33d2","2025-12-14","文脈"],["I.Q","固有名詞","中村至男が佐藤雅彦とともに取り組んだ初期の共作で、プレイステーション用ソフトである。筆者は展示の中で写真とともに取り上げている。展覧会の紹介文では、明和電機の仕事と並んで、中村が鮮烈な視覚世界で注目された代表作として挙げられている。","【鑑賞メモ】中村至男展","https://note.com/beefbowl60/n/nb78789ea33d2","2025-12-14","文脈"],["キッチリした世界観","概念","中村至男の作品を観た筆者が、写真を添えて短く記した感想である。紹介文でも、ミニマムな表現と多角的な視点、想像力を掻き立てるビジュアルがどの作品にも共通する魅力とされる。筆者は「これは何かわかりますか？」と読者に問いかけてもいる。","【鑑賞メモ】中村至男展","https://note.com/beefbowl60/n/nb78789ea33d2","2025-12-14","文脈"],["削ぎ落としたシンプルは、単純とは違う豊かさを持つ。","文","記事に引用された展覧会の紹介文で、中村至男の表現は無駄な情報を削ぎ落としながらも「シンプル＝単純」ではなく、メッセージのエッセンスを凝縮した豊かな表現だと説明されている。筆者が感じたキッチリした世界観の裏付けとなる部分である。","【鑑賞メモ】中村至男展","https://note.com/beefbowl60/n/nb78789ea33d2","2025-12-14","文脈"],["舛田光洋『3日で運がよくなる「そうじ力」』","固有名詞","年末の大掃除のモチベーションを上げるために筆者が読んだ本である。ゴミや汚れ、不用品はマイナスのエネルギーを発するとし、「換気」と「捨てる」を掃除の基本に据える。筆者は要点をメモにまとめ、読了後すぐに片付けの一歩を踏み出している。","【読書メモ】3日で運がよくなる「そうじ力」","https://note.com/beefbowl60/n/n7dfd8f8226f7","2025-12-18","文脈"],["マイナスのエネルギー","概念","『そうじ力』の中心にある考え方で、カビ、ホコリ、汚れ、不用品、乱雑さが発するものとされる。筆者の要約では、生活に必要なもの以外を捨てなければ運気は巡ってこないとされ、換気で外からプラスを取り入れることと対になっている。","【読書メモ】3日で運がよくなる「そうじ力」","https://note.com/beefbowl60/n/n7dfd8f8226f7","2025-12-18","文脈"],["捨てることを極めると、買うものの質が変わる。","文","『そうじ力』の要約メモで、筆者は掃除の基本の二つ目「捨てる」に関する項目を書き留めている。「必要か、必要でないか」で選別し、自分のレベルを下げるものを手放していくと、その先で何を手に入れるかという選び方まで変わるという流れである。","【読書メモ】3日で運がよくなる「そうじ力」","https://note.com/beefbowl60/n/n7dfd8f8226f7","2025-12-18","文脈"],["精神状態の合せ鏡としての排水溝","概念","『そうじ力』で洗面所のポイントとして挙げられる考え方である。筆者のメモには「人生に行き詰まったら排水溝を掃除する」とあり、目につきにくい場所の汚れが心の状態を映すという見立てが、鏡と並ぶ要点として書き留められている。","【読書メモ】3日で運がよくなる「そうじ力」","https://note.com/beefbowl60/n/n7dfd8f8226f7","2025-12-18","文脈"],["磁場のリセット","概念","『そうじ力』の要約で、来客の後は必ず換気をして掃除機をかけるという習慣に付けられた言い方である。家庭不和はリビングから始まるという項目と並び、人が出入りした後の空気や場の状態を掃除で元に戻すという発想として筆者はメモしている。","【読書メモ】3日で運がよくなる「そうじ力」","https://note.com/beefbowl60/n/n7dfd8f8226f7","2025-12-18","文脈"],["古いメールや使わないアプリを消すのも掃除である。","文","『そうじ力』の要約の終盤に、古いメールや使わないアプリは削除するという項目がある。筆者は部屋の片付けは週末に回し、まずスマホの不要なアプリを全部削除した。思ったよりスッキリして気持ちよく、おすすめだと感想を添えている。","【読書メモ】3日で運がよくなる「そうじ力」","https://note.com/beefbowl60/n/n7dfd8f8226f7","2025-12-18","文脈"],["年末年始は予定を先に並べ、その上に片付けを組む。","文","筆者は会食、行きたいイベント、見たい配信番組をカレンダーに登録し、年末年始の全体像を把握した。そのうえで片付けや掃除のプランを重ね、手順はAIで最適化してそれに従ってこなす方針を立てた。計画が整ったことを週のまとめに記している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n4e92137dd688","2025-12-21","文脈"],["三島由紀夫『金閣寺』","固有名詞","筆者が学生の頃に途中で挫折していた小説である。今回は毎日少しずつ味わうように読み進め、ついに読了して達成感を得た。三島の言語化力と人物造形の巧妙さに圧倒されたと述べ、若い頃とは違う読み方ができたことを週のまとめに書いている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n4e92137dd688","2025-12-21","文脈"],["三島由紀夫の文章には、描写できない美などないという自信がある。","文","『金閣寺』を読了した筆者が、何より圧倒された点として挙げた感想である。心情であれ美であれ、言葉にできないものはないという自信が文章に溢れていると受け止め、三島の言語化力の高さを読書の一番の収穫として記している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n4e92137dd688","2025-12-21","文脈"],["柏木","固有名詞","『金閣寺』の登場人物である。筆者は若い頃に読んだときはかなり受け付けられなかったが、今読むとかなり面白い奴として読めたと述べる。年齢を重ねて同じ人物の見え方が変わったことを、人物造形の巧妙さとともに繰り返し「よかった」と振り返っている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n4e92137dd688","2025-12-21","文脈"],["CMF Phone 1","固有名詞","筆者が古くなった仕事用スマホの買い替えで選んだ機種である。発売から1年ほど経つが、使ってみてスピードでもたつく感じはないという。色はライトグリーンにし、SNSアプリを大量に入れて最新Androidにも慣れ、今後は情報収集メインで使う予定である。","仕事用のスマホを新調","https://note.com/beefbowl60/n/n005fdbf0d982","2025-12-25","文脈"],["POCO X6 Pro","固有名詞","筆者が仕事用スマホを選ぶ際に、CMF Phone 1と最後まで迷ったXiaomiの機種である。最新機種と比べて1年前の機種を選んだことになるが、今のところ動作に不満はなく、結果としてデザイン面で楽しめるほうを取った判断に納得している。","仕事用のスマホを新調","https://note.com/beefbowl60/n/n005fdbf0d982","2025-12-25","文脈"],["サブ機ならではの遊び","概念","仕事用のサブ機だからこそ、筆者は色をライトグリーンにして遊んでみた。届いた実物は思ったよりファンシーポップな印象だったが、1日使ううちにこれはこれでいいと思えてきた。メイン機では選ばない冒険をサブ機で楽しむ姿勢である。","仕事用のスマホを新調","https://note.com/beefbowl60/n/n005fdbf0d982","2025-12-25","文脈"],["Nothing OS","固有名詞","CMF Phone 1に搭載されたOSで、独特のモノトーン画面デザインを筆者は新鮮だと感じた。カメラは貧弱でNFCもQiもなく、コスパが良いわけではないと認めつつ、画面の見た目の楽しさが機種を気に入る理由の一つになっている。","仕事用のスマホを新調","https://note.com/beefbowl60/n/n005fdbf0d982","2025-12-25","文脈"],["毎日使う道具は、スペックより見て使って楽しいかで選ぶ。","文","新しい仕事用スマホは機能面で見劣りする点もあったが、筆者は毎日使うものだからデザインを含めて見ていて使っていて楽しいほうが良いと感じた。この辺りは昔とは判断基準が変わってきていると、自分の選び方の変化に気づいている。","仕事用のスマホを新調","https://note.com/beefbowl60/n/n005fdbf0d982","2025-12-25","文脈"],["過去が負担になっていたノート","概念","仕事納めの日、筆者は今の職場に来てからの業務の手帳とノート10冊ほどを細かく見ずにシュレッダーにかけた。キャビネットを占領していたものが消えて大きな空間ができ、なんとなく「過去」が負担になっていたのも断ち切れた気分になったという。","職場の机まわり断捨離","https://note.com/beefbowl60/n/n95e2f0104ef5","2025-12-26","文脈"],["名刺を溜めても、他人をコレクションするだけで意味はない。","文","数百枚ある名刺を、筆者は顔が思い浮かばない人を中心に仕分けて3分の1ほどに減らした。二度と関わらない人のためにスペースを使っていたのは無意味だったと気づき、今回の断捨離の中でもスッキリ度がかなり高かったと振り返っている。","職場の机まわり断捨離","https://note.com/beefbowl60/n/n95e2f0104ef5","2025-12-26","文脈"],["ノイジーなロゴ","概念","企業ロゴ入りのクリアファイルや、もらった企業名入りのカレンダーを筆者が全部捨てた理由である。ロゴやカラー、デザインが視界の中でうるさく感じられるという感覚で、実用的に使えるかどうかより、目に入るものの静けさを優先している。","職場の机まわり断捨離","https://note.com/beefbowl60/n/n95e2f0104ef5","2025-12-26","文脈"],["「ゴミ箱」だけのデスクトップ","概念","机まわりに続いて筆者はPC内も整理し、いつの間にか増えていたデスクトップのショートカットを全削除して「ゴミ箱」だけにした。背景も無地にし、過去のファイルはアーカイブフォルダに一か所にまとめて視界から消すという方法をとった。","職場の机まわり断捨離","https://note.com/beefbowl60/n/n95e2f0104ef5","2025-12-26","文脈"],["迷ったときにAIに聞くと、捨てる背中を押してくれる。","文","職場の机まわりの断捨離で、筆者は捨てるか悩む場面のたびにAIに相談した。すると毎回「全部捨ててください」と背中を押してくれたという。いつか使うかもとしまっていたケーブル類なども、その後押しで一旦全部捨てる判断ができた。","職場の机まわり断捨離","https://note.com/beefbowl60/n/n95e2f0104ef5","2025-12-26","文脈"],["『気がつくと机がぐちゃぐちゃになっているあなたへ』","固有名詞","職場の机まわりの断捨離を終えた筆者が記事の最後に紹介した本である。「6ヶ月以上保存しているものの95パーセントは不要（ゴミ）」という一節を引き、久しぶりに徹底的に片付けてすっきりした体験を裏づける言葉として添えている。","職場の机まわり断捨離","https://note.com/beefbowl60/n/n95e2f0104ef5","2025-12-26","文脈"],["AirPods Pro 3","固有名詞","筆者が2025年下期のベストバイに挙げたイヤホンである。すっかり生活に溶け込んで手放せず、音楽に没頭したいときはこれ一択だという。用途に応じてイヤーカフ型のHUAWEI FreeClipと使い分けていることも、買い物の振り返りで触れている。","買ってよかったもの 2025","https://note.com/beefbowl60/n/n9719269f13fa","2025-12-27","文脈"],["ほぼ日5年手帳","固有名詞","筆者が2026年始まりの小型タイプを3ヶ月前倒しで使い始めた手帳である。今のところ毎日続いており、サイズ感と質感が気に入っている。一方で、5年間大切に使い続けなければならないのは何気にプレッシャーだと本音も漏らしている。","買ってよかったもの 2025","https://note.com/beefbowl60/n/n9719269f13fa","2025-12-27","文脈"],["カリモク THE FIRST","固有名詞","筆者の2025年の大型の買い物の一つであるリクライニングソファである。寝る前にここで動画を見たり読書したりする時間が快感だといい、費用対効果はあったと評価している。買ってよかったものの振り返りで、生活の質を上げた品として挙げられている。","買ってよかったもの 2025","https://note.com/beefbowl60/n/n9719269f13fa","2025-12-27","文脈"],["スマホ2台運用","概念","仕事用にCMF Phone 1を買ったことで筆者が便利さに感動した使い方である。動画を見ながら手元で調べ物をするのはタブレットでもできたが、スマホ＋スマホのほうがアカウントを分けるなど何かと扱いやすいと実感した。","買ってよかったもの 2025","https://note.com/beefbowl60/n/n9719269f13fa","2025-12-27","文脈"],["iPad mini (A17)","固有名詞","筆者が何となく勢いで買ってしまったタブレットである。稼働率はそこそこだと控えめに評価しており、買ってよかったものの一覧に入れつつも、他の品ほどの満足は語っていない。2025年は失敗な買い物も多かったという総括と響き合う一品である。","買ってよかったもの 2025","https://note.com/beefbowl60/n/n9719269f13fa","2025-12-27","文脈"],["買ってよかったものは、評価の定まった品に寄っていく。","文","2025年の買い物を振り返った筆者は、失敗な買い物も多い1年だったと認める。そのうえで、買ってよかったものに限れば「評価がしっかりしている品物」に寄っていたと気づき、来年はもっといい買い物をしたいと締めくくっている。","買ってよかったもの 2025","https://note.com/beefbowl60/n/n9719269f13fa","2025-12-27","文脈"],["住所非公開のお店","概念","仕事納めの週に筆者が忘年会を開いた渋谷の店である。住所が公開されていない店で、入口の様子を画像で残している。新しいスマホやバッグを使い始めた慌ただしい一週間の中で、年末らしい出来事として日記に書き留められている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n830f1686f99d","2025-12-28","文脈"],["物を手放していくと、価値観も更新されていく。","文","休日はずっと家の片付けをしていた筆者は、去年に続き今年もかなり物を捨てている。余分な物を手放すうちに次第に価値観もアップデートされてくる感じがあり、それが気持ちいいと述べて、捨てる行為を内面の変化と結びつけている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n830f1686f99d","2025-12-28","文脈"],["細野晴臣×小西康陽のトリビュート・アルバム","固有名詞","筆者が「最高の取り合わせ」と評して、じっくり味わっている作品である。全曲弾き語りのトリビュート・アルバムで、本人のプレイも収められているという。多分配信には入らないのではないかと推測し、手元で聴く一枚として紹介している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n830f1686f99d","2025-12-28","文脈"],["長く過ごす自分の空間こそ、美しさと快適さを追求する。","文","職場の机まわりの断捨離を振り返った筆者は、短くない仕事の時間を過ごす以上、せめて自分の空間だけでも超美しく超快適を追求すべきだと改めて感じた。さらにそれは生活の全てに言えることだと考えを広げている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n830f1686f99d","2025-12-28","文脈"],["生成AIが買い物に介入した年","概念","買ってよかったものの振り返りを受け、筆者は買い物も失敗なくして成功なしだとまとめた。そのうえで、2025年は本格的に生成AIが買い物に介入してきた年だったことも覚えておこうと記し、自分の購買行動の変化を一年の特徴として残している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n830f1686f99d","2025-12-28","文脈"],["歳相応のアップデート","概念","年末の捨て活で衣類を整理した筆者の基本方針である。1年以上着ていないコートや冠婚葬祭関連などをほとんど捨て、必要になったら新しく買えばよいと割り切った。45リットル袋3つ分を手放し、服は歳相応に更新していくものだと考えている。","お家の断捨離 2025","https://note.com/beefbowl60/n/n0104ff7a5dca","2025-12-30","文脈"],["古いものを身体に取り込んだり塗ったりはしない。","文","メディカル・ボディケア系の整理で筆者が掲げた方針である。医薬品やサプリのストックを大幅に減らし、香りなどが年齢に合わなくなってきたものも手放した。口に入れたり肌に塗ったりするものほど鮮度を優先するという判断である。","お家の断捨離 2025","https://note.com/beefbowl60/n/n0104ff7a5dca","2025-12-30","文脈"],["AIによる処分判定","概念","古いモバイルバッテリーや壊れたデジカメ、増殖した充電ケーブルなど、捨てていいか分からないものを筆者はリストアップしてAIに処分を判定させた。これでかなり作業が捗り、その過程でメルカリに出せそうなものも多く見つかったという。","お家の断捨離 2025","https://note.com/beefbowl60/n/n0104ff7a5dca","2025-12-30","文脈"],["買って読まずにいた本は、失敗を認めて手放す。","文","本の整理で筆者は、読み終わった本を捨てるだけでなく、読もうと思って買ったまま読んでいない本も失敗を認めて捨てた。さらに本棚に並べておくと何となくテンションの下がる本も手放し、本棚を気分の上がるものだけにしている。","お家の断捨離 2025","https://note.com/beefbowl60/n/n0104ff7a5dca","2025-12-30","文脈"],["「最近買った」つもりの物も、気づけば5、6年経っている。","文","年末の捨て活を終えた筆者の締めくくりの気づきである。歳のせいか、最近買ったつもりのものが平気で5、6年経っていることに気づき、意識的に環境を更新していかないといけないと考えた。特に衣類やファッション系でそれを強く感じている。","お家の断捨離 2025","https://note.com/beefbowl60/n/n0104ff7a5dca","2025-12-30","文脈"],["2ヶ月ルール","概念","筆者がスマホのアプリ整理のために設けた「2ヶ月開いていないアプリは削除」というマイルールである。暇な時間にフォルダの隅々まで確認して消していく作業は思いのほか爽快で、存在自体が好きではないSNSもこの機に消したという。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n167d6f22eb24","2026-01-04","文脈"],["必要なアプリだけが並ぶ画面は、精神衛生に良い。","文","年末からアプリの断捨離を進めた筆者は、必要になればまた入れれば良いと割り切った。画面に必要なアプリだけが並ぶ状態は精神衛生に良いと感じておすすめする。勢いでiPadも整理したが、デフォルトアプリとKindleしか残らなかった。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n167d6f22eb24","2026-01-04","文脈"],["データの地層","概念","Macや外付けHDDの整理に着手した筆者が、10年分以上のデータが積み重なった状態をこう表現した。iCloudドライブはクリーンにできたが、写真や音楽はバックアップやクラウドが絡み合い、元データの所在すら不明確で、2026年のテーマになりそうだという。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n167d6f22eb24","2026-01-04","文脈"],["メルカリ","固有名詞","筆者が年末の片付けで出た不用品のApple製品を出品したフリマサービスである。10分とかからずに売れていき、価格設定が安すぎたのかもしれないと振り返る。オークション形式を選べることも最近知ったと、新しい発見として記している。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n167d6f22eb24","2026-01-04","文脈"],["Smari","固有名詞","メルカリで売れた品の発送に筆者が利用したローソンのサービスである。コンビニごとに発送システムが異なるため最初は面倒に感じたが、一度慣れてしまえば便利さを感じるのかもしれないと、使い始めの手間と今後の期待を率直に書いている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n167d6f22eb24","2026-01-04","文脈"],["Duolingo","固有名詞","筆者が年末年始に中国語をゼロから学び始めるために使い始めた語学アプリである。記事の時点で9日ほど続いており、どこまで習得できるか楽しみだと述べている。片付けや整理が中心の週の中で、新しく始めたこととして挙げられている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/n167d6f22eb24","2026-01-04","文脈"],["コクヨ IDeo ネックストラップ","固有名詞","仕事始めに筆者が気分転換として替えた黒い無地のストラップである。団体や企業のロゴが入っているものだと微妙にテンションが下がるため、無地を選んだという。職場の環境改善として身の回りの小物から整えていく取り組みの一つである。","しごとはじめ","https://note.com/beefbowl60/n/na5e3e403689c","2026-01-05","文脈"],["ロゴの入った持ち物は、微妙に気分を下げる。","文","筆者は仕事始めにネックストラップを団体・企業のロゴ入りから無地の黒いものに替えた。毎日身につける小物に他人のロゴがあることが微妙にテンションを下げていたと気づき、無地にすることで気分転換を図っている。","しごとはじめ","https://note.com/beefbowl60/n/na5e3e403689c","2026-01-05","文脈"],["MARVIS","固有名詞","筆者が新しく使い始めた、黒くてカッコいい歯ブラシのブランドである。使っていると微妙に自己肯定感が上がってよいという。これに見合う黒のコップがあれば最高だと付け加え、小さな日用品の見た目が気分を左右することを楽しんでいる。","しごとはじめ","https://note.com/beefbowl60/n/na5e3e403689c","2026-01-05","文脈"],["NOLTYティオ","固有名詞","筆者が業務用ノートとして3年目になる手帳である。2026年版は黒を選んだ。ストラップや歯ブラシと並んで仕事始めに新調したもので、身の回りがちょっとずつ確実に改善されていっているという実感の一部として紹介されている。","しごとはじめ","https://note.com/beefbowl60/n/na5e3e403689c","2026-01-05","文脈"],["黒基調","概念","仕事始めに新調したストラップ、歯ブラシ、手帳がいずれも黒だったことから、筆者は今年は全体的に黒基調で物が選ばれていきそうだと予感している。意図して揃えたというより、選ぶうちに自然とそうなっている流れとして捉えている。","しごとはじめ","https://note.com/beefbowl60/n/na5e3e403689c","2026-01-05","文脈"],["パーカーのボールペン","固有名詞","年末の大掃除で棚の中から出てきた、名入れもしてあるそこそこの値段のボールペンである。何年も出番がなく眠っていたが、筆者はもう一度使ってみようと再生計画を立て、リフィルを交換して再び手元で使い始めることにした。","PARKERのボールペンを再生する","https://note.com/beefbowl60/n/n299adf57bbe8","2026-01-10","文脈"],["眠っていた道具の再生","概念","大掃除で出てきた使っていないパーカーのボールペンを、筆者は捨てるのではなくリフィル交換で生き返らせた。断捨離が続く年末年始の中で、手放すのとは逆に、持っているものにもう一度出番を与えるという選択をしている。","PARKERのボールペンを再生する","https://note.com/beefbowl60/n/n299adf57bbe8","2026-01-10","文脈"],["ジェットストリーム","固有名詞","筆者が普段から使っている三菱鉛筆のボールペンで、パーカーの再生にあたってその替芯を選んだ。軸はパーカーの重厚さ、ペン先はジェットストリームの滑らかさという組み合わせになり、慣れ親しんだ書き味を取り入れている。","PARKERのボールペンを再生する","https://note.com/beefbowl60/n/n299adf57bbe8","2026-01-10","文脈"],["重い軸と滑らかなペン先の組み合わせには、慣れが要る。","文","パーカーのボールペンにジェットストリームの替芯を入れた筆者は、重厚な軸と滑らかなペン先の組み合わせを微妙にバランスが悪いと感じた。それでも元に戻すのではなく、この書き心地に慣れていこうと考えている。","PARKERのボールペンを再生する","https://note.com/beefbowl60/n/n299adf57bbe8","2026-01-10","文脈"],["多少ちぐはぐでも、気分が上がる道具なら良しとする。","文","リフィルを替えて再生したパーカーのボールペンは、書き味のバランスに少し違和感が残った。それでも筆者は、書くときの気分が上がっているのだからこれで良しと結論づけ、道具の完成度より使う気持ちを優先している。","PARKERのボールペンを再生する","https://note.com/beefbowl60/n/n299adf57bbe8","2026-01-10","文脈"],["温度計の数字より、体感の寒さを信じてよい。","文","職場の机の下が寒く、タニタの温度計で測ると足元は21度あったが、筆者の体感では17度ほどに感じていた。厚手の靴下のような中途半端な対策では凌げず、数字上は問題なくても続く地味なストレスを解消すべき課題として扱うことにした。","オフィスの足元が寒すぎる問題に終止符。300Wの小型ヒーターが最適解だった話","https://note.com/beefbowl60/n/nb5bbd6c896a6","2026-01-10","文脈"],["Gemini","固有名詞","足元の冷え対策をホットカーペットにするかパネルヒーターにするか迷った筆者が相談したAIである。「パネルヒーター一択」と返されたが、筆者はもっと大げさでない手段を求めており、助言をそのまま採らずに自分の条件で選び直した。","オフィスの足元が寒すぎる問題に終止符。300Wの小型ヒーターが最適解だった話","https://note.com/beefbowl60/n/nb5bbd6c896a6","2026-01-10","文脈"],["ステルス性","概念","職場で使う暖房器具を選ぶ際に筆者が重視した条件である。周囲に気づかれない静かさや目立たなさを求めて小型ヒーターを選び、実際に音は静かで色もサイズも目立たず、誰にも気づかれていないと満足げに報告している。","オフィスの足元が寒すぎる問題に終止符。300Wの小型ヒーターが最適解だった話","https://note.com/beefbowl60/n/nb5bbd6c896a6","2026-01-10","文脈"],["TOPLAND（トップランド）","固有名詞","筆者が職場の足元用に導入した300Wの小型セラミックヒーターを作る日本のメーカーである。人感センサー付きの製品を足元にひっそり置いたところ、21度だった足元が26度まで上がり、午後には汗ばむほどになったという。","オフィスの足元が寒すぎる問題に終止符。300Wの小型ヒーターが最適解だった話","https://note.com/beefbowl60/n/nb5bbd6c896a6","2026-01-10","文脈"],["自分専用の熱源","概念","小型ヒーターを足元に置いたことで筆者が得た感覚を表す言葉である。職場全体の空調ではなく、自分だけの暖かさを手元に持てることに幸福感を覚え、暖かいことは最高だと述べて、久しぶりにいい買い物ができたと締めくくっている。","オフィスの足元が寒すぎる問題に終止符。300Wの小型ヒーターが最適解だった話","https://note.com/beefbowl60/n/nb5bbd6c896a6","2026-01-10","文脈"],["レグザブルーレイ","固有名詞","TVS REGZAが全製品の生産を完了したと報じられたブルーレイレコーダーである。筆者はこのニュースを受け、ブルーレイレコーダーは数年前からオワコンで日本でしか需要がなさそうだと述べ、自宅に溜まった録画データの整理に取りかかった。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nedb788fa4047","2026-01-11","文脈"],["所有データのミニマム化","概念","録画番組が外付けHDDにまで溢れた状況で筆者がたどり着いた方針である。家庭内にデータを置く時代は終わりつつあるが、クラウド容量には入り切らない。そのせめぎ合いの中で、所有するデータ自体を減らしていくのが今なのかもしれないと考えている。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nedb788fa4047","2026-01-11","文脈"],["お風呂読書","概念","一度はやってみたいと思いつつきっかけがなかった行動を、筆者が捨てる予定の本で試したものである。本はふやけず意外と難なくできたが、手が寒いうえ、スマホのKindleがあれば紙の本を持ち込むまでもないという印象に落ち着いた。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nedb788fa4047","2026-01-11","文脈"],["『地平線の相談』","固有名詞","筆者がお風呂読書を試した際に読んでいた本である。10年ほど前の内容の対談で、若いほうの人がやたらと下ネタを振るのが鼻についたと率直な感想を記している。捨てる予定の本として湯船に持ち込まれた一冊でもある。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nedb788fa4047","2026-01-11","文脈"],["資産運用は退屈なくらいが平常運転である。","文","新年を迎え、筆者は個別株を少し売却してNISA枠に移し、オルカンに投資した。その一連の作業を「平常運転」と呼び、実に退屈だと書いている。刺激のなさをむしろ順調さの表れとして淡々と受け止めている様子がうかがえる。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nedb788fa4047","2026-01-11","文脈"],["身の回りの見直しは、快適さ以上に楽しさをくれる。","文","今週書いた記事として、筆者はIDカードのストラップの新調、カッコいい歯ブラシ、小型ヒーターの導入を挙げた。地味にQOLが上がったと振り返り、環境や持ち物をつぶさに見直すことは快適になるだけでなく何より楽しいと結んでいる。","今週のまとめ（日記）","https://note.com/beefbowl60/n/nedb788fa4047","2026-01-11","文脈"],["勝間和代『仕事と人生を変える 勝間家電』","固有名詞","筆者が夜にKindleで買い、翌日の昼には読み終えた本である。早口で喋り続けて口を挟む隙を与えないような勢いと強い圧があると評した。情報量が膨大なので、読む人それぞれのライフスタイルに合った発見があるだろうとまとめている。","【読書メモ】勝間家電","https://note.com/beefbowl60/n/nf9899909017f","2026-01-13","文脈"],["生産性意識の高い人のアベレージ","概念","筆者が『勝間家電』で紹介される道具を評した言葉である。スマートバンドやルンバ、食洗機など、ここ10年で主流になった道具が多く、尖った人の生態というより平均的な水準であり、だからこそ一般人の参考になるのだろうと考えた。","【読書メモ】勝間家電","https://note.com/beefbowl60/n/nf9899909017f","2026-01-13","文脈"],["無洗米＋急速炊飯","概念","『勝間家電』で「一番美味しい」と紹介されていた米の炊き方である。筆者の家でも無洗米は導入済みだが、自分の体験では全くそんなことはないとして、この説が本書で一番驚いた点だったと述べている。納得できない主張として印象に残った。","【読書メモ】勝間家電","https://note.com/beefbowl60/n/nf9899909017f","2026-01-13","文脈"],["必要のないモノは資産ではなく負債である。","文","『勝間家電』を読んだ筆者が、自分にとっての至言として書き出したメモの一つである。モノは足す前にまず引くことを考え、増やして管理するのではなくまず減らす、という関連する教えとあわせて、新たな気づきとして並べている。","【読書メモ】勝間家電","https://note.com/beefbowl60/n/nf9899909017f","2026-01-13","文脈"],["個人の生産性は、上司や会社の生産性を超えられない。","文","『勝間家電』の至言として筆者がメモした一節である。生産性を高めるには転職するか労働時間を短縮するしかないという結論が添えられている。家電や道具の話が並ぶ中で、働く環境そのものに踏み込んだ気づきとして書き留められている。","【読書メモ】勝間家電","https://note.com/beefbowl60/n/nf9899909017f","2026-01-13","文脈"],["ビートセイバー","固有名詞","『勝間家電』で、買ってよかった家電の2位に挙げられたVRに関連して登場するゲームである。筆者のメモでは、VRをジムの代わりとして使うという文脈で記されている。運動の場所を家の中に持ち込む発想として、筆者が至言の一つに加えた。","【読書メモ】勝間家電","https://note.com/beefbowl60/n/nf9899909017f","2026-01-13","文脈"],["要約する抜き書き","概念","筆者の読書法の要となる工程である。マーカーでチェックしながら1周目を読み、2周目で箇条書きの抜き書きを作る。昔は一字一句正確に写経していて時間がかかりすぎたため、自分で要約しながら書くことをポイントに据えている。","最近の読書方法","https://note.com/beefbowl60/n/nd5155ded10ce","2026-01-14","文脈"],["線を引けない図書館本は、内容の確認にだけ借りる。","文","紙の本は線を引きながら読むのが圧倒的に早いと筆者は感じている。そのため書き込みのできない図書館本はほとんど読まなくなり、借りるのは内容を確認するためだけになったという。読み方の変化が本の入手方法まで変えた例である。","最近の読書方法","https://note.com/beefbowl60/n/nd5155ded10ce","2026-01-14","文脈"],["NotebookLM","固有名詞","筆者が箇条書きの読書メモをコピペして読み込ませているGoogleのAIサービスである。「シンプルライフ・断捨離」のようにジャンルごとにノートを分けて作っている。情報源を元にした会話は単独でもできるが、筆者はGemini経由での利用を好む。","最近の読書方法","https://note.com/beefbowl60/n/nd5155ded10ce","2026-01-14","文脈"],["Gemini","固有名詞","筆者がNotebookLMのノートを参照させて、個人的な課題解決に特化した会話をするAIである。複数の情報源を一つの文脈でうまくブレンドして返すため的確な答えが得やすいと評価する。文学や哲学の本は対話しながら読み進めている。","最近の読書方法","https://note.com/beefbowl60/n/nd5155ded10ce","2026-01-14","文脈"],["横断的マッシュアップ","概念","読み込ませる読書メモが増えるほど、AIの返答が複数の本を横断して混ぜ合わせたものになる現象を筆者はこう表現した。知識を育てているような感覚があって面白いと述べ、メモの蓄積そのものに楽しみを見いだしている。","最近の読書方法","https://note.com/beefbowl60/n/nd5155ded10ce","2026-01-14","文脈"],["本を丸ごとAIに渡すと、興味のない部分がノイズになる。","文","NotebookLMには自炊した本を丸ごと読み込ませることもできるが、筆者は興味のない部分に引きずられたりノイズが増えたりする印象を持った。良し悪しがあるとして、自分で要約した抜き書きを読み込ませる方法を選んでいる。","最近の読書方法","https://note.com/beefbowl60/n/nd5155ded10ce","2026-01-14","文脈"],["ソニーのRX100初代モデル","固有名詞","家族の愛用品だったが、スマホしか使わないからと筆者に譲られたデジカメである。2014年頃に家電量販店で一緒に選んだ思い出があり、電源は入るもののレンズが動かない状態だった。当時は7万円ほどで、少し高く感じたと振り返っている。","動かないデジカメ2万円で売れた","https://note.com/beefbowl60/n/nd3f8b4c06f43","2026-01-17","文脈"],["サイバーショット","固有名詞","筆者が手放したRX100が属するソニーのカメラのシリーズである。電源を入れると特有の「シャリ〜ン」という音が鳴り、その音をきっかけに、10年ほど前に媒体に出た際スタジオでこのカメラで記念撮影したことや、当時の職場を思い出した。","動かないデジカメ2万円で売れた","https://note.com/beefbowl60/n/nd3f8b4c06f43","2026-01-17","文脈"],["壊れたカメラにも、直して流通させる道がある。","文","レンズが動かないジャンク品のRX100をフリマサイトに出品したところ、筆者の予想に反して2万円ほどで売れた。動かないのにと驚きつつ、どこかに修理できる流通ルートがあるのだろうと推測している。2万円で何を買おうかと結んでいる。","動かないデジカメ2万円で売れた","https://note.com/beefbowl60/n/nd3f8b4c06f43","2026-01-17","文脈"],["物を手放す瞬間に、忘れていた過去がふと浮かぶ。","文","動かないデジカメを売ったとき、筆者は一緒に選んだ家電量販店の記憶や、そのカメラで撮った記念写真、当時の職場のことを次々に思い出した。物を手放すという行為が、しまい込まれていた記憶を呼び起こす引き金になったのである。","動かないデジカメ2万円で売れた","https://note.com/beefbowl60/n/nd3f8b4c06f43","2026-01-17","文脈"],["霧の向こうに消えていく記憶","概念","カメラを手放したときに浮かんだ過去の出来事について、筆者はあと10年もしたら霧の向こうに消えていきそうだと書いた。だからここに残しておいたと述べ、記事を書くこと自体を薄れゆく記憶を留めておくための記録として位置づけている。","動かないデジカメ2万円で売れた","https://note.com/beefbowl60/n/nd3f8b4c06f43","2026-01-17","文脈"],["RAIDを組んでも、データの保全性が高まるとは限らない。","文","筆者は家庭内ネットワーク上のハードディスクであるNASを撤去することにした。RAIDでも保全性が高まるわけではないという話を踏まえ、バックアップは外付けHDDに集約した。見た目は美しくなく、ベストな解決策ではないと認めている。","データの整理","https://note.com/beefbowl60/n/nf397cb31cf23","2026-01-17","文脈"],["iCloud+","固有名詞","筆者がGoogle Driveとともにそれぞれ2TBを契約しているクラウドストレージである。契約しているのに効率的に使えていない状況だと認めつつ、12TBで月9000円のプランも、考え方次第ではアリなのかもしれないと検討している。","データの整理","https://note.com/beefbowl60/n/nf397cb31cf23","2026-01-17","文脈"],["積み上がった写真や動画を整理する決定打は、まだない。","文","整理しきれていない10年分以上の写真や動画を前に、筆者は保管と整理を両立する決定的なソリューションが世の中にまだないと感じている。HDDを数年ごとに大容量へ引っ越して凌いできたが、その間にもデータは増え、ドライブも安くない。","データの整理","https://note.com/beefbowl60/n/nf397cb31cf23","2026-01-17","文脈"],["データのトランクルーム","概念","クラウドストレージの料金について筆者が持ち出した見方である。データも物と同じようにトランクルームに預け、その家賃を払っていると考えれば、大容量プランへの月額支払いも納得できるかもしれないと、費用の捉え方を物の保管になぞらえた。","データの整理","https://note.com/beefbowl60/n/nf397cb31cf23","2026-01-17","文脈"],["データの断捨離","概念","クラウドの大容量プランも検討した筆者が、最終的に先にやるべきだと考えたことである。不要なデータにお金はかけたくないため、保管場所を増やす前にまずデータ自体を減らす必要がありそうだと結論づけ、物の整理と同じ発想をデータに向けている。","データの整理","https://note.com/beefbowl60/n/nf397cb31cf23","2026-01-17","文脈"],["高輪ゲートウェイのNEWoMan","固有名詞","3連休の月曜日に筆者が買い物に訪れた商業施設である。目新しい店がたくさん入っているわりに人が少なく非常に快適で、年齢層も若すぎず落ち着いている点も評価した。高輪ゲートウェイを「穴場」と呼び、スタバのスタンプも取得した。","日記（今週のまとめ）","https://note.com/beefbowl60/n/naf3859ee261e","2026-01-18","文脈"],["Duolingo","固有名詞","筆者が前年末から主に中国語を学ぶためにコツコツ続けている語学アプリである。有料の「Super Duolingo」プランにアップグレードし、60％割引で年8000円弱、広告なしで無制限に使えて快適だという。中国語レベル5、英語レベル60で進行中である。","日記（今週のまとめ）","https://note.com/beefbowl60/n/naf3859ee261e","2026-01-18","文脈"],["仲間と一緒に学ぶと、続ける気力が湧いてくる。","文","Duolingoを続けていた筆者は、知人も同じアプリをやっていると知って相互フォローした。一緒にやっているとモチベーションが上がると実感し、それが有料プランへのアップグレードを決める後押しにもなった。独学に他人の存在が効いた例である。","日記（今週のまとめ）","https://note.com/beefbowl60/n/naf3859ee261e","2026-01-18","文脈"],["ゲーム感覚の学習","概念","筆者がDuolingoにのめり込んでいった過程を表す言葉である。最初はゲーム感覚で時間潰しにやっていたが、だんだんとハマってきたと述べている。学ぼうと意気込むより、遊びの延長で続けるうちに習慣になっていったことがうかがえる。","日記（今週のまとめ）","https://note.com/beefbowl60/n/naf3859ee261e","2026-01-18","文脈"],["AIと音声で遅延なく話せたら、世の中は変わる。","文","AppleがGoogleの「Gemini」を次世代SiriなどのAI基盤に採用するというニュースを、筆者は今週気になった話題として取り上げた。今より高性能になり音声でタイムラグなく会話できるようになれば、世の中が変わりそうだと期待を寄せている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/naf3859ee261e","2026-01-18","文脈"],["「Tokyo Melody Ryuichi Sakamoto」4Kレストア版","固有名詞","1984年の坂本龍一を追ったドキュメンタリー映画で、筆者は平日の夜に歌舞伎町タワーの109シネマズプレミアム新宿で観た。『音楽図鑑』制作中のスタジオやピアノの「戦場のメリークリスマス」などが映り、映画に登場した機材や写真パネルの展示も楽しんだ。","【映画】「Tokyo Melody Ryuichi Sakamoto」","https://note.com/beefbowl60/n/n654496b810ad","2026-01-24","文脈"],["坂本龍一の音楽論は、1984年から自伝までほぼ変わらない。","文","映画の冒頭、メイクする顔のアップとともに坂本龍一が音楽論を語る場面がある。筆者は、そこで語られている内容が後の自伝『音楽は自由にする』とほとんど変わっていないことに驚いた。考えの一貫性が、時を隔てた二つの記録から浮かび上がった。","【映画】「Tokyo Melody Ryuichi Sakamoto」","https://note.com/beefbowl60/n/n654496b810ad","2026-01-24","文脈"],["勢いのあった頃の東京","概念","映画にコラージュ的に挿入された80年代の街の風景を見て筆者が感じたものである。改札のハサミのリズムやパチンコ店の音、日本製の家電がぎっしり並ぶ秋葉原などが映る。この手の記録映像がもともと大好きで、4Kの臨場感に没入できたという。","【映画】「Tokyo Melody Ryuichi Sakamoto」","https://note.com/beefbowl60/n/n654496b810ad","2026-01-24","文脈"],["フェアライトCMI","固有名詞","映画の中で操作説明の場面が登場する機材である。難しそうな機械を操作し、画面にペンで波形が描ける様子に、筆者は「ハイテク！」と当時の先端ぶりを面白がった。上映館では映画に登場したフェアライトCMIの展示もあり、それも楽しんだ。","【映画】「Tokyo Melody Ryuichi Sakamoto」","https://note.com/beefbowl60/n/n654496b810ad","2026-01-24","文脈"],["竹の子族","固有名詞","映画の中で長回しで映される、80年代の路上で踊る若者たちである。筆者はその踊りを見て、TikTokのダンス動画と本質的に何も変わっていないと感じ、むしろかっこいいと評した。時代を超えて繰り返される若者文化の姿を重ね合わせている。","【映画】「Tokyo Melody Ryuichi Sakamoto」","https://note.com/beefbowl60/n/n654496b810ad","2026-01-24","文脈"],["間のよい編集は、何十年たっても古臭くならない。","文","1984年の映像で構成された坂本龍一のドキュメンタリーを4Kレストア版で観た筆者は、映画の編集の仕方について、間がよくて今見ても古臭くないと評した。街の風景やライブ映像をつなぐリズムに、時代を超える力を感じ取っている。","【映画】「Tokyo Melody Ryuichi Sakamoto」","https://note.com/beefbowl60/n/n654496b810ad","2026-01-24","文脈"],["『勝間式 汚部屋脱出プログラム』","固有名詞","以前Kindleで買ってあったのを筆者が再読した片付けの本である。収納や在庫、物の選び方から家事と幸せの関係まで、多数の要点を箇条書きの読書メモにまとめた。この本からも片付けのロジックとモチベーションが得られたと締めくくっている。","【読書メモ】勝間式汚部屋脱出プログラム","https://note.com/beefbowl60/n/naaf07188bc55","2026-01-25","文脈"],["収納破産ポイント","概念","筆者の読書メモの冒頭に置かれた考え方で、収納がいっぱいになり物があふれだすと管理不能になる境目を指す。これを避けるため、原則ふだん使っている物以外は捨て、「ふだん」は季節物以外なら1か月、季節物なら1年以内と定義するという。","【読書メモ】勝間式汚部屋脱出プログラム","https://note.com/beefbowl60/n/naaf07188bc55","2026-01-25","文脈"],["ジャストインタイム","概念","筆者の読書メモで、食品や消耗品などの在庫を極力持たないという方針を説明する言葉として出てくる。食洗機や洗濯機もたまるまで待たず、気づいたときに少量でも回すほうが早く終わるという項目と並び、ため込まない暮らし方として記されている。","【読書メモ】勝間式汚部屋脱出プログラム","https://note.com/beefbowl60/n/naaf07188bc55","2026-01-25","文脈"],["再調達に3万円もかからない物は、手放してよい。","文","筆者が本から書き出した処分ルールの一つである。再調達コストが3万円を上回らない物は処分するという基準で、必要になればまた買えばよいという割り切りを示している。使用頻度と占有スペースで物を選ぶという項目とあわせてメモされた。","【読書メモ】勝間式汚部屋脱出プログラム","https://note.com/beefbowl60/n/naaf07188bc55","2026-01-25","文脈"],["片付けもダイエットも、InとOutの管理である。","文","筆者の読書メモに並ぶ項目の一つである。物の量も体重も、入ってくる量と出ていく量の管理で決まるという見方で、使用頻度の高くない物は慎重に買い、あまり使わなかった物は早めに処分するという、入口と出口の両方に関わるルールとつながっている。","【読書メモ】勝間式汚部屋脱出プログラム","https://note.com/beefbowl60/n/naaf07188bc55","2026-01-25","文脈"],["「趣味＝家事」","概念","筆者のメモで、幸せのキーポイントとして記された考え方である。いくら稼いでも、汚れた家に住み、気に入らない服を着て、まずいものを食べていたら幸せを感じられないという項目と並ぶ。物を捨てると好循環が始まるという言葉でメモは結ばれている。","【読書メモ】勝間式汚部屋脱出プログラム","https://note.com/beefbowl60/n/naaf07188bc55","2026-01-25","文脈"],["昔の写真の整理は、気力を過去に持っていかれる。","文","HDDのデータ整理で昔の写真を見返した筆者は、懐かしさと同時に少し落ち込み、変な記憶の扉が開いて気持ちが疲弊した。デジカメ以降は写真が選抜されず「残りすぎている」ことにも理由がありそうだと考え、RAWをJPEGに変換して削除した。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nfe5835b835a3","2026-01-25","文脈"],["UGREEN","固有名詞","以前NASとして使っていたHDDを外付けドライブとして使うため、筆者が初めて買ったメーカーのHDDケースである。取り付けが簡単で、ケースもACアダプターも小型でミニマムだとして、良い買い物だったと評価している。データ整理の一環での購入である。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nfe5835b835a3","2026-01-25","文脈"],["ほどよい間合いの人付き合いは、何より心地よい。","文","筆者は友人と坂本龍一の映画を観た後、新宿西口の地下の店で食事をして解散した。数年に一度あるかどうかの有意義でポジティブな時間だったと振り返り、適切な間合いと距離感で人と付き合えるととても気持ちが良いと書いている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nfe5835b835a3","2026-01-25","文脈"],["環境を整える入浴","概念","疲れが出て頭が冴えなかった土曜日、筆者は午後に風呂を入れ、音響やソルト、マッサージャーを用意して湯に浸かった。入浴後も香りをつけ、白檀を焚いて音響の中でストレッチをした。最高の環境を整えることが重要だと繰り返し強調している。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nfe5835b835a3","2026-01-25","文脈"],["学習進捗による生存確認","概念","ふだんメッセージのやりとりはほとんどなく、Duolingoだけでつながっている友人との関係を筆者はこう表した。毎日の学習進捗だけで互いの無事を確かめ合う関係がとても良いと述べ、暮らしを見せ合ったり主張し合ったりするのは疲れると続けている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nfe5835b835a3","2026-01-25","文脈"],["Obsidian","固有名詞","筆者が職場で仕事中のメモアプリとして使い始めたツールである。作業のログを書いたりスクショを貼り付けたりしている。まだ知らない機能がたくさんあり、これから勉強していくつもりだと述べ、知らないことを学ぶワクワク感を楽しんでいる。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nea9ab93dc3f1","2026-02-01","文脈"],["『ロギング仕事術』","固有名詞","筆者が昔読み、職場でObsidianを使い始めるにあたって作業メモの考え方の参考にしている本である。副題は「課題に気づく、タスクが片づく、成果が上がる」。作業のログを書き残すという仕事中のメモ運用の考え方を、この本から借りている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nea9ab93dc3f1","2026-02-01","文脈"],["知らない機能を一つずつ覚えていくのはワクワクする。","文","忙しい一週間の中で、筆者は職場のメモアプリとしてObsidianを使い始めた。作業ログやスクショの置き場として使いつつ、まだ知らない機能が多いことに気づき、これから学んでいく過程そのものを楽しみとして受け止めている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nea9ab93dc3f1","2026-02-01","文脈"],["テスラ","固有名詞","筆者が今週気になったニュースとして挙げた企業である。スペースXとの合併協議や、脱炭素の看板を捨ててEV工場をヒト型ロボット生産に転用し、AI企業へ転換するという報道を紹介している。理由ははっきりしないが、なんとなく動向が気になると述べている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/nea9ab93dc3f1","2026-02-01","文脈"],["第51回衆議院議員総選挙","固有名詞","筆者が土曜日に期日前投票へ行った選挙である。雪が舞う中を少し遠くの投票所まで出かけた。投票先は今回は比較的悩まずに決められたと述べ、豊かで平和な暮らしを次の世代にも残したいという気持ちを、投票をきっかけに書き留めている。","第51回衆議院議員総選挙","https://note.com/beefbowl60/n/n3d5d7fff1c7e","2026-02-08","文脈"],["GO","固有名詞","期日前投票へ急ぐために筆者が初めて使った配車アプリである。段取りに不慣れで微妙におたおたしたと振り返っている。帰りは迎車代500円を節約するため、アプリを使わずに流しのタクシーを拾って帰ったという小さなエピソードで記事を締めている。","第51回衆議院議員総選挙","https://note.com/beefbowl60/n/n3d5d7fff1c7e","2026-02-08","文脈"],["期日前投票","概念","筆者が今回の総選挙で利用した投票方法である。投票所には大勢の人がいて、並んで少し待った。期日前投票では用紙の裏面に記入が必要だと現地で知り、慌てて書いたという。慣れない手続きに戸惑う様子を日記として淡々と記録している。","第51回衆議院議員総選挙","https://note.com/beefbowl60/n/n3d5d7fff1c7e","2026-02-08","文脈"],["豊かで平和な暮らしを、先人から受け取り次の世代へ渡したい。","文","投票に行った日、筆者は人生の大部分を豊かで平和に暮らせてよかったと最近実感していると書く。その暮らしを築いた先人たちへの感謝と、それを次の世代にも残したいという気持ちが大きいと述べ、投票という行為にその思いを重ねている。","第51回衆議院議員総選挙","https://note.com/beefbowl60/n/n3d5d7fff1c7e","2026-02-08","文脈"],["同じ社会にいても、人によって見えているものが違う時代になった。","文","平和な暮らしを次世代に残したいと願う一方で、筆者はどのような考えや認識の仕方がそれを実現してくれるのか、はっきりとは分からないと認める。人によって見えているものが異なる時代になってしまったと述べ、答えを保留したまま記事を閉じている。","第51回衆議院議員総選挙","https://note.com/beefbowl60/n/n3d5d7fff1c7e","2026-02-08","文脈"],["『戦争に反対する唯一の手段は。』","固有名詞","様々なアーティストがピチカート・ファイヴの曲をカバーしたCDで、筆者が今週聴いた一枚である。デューク・エイセス、南佳孝、和田アキ子あたりのアレンジが大好きだという。オリジナルアルバムが配信になく、入手が難しくなっている状況を残念がっている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/n84d672395278","2026-02-08","文脈"],["『生成AIとライフハック』","固有名詞","筆者が今週読んだ本である。いろいろな人の生成AIに対する接し方や感じ方を知るのは興味深いと述べ、この本のスタンスを「ライフハックの道具としての生成AI」という距離感だと捉えた。そのうえで、筆者自身は道具以上の存在になると予想している。","日記（今週のまとめ）","https://note.com/beefbowl60/n/n84d672395278","2026-02-08","文脈"],["AIはいずれ道具を超え、人の心理の奥深くへ入り込んでいく。","文","生成AIをライフハックの道具として扱う本を読んだ筆者が、自分の予想として書いた見立てである。AIは今後、道具としての距離感を超えて多くの人間の心理の奥深くに入り込んでいくのではないかと述べ、その善し悪しについては判断を保留している。","日記（今週のまとめ）","https://note.com/beefbowl60/n/n84d672395278","2026-02-08","文脈"],["『死ぬまで落ち着かない』","固有名詞","『完全自殺マニュアル』の著者・鶴見済が六十年生きてわかったことを綴った本で、筆者が前週から読み進めていた。著者も還暦を迎えたことに触れ、「老い」への向き合い方を描いた本として読んでいる。前週の日記では全ページ染み渡ると評していた。","日記（今週のまとめ）","https://note.com/beefbowl60/n/n84d672395278","2026-02-08","文脈"],["老いの予習","概念","筆者が最近「老い」関連の本を結構読んでいる理由を表した言葉である。自分にとっては予習のような意味合いが大きいという。ただし、まだそこまでの年齢ではないので、もっと「若い本」も読んだほうがいいかもしれないとも感じ、バランスを気にしている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/n84d672395278","2026-02-08","文脈"],["デイリーノート","概念","筆者が使い始めたObsidianにある、1日1ページでノートを作る仕組みである。常時開いて細かいメモとスクショの貼り付け場所にしている。紙のノートや標準のメモ帳も併用して運用がシンプルでなくなってきたため、どこかで最適化したいと考えている。","日記（今週のまとめ）","https://note.com/beefbowl60/n/n84d672395278","2026-02-08","文脈"],["THREADS","固有名詞","筆者が最近覗いていて違和感を覚えたSNSである。本当に人間が投稿しているのかと思うほど、今の自分にフィットしたポストが並ぶという。自分を肯定する世界、不安を慰める世界、怒りを増幅させる世界がそこにあると述べ、アルゴリズムの力を不気味がっている。","AI・気持ち悪さ・抵抗","https://note.com/beefbowl60/n/n24b0c976ff5f","2026-02-09","文脈"],["特定されすぎる気持ち悪さ","概念","筆者がSNSに対して抱く感覚を表した言葉である。2台のスマホでアカウントを分離していても様々なパターンで簡単に同定されてしまう。個人情報という外面だけでなく、思想・趣味・嗜好・環境まで特定されすぎていることを気持ち悪いと述べている。","AI・気持ち悪さ・抵抗","https://note.com/beefbowl60/n/n24b0c976ff5f","2026-02-09","文脈"],["カラーバス効果","概念","意識しているものほど目に入りやすくなる心理現象として、筆者が引き合いに出した言葉である。頭の中だけで考えていたことや、最近リアルで誰かと話した話題までSNSに反映されている気がするが、それが偶然のカラーバス効果なのかすら判断できないと述べている。","AI・気持ち悪さ・抵抗","https://note.com/beefbowl60/n/n24b0c976ff5f","2026-02-09","文脈"],["仕事をAIに奪われるより、行動をアルゴリズムに支配されるほうが怖い。","文","SNSのフィードが自分に合わせすぎていると感じた筆者の結論である。AIで仕事がなくなることよりも、アルゴリズムによって行動が支配されることのほうが怖いと述べ、こうした方向に進む世界に対してユーザーはなすすべがないという気がしていると書いている。","AI・気持ち悪さ・抵抗","https://note.com/beefbowl60/n/n24b0c976ff5f","2026-02-09","文脈"],["アルゴリズムへのささやかな抵抗は、古典を読むことと身体を使うことだ。","文","アルゴリズムに支配される世界に人間はなすすべがないと感じた筆者が、それでもできることとして挙げた答えである。読書、特に古典と、身体性の重視をささやかな抵抗と位置づけた。2026年の「今の感覚」を残すために書いたと記事を結んでいる。","AI・気持ち悪さ・抵抗","https://note.com/beefbowl60/n/n24b0c976ff5f","2026-02-09","文脈"],["Obsidian","固有名詞","筆者が昨年末に導入し、情報集約のメインに据えることにしたノートアプリである。ワークフローをシンプルにするため、Notion、Cosense、Goodnotes、Day Oneなどは基本的に運用を終えた。テキストを書くためのアプリとしてシンプルで使いやすい点が自分にフィットしたという。","最近のメモ事情（Obsidian）","https://note.com/beefbowl60/n/n1d554c8d99c0","2026-02-14","文脈"],["デイリーノート","概念","筆者がObsidianで使っている、日付に紐づいたノートである。アイデア、思いつき、考え、TODO、出来事などを自分の言葉で箇条書きにして書き溜めており、ジャーナリングに近い。以前と比べて4〜5倍くらいの量を書き出している感覚があるという。","最近のメモ事情（Obsidian）","https://note.com/beefbowl60/n/n1d554c8d99c0","2026-02-14","文脈"],["自分の言葉で言語化したログ","概念","生成AIの利用を前提にしたとき、筆者が最も価値を持つと感じている素材である。知的生産の素材は構造化されたデジタルテキストがよく、その中でも自分の言葉で書いたログが真に価値を持つという。その結果、紙のノートの役割も変わりつつあると述べている。","最近のメモ事情（Obsidian）","https://note.com/beefbowl60/n/n1d554c8d99c0","2026-02-14","文脈"],["箇条書きとAIの往復を重ねるほど、気づきの抽象度が上がる。","文","筆者の書き方の手順から出た実感である。まず箇条書きを大量に書き、思念が出尽くしたら生成AIに投げてフィードバックを得て、さらに掘り下げた箇条書きを作る。これを5〜6サイクル行うと、最終的な行動への意思決定の精度も高まってくる感覚があるという。","最近のメモ事情（Obsidian）","https://note.com/beefbowl60/n/n1d554c8d99c0","2026-02-14","文脈"],["行動や判断を最後に決めるのは、自分の言葉である。","文","デジタルノート運用を振り返った筆者のまとめである。大量の「自分の言葉」の資産は生成AIによって容易に言語資本化できるようになったと述べ、そうした使い方と相性の良いデジタルノートを、しばらくは活用していくことになりそうだと結んでいる。","最近のメモ事情（Obsidian）","https://note.com/beefbowl60/n/n1d554c8d99c0","2026-02-14","文脈"],["低負荷から始める習慣化","概念","かなり久しぶりにジムへ行った筆者が試したやり方である。以前は「せっかく来たから」と長くダラダラやっていたが、習慣化のためには最初の負荷を下げたほうがいいと聞き、40分ほど集中してバイクとランをこなし、さっと引き上げたという。","日記｜運動や技術","https://note.com/beefbowl60/n/n61fa42d11a67","2026-02-15","文脈"],["運動は疲れる手前で切り上げるほうが気持ちいい。","文","久しぶりのジムで、筆者は長居せず40分ほど集中して運動し、早めに引き上げた。そのとき、疲れる手前の良い感じのところで適度に切り上げるほうが気持ちがいいことに気づいたという。習慣化のために負荷を下げるという助言を試した結果の実感である。","日記｜運動や技術","https://note.com/beefbowl60/n/n61fa42d11a67","2026-02-15","文脈"],["「着いていけないかも」という実感","概念","仕事の守備範囲でAIに限らない技術革新の波が次々に来る中で、筆者がキャリアで初めて抱いた小さな実感である。いつかどこかで着いていけなくなるのはマクロ的には必然だとしつつ、それが「今」来ていることを記録しておこうと考えて書き留めた。","日記｜運動や技術","https://note.com/beefbowl60/n/n61fa42d11a67","2026-02-15","文脈"],["今さら慌てても仕方ない変化には、焦らず人生設計で向き合う。","文","技術革新に着いていけないかもしれないと初めて感じた筆者は、それを嘆くのではなく記録に残すことにした。そのうえで、今さら慌てても仕方がないとして、これからの人生のライフプランを焦らずじっくり考えていこうという姿勢を示している。","日記｜運動や技術","https://note.com/beefbowl60/n/n61fa42d11a67","2026-02-15","文脈"],["BDレコーダーの終売","固有名詞","筆者が今週気になったニュースである。東芝（TVS REGZA）に続き、ソニーもブルーレイ・レコーダーの出荷終了を決めた。自宅の機械はまだ現役だが、懸案だった永久保存したい動画は、どうにかして本体から取り出すことに成功したと安堵を記している。","日記｜運動や技術","https://note.com/beefbowl60/n/n61fa42d11a67","2026-02-15","文脈"],["規格外『すべては言葉からはじまる』","固有名詞","Xでフォローしている人の推薦で、筆者がKindleで読んだビジネス自己啓発本である。普段あまり読まないジャンルで最初は面食らったが、言語化の意味と目的が明快に述べられていて、自分のノートやメモの取り組み方に大いに参考になったと評価している。","【読書メモ】すべては言葉からはじまる","https://note.com/beefbowl60/n/nd782858dcab4","2026-02-15","文脈"],["言語化資本","概念","筆者がこの本で特に注目し「！」付きで挙げた概念である。抜粋メモでは、言語資本は人的資本・社会資本・金融資本と同等の価値を持つとされる。筆者は、自分の言葉を書き溜めるノートやメモの取り組みに、この考え方が大いに参考になったと述べている。","【読書メモ】すべては言葉からはじまる","https://note.com/beefbowl60/n/nd782858dcab4","2026-02-15","文脈"],["判断基準の明文化","概念","本の抜粋メモで筆者が繰り返し書き留めた考え方である。判断基準を明文化しておけば多くの決断が自動化され、認知コストが節約でき、無形資産の積み上げにもなるという。筆者は2030年に向けた新たな行動の判断基準を言語化し、自分の中に作りたいと考えている。","【読書メモ】すべては言葉からはじまる","https://note.com/beefbowl60/n/nd782858dcab4","2026-02-15","文脈"],["まど・みちお","固有名詞","筆者が本から抜き書きした言葉の出典として登場する詩人である。「世の中に？と！が両方あれば他に何もいらない」という言葉が引かれている。筆者はこれを、日記を発見や実験の場にするという考え方や、問いが人生の方向を決めるという一節と並べてメモしている。","【読書メモ】すべては言葉からはじまる","https://note.com/beefbowl60/n/nd782858dcab4","2026-02-15","文脈"],["人生は、自分が立てた問いの方向にしか進まない。","文","筆者が本から抜き書きしたメモの一つを凝縮したものである。本では、最上位の目標に「時間が経つほどに幸せになる」という抽象度の高い問いを定めることが勧められている。筆者はこうした言葉を、自分の行動の判断基準を言語化する手がかりとして集めている。","【読書メモ】すべては言葉からはじまる","https://note.com/beefbowl60/n/nd782858dcab4","2026-02-15","文脈"],["一人で楽しめる趣味は、人生の安定装置になる。","文","本の抜粋メモとして筆者が書き留めた一節である。同じメモには、本を読むことは生命と財産を守る生存戦略である、タイパやコスパを追いすぎると人生がマニュアル通りの作業になり下がる、といった言葉も並び、筆者が暮らしの基準として響いた言葉を集めている。","【読書メモ】すべては言葉からはじまる","https://note.com/beefbowl60/n/nd782858dcab4","2026-02-15","文脈"],["還付金を時給に換算すると、確定申告はコスパのいい仕事だ。","文","週末に1時間ほど集中して確定申告を終わらせた筆者の感想である。今週中に絶対終わらせたかったタスクをこなせて肩の荷が降りたと述べ、戻ってくる還付金の額を作業時間で割って時給に換算すると、かなりコスパのいい働きだったと振り返っている。","日記的なもの｜買ったイヤホンなど","https://note.com/beefbowl60/n/nd956c9b3db30","2026-02-23","文脈"],["つげ義春のいるところ展","固有名詞","調布市文化会館たづくりで開かれ、筆者が訪れた展示である。約3年前にも同じ会場で「つげ義春展」があった馴染みの場所で、平日でも混んでいた。最後の部屋の各界著名人による「つげ義春との出会い」を読んで泣きそうになり、しばらく放心したという。","日記的なもの｜買ったイヤホンなど","https://note.com/beefbowl60/n/nd956c9b3db30","2026-02-23","文脈"],["調布世界圏","概念","つげ義春が調布を舞台に描いた作品群を、筆者が愛着を込めて呼んだ言葉である。調布周辺の生活モノから『無能の人』へ繋がっていく世界への憧憬は、何十年経っても褪せていないと述べる。今も調布に住むと言われる伝説の漫画家に、長生きしてほしいと願っている。","日記的なもの｜買ったイヤホンなど","https://note.com/beefbowl60/n/nd956c9b3db30","2026-02-23","文脈"],["若い頃に心をつかまれた作品への感性は、何十年経っても変わらない。","文","つげ義春の展示を見て放心した筆者は、昼ご飯を我慢して全集を買い、読んでいた日々を思い出した。今はランチに困っていないが、あの頃と感性は不思議なほど変わらないと述べ、自分を捉えて離さない何かがつげ作品にはあると書いている。","日記的なもの｜買ったイヤホンなど","https://note.com/beefbowl60/n/nd956c9b3db30","2026-02-23","文脈"],["CMF Buds 2","固有名詞","筆者がサブのイヤホンとして購入したNothing社の製品である。ケースの部品まで鮮やかなオレンジで統一され、美しく見つけやすい。音質はふつうで、ノイズキャンセリングはAirPods Pro3を10とすると2〜3程度と価格差を感じたが、割り切ったサブ機として満足している。","日記的なもの｜買ったイヤホンなど","https://note.com/beefbowl60/n/nd956c9b3db30","2026-02-23","文脈"],["Thino","固有名詞","筆者がObsidianで多用しているプラグインである。昔のツイッターのように一言コメントを時系列で残せる。忙しすぎて昨日のことも覚えていないため、記憶を留めようとログを取りまくっており、後から振り返って次の行動を考える時間が有意義で楽しいと述べている。","日記的なもの｜買ったイヤホンなど","https://note.com/beefbowl60/n/nd956c9b3db30","2026-02-23","文脈"],["ホテルという閉空間","概念","海外出張中の筆者が、平日の朝晩や休日を過ごした場所をこう表した。そこでどのようにコンディションを維持していたかを備忘録としてまとめ、洗濯、ジムでのウォーキング、ストレッチ、語学、動画、ジャーナリング、お香、音楽などのルーティンを記録している。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["筋トレは、あえて負荷を小さくして始めると習慣になる。","文","出張中、筆者はジムでの運動とは別に部屋で軽いストレッチと筋トレを行っていた。習慣化するために負荷をあえてかなり少なめにし、1セット10回程度から始めたという。これは帰国後も続けていきたい習慣になったと述べている。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["Duolingo","固有名詞","筆者が続けている語学学習アプリである。連続学習記録を伸ばすため、出張中も毎朝朝食後に15分ほど英語と中国語に取り組んだ。出張の後半には、現地語が少しずつ「音」として分解され、理解できる感覚が芽生えてきたという手応えを記している。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["その日のうちに書いたログほど、見返す価値が高くなる。","文","出張中、筆者はObsidianで日記に近いログを毎日残していた。その日のうちに記録することで事象や感情を細かく拾い上げられ、記録を見返す価値がかなり高まったと感じている。Thinoで残した時系列のメモも使い、出張中に何度も振り返りを行った。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["NotebookLM","固有名詞","出張から帰国した筆者が、ログの活用に使ったツールである。出張中にObsidianで書き溜めた2週間分のデイリーノート（mdファイル）を読み込ませて分析させているという。日々の記録を後からAIに読ませて振り返る使い方として紹介している。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["いつもの部屋の香り","概念","出張先のホテルで、筆者が無印良品で買った香を少量焚いていた理由である。いつもの自分の部屋の香りを楽しむこと、また少量の煙を吸うことで、気持ちがリセットできた気がすると述べ、異国の閉空間で自分の日常を再現する工夫として記している。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["LOVEBEAT","固有名詞","出張中、筆者が持ち込んだ小型Bluetoothスピーカーで部屋に流していたアルバムの一枚である。よく聴いていた2枚のうち、特にこのアルバムは掛けていると部屋が整う感じがしたという。ホテルの部屋を自分の空間にするための音として挙げている。","出張〜ホテルでの過ごし方","https://note.com/beefbowl60/n/n960374b825f0","2026-03-15","文脈"],["iPhone 17 Pro","固有名詞","筆者が購入したスマートフォンで、シルバーの512GBである。旧スマホの容量不足から512GBを選んだ。仕事の都合で開封が遅れた。使い心地はアプリの起動が少し速くなった程度で大きな変化はないと感じ、カメラコントロールボタンなどの活用法を検討中である。","iPhone 17 Proを買いました","https://note.com/beefbowl60/n/n52a4c5803d84","2026-03-16","文脈"],["届いた機械は、初期不良を考えてすぐに開封すべきだ。","文","iPhone 17 Proは先月には届いていたが、筆者は仕事の関係で開封が遅くなってしまった。初期不良の可能性もあるので、こういうのはあまり良くないと反省している。新しい機械を手にしたらまず早めに確認するべきだという自戒として書き留めている。","iPhone 17 Proを買いました","https://note.com/beefbowl60/n/n52a4c5803d84","2026-03-16","文脈"],["テックウーヴンケース","固有名詞","筆者がiPhone 17 Proと合わせて買った、ブラックのMagSafe対応ケースである。全体をモノトーンな感じにしたくて選んだ。ザラザラした手触りで、少し劣化しそうなテクスチャなので、慎重に扱っていると述べている。","iPhone 17 Proを買いました","https://note.com/beefbowl60/n/n52a4c5803d84","2026-03-16","文脈"],["機種変更の移行作業","概念","新しいiPhoneへの移行で筆者が行った一連の作業である。物理SIMからeSIMへの変更に1時間ほど、データ移行はスムーズだったが、Apple Watch内のSuicaの移行に手間取り、各アプリへのログインも含めて合計3時間ほど掛かったと振り返っている。","iPhone 17 Proを買いました","https://note.com/beefbowl60/n/n52a4c5803d84","2026-03-16","文脈"],["iPhoneのアクションボタン","固有名詞","使い始めたiPhone 17 Proで、音量ボタンの上にある任意の機能を割り当てられるボタンである。筆者はメモ系と相性が良いと考え、まずObsidianの起動に割り当てた。さらに自作の音声メモ用ショートカットを紐付け、ロック状態から一発で記録できるようにした。","iPhoneのアクションボタンからobsidianに音声メモを取る","https://note.com/beefbowl60/n/n9d2e93c331a5","2026-03-17","文脈"],["Obsidian","固有名詞","筆者が最近はまっているメモアプリである。アクションボタンから音声入力した内容をテキスト化し、デイリーノートの末尾に時刻付きで追記する仕組みを作った。実現にはコミュニティプラグイン「advanced-uri」が必要で、「Thino」との併用も勧めている。","iPhoneのアクションボタンからobsidianに音声メモを取る","https://note.com/beefbowl60/n/n9d2e93c331a5","2026-03-17","文脈"],["暦本純一","固有名詞","アクションボタンの使い道を考えていた筆者が思い出したポストの主である。アイデアを得る秘訣を問われ、長押し一発で音声メモを取る設定を明かすと、その場の皆が設定を始めたという話だった。これをきっかけに筆者は音声メモの仕組みづくりに取りかかった。","iPhoneのアクションボタンからobsidianに音声メモを取る","https://note.com/beefbowl60/n/n9d2e93c331a5","2026-03-17","文脈"],["音声入力メモ","概念","「時代は音声入力」と考えた筆者が作ったメモの取り方である。ボタンを押して話し、停止するとテキストに変換され、Obsidianのデイリーノートに追記される。メモライフが一段アップグレードしたと感じる一方、文字化の精度はまだ微妙で今後の課題としている。","iPhoneのアクションボタンからobsidianに音声メモを取る","https://note.com/beefbowl60/n/n9d2e93c331a5","2026-03-17","文脈"],["アイデアは一撃で記録できる仕組みがあってこそ拾える。","文","暦本純一氏がアイデアを得る秘訣として、アクションボタン長押しで音声メモを取る設定を挙げたポストを筆者は目にした。ロック状態からでも一発起動できる手軽さに注目し、自分のiPhoneにも同じような音声メモの導線を作ることにした。","iPhoneのアクションボタンからobsidianに音声メモを取る","https://note.com/beefbowl60/n/n9d2e93c331a5","2026-03-17","文脈"],["欲しい自動化はAIに尋ねながら作れば15分で形になる。","文","音声メモのショートカットを作る際、筆者は詳細をGeminiに丸投げして尋ねながら悪戦苦闘した。15分ほどで意図どおりの動作が完成し、まさにこういうのが欲しかったというものができたと述べている。記事末尾には作り方の詳細手順も載せている。","iPhoneのアクションボタンからobsidianに音声メモを取る","https://note.com/beefbowl60/n/n9d2e93c331a5","2026-03-17","文脈"],["RIMOWA","固有名詞","筆者が使っている黒いスーツケースのブランドである。目印が少なく、空港でのピックアップのたびに微妙な不安がつきまとっていた。中国出張を機にカラーのキャスターカバーを付けたところ、がっつり目立つようになり、荷物探しのストレスが大幅に減ったと述べている。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["CMF by Nothing Phone 1","固有名詞","中国出張で筆者が「出張用」と位置づけたサブのスマホである。アリペイやDeepSeekなど現地で要るアプリを入れ、現地での写真撮影もこちらで行った。メインのiPhoneとの2台体制でプライベートと仕事の情報を分離でき、この運用は上手くいったと振り返っている。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["情報インフラ","概念","筆者が海外出張の快適さの土台として最初に挙げたものである。無制限のレンタルWiFiをホテルや職場で使い、別に現地の物理SIMを2台のスマホに挿した。SIMのおかげで重いWiFi本体を持ち歩かずに済み、まず情報インフラを整えることが大事だとまとめている。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["イヤフォンは場面ごとに使い分けるなら3台あっても多くない。","文","筆者は出張にイヤフォンを3台持参し、3つも要るのかと自問しつつ要ると答えた。機内はノイズキャンセリング性能でAirPods Pro3、ジムでは耳を圧迫しないCMF Buds2、朝食時は咀嚼音が気にならないイヤカフ型と、状況で使い分けていた。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["3Cマーク","概念","中国の空港でモバイルバッテリーが没収されるかどうかに関わる表示として筆者が気にしたものである。この表示がないものや表記が不明瞭なものは没収されるリスクがあるため、大容量のものは避けてシンプルなUGREEN製を選んだ。結果的に使う場面は少なかったという。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["Huawei Band 8","固有名詞","出張中に筆者が歩数計として使ったスマートバンドである。Apple Watchは使い道がほぼなく毎日の充電も面倒だとして、こちらを選んだ。軽量で、1回の充電で1週間くらいもつところが旅行向きだと評価している。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["Omikamoキーボード","固有名詞","筆者が出張に持参した折り畳み式のキーボードである。このおかげで毎日のログを記入できたといっても過言ではないとし、「ジャーナリング生活の礎」と呼んでいる。一方で、iPhoneの漢字変換のルールがMacと違うことへの戸惑いはまだ残っていると述べている。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["五感を気持ちよく刺激する持ち物","概念","筆者が「QOL系」としてまとめた持ち物の考え方である。部屋でいつもの香りのお香を半分に割って少しずつ焚き、Bluetoothスピーカーで音楽を流して気分をリフレッシュした。香りや音楽で五感を満たすことが、ホテル暮らしを快適にする要素の一つだと実感している。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["砂原良徳「LOVEBEAT」","固有名詞","出張先のホテルの部屋で、筆者が持参したBluetoothスピーカーでばかり聴いていたアルバムである。スピーカーは部屋で音楽を聴くための道具として「あると便利」と評している。香りと並んで音楽が滞在中の気分を整える役割を担っていた。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["失うと痛手の大きい物は旅にあえて持ち出さない。","文","筆者は「持っていかなかったもの」として5年連用日記を挙げ、無くしたり汚したりしたときのダメージが大きいことを理由にした。日々の記録は折り畳みキーボードとスマホで続けており、替えのきかない物は家に置いておく判断をしている。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["海外出張の快適さは、出発前の準備でほぼ決まる。","文","2週間の中国出張を大きなストレスなくホテル暮らしで過ごせた筆者は、海外出張は準備が99%だと結論づけた。情報インフラを整え、香りや音楽で五感を刺激し、飲食を管理すれば快適に過ごせる確率が大いに上がると実感している。","海外出張に持っていって良かったもの","https://note.com/beefbowl60/n/n4096ae260a16","2026-03-19","文脈"],["ノート術という趣味","概念","本来は目的に到達する手段であるはずのノート術が目的化し、知ったり試したりすること自体が楽しい世界を指す筆者の言葉である。筆者は自分もその「趣味の人」だと認め、ツールや手法を入れ替えるたびに思考がわずかに更新される過程こそが醍醐味だとしている。","ノート術の本を読むこと自体が趣味 | SECOND BRAIN（セカンドブレイン）時間に追われない「知的生産術」","https://note.com/beefbowl60/n/ne9cd6440f222","2026-03-21","文脈"],["歳を重ねると目標が曖昧になり、手段だけが残っていく。","文","筆者はかつて明確な目標のためにノートを活用して悪戦苦闘していたと振り返る。しかし歳とともに目標自体が曖昧になり、手段だけが形骸化している面があるのかもしれないと認めている。それでも楽しめているのだから良いと、肯定的に受け止めている。","ノート術の本を読むこと自体が趣味 | SECOND BRAIN（セカンドブレイン）時間に追われない「知的生産術」","https://note.com/beefbowl60/n/ne9cd6440f222","2026-03-21","文脈"],["ティアゴ・フォーテ『SECOND BRAIN』","固有名詞","ノート術の本を読むこと自体が趣味だという筆者が、この日に読んだ一冊である。副題は「時間に追われない『知的生産術』」。中身はざっくり言えば情報の収集・整理・要約・活用だけだと評しつつも、細部から何かしら学びを得るのが趣味の人だとしている。","ノート術の本を読むこと自体が趣味 | SECOND BRAIN（セカンドブレイン）時間に追われない「知的生産術」","https://note.com/beefbowl60/n/ne9cd6440f222","2026-03-21","文脈"],["CODEメソッド","概念","『SECOND BRAIN』で提唱される方法で、情報を収集し（Capture）、分類整理し（Organize）、要約し（Distill）、活用する（Express）という流れを指す。筆者は難しい概念として打ち出されているが、要するにそれだけの内容だとやや冷めた目で要約している。","ノート術の本を読むこと自体が趣味 | SECOND BRAIN（セカンドブレイン）時間に追われない「知的生産術」","https://note.com/beefbowl60/n/ne9cd6440f222","2026-03-21","文脈"],["PARAルール","概念","『SECOND BRAIN』で提案されるノートのフォルダ分類で、Project、Area、Resource、Archiveの4つに分ける。筆者はフォルダ分けという永遠のテーマに示された一つの暫定解と受け止め、早速自分のデジタルノートに取り入れた。上手くいくかは分からないとしている。","ノート術の本を読むこと自体が趣味 | SECOND BRAIN（セカンドブレイン）時間に追われない「知的生産術」","https://note.com/beefbowl60/n/ne9cd6440f222","2026-03-21","文脈"],["ツールや手法を替えるたびに、思考は少しだけ更新される。","文","『SECOND BRAIN』のPARAルールを自分のデジタルノートに取り入れた筆者は、上手くいくかは分からないと留保しつつ、道具や方法を入れ替えること自体に価値を見いだした。その小さな更新の過程こそが、ノート術という趣味の醍醐味だと締めくくっている。","ノート術の本を読むこと自体が趣味 | SECOND BRAIN（セカンドブレイン）時間に追われない「知的生産術」","https://note.com/beefbowl60/n/ne9cd6440f222","2026-03-21","文脈"],["テート美術館 ― YBA & BEYOND 世界を変えた90s英国アート","固有名詞","知人に誘われて筆者が国立新美術館で観た展覧会である。UK方面には全然詳しくなかったが、藤原ヒロシ氏の著作で90年代UKカルチャーに興味が湧いていたことと、細野晴臣が音声ガイドを担当していることに引っ掛かり、足を運んだ。","六本木で細野晴臣の未発表曲を聴く","https://note.com/beefbowl60/n/ned4e9614ff61","2026-03-21","文脈"],["詳しくない分野でも、小さな引っ掛かりが足を運ぶ理由になる。","文","英国美術の展覧会に誘われた筆者は、UKには詳しくないまま二つ返事で応じた。最近読んだ本で90年代UKカルチャーに少し興味が湧いていたことと、好きな音楽家が音声ガイドを務めているという接点が、行ってみようと思わせる後押しになった。","六本木で細野晴臣の未発表曲を聴く","https://note.com/beefbowl60/n/ned4e9614ff61","2026-03-21","文脈"],["細野晴臣「Anemo Wheel」","固有名詞","展覧会の音声ガイドの冒頭で聴けた、細野晴臣が80年代後半に制作した未発表曲である。筆者は「モナド/ノンスタンダード」期の作品に入っていても違和感のないサウンドと評し、映画『ぼくの伯父さん』のテーマ曲を思わせる軽快でユーモラスなメロディに注目した。","六本木で細野晴臣の未発表曲を聴く","https://note.com/beefbowl60/n/ned4e9614ff61","2026-03-21","文脈"],["音声ガイドの2周目","概念","展覧会の音声ガイドは会場を出た後も聞けるため、筆者は「復習」として2周目という選択肢があると指摘した。ガイドを聞きながら鑑賞すると不思議と分かったような気になるとも述べ、詳しくない分野の展示を楽しむ手がかりとして音声ガイドを評価している。","六本木で細野晴臣の未発表曲を聴く","https://note.com/beefbowl60/n/ned4e9614ff61","2026-03-21","文脈"],["ジュリアン・オピー","固有名詞","英国美術の展覧会で、筆者が自分へのおみやげとしてトートバッグを買った作家である。バッグには作家のイラストらしきものがプリントされていた。展示では写真では伝わらない自転車の作品が一番良かったとしつつ、記念にこのバッグを選んでいる。","六本木で細野晴臣の未発表曲を聴く","https://note.com/beefbowl60/n/ned4e9614ff61","2026-03-21","文脈"],["Apple Watchのアクティビティ","固有名詞","所定の運動をすると3つのリングが完成する、Apple Watchの機能である。筆者はかつてこの数値を気にして運動に励んでいたが、最近はリングが完成しない日が続き、目に入ってもスルーするようになっていた。機能の意味がなくなったと感じ、目標値を見直した。","アクティビティゴールの目標を下げる","https://note.com/beefbowl60/n/ne9c94ddb5266","2026-03-22","文脈"],["達成できない目標は、やがて目に入っても素通りされる。","文","Apple Watchのアクティビティのリングが完成しない日が続いた結果、筆者は表示を見てもスルーするようになったと振り返る。数値を気にして運動していた頃とは違い、届かない目標が続くことで、せっかくの機能が意味をなさなくなっていたことに気づいた。","アクティビティゴールの目標を下げる","https://note.com/beefbowl60/n/ne9c94ddb5266","2026-03-22","文脈"],["モチベーションの再定義","概念","筆者がアクティビティの1日の目標を変えた狙いである。以前の設定値から40〜50%ほど減らし、普通に生活していれば達成できそうな水準まで下げた。目標を低くし、小さな成功を積み重ねることで習慣化できるかを試しており、経過は後日報告するとしている。","アクティビティゴールの目標を下げる","https://note.com/beefbowl60/n/ne9c94ddb5266","2026-03-22","文脈"],["ポジティブフィードバックサイクル","概念","目標を下げた筆者が回りだすことを期待している循環である。少し運動すればリングが完成し、それが嬉しくてやる気が上がり、また動くという流れを想定している。このやり方で習慣化ルーティンが上手くいくかは、まだ分からないと結論を保留している。","アクティビティゴールの目標を下げる","https://note.com/beefbowl60/n/ne9c94ddb5266","2026-03-22","文脈"],["必要な機能を詰め込むと、見た目の美しさは犠牲になりがちだ。","文","目標変更のついでに、筆者は久しぶりにApple Watchの文字盤をカスタマイズした。カラーもレイアウトもゴチャついていてあまり美しくないと認めつつ、必要な機能を並べるとこうなったと述べ、見た目より実用を優先した結果として受け入れている。","アクティビティゴールの目標を下げる","https://note.com/beefbowl60/n/ne9c94ddb5266","2026-03-22","文脈"],["つげ義春","固有名詞","3月27日の夕方、筆者はこの漫画家の訃報に接した。高校で出会って以来ハマり、全集を揃え、近年も読み直してきた。『ねじ式』ばかりが取り上げられがちだが、中期の紀行ものや後期の自伝的作品にも名作が多いとし、これからも読み継がれることを願っている。","さよなら、つげ義春さん｜哀悼","https://note.com/beefbowl60/n/n5764cff3ddc6","2026-03-27","文脈"],["同じ時代にどこかで暮らしている、それだけで支えになる人がいる。","文","つげ義春の訃報に接した筆者は、この数年こうした日が来る覚悟はしていたと記す。近年の展覧会などで、この人は今も調布のどこかで生活しているのだと思うたびに、それが心の支えになっていたことも確かだったと振り返っている。","さよなら、つげ義春さん｜哀悼","https://note.com/beefbowl60/n/n5764cff3ddc6","2026-03-27","文脈"],["はっぴいえんど「ゆでめん」","固有名詞","はっぴいえんどのファーストアルバムの通称である。筆者はその裏ジャケットに「つげ義春」の名を見つけたのが、この漫画家を知った最初だったと記憶している。音楽から漫画へと関心がつながり、のちに作品へのめり込んでいくきっかけになった。","さよなら、つげ義春さん｜哀悼","https://note.com/beefbowl60/n/n5764cff3ddc6","2026-03-27","文脈"],["『無能の人』","固有名詞","筆者が高校の図書館で出会い、衝撃を受けたつげ義春の代表作の一つである。これを入口に、大学時代にはなけなしのお金で全集を揃えるほどハマっていった。筆者にとってつげ作品へ深く入っていく転機となった一冊として挙げられている。","さよなら、つげ義春さん｜哀悼","https://note.com/beefbowl60/n/n5764cff3ddc6","2026-03-27","文脈"],["古くならない作品は、いつ読んでも同じ感覚を呼び覚ます。","文","筆者は昨年、比較的新しい全集シリーズ『大全』でつげ義春の作品を最初から読み直した。学生時代から何度も読んできたにもかかわらず、いつ読んでも同じ感覚が呼び覚まされると述べ、新鮮で古くならない不思議な作品たちだと評している。","さよなら、つげ義春さん｜哀悼","https://note.com/beefbowl60/n/n5764cff3ddc6","2026-03-27","文脈"],["新宿ピットイン","固有名詞","筆者が今年初めてのライブに選んだ、ジャズの老舗ライブハウスである。木曜の夜に「つぼぐち祭りⅢ」の2日目を観に行った。静寂の中からその場で音楽が生み出される空間で、筆者はこれからもっと自由に生きたいという思いを強く抱いた。","自由に生きたい｜新宿ピットイン","https://note.com/beefbowl60/n/n09ee3aa1afe7","2026-03-28","文脈"],["Ortance（オルタンス）","固有名詞","坪口昌恭、西田修大、大井一彌による、筆者が新宿ピットインで観たバンドである。観るのは2回目だった。ドラム、シンセベース、ギターが生み出す複雑なリズムと、その「間」から生じる重層的なグルーヴを、筆者は官能的だったと評している。","自由に生きたい｜新宿ピットイン","https://note.com/beefbowl60/n/n09ee3aa1afe7","2026-03-28","文脈"],["大井一彌","固有名詞","Ortanceのドラマーで、筆者によれば近年のYMOトリビュートバンドのメンバーでもある。タイトでソリッドなドラミングはテクノっぽくもあり、そこにピアノとギターノイズが重なると、中期YMOのような退廃感を感じる場面もあったと筆者は述べている。","自由に生きたい｜新宿ピットイン","https://note.com/beefbowl60/n/n09ee3aa1afe7","2026-03-28","文脈"],["「間」から生じるグルーヴ","概念","Ortanceのライブで筆者が最も惹かれた音の感触である。ドラム、シンセベース、ギターの複雑なリズムの隙間から、重層的なグルーヴが立ち上がってくると捉えた。筆者はそれを官能的と表現し、音の鳴っていない部分が演奏を形づくっていると感じている。","自由に生きたい｜新宿ピットイン","https://note.com/beefbowl60/n/n09ee3aa1afe7","2026-03-28","文脈"],["その場で生まれる音楽は、自由に生きたい気持ちを呼び起こす。","文","新宿ピットインで静寂の中から即興的に生まれる演奏を聴いた筆者は、なぜか「これからもっと自由に生きたい」と強く感じた。とりあえず、また楽器を始めるか、楽理を習うかしてみたいと、具体的な一歩を思い描いて記事を締めくくっている。","自由に生きたい｜新宿ピットイン","https://note.com/beefbowl60/n/n09ee3aa1afe7","2026-03-28","文脈"],["pha『書きたいことがない人のための日記入門』","固有名詞","筆者が読んだ、日記とその書き方についての本である。論理立ったハウツー本というよりエッセイに近いと評し、noteで日記を書く人にはヒントが多く楽しめるとした。普通の話が他人には面白い、テーマを絞ると面白くなる、といった点が心に残ったという。","日記が書きたくなる本〜「書きたいことがない人のための日記入門」","https://note.com/beefbowl60/n/nf38357804679","2026-03-29","文脈"],["日記はエッセイと違って、オチがなくてもかまわない。","文","phaの日記入門を読んだ筆者が、心に残ったポイントの筆頭に挙げた考えである。本の感想を書く読書日記ならまとまっていなくても許されることや、少し時間が経ってから思い出して書くやり方とあわせて、日記を気負わず書くためのヒントとして要約している。","日記が書きたくなる本〜「書きたいことがない人のための日記入門」","https://note.com/beefbowl60/n/nf38357804679","2026-03-29","文脈"],["日記の3媒体","概念","筆者が日記を付けている3つの場を指す。公開するnote、デジタルのメモアプリ（Obsidian）、アナログのほぼ日5年手帳である。noteはよそ行き、メモアプリは思いついたことの細かいメモの集合と、同じ日記でも媒体ごとに性格が違うことを整理している。","日記が書きたくなる本〜「書きたいことがない人のための日記入門」","https://note.com/beefbowl60/n/nf38357804679","2026-03-29","文脈"],["死後に読まれると思うと、日記はあっさりしたものになる。","文","筆者の3つの日記のうち、最も本来の意味での日記らしいのはほぼ日5年手帳だという。ところが、なぜか内容はいつもわりとあっさりしている。筆者はその理由を、死後に誰かに読まれることを前提にしているからかもしれないと推測している。","日記が書きたくなる本〜「書きたいことがない人のための日記入門」","https://note.com/beefbowl60/n/nf38357804679","2026-03-29","文脈"],["読み手の意識し具合","概念","日記を書くうえで筆者が難しいと感じているバランスである。noteでは読み手をある程度意識しており、手帳でも死後の読者を想定してしまう。どの程度まで他人の目を意識して書くかの加減は、答えの出ていない課題として記事の最後に残されている。","日記が書きたくなる本〜「書きたいことがない人のための日記入門」","https://note.com/beefbowl60/n/nf38357804679","2026-03-29","文脈"],["Pedometer++","固有名詞","筆者が歩数管理のために入れた無料アプリである。Apple Watchでも歩数は計測できるが、歩数をメインに管理してくれない感じがあったため導入した。Apple Watch上でもすぐに歩数を確認できるようになり、毎日の記録に使っている。","毎日のウォーキング歩数の記録","https://note.com/beefbowl60/n/n9469dfe1519b","2026-04-07","文脈"],["歩数のKPI","概念","筆者が毎日のウォーキングに設けている指標である。最低5000歩以上、目標8000歩以上と二段構えで設定し、それを基準に歩いている。今週はいい感じで目標をクリアできていたと報告しており、ルーティン化の手応えを得ている。","毎日のウォーキング歩数の記録","https://note.com/beefbowl60/n/n9469dfe1519b","2026-04-07","文脈"],["日常との差分は、決まった行動で埋めれば届く。","文","筆者の日常生活の歩数は6000歩くらいで、目標の8000歩には2000歩ほど足りない。そこで残りはジムに行って20分ほど歩いて補うことにした。目標と普段の暮らしの差を具体的な習慣に置き換え、毎日の達成につなげている。","毎日のウォーキング歩数の記録","https://note.com/beefbowl60/n/n9469dfe1519b","2026-04-07","文脈"],["毎日の数値をそろえていくことは、それ自体が気持ちいい。","文","歩数の目標を今週はいい感じでクリアできていた筆者は、ルーティン化して毎日の歩数を「揃えていく」のは気持ちいい作業だと述べる。健康のためという目的だけでなく、記録が並んでいく過程そのものに楽しさを見いだしている。","毎日のウォーキング歩数の記録","https://note.com/beefbowl60/n/n9469dfe1519b","2026-04-07","文脈"],["アクティビティリング","固有名詞","運動によって3種類のリング状の指標を完成させる、Apple Watchの機能である。筆者は以前、目標値を高く設定していたためほとんど完成せず、リングの存在自体を無視して暮らしていた。結構なメインの機能なのにと感じ、目標値を見直すことにした。","アクティビティリングの目標値を下げたら生活が変化した","https://note.com/beefbowl60/n/nbf01cc639e33","2026-04-09","文脈"],["学習性無力感","概念","アクティビティリングがほとんど完成しなかった頃の自分の状態を、筆者が言い表した言葉である。目標値が高すぎて達成できない日が続くうち、リングの存在そのものを無視して暮らすようになっていた。この状態を抜け出すために、目標を大きく下げる改善策をとった。","アクティビティリングの目標値を下げたら生活が変化した","https://note.com/beefbowl60/n/nbf01cc639e33","2026-04-09","文脈"],["日常生活プラスαのゴール","概念","筆者が見直したアクティビティリングの目標設定の考え方である。ムーブ220kcal、エクササイズ20分、スタンド6時間とぐっと下げた。すると毎日リングを完成できるようになり、休日でもこれくらいなら動こうと思えるようになったと述べている。","アクティビティリングの目標値を下げたら生活が変化した","https://note.com/beefbowl60/n/nbf01cc639e33","2026-04-09","文脈"],["並んだ達成の印を眺める喜びが、生活そのものを楽しくする。","文","目標値を下げた結果、筆者のアクティビティリングは毎日完成するようになった。変更前後の画面を見比べながら、並ぶリングの気持ちよさと達成感を味わい、結果的に生活が楽しくなったと振り返っている。小さな達成の積み重ねが日々の張り合いになった。","アクティビティリングの目標値を下げたら生活が変化した","https://note.com/beefbowl60/n/nbf01cc639e33","2026-04-09","文脈"],["目標を最適化すれば、意欲はこちらで調整できる。","文","高すぎる目標でリングを無視していた筆者は、目標値を下げただけで毎日達成できるようになり、生活にも前向きな変化が生まれた。この経験から、意欲は目標の置き方次第で調整できると学び、達成と継続ができるゴール設定が大事だとまとめている。","アクティビティリングの目標値を下げたら生活が変化した","https://note.com/beefbowl60/n/nbf01cc639e33","2026-04-09","文脈"],["日々のKPI","概念","本来は業績評価の指標であるKPIを、筆者は健康とボディメイクのための1日の達成目標として日常に持ち込んだ。水・睡眠・歩数の3項目を数値で決め、それを管理する道具としてハビットトラッカーを探し始めるという流れで記事が展開する。","日々のKPIとハビットトラッカー","https://note.com/beefbowl60/n/n7360e26eca26","2026-04-11","文脈"],["毎日の目標は、これだけはという3つに絞る。","文","筆者はストレッチや筋トレ、お菓子を控えることなど習慣化したいことを他にも抱えていたが、あえて毎日必ず守るものだけを選び、水3リットル、睡眠7時間、8000歩の3つに定めた。始めて1週間ほどの取り組みとして、シンプルさを優先している。","日々のKPIとハビットトラッカー","https://note.com/beefbowl60/n/n7360e26eca26","2026-04-11","文脈"],["Streaks","固有名詞","日々のKPIを管理するために筆者が1000円で購入したハビットトラッカーアプリである。インタフェースはきれいで良いと認めつつ、しばらく使っても不思議とテンションが上がらず、紙ノートへの転向を検討するきっかけになった。","日々のKPIとハビットトラッカー","https://note.com/beefbowl60/n/n7360e26eca26","2026-04-11","文脈"],["ハビットトラッカー","概念","習慣の達成を記録していく道具である。筆者はアプリを探して試したうえで、頭の中にある理想のハビットトラッカーを画像で示し、自分に合う形を模索している。管理の道具選びそのものが、習慣化の取り組みの一部になっている。","日々のKPIとハビットトラッカー","https://note.com/beefbowl60/n/n7360e26eca26","2026-04-11","文脈"],["習慣の記録は、熱量が見えてこそ面白くなる。","文","アプリのStreaksを使ってみた筆者は、きれいなUIなのに気分が上がらないことに気づいた。ハビットトラッカーは習慣化への熱量が結果的に可視化されていくことで面白くなるものだと考え、紙ノートのほうが向いているのではないかとアナログへの転向を検討している。","日々のKPIとハビットトラッカー","https://note.com/beefbowl60/n/n7360e26eca26","2026-04-11","文脈"],["気分より先に、決めたKPIが身体を動かしてくれる。","文","朝からモヤモヤ、イライラして何事にもやる気が出ない日曜日の前半、筆者を動かしたのは毎日8000歩という健康管理のKPIだった。気分が乗らなくても設定済みの目標に従ってジムへ向かったことが、結果的にメンタルを整えるきっかけになっている。","【三行日記】運動脳的なこと","https://note.com/beefbowl60/n/nd30139ec1030","2026-05-03","文脈"],["やる気が出ない日でも、歩けば気持ちは前を向く。","文","筆者はジムのトレッドミルで50分ほど歩いたところ、不思議とメンタルが整ってきた。家に帰ったらあれをやろう、明日はどうしようと気持ちが急激に前向きになり、それまでのやる気のなさが嘘のように変わった体験を三行日記として記している。","【三行日記】運動脳的なこと","https://note.com/beefbowl60/n/nd30139ec1030","2026-05-03","文脈"],["運動脳","固有名詞","筆者が記事で紹介した書籍である。やる気の出ない日曜日にトレッドミルで歩いたら気持ちが急に前向きになった体験を、筆者はこの本のいう「運動脳」的なことではないかと結びつけ、運動と脳の関係を実感した一日として振り返っている。","【三行日記】運動脳的なこと","https://note.com/beefbowl60/n/nd30139ec1030","2026-05-03","文脈"],["自動化された義務","概念","筆者が習慣化を言い換えた表現である。運動が脳に良いことは今や自明にも思えるので、ポイントはそれをいかに習慣化するかだと考えた。やる気のない日でも歩けたのはKPIとして決めていたからであり、義務が自動で回る状態を目指している。","【三行日記】運動脳的なこと","https://note.com/beefbowl60/n/nd30139ec1030","2026-05-03","文脈"],["Perlegear","固有名詞","筆者が選んだキャスター付きテレビスタンドのメーカーである。Amazonには同種製品が多く、レビューも一長一短で迷ったが、以前から使っていた移動できない型のスタンドと同じメーカーを選んだ。普通に組み立てて設置でき、品質的な問題はなかったと述べている。","最近買って微妙に良かったもの | TVのキャスタースタンド","https://note.com/beefbowl60/n/na436db0bdc3b","2026-05-04","文脈"],["勝間家電","固有名詞","筆者が少し前に読んだ本で、キャスター付きの「移動できるテレビスタンド」が勧められていた。テレビまわりの環境改善に取り組むなかで、この本の推薦をきっかけにスタンドを導入しており、実際に使ってみて軽くスムーズに動くことを確かめている。","最近買って微妙に良かったもの | TVのキャスタースタンド","https://note.com/beefbowl60/n/na436db0bdc3b","2026-05-04","文脈"],["テレビが動かせると、大型家電の置き方の常識が変わる。","文","移動式スタンドを使ってみた筆者は、鑑賞地点の椅子やソファに少し近づけるだけでだいぶ見やすくなると感じた。使わない時は部屋の隅にしまうこともできるため、テレビという大型家電の配置に関する概念そのものが変わったと述べている。","最近買って微妙に良かったもの | TVのキャスタースタンド","https://note.com/beefbowl60/n/na436db0bdc3b","2026-05-04","文脈"],["Bose TV Speaker","固有名詞","筆者がテレビスタンドに合わせて設置したサウンドバー型スピーカーである。スタンドから飛び出すと格好悪いとして幅60cmのミニマムなタイプを選んだ。サウンドバー懐疑派だったが、音声がよく聞こえるようになり、もっと早く買えばよかったと感じている。","最近買って微妙に良かったもの | TVのキャスタースタンド","https://note.com/beefbowl60/n/na436db0bdc3b","2026-05-04","文脈"],["絶妙なアップグレード","概念","サウンドバー導入の効果を筆者が表した言葉である。差分としては小さなストレスがなくなり音が1〜2ランク良くなった程度にすぎないが、以前の状態には戻りたくないと思わせる。劇的ではないが後戻りできない改善として、微妙に良かった買い物を評価している。","最近買って微妙に良かったもの | TVのキャスタースタンド","https://note.com/beefbowl60/n/na436db0bdc3b","2026-05-04","文脈"],["機器が整うと、使い方そのものが変わっていく。","文","もともとテレビ放送はそれほど見なかった筆者だが、移動式スタンドとサウンドバーを導入したことで、YouTubeなどを大きめの画面で流しっぱなしにすることが増えた。機器の改善が視聴習慣そのものを変えたことを、記事の締めくくりに記している。","最近買って微妙に良かったもの | TVのキャスタースタンド","https://note.com/beefbowl60/n/na436db0bdc3b","2026-05-04","文脈"],["「写真」Sha Shin Magazine","固有名詞","筆者が購入して読んだ文芸系の写真雑誌で、vol.8を手にしている。ほぼ全編カラーで、現在活躍する写真家の作品ページに加えて解説やエッセイが豊富に収められている。写真界の外にいる筆者には初めて知ることばかりで、大いに勉強になったという。","写真への興味 | 写真 Sha Shin Magazine (Vol.8)","https://note.com/beefbowl60/n/n7223bf1c42f3","2026-05-07","文脈"],["個展と写真集","概念","雑誌を通じて筆者が関心を持った、写真家が作品を発表する形である。個展で公開したり写真集を制作したりするとはどういうことなのかが解説されていた。写真界の中にいない筆者にとっては、写真家の活動の裏側を知る初めての機会になった。","写真への興味 | 写真 Sha Shin Magazine (Vol.8)","https://note.com/beefbowl60/n/n7223bf1c42f3","2026-05-07","文脈"],["一枚一枚の写真は、真剣に制作されたものである。","文","雑誌の解説やエッセイを通じて、筆者は写真家が日常で写真とどう向き合っているかを知った。写真界の外にいる身として、作品が一枚ずつ真剣に作られていることは初めて知ることの一つであり、写真への興味を深めるきっかけになったと述べている。","写真への興味 | 写真 Sha Shin Magazine (Vol.8)","https://note.com/beefbowl60/n/n7223bf1c42f3","2026-05-07","文脈"],["東京都写真美術館","固有名詞","写真鑑賞がマイブームになりつつある筆者が、恵比寿で訪れた美術館である。3つの展示を観て合計2600円ほどかかった。今後は定期的に通うつもりなので、年間パスポート（3300円）を買えばよかったと少し後悔している。","恵比寿の東京都写真美術館 | Don't think. Feel.他","https://note.com/beefbowl60/n/n71e699d4c7dd","2026-05-10","文脈"],["Don't think. Feel.","固有名詞","東京都写真美術館のTOPコレクション展である。北井一夫、影山光洋、深瀬昌久、川内倫子、田中長徳、森村泰昌らの作品が特に印象に残り、筆者はこれまで断片的にしか知らなかった自らの無知を恥じるばかりだと振り返っている。","恵比寿の東京都写真美術館 | Don't think. Feel.他","https://note.com/beefbowl60/n/n71e699d4c7dd","2026-05-10","文脈"],["現物写真のアウラ","概念","図版で知っていた名作でも、美術館で現物のプリントを前にすると宿っているアウラが全く別物だったと筆者は感じた。プリントの繊細さに思わず目を見張った体験であり、写真を実物で観ることの価値に気づいた場面として記されている。","恵比寿の東京都写真美術館 | Don't think. Feel.他","https://note.com/beefbowl60/n/n71e699d4c7dd","2026-05-10","文脈"],["W. ユージン・スミス『水俣』","固有名詞","筆者が「W. ユージン・スミスとニューヨーク ロフトの時代」展で深く引き込まれた作品群である。スミスの作品をまとまった形で観たのは初めてで、ただ写真が並んでいるだけなのに語りかけてくるメッセージの強靭さに言葉を失ったと述べている。","恵比寿の東京都写真美術館 | Don't think. Feel.他","https://note.com/beefbowl60/n/n71e699d4c7dd","2026-05-10","文脈"],["フォーカススタッキング","概念","「養老孟司と小檜山賢二の虫展」で、昆虫のマクロ写真を巨大なプリントにする際に使われていた合成技術である。展示では簡単な説明しかなかったため、筆者は具体的にどんな技術や機材で撮影しているのかに興味が湧き、帰宅後に調べてしまった。","恵比寿の東京都写真美術館 | Don't think. Feel.他","https://note.com/beefbowl60/n/n71e699d4c7dd","2026-05-10","文脈"],["AIによる映画レコメンド","概念","筆者は学生時代から鑑賞した映画をスプレッドシートに記録しており、約500本のリストをAIに読ませて都内で今観られるおすすめ作品を提案させた。今年のGWはその出力を参考に鑑賞し、「今観ないと数年待つ」とAIに煽られて最終日に劇場へ行った。","映画に関しての雑記 | 松本俊夫『修羅』『ドグラ・マグラ』","https://note.com/beefbowl60/n/n944d17513fa0","2026-05-13","文脈"],["新・文芸坐","固有名詞","筆者が松本俊夫監督の『修羅』と『ドグラ・マグラ』を2本続けて観た池袋の映画館である。2本目割というシステムを利用して1900円と安く観られた。AIの提案を参考に、上映の最終日に足を運んでいる。","映画に関しての雑記 | 松本俊夫『修羅』『ドグラ・マグラ』","https://note.com/beefbowl60/n/n944d17513fa0","2026-05-13","文脈"],["家で集中できないなら、劇場に足を運べばいい。","文","筆者が劇場で映画を観る一番の理由は、家ではもう2時間座って鑑賞する集中力がないことである。一方で人混みは苦手で、混んだ回は避け、快適な席番号を覚えて取るようにしている。直前にキャンセルできる劇場が広まればいいとも述べている。","映画に関しての雑記 | 松本俊夫『修羅』『ドグラ・マグラ』","https://note.com/beefbowl60/n/n944d17513fa0","2026-05-13","文脈"],["予習の差配","概念","古い映画、特にアート系作品は時代背景や文脈を知らないとさっぱり分からないことがある。筆者は、予習すればストーリーは理解しやすくなるが予想外の感動は減ってしまうとして、その加減の難しさを語る。分からない時は無理に楽しまず、ぼーっと観るという。","映画に関しての雑記 | 松本俊夫『修羅』『ドグラ・マグラ』","https://note.com/beefbowl60/n/n944d17513fa0","2026-05-13","文脈"],["松本俊夫『修羅』","固有名詞","筆者が観た1971年のアート系時代劇である。モノクロでスローテンポ、単位時間当たりの情報量は最新のアニメ映画の千分の一ほどと感じ、序盤は何度も寝そうになった。それでも唐十郎の怪演に支えられ、なんとか最後まで観ることができたという。","映画に関しての雑記 | 松本俊夫『修羅』『ドグラ・マグラ』","https://note.com/beefbowl60/n/n944d17513fa0","2026-05-13","文脈"],["良い映画は、観て2、3日経ってからじわじわ効いてくる。","文","『修羅』を観終えた筆者には「どういうことなの？」という疑問が渦巻いた。良い映画は心に引っ掛かるものが後に残り、湧き出た謎から好奇心が刺激されて監督の著作に当たると、気づきと再確認の終わらないサイクルが始まると述べている。","映画に関しての雑記 | 松本俊夫『修羅』『ドグラ・マグラ』","https://note.com/beefbowl60/n/n944d17513fa0","2026-05-13","文脈"],["ちょっといいキーボード","概念","職場支給品から自腹で替えた安価な無線キーボードで数年満足していた筆者が、仕事環境の改善を名目に気になり始めたものである。数多くの機種があって選ぶのも大変で、この世界の初心者として自分の選択が「正解」なのかは全然分かっていないと述べている。","キーボードは自己投資|Keychron K1 Max","https://note.com/beefbowl60/n/n2cda8b46597a","2026-05-27","文脈"],["Keychron K1 Max","固有名詞","筆者がAmazonセールで思い切って購入した、人生で一番高いキーボードである。右側の方向キー等が独立し、テンキーなしで薄型という条件で選び、このモデルに行き着いた。レトロカラーがマイルドで優しいと気に入っている。","キーボードは自己投資|Keychron K1 Max","https://note.com/beefbowl60/n/n2cda8b46597a","2026-05-27","文脈"],["打鍵欲","概念","K1 Maxを使い始めて2日ほどで打鍵感に慣れた筆者が、「もっと文章を打ちたい！」と感じた欲求を指す言葉である。最初は戸惑ったが、コトコトとした押し心地が気持ちよくなり、これまでのキーボードでは感じたことのない感覚だったと述べている。","キーボードは自己投資|Keychron K1 Max","https://note.com/beefbowl60/n/n2cda8b46597a","2026-05-27","文脈"],["毎日触れる道具の質を上げるのは、費用対効果の高い自己投資だ。","文","筆者は1日8時間くらいPCに向かって何かを操作している。ちょっといいキーボードを使ってみて、インタフェースの品質をできる限り上げることは確実に費用対効果の高い自己投資だと確信し、もっと早く買えばよかったと振り返っている。","キーボードは自己投資|Keychron K1 Max","https://note.com/beefbowl60/n/n2cda8b46597a","2026-05-27","文脈"],["Keychron K0 Max","固有名詞","K1 Maxを使い始めてすぐ「やっぱりテンキー欲しい」と感じた筆者が追加購入した数字キーパッドである。本体とあまり変わらない値段で予算を大きく超えたが、左側に置いて左手デバイスとして使えばむしろメリットになると前向きに捉えている。","キーボードは自己投資|Keychron K1 Max","https://note.com/beefbowl60/n/n2cda8b46597a","2026-05-27","文脈"],["キーボードは、仕事を格段に楽しくする道具である。","文","キーボードを買うつもりはなかった筆者が、打鍵欲の目覚めやテンキーの追加購入を経て書き記した「今日の結論」である。キーマップのカスタマイズなど、まだ概念がよく分かっていない機能も、これから少しずつ試していくつもりだとしている。","キーボードは自己投資|Keychron K1 Max","https://note.com/beefbowl60/n/n2cda8b46597a","2026-05-27","文脈"],["試さずに買う","概念","記事タイトルにもなった筆者の買い方である。新しいシューズは履いたことのないメーカーの物で試着しておきたかったが、近所の店に同じモデルがなく、色々と面倒になって試着を諦めた。普段のハーフサイズアップでネット注文し、結果は吉と出た。","【日記】試さずに買う | On Cloudtilt","https://note.com/beefbowl60/n/n9df7ee846ede","2026-06-01","文脈"],["On Cloudtilt","固有名詞","10年ほど履いたウォーキングシューズが、ジムのマシンの上で突然ソールが剥がれて壊れたため、筆者が買い替えたシューズである。足の裏が痛くならなそうなものを条件に直観で見つけ、届いてすぐ履いてみたらめちゃくちゃピッタリだったという。","【日記】試さずに買う | On Cloudtilt","https://note.com/beefbowl60/n/n9df7ee846ede","2026-06-01","文脈"],["死ぬわけじゃないなら、迷ったときは直観で進めばいい。","文","試着できないまま靴をネット注文した筆者は、2日後に届いた箱を開けて履いてみて、驚くほどぴったりだったことを知った。確認の手間にこだわって足踏みするより、直観に従って動いたほうがうまくいった経験から、「今日の教訓」として記している。","【日記】試さずに買う | On Cloudtilt","https://note.com/beefbowl60/n/n9df7ee846ede","2026-06-01","文脈"],["都会のオアシスとしての写真ギャラリー","概念","休日の昼間にぶらりと写真ギャラリーに入ることが、筆者の最近の小さな趣味である。たいてい空いていて静かで、しかも無料なので、疲れた足を休めながら写真をぼーっと眺めて気分転換できる。ほぼ無限に楽しめる趣味として続けたいと述べている。","散歩と写真ギャラリー | 鉄道写真 広田尚敬展","https://note.com/beefbowl60/n/n1eadc152c3b3","2026-06-06","文脈"],["写真を見るときの三つの自問","概念","何が写っているのか、何を撮ろうとしたのか、そして何が写ってしまっているのか。筆者は写真を見るとき、何となく頭の中でこの三つを問うクセがあるという。映画などと同じく、解釈の余白のある写真は面白いと最近分かってきたと述べている。","散歩と写真ギャラリー | 鉄道写真 広田尚敬展","https://note.com/beefbowl60/n/n1eadc152c3b3","2026-06-06","文脈"],["広田尚敬","固有名詞","品川のキヤノンギャラリーSで筆者が写真展「鉄道写真」を観た写真家である。機関車や煙、レール、駅の売店、乗り降りする人々から、田舎の風景の隅に小さく写る列車まで、鉄道をテーマにした幅広いバリエーションの先駆者という解説に筆者は納得した。","散歩と写真ギャラリー | 鉄道写真 広田尚敬展","https://note.com/beefbowl60/n/n1eadc152c3b3","2026-06-06","文脈"],["疾走する機関車の写真には、質量×加速度＝力が写っている。","文","広田尚敬の作品のうち、筆者に特に強い印象を残したのは、疾走してくる機関車の運動体としての勢いと迫力を写し取った白黒写真だった。1950〜60年代の人々の顔を正面から捉えたスナップも好みで、当時の日本の空気まで残っていると感じている。","散歩と写真ギャラリー | 鉄道写真 広田尚敬展","https://note.com/beefbowl60/n/n1eadc152c3b3","2026-06-06","文脈"],["鉄道写真と一眼レフの相性","概念","超望遠で車両を撮り、広角で自然風景や駅頭スナップを撮ることを一つのシステムで完結できる点に、筆者は鉄道写真と一眼レフの相性の良さを感じた。高速物体を的確に撮るための自動化技術やズームレンズの進歩とも連動しているのではないかと考えている。","散歩と写真ギャラリー | 鉄道写真 広田尚敬展","https://note.com/beefbowl60/n/n1eadc152c3b3","2026-06-06","文脈"],["最終的な出力方法が違えば、写真の届き方も変わる。","文","キヤノンのギャラリーは全てインクジェットによる大型プリント展示で、筆者はカラーの鮮やかさが特徴だと感じた。写真美術館で見た銀塩白黒プリントの引き込まれる感じとは違う味わいに気づき、写真家が展示の表現や再現方法にどうこだわるのかにも興味が湧いたという。","散歩と写真ギャラリー | 鉄道写真 広田尚敬展","https://note.com/beefbowl60/n/n1eadc152c3b3","2026-06-06","文脈"],["古本ブックエンド","固有名詞","筆者が富山市を訪れた際にGoogleマップで見つけた古書店である。総曲輪という市街地の脇道にある数坪ほどの店だが、筆者は最高クラスに自分の趣味と合致したと評価する。翌日も再訪して本を買い足し、別店舗「ブックエンド2」に行けなかったことを残念がっている。","富山で見つけた最高のお店｜古本ブックエンド","https://note.com/beefbowl60/n/n96c5cdb55cbf","2026-06-14","文脈"],["中山岩太","固有名詞","古本ブックエンドの外から見えた写真集の写真家である。筆者はこれに惹かれて入店し、まず写真コーナーへ向かった。そこには木村伊兵衛のような定番から瀧口修造全集のような骨太なものまでが揃っており、店の棚の奥深さを知る入り口になった。","富山で見つけた最高のお店｜古本ブックエンド","https://note.com/beefbowl60/n/n96c5cdb55cbf","2026-06-14","文脈"],["セレクトの密度","概念","音楽、芸能、写真、哲学・思想、郷土史、料理と、各テーマの棚に並ぶ本が徹底して厳選されていることに筆者が唸った点である。入荷した本を適当に並べただけではこんな棚にならないとすぐ理解した。価格は高くなく全商品にビニールカバーがかけられ、古本愛を感じている。","富山で見つけた最高のお店｜古本ブックエンド","https://note.com/beefbowl60/n/n96c5cdb55cbf","2026-06-14","文脈"],["旅先の古書店巡り","概念","筆者は地方を旅するたびに、その土地の古書店を覗くようにしている。古本ブックエンドでは、タモリや細野晴臣の関連本が充実している一方で「越中百家」のような郷土本もさりげなく置かれており、土地の色と店主の趣味が同居する棚に出会った。","富山で見つけた最高のお店｜古本ブックエンド","https://note.com/beefbowl60/n/n96c5cdb55cbf","2026-06-14","文脈"],["棚に感動すると、思わず店の人に伝えたくなる。","文","ホンマタカシの本とタモリ関連の本を手にレジへ向かった筆者は、普段なら絶対にしないのに、抑えきれずに「このお店、本のチョイスがいいですね」と店の人に声を掛けてしまった。棚から受けた興奮がそれほど大きかったことを示す場面である。","富山で見つけた最高のお店｜古本ブックエンド","https://note.com/beefbowl60/n/n96c5cdb55cbf","2026-06-14","文脈"],["ネットのレコメンドでは、本との幸福な遭遇は起きない。","文","時間がないなかで本を選び、翌日も再訪して追加で2冊を購入した筆者は、この体験を実店舗ならではの出会いとして記事を締めくくった。また必ず訪れたいと述べ、遠い街からこの古書店を応援していると結んでいる。","富山で見つけた最高のお店｜古本ブックエンド","https://note.com/beefbowl60/n/n96c5cdb55cbf","2026-06-14","文脈"],["猪野秀史『Satisfaction』","固有名詞","猪野秀史（INO hidefumi）のデビュー作にしてヒット作のアルバムである。筆者は20年前、渋谷タワレコの試聴機で1曲目を聴いてすぐレジに持っていった。発売20周年の記念ライブを恵比寿リキッドルームで観て、聴いていた当時の自分を思い出している。","【ライブ】INO hidefumi \"Satisfaction\" 20th","https://note.com/beefbowl60/n/nf35a5537ac74","2026-06-20","文脈"],["フェンダー・ローズ","固有名詞","『Satisfaction』でフィーチャーされているエレクトリック・ピアノである。筆者はこのアルバムを官能的な作品集と紹介している。ライブでは「JUST THE TWO OF US」の後半でグルーヴィなベースにローズが絡みつく展開に心を揺さぶられ、涙腺が決壊したと書いている。","【ライブ】INO hidefumi \"Satisfaction\" 20th","https://note.com/beefbowl60/n/nf35a5537ac74","2026-06-20","文脈"],["これからの人生","概念","ミシェル・ルグランのスタンダード「What Are You Doing The Rest of Your Life」の邦題である。筆者は20年前、何かを成し遂げた後に「これからの人生」を考える時期が自分にも来るのかと思っていた。ライブ後、電車に揺られながら自身のこれからの人生に思いを馳せている。","【ライブ】INO hidefumi \"Satisfaction\" 20th","https://note.com/beefbowl60/n/nf35a5537ac74","2026-06-20","文脈"],["後退に見えた時期も、振り返れば前に進んでいた。","文","ライブのMCで猪野秀史が語った「20年進んできて、途中後ろに進んでいるんじゃないかと思う時もあったが、今思えば前に進んでいた」という言葉である。筆者はこれにぐっと来たと書き、20年という時間の重みを自分の歩みにも重ねている。","【ライブ】INO hidefumi \"Satisfaction\" 20th","https://note.com/beefbowl60/n/nf35a5537ac74","2026-06-20","文脈"],["イノセントな魂","概念","猪野秀史がMCで、ノスタルジーという言葉は好きではなく、心がときめく方、感動する方へ進んできたと語った場面から筆者が受け取ったものである。筆者はリスナーとして、まさにイノセントな魂に20年間触れてきたのだという実感が溢れてきたと書いている。","【ライブ】INO hidefumi \"Satisfaction\" 20th","https://note.com/beefbowl60/n/nf35a5537ac74","2026-06-20","文脈"],["「JUST THE TWO OF US」","固有名詞","筆者にとってこの日のライブの個人的クライマックスとなった曲である。ボーカルが入り、間奏から後半にかけてグルーヴィなベースにローズが絡みつく展開がエモすぎて、危うく涙腺が決壊しそうになった（実際はしていた）と振り返っている。","【ライブ】INO hidefumi \"Satisfaction\" 20th","https://note.com/beefbowl60/n/nf35a5537ac74","2026-06-20","文脈"],["買ってすこし良かったもの","概念","筆者が最近買って少し良かったものを紹介するシリーズの題である。大絶賛ではなく「すこし」良かったという温度感で、日常の小さな改善をもたらした品を取り上げている。この回ではiPhoneとiPad mini用の覗き見防止フィルターを紹介している。","買ってすこし良かったもの | 覗き見防止フィルター","https://note.com/beefbowl60/n/n87b2bb997972","2026-06-21","文脈"],["覗き見防止フィルター","概念","職場やジム、電車内、エレベーターでスマホを開くと周囲の視線が気になるため、筆者が導入したプライバシーフィルターである。上下左右の視野角を狭めてくれる。取り外し可能な吸着タイプだが、筆者はずっと貼りっぱなしで使っている。","買ってすこし良かったもの | 覗き見防止フィルター","https://note.com/beefbowl60/n/n87b2bb997972","2026-06-21","文脈"],["視線を遮るだけで、人前でスマホを開く安心感が変わる。","文","確実にチラッと見られていると感じていた筆者が、覗き見防止フィルターを使ってみた実感である。電車内などでの安心感がかなり違い、画面が少し暗くなる欠点もしばらくすると慣れたと述べ、真後ろから覗き込まない限り文字は読めないと評価している。","買ってすこし良かったもの | 覗き見防止フィルター","https://note.com/beefbowl60/n/n87b2bb997972","2026-06-21","文脈"],["Agrado","固有名詞","筆者がiPhone用に買った覗き見防止フィルターのメーカー名である。いろいろある中からなんとなく選んだが、使い勝手に問題はなかったと述べている。着脱式で繰り返し使える製品で、真後ろから覗き込まない限り画面の文字は読めない感じだという。","買ってすこし良かったもの | 覗き見防止フィルター","https://note.com/beefbowl60/n/n87b2bb997972","2026-06-21","文脈"],["iPad mini","固有名詞","iPhone用フィルターが良かったため、筆者が覗き見防止フィルターを追加で導入した端末である。こちらの製品はiPhone用より視野角が広く、結構斜めからでも見える。筆者はそれを欠点とせず、用途的にそういう設計なのだろうと納得している。","買ってすこし良かったもの | 覗き見防止フィルター","https://note.com/beefbowl60/n/n87b2bb997972","2026-06-21","文脈"],["覗き見防止の強さは、端末の用途に合わせて設計されている。","文","iPhone用とiPad mini用のフィルターを比べた筆者の気づきである。iPad mini用は視野角が広く斜めからでも見えたが、筆者は不満とせず、用途的にこれはこれでそういう設計なのだろうと納得し、どちらも少し良い買い物だったとまとめている。","買ってすこし良かったもの | 覗き見防止フィルター","https://note.com/beefbowl60/n/n87b2bb997972","2026-06-21","文脈"],["WORLD HAPPINESS","固有名詞","故 高橋幸宏が主催していた夏フェスで、通称ワーハピである。9年ぶりに国立代々木競技場第一体育館で開催された。筆者は夢の島時代の旧ワーハピに何度か足を運び、岡村靖幸の「カルアミルク」や原田知世の「At Dawn」の演奏を思い出に挙げている。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["屋外フェスでは、日の傾きや風までが記憶に残る。","文","夢の島で開かれていた旧ワーハピを振り返った筆者の実感である。時間とともに日が傾き、涼やかな風が吹くといった自然の演出が演奏とともに記憶に残っていると述べ、屋内の代々木第一体育館で開かれた今回と対比している。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["フェス感","概念","屋内開催の今回のワーハピで筆者が低下を感じたものである。天候の面ではメリットが多いが、アリーナ席でずっと観ていると聴くか聴かないかの二択になり、屋台に並んだり友人と会ったりする余白がなかった。会場の特性か音響もあまり良くなかったと書いている。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["細野晴臣","固有名詞","今回のワーハピで筆者が目玉の一つとしていた出演者である。演奏わずか30分と期待しすぎないようにしていたが、ドラムセットやマリンバが並ぶのを見てフルバンドだと気づき期待が高まった。くくくとシャッポらの固定メンバーで、ここまで聴けただけで元が取れたと大満足している。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["「プリオシーヌ」","固有名詞","細野晴臣がMCで高橋幸宏の思い出に触れた後に演奏した曲である。筆者は「まさに涅槃の音楽」と書き、間奏から原田郁子と角銅真実の民謡コーラスが入るところで昇天状態になった。映画『銀河鉄道の夜』サントラの「プリオシン海岸」がベースになっている。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["細野シャーマニック路線","概念","筆者が細野晴臣の霊的な作風を呼んだ言葉である。「プリオシン海岸」をベースにしたその到達点が、この時代の最新メンバーで「再生」されたことに筆者は感動した。長年封印されてきた作品に脚光が当たる今、霊的な世界観への回帰も感じ取っている。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["『Medicine Compilation』","固有名詞","細野晴臣の作品で、『omni Sight Seeing』とともに長年封印されてきたと筆者が書いているアルバムである。ここにきてそれらに脚光が当たり始めていることに筆者は喜びと驚きを覚え、そこに霊的な世界観への回帰を感じて新作がますます楽しみになったと述べている。","WORLD HAPPINESS 2026 の細野晴臣","https://note.com/beefbowl60/n/nefd33a16d75a","2026-06-30","文脈"],["Apple Watch Series5","固有名詞","筆者が長く使ってきたApple Watchで、2019年発売のモデルである。気づけばバッテリー容量が72％になり、電池が1日も持たなくなっていた。OSのサポートもいつの間にか終わっており、たまに挙動がおかしいと感じていたことから、買い替えを決めるきっかけになった。","Apple Watch SE3に買い替えた話","https://note.com/beefbowl60/n/n9b38942081e7","2026-07-06","文脈"],["誰が考えても合理的な選択","概念","筆者がApple Watchの買い替えを決めた理屈である。現在の機種のバッテリー交換に15,800円掛けるより、プラス2万円ほどで37,800円の最新モデルにした方が合理的だと判断した。記事では図解まで添え、これはもう新しいのを買うしかないと結論づけている。","Apple Watch SE3に買い替えた話","https://note.com/beefbowl60/n/n9b38942081e7","2026-07-06","文脈"],["Apple Watch SE3","固有名詞","筆者がSeries5から買い替えたApple Watchの廉価モデルである。サイズは40mmを選び、結果的に見た目はそれまでの物とほとんど変わらない。購入から2週間経っても不都合はなく、サポートが切られるまでは使っていきたいと述べている。","Apple Watch SE3に買い替えた話","https://note.com/beefbowl60/n/n9b38942081e7","2026-07-06","文脈"],["スターライト","固有名詞","筆者がApple Watch SE3で選んだ本体カラーである。少し悩んだが、金属っぽい質感が好みだとして以前と同じシルバー系にした。届いてみるとシルバーよりも微妙にゴールドが入っていて、これはこれで良かったかもと受け止めている。ベルトはスポーツループにした。","Apple Watch SE3に買い替えた話","https://note.com/beefbowl60/n/n9b38942081e7","2026-07-06","文脈"],["良い買い替えは、買い替えたこと自体を意識させない。","文","Apple Watch SE3を購入して2週間が経った筆者の感想である。色もサイズも以前とほぼ同じものを選んだため見た目はほとんど変わらず、何の不都合もないし、買い替えたことを意識することもないと書いている。","Apple Watch SE3に買い替えた話","https://note.com/beefbowl60/n/n9b38942081e7","2026-07-06","文脈"],["指でパチパチ操作","概念","新しいApple Watchで筆者が試している、指をパチパチとやって操作する方法である。まだ慣れていない点はあるものの、とにかくいい感じだと評価している。この使い心地も含め、サポートが切られるまでは使っていきたいと記事を締めくくっている。","Apple Watch SE3に買い替えた話","https://note.com/beefbowl60/n/n9b38942081e7","2026-07-06","文脈"],["Obsidianのデイリーノート","固有名詞","筆者が自分用のプライベートな記録を残している場所である。日記というより、どこに行ったか、どのサブスクを解約したかといった事実の羅列に近い。書いたメモをClaude（Claudian）でいじったり分析したりして遊んでいたが、それにも飽きてきたと書いている。","日記は書いたほうがいいらしい","https://note.com/beefbowl60/n/n9f519df9a5a6","2026-07-11","文脈"],["日記のようで日記でもないnote","概念","筆者が自分のnoteをどう位置づけているかを表した言葉である。Obsidianに書く事実の羅列とも違い、かといって日記そのものでもない。かっこいいnote日記の書き手を見つけて嬉しくなる一方、自分の書くものとの違いも意識している。","日記は書いたほうがいいらしい","https://note.com/beefbowl60/n/n9f519df9a5a6","2026-07-11","文脈"],["ECDの日記","固有名詞","筆者が「かっこいい日記」の例えとして挙げたものである。最近そうした日記を書くnoteの書き手を見つけて嬉しかったと述べ、note日記が上手い人もいるのだと感心した。同時に意気消沈しても仕方ないと、自分のスタイルを貫く決意につなげている。","日記は書いたほうがいいらしい","https://note.com/beefbowl60/n/n9f519df9a5a6","2026-07-11","文脈"],["上手い書き手に落ち込まず、自分の駄文を積み上げる。","文","かっこいい日記を書くnoteの書き手を見つけた筆者が、自分と比べて意気消沈しそうになった場面から出た言葉である。落ち込んでも仕方ないとして、自分は自分のスタイルで駄文を積み上げていこうと気持ちを切り替えている。","日記は書いたほうがいいらしい","https://note
