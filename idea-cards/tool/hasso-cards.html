.com/beefbowl60/n/n9f519df9a5a6","2026-07-11","文脈"],["記事タイトルは公開後に内容に合わせて直せばいい。","文","日記001のような連番タイトルでは過去記事を遡るときに内容が分からないと感じた筆者は、自分の過去記事のタイトルを少しずつ修正した。いきなり格好つけたタイトルで公開する勇気はないので、後から直すのはいいかもしれないと考えている。","日記は書いたほうがいいらしい","https://note.com/beefbowl60/n/n9f519df9a5a6","2026-07-11","文脈"],["呼気NO","概念","呼吸の苦しさからクリニックを受診した筆者が検査で測った一酸化窒素の数値である。結果は100オーバーで、3桁を超える人は患者全体でも数％程度と説明された。医師からこのままだと10年後はかなり危ないと告げられ、治療を受け入れるきっかけになった。","通院2026夏｜余命10年？｜CT画像","https://note.com/beefbowl60/n/n97082c396910","2026-07-16","文脈"],["死を告げられても、なぜか半笑いになってしまう。","文","呼気NOの数値から、このままでは10年後に急に心臓が止まるかもしれないと医師に言われた場面である。筆者は嫌だと思いつつもなぜか少しテンションが上がり、気づけば半笑いになっていた。どこか楽しげな医師の様子とも呼応している。","通院2026夏｜余命10年？｜CT画像","https://note.com/beefbowl60/n/n97082c396910","2026-07-16","文脈"],["「終わりなき日常」の終わり","概念","余命10年とも取れる宣告を受けた筆者が、その瞬間を言い表した言葉である。急に目の前に現れた退屈な生からの脱却だと感じ、提示されたのは「10年」という期限付きの執行猶予だったと書いている。深刻さと高揚が入り混じった受け止め方である。","通院2026夏｜余命10年？｜CT画像","https://note.com/beefbowl60/n/n97082c396910","2026-07-16","文脈"],["薬のサブスク","概念","毎日薬を飲み続ける必要があり、悪化すれば月6万円ほどの自己注射になると説明された筆者が抱いた疑念である。薬漬けにするため大袈裟に脅しているのではと頭をよぎったが、まあ真実なのだろうと納得し、治療を受け入れることにした。","通院2026夏｜余命10年？｜CT画像","https://note.com/beefbowl60/n/n97082c396910","2026-07-16","文脈"],["DICOM","固有名詞","CTやMRIの検査結果を入手できるファイル形式である。筆者は以前から自分のCTを撮ってみたかったため、医師に訝しがられながらも生データをCD-ROMに焼いてもらった。DICOMビューアで読み込めば、心ゆくまで自分の断面を鑑賞できると紹介している。","通院2026夏｜余命10年？｜CT画像","https://note.com/beefbowl60/n/n97082c396910","2026-07-16","文脈"],["IMAIOS DICOM Viewer","固有名詞","筆者が記事の余談で紹介した、無料のオンラインDICOM画像ビューアである。コンピュータやCD、DVDからDICOMファイルを読み込める。筆者は自分のCTデータを「自分で楽しむ目的」でもらっており、こうしたビューアで自分の断面を愉しむ方法を勧めている。","通院2026夏｜余命10年？｜CT画像","https://note.com/beefbowl60/n/n97082c396910","2026-07-16","文脈"],["伊丹十三記念館","固有名詞","松山市の市街から車で15分ほどの場所にある記念館である。筆者が松山に来た理由の7割くらいはここを訪れることだった。きれいな展示室に伊丹が趣味で打ち込んだ楽器やカメラ、調理器具が並び、伊丹ファンにはたまらない空間だと書いている。","愛媛旅行で良かった場所｜伊丹十三記念館","https://note.com/beefbowl60/n/nb84d45e3c760","2026-07-23","文脈"],["「ドレミファ娘の血は騒ぐ」","固有名詞","伊丹十三記念館に展示されていたバイオリンを見て、筆者が思い出した映画である。記事では画像キャプションで短く触れられているだけだが、展示された一つの楽器から一本の映画の記憶がよみがえる、記念館ならではの楽しみ方がうかがえる場面である。","愛媛旅行で良かった場所｜伊丹十三記念館","https://note.com/beefbowl60/n/nb84d45e3c760","2026-07-23","文脈"],["趣味人","概念","筆者が伊丹十三記念館で楽しんだ伊丹の一面である。楽器、YASHICAのカメラ、こだわりの料理道具など、氏が趣味として打ち込んだ品々の展示を見て回り、その趣味人ぶりを味わった。館内を巡った後は併設カフェで生姜湯と十三饅頭をいただいている。","愛媛旅行で良かった場所｜伊丹十三記念館","https://note.com/beefbowl60/n/nb84d45e3c760","2026-07-23","文脈"],["「タンポポ」","固有名詞","筆者が一番好きな映画として挙げた伊丹十三の作品である。伊丹十三記念館ではそのポスターや出演者のスケッチが展示されており、筆者は写真に収めている。売店には伊丹の書籍や宮本信子が作ったグッズも並んでいた。","愛媛旅行で良かった場所｜伊丹十三記念館","https://note.com/beefbowl60/n/nb84d45e3c760","2026-07-23","文脈"],["旅の目的の大半を、ひとつの場所に託してもいい。","文","筆者は愛媛旅行で松山を訪れた理由の7割くらいが伊丹十三記念館に行くことだったと書いている。静かで美しい中庭や趣味の品々の展示を楽しみ、小さい饅頭を買って帰った。旅行で良かった場所としてこの館だけを取り上げている。","愛媛旅行で良かった場所｜伊丹十三記念館","https://note.com/beefbowl60/n/nb84d45e3c760","2026-07-23","文脈"],["杉本博司 絶滅写真","固有名詞","東京国立近代美術館で開かれた杉本博司の個展で、初期から現在までの銀塩写真およそ60点が並んだ。この規模の個展は21年ぶりらしい。筆者は平日の正午過ぎに訪れ、予想以上の人出に驚きつつ、各シリーズを「どう撮ったのか」という視点で見て回った。","「杉本博司 絶滅写真」をみた感想｜東京国立近代美術館","https://note.com/beefbowl60/n/nbcbe61220478","2026-08-09","文脈"],["現代アートの写真は、被写体より「写真とは何か」を問う。","文","筆者が杉本博司を、写真家というより写真を使った現代美術家と位置づけた際の説明である。普通の写真家は被写体を写真で表現しようとするが、現代アートとしての写真は問いを立て、作品を実験素材のように使って検証していくと整理している。","「杉本博司 絶滅写真」をみた感想｜東京国立近代美術館","https://note.com/beefbowl60/n/nbcbe61220478","2026-08-09","文脈"],["映画を積分する写真","概念","杉本博司の「劇場」シリーズを筆者が読み解いた言葉である。映画が微分されたコマの連続なら、上映中の光を長時間露光で積み重ねた写真は一本まるごとを白く光る矩形に畳み込む。歴史ある劇場を被写体に選んだ点に独自性と美的な迫力を見ている。","「杉本博司 絶滅写真」をみた感想｜東京国立近代美術館","https://note.com/beefbowl60/n/nbcbe61220478","2026-08-09","文脈"],["「海景」","固有名詞","海と空だけを写した杉本博司の連作で、筆者にとって今回いちばんの驚きだった。水平線にピントがあると思っていたが、実物に近づくと手前の海に焦点があり水平線はぼけていた。大判プリントを間近で見なければ気づけず、それだけで足を運んだ甲斐があったと書いている。","「杉本博司 絶滅写真」をみた感想｜東京国立近代美術館","https://note.com/beefbowl60/n/nbcbe61220478","2026-08-09","文脈"],["「Opticks」","固有名詞","光の三原色とその周辺の色をカラー写真で表した杉本博司の作品である。自作のプリズムに窓からの太陽光を通して壁に投射し、現れた色を撮影したという。筆者は部屋を分光装置に見立てた例は珍しいと感じ、プリズムの大きさや機材の配置に興味が尽きないと書いている。","「杉本博司 絶滅写真」をみた感想｜東京国立近代美術館","https://note.com/beefbowl60/n/nbcbe61220478","2026-08-09","文脈"],["一枚の作品の裏には、表に出ない無数の試行がある。","文","展示室の一角にあった創作ノート「スギモトノート」を見た筆者の気づきである。着想の断片や試行の跡から作者の思考が少し覗けた。会場に並ぶ作品は氷山の一角にすぎず、その裏の気の遠くなるような時間を想像すると果てしない気持ちになると結んでいる。","「杉本博司 絶滅写真」をみた感想｜東京国立近代美術館","https://note.com/beefbowl60/n/nbcbe61220478","2026-08-09","文脈"],["脳のリソースをドカ食いするもの","概念","ジムのウォーキング中に筆者が求めたものである。テレビやNETFLIX、YouTube、Podcastを試したが、歩いているとすぐ脳がヒマして「まだ3分しか歩いていない」となってしまう。もっと脳を使い込む没頭先として、筆者は読書にたどり着いた。","ジムでウォーキングしながらKindle読書をするたった一つの方法","https://note.com/beefbowl60/n/n3206065e4658","2026-08-10","文脈"],["キヤノン PR5500-C","固有名詞","筆者がウォーキング中のKindle読書のためにたどり着いた「ページクリッカー」という日本製の製品である。本来はPowerPointをめくる指輪型スイッチで、iPhoneのKindleアプリに公式対応している。Amazonの星2つの製品群を避け、中古で購入した。","ジムでウォーキングしながらKindle読書をするたった一つの方法","https://note.com/beefbowl60/n/n3206065e4658","2026-08-10","文脈"],["指にはめる操作具なら、歩く姿勢を崩さず本が読める。","文","ページクリッカーをウォーキングで使った筆者の実感である。指にはめる形なので持つ必要がなく、腕を普通に振りながら親指でカチッと押すだけでページが送れる。台に置いたスマホに触れずに済み、完全に想定どおりだったと書いている。","ジムでウォーキングしながらKindle読書をするたった一つの方法","https://note.com/beefbowl60/n/n3206065e4658","2026-08-10","文脈"],["本が面白いと、早く終えたい運動がもっと続けたい運動に変わる。","文","ページクリッカーで読書しながら歩くようになった筆者の変化である。かつての「まだ3分しか歩いてない」問題は解消し、本の面白いところに差し掛かると目標距離を超えても歩き続けるようになった。脳が「キリの良いところまで」に切り替わったと書いている。","ジムでウォーキングしながらKindle読書をするたった一つの方法","https://note.com/beefbowl60/n/n3206065e4658","2026-08-10","文脈"],["タイパの限界突破","概念","ウォーキングしながらのKindle読書を筆者が評した言葉である。カロリーを消費し体脂肪を燃焼しながら、脳にインプットまでできる。最終的にはテレビをチラ見し、Podcastを聴き、Kindleで読みながら歩く形態に至り、さらなる改善を目指している。","ジムでウォーキングしながらKindle読書をするたった一つの方法","https://note.com/beefbowl60/n/n3206065e4658","2026-08-10","文脈"],["ウォーキング三種の神器","概念","筆者がジムでのウォーキングに欠かせない道具として挙げた組み合わせである。AirPods Pro 3、ページクリッカー、KINTOのボトルの三つで、記事の最後に画像で紹介している。読書しながら歩く習慣を支える、筆者なりの装備の到達点である。","ジムでウォーキングしながらKindle読書をするたった一つの方法","https://note.com/beefbowl60/n/n3206065e4658","2026-08-10","文脈"],["下書き供養","概念","盂蘭盆会にちなみ、筆者がnoteの下書きに溜まったまま公開されない記事を紹介した試みである。フジロックの感想や運動習慣、バナナの見分け方などのボツネタを並べ、それぞれボツの理由を添えた。未練がましいネタが読者の目に触れて成仏することを祈っている。","note の下書き供養","https://note.com/beefbowl60/n/nb076d0e1b829","2026-08-12","文脈"],["柴田聡子","固有名詞","AmazonPrimeで配信されたフジロックフェスティバルの感想記事で、筆者が唯一見たアーティストである。Band setでの出演だった。感想は最近の歌唱法に関する疑問のような内容になりそうで、膨らまずにボツ記事になったと筆者は明かしている。","note の下書き供養","https://note.com/beefbowl60/n/nb076d0e1b829","2026-08-12","文脈"],["旬を逃した下書きは、そのままボツになりやすい。","文","筆者の下書きに残ったネタの多くに共通するボツの理由である。運動習慣100日目の振り返りは放置するうちに旬を逃し、ブックオフの釣果報告も気持ちの旬を逃した。ただし運動の記事は130日目あたりを進行中で、またタイミングが合えば書きたいとしている。","note の下書き供養","https://note.com/beefbowl60/n/nb076d0e1b829","2026-08-12","文脈"],["9割書けても、公開をためらう記事はある。","文","「株投資の話題がでると黙ってしまう理由」という下書きについての筆者の告白である。何となく面白そうなタイトルで、ほぼ書き終わっているものの、内容的に公開することに躊躇いを感じて踏みとどまっている。公開する日は来ないかもしれないと書いている。","note の下書き供養","https://note.com/beefbowl60/n/nb076d0e1b829","2026-08-12","文脈"],["スピ度","概念","細野晴臣の新作についての「プチ考察」の下書きで、筆者が使った言葉である。考察が流行っていると耳にし、解禁された数曲からアルバムの方向性を考えた。筆者は勝手に、新作のスピリチュアルな度合いは高いと予測しているが、記事は下書きのままになっている。","note の下書き供養","https://note.com/beefbowl60/n/nb076d0e1b829","2026-08-12","文脈"],["写真は若い頃の撮影体験に、永遠にかなわない。","文","「写真というのは自分の中で一度終わっている」という下書きの主題である。筆者は、今の写真は若い頃の撮影体験に永遠にかなわないという実感を抱いている。記事としては公開されず、タイトルと短い要約だけが供養として紹介された。","note の下書き供養","https://note.com/beefbowl60/n/nb076d0e1b829","2026-08-12","文脈"],["Googleマップのローカルガイド","固有名詞","筆者が数年前から続けているGoogleマップへのレビュー投稿の仕組みである。投稿数は100件ほどでレベル6に達し、しばらく休んだ後に活動を再開した。月10件の投稿を目標に掲げ、次はレベル7を目指していると述べている。","Google Mapレビューという趣味","https://note.com/beefbowl60/n/n2f1d6c8da588","2026-09-05","文脈"],["レビューは報復ではなく、良い店への感謝として書く。","文","筆者はレビュー投稿の目的を、気に食わない店への低評価ではなく、サービスの良い店への高評価の積み重ねだと位置づけた。過去の投稿の閲覧数が数万回に達している場所もあり、どこかの誰かの役に立っている気がして地味に嬉しいと語っている。","Google Mapレビューという趣味","https://note.com/beefbowl60/n/n2f1d6c8da588","2026-09-05","文脈"],["説明的な写真","概念","レビュー投稿のために筆者が撮るようになった、店舗の外観やメニュー表などの写真である。役に立つ一方で、出先で立ち寄ったコンビニまで撮りたくなってしまうため、作業としては割と面倒でもあると本音を漏らしている。","Google Mapレビューという趣味","https://note.com/beefbowl60/n/n2f1d6c8da588","2026-09-05","文脈"],["非AI性","概念","筆者がGeminiにレビューを査定させる際の観点の一つである。生成AIで文章を整形しているからこそ、完成した文章がAI文体にならないよう気をつけており、有用性や客観性と並ぶ仕上げのチェック項目として挙げている。","Google Mapレビューという趣味","https://note.com/beefbowl60/n/n2f1d6c8da588","2026-09-05","文脈"],["朝の空気の入れ替え","概念","筆者の夏の朝のルーティンの最初の行動である。起きてカーテンと窓を開け放ち、古い空気を外に逃がす。どこかの本で運気を上げるための最初の手段だと読んだのがきっかけで、その後の植物への水やりや小魚の餌やりへと一日が続いていく。","2026年のTypicalな夏の終りの一日","https://note.com/beefbowl60/n/n568c4c74e8eb","2026-09-06","文脈"],["CHO CO PA CO CHO CO QUIN QUIN『Synthetic海岸』","固有名詞","筆者が朝の家事の時間に聴いてテンションを上げていた、チョコパの新作アルバムである。掃除機がけや小物の整理整頓をしながら聴き、アルバムが良いと繰り返し評価している。同時期に聴いたコーネリアスの新作とともに新しさを感じたという。","2026年のTypicalな夏の終りの一日","https://note.com/beefbowl60/n/n568c4c74e8eb","2026-09-06","文脈"],["好きな音楽家の新作に、新しい時代の到来を感じる。","文","筆者はチョコパの新作に続いてコーネリアスの新作『Refractions』も聴き、今までと雰囲気が違ってよいと感じた。まだ聴き込めていないが「よい」予感があるとし、どちらにも新しい時代に来ている感覚があると記している。","2026年のTypicalな夏の終りの一日","https://note.com/beefbowl60/n/n568c4c74e8eb","2026-09-06","文脈"],["電気グルーヴ『イルボン2000』","固有名詞","筆者が電気グルーヴのアルバムを最初から全部聴き直した結果、一番好きだと認識した作品である。この時期のライヴでのDJ TASAKAとKAGAMIのスクラッチプレイを最高と評し、元になったツアー映像をYouTubeで見つけて家事をしながら楽しんだ。","2026年のTypicalな夏の終りの一日","https://note.com/beefbowl60/n/n568c4c74e8eb","2026-09-06","文脈"],["ジム帰りのカフェで書く日記は、驚くほど集中できる。","文","筆者は午後にジムで8000歩のウォーキングと軽い筋トレをした後、近くのイタトマでアイスコーヒーを飲みながら、iPad miniとOMIKAMOのキーボードで日記を書いた。すごく集中できたと繰り返す一方、店内がタバコ臭く退散したという顛末も添えている。","2026年のTypicalな夏の終りの一日","https://note.com/beefbowl60/n/n568c4c74e8eb","2026-09-06","文脈"],["寝る前のハチミツ","概念","筆者の夜の日課で、夕食後のプロテインヨーグルトにスプーン一杯のハチミツを加えて甘さを足している。寝る前のハチミツは睡眠を深くすると中西哲生の本に書いてあったことが理由で、今年は毎日この一日のルーティンを繰り返していたと振り返る。","2026年のTypicalな夏の終りの一日","https://note.com/beefbowl60/n/n568c4c74e8eb","2026-09-06","文脈"],["細野晴臣「Yours Sincerely」","固有名詞","2026年9月11日に発売された細野晴臣のオリジナルアルバムで、2019年の「HOCHONO HOUSE」以来となる23作目とされる。筆者は発売日の仕事の休憩中に聴き始め、長年のファンとして様々な思いが蘇り、深く染み込んでくる作品だったと記している。","細野晴臣 新作「Yours Sincerely」","https://note.com/beefbowl60/n/n3ef74f54b4e1","2026-09-12","文脈"],["天上の環境音楽","概念","筆者が細野晴臣の新作を初めて聴いたときの印象を表した言葉である。どこかに連れて行かれるような、死後の世界のような響きがあり、死と生と誕生のあいまいな境界線上で鳴っている音楽だと感じたと述べている。","細野晴臣 新作「Yours Sincerely」","https://note.com/beefbowl60/n/n3ef74f54b4e1","2026-09-12","文脈"],["50年以上創作を続けていること自体が、畏怖に値する。","文","細野晴臣の新作を聴いた筆者は、年齢のことは抜きにしても、50年以上にわたり独特でちょっと変わったクリエイションを続け、今もなお続いているという事実に、畏怖に近い思いが湧き上がってきたと記している。","細野晴臣 新作「Yours Sincerely」","https://note.com/beefbowl60/n/n3ef74f54b4e1","2026-09-12","文脈"],["仕事の合間ではなく、寝る前に小さなスピーカーで聴く音楽がある。","文","筆者は細野晴臣の新作を発売日の仕事の休憩時間に聴き始めたが、仕事の合間に聴くようなものではないと思い直した。家に帰ってから夜寝る前に、小さいスピーカーで繰り返し聴くことにしたという聴き方の選択である。","細野晴臣 新作「Yours Sincerely」","https://note.com/beefbowl60/n/n3ef74f54b4e1","2026-09-12","文脈"],["モナド/ノン・スタンダード期","固有名詞","細野晴臣の新作に、この時期を彷彿とさせる曲調があると筆者が指摘した過去の活動期である。「ハッシャ・マンダラ・ニパーリ」という詞やコシミハルの歌とともに、長年のファンとして思いが蘇り、走馬灯のようだったと振り返っている。","細野晴臣 新作「Yours Sincerely」","https://note.com/beefbowl60/n/n3ef74f54b4e1","2026-09-12","文脈"],["LIQUIDROOM","固有名詞","恵比寿にあるライブハウスで、2026年9月2日に22周年企画として細野晴臣の「The Yours Sincerely Tour -Prelude」が開かれた。筆者はスタンディングで参加し、驚きに満ちたライブだったと振り返り、セットリストとともに記録を残している。","細野晴臣ライヴ＠LIQUIDROOM","https://note.com/beefbowl60/n/n9437c344a115","2026-09-17","文脈"],["くくく（原田郁子・角銅真実）","固有名詞","LIQUIDROOM公演で細野晴臣と共演したユニットである。筆者によれば、高橋幸宏が亡くなって間もない2023年のライブで、細野晴臣がくくくのメンバーと共に追悼を込めて「Stella」を演奏したことがあり、それが今回の選曲を予感させる伏線になっていた。","細野晴臣ライヴ＠LIQUIDROOM","https://note.com/beefbowl60/n/n9437c344a115","2026-09-17","文脈"],["高座に上がる名人のようなMC","概念","前日まで入院し、心臓にペースメーカーを入れる手術をした経緯を、細野晴臣が曲の合間ごとに語ったMCを筆者はこう例えた。おどけた調子に最初は冗談かと思ったが、最後まで会場を笑いで包み込む姿に驚かされたと記している。","細野晴臣ライヴ＠LIQUIDROOM","https://note.com/beefbowl60/n/n9437c344a115","2026-09-17","文脈"],["「Stella」","固有名詞","筆者が最も驚いたアンコール曲である。元はスケッチショーの曲で、新作『Yours Sincerely』の追加曲として新たに作られたアコースティック版だという。この曲だけバンドを離れ、細野晴臣がたった独りでギターの弾き語りをしたことが余計に胸に染みたと述べている。","細野晴臣ライヴ＠LIQUIDROOM","https://note.com/beefbowl60/n/n9437c344a115","2026-09-17","文脈"],["WORLD HAPPINESS","固有名詞","筆者が6月に参加したフェスで、高橋幸宏トリビュートの色が強かった。筆者は「Stella」が演奏されるかもと勝手に思っていたが、あえて演らなかったように感じたという。代わりにYMOメンバーで作った「Supreme Secret」で盛り上がったと記している。","細野晴臣ライヴ＠LIQUIDROOM","https://note.com/beefbowl60/n/n9437c344a115","2026-09-17","文脈"],["無数の選択肢から選び取った形は、それだけで胸に染みる。","文","6月のフェスでは演奏されなかった「Stella」が、LIQUIDROOMのアンコールで細野晴臣の独りの弾き語りとして披露された。筆者は、無数にある選択肢の中からあえてこの形を選んだのだと思うとなおさら胸に染みたと述べ、長生きを願って結んでいる。","細野晴臣ライヴ＠LIQUIDROOM","https://note.com/beefbowl60/n/n9437c344a115","2026-09-17","文脈"],["北村写真機店","固有名詞","筆者が新宿に行ったついでに立ち寄ったカメラ店である。オシャレすぎて入口が分からないことでおなじみだと紹介している。写真展「エルマー35展」を見た後、エレベーターで最上階のライカ専門コーナーへ上がり、中古レンズコーナーも眺めて回った。","欲しいカメラ","https://note.com/beefbowl60/n/n5aed2d901e18","2026-09-22","文脈"],["エルマー3.5cm F3.5","固有名詞","北村写真機店で開かれていた「エルマー35展」の写真は、すべてこのレンズで撮られたものだった。筆者は、同じレンズでも表現や視点は実に様々だと感じ、カメラさえあれば自由になれるという気持ちにさせてくれる展示だったと述べている。","欲しいカメラ","https://note.com/beefbowl60/n/n5aed2d901e18","2026-09-22","文脈"],["同じレンズで撮っても、視点次第で表現はいくらでも広がる。","文","筆者は、すべてエルマー3.5cm F3.5という一本のレンズで撮られた写真を集めた展示を見た。機材は同じでも写真の表現や視点が一枚ごとに違うことに気づき、カメラさえあれば自由になれるという気持ちを抱いたと記している。","欲しいカメラ","https://note.com/beefbowl60/n/n5aed2d901e18","2026-09-22","文脈"],["いつかはM型","概念","数年前から少しずつライカが欲しくなっている筆者の目標である。最初はQシリーズに興味があったが、最近はM型に関心が移ったという。早くしないと健康寿命が尽きてしまうと書き、憧れを先延ばしにできない年齢の感覚ものぞかせている。","欲しいカメラ","https://note.com/beefbowl60/n/n5aed2d901e18","2026-09-22","文脈"],["揺れる物欲","概念","中古レンズコーナーで、思ったより手頃なM-HEXANONレンズを眺めた筆者の心境である。こうしたレンズに最新のM型カメラはオーバースペックな気もしつつ、買うか否か行ったり来たりする揺れる気持ちそのものを楽しんでいると述べている。","欲しいカメラ","https://note.com/beefbowl60/n/n5aed2d901e18","2026-09-22","文脈"],["宇井眞紀子「ankoraci アンコラチ そのまま、そのまま」","固有名詞","品川のキヤノンギャラリーSで筆者が観た写真展である。少数民族の写真といえば、サンプル扱いの記録写真か民族衣装で過度に美化したものが多かったが、この展示はアイヌの人々のリアルな日常生活を記録していて、どれとも違ったと評している。","宇井眞紀子 写真展 | 奈良美智 トークイベント","https://note.com/beefbowl60/n/n0ff87559f4cc","2026-09-26","文脈"],["家族写真のような距離","概念","宇井眞紀子の写真について、筆者が感じた被写体との近さを表した言葉である。時間をかけて家族のように関わり、信頼関係を築いてから写真に残すからこそ、写る人たちの何気ない表情が本当に良かったと述べている。","宇井眞紀子 写真展 | 奈良美智 トークイベント","https://note.com/beefbowl60/n/n0ff87559f4cc","2026-09-26","文脈"],["何気ない笑顔やまっすぐな視線は、信頼関係なしには撮れない。","文","筆者は宇井眞紀子の写真展で、子どもがふと振り向いたときの笑顔や、戸惑いのないまっすぐな視線に心を動かされた。こうした表情は人との関係がなければ撮れないと考え、撮影者が長い時間をかけて築いた関わりの深さに注目している。","宇井眞紀子 写真展 | 奈良美智 トークイベント","https://note.com/beefbowl60/n/n0ff87559f4cc","2026-09-26","文脈"],["作品の余白","概念","写真展では、宇井眞紀子がなぜアイヌの人々の暮らしに関心を抱いたのかが詳しく説明されていなかった。筆者は見終わった後もその説明されない部分について考え続けており、答えを保留したまま作品を反芻している。","宇井眞紀子 写真展 | 奈良美智 トークイベント","https://note.com/beefbowl60/n/n0ff87559f4cc","2026-09-26","文脈"],["奈良美智","固有名詞","宇井眞紀子とのトークイベントに登壇した美術家である。台湾の先住民族の暮らしから樺太アイヌにつながるサハリンの話へと写真で語った。筆者はXのポストから尖った人を想像していたが、率直でユーモアのある人柄に一気にファンになったという。","宇井眞紀子 写真展 | 奈良美智 トークイベント","https://note.com/beefbowl60/n/n0ff87559f4cc","2026-09-26","文脈"],["土地は人が住んでいただけで、元々どこの国のものでもない。","文","少数民族への関心が基準値を超えた二人のトークで、奈良美智がこうした意味のことを語り、筆者に刺さった。二人の熱量に巻き込まれて辺境の地へ行ってみたくなったと述べ、作品の奥にある人としての魅力が印象に残ったと結んでいる。","宇井眞紀子 写真展 | 奈良美智 トークイベント","https://note.com/beefbowl60/n/n0ff87559f4cc","2026-09-26","文脈"]];
const EMBEDDED_LABEL = "カード候補（未選別）";
const STORE = "hasso-cards-csv";

let cards = EMBEDDED;
let label = EMBEDDED_LABEL;
let filter = "";
let hand = [];

const $ = (id) => document.getElementById(id);

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function fromCSV(text) {
  const rows = parseCSV(text).filter((r) => r.some((c) => c.trim()));
  if (!rows.length) throw new Error("空のファイルです。");
  const head = rows[0].map((h) => h.trim());
  const cols = ["ワード", "種別", "裏面テキスト", "出典タイトル", "URL", "公開日", "裏面の種類"];
  const idx = cols.map((c) => head.indexOf(c));
  if (idx.slice(0, 3).some((i) => i < 0)) throw new Error("ワード・種別・裏面テキストの列が見つかりません。");
  const accept = head.indexOf("採否");
  const ok = new Set(["○", "〇", "o", "1", "y"]);
  return rows.slice(1)
    .filter((r) => accept < 0 || ok.has((r[accept] || "").trim()))
    .map((r) => idx.map((i) => (i < 0 ? "" : r[i] || "")))
    .filter((r) => r[0].trim());
}

function pool() {
  return filter ? cards.filter((c) => c[1] === filter) : cards;
}

function pick(n, exclude) {
  const p = pool();
  const out = [];
  const usedUrl = new Set(exclude.map((c) => c[4]));
  const used = new Set(exclude);
  for (let tries = 0; out.length < n && tries < 400; tries++) {
    const c = p[Math.floor(Math.random() * p.length)];
    if (!c || used.has(c)) continue;
    if (usedUrl.has(c[4]) && tries < 200) continue; // なるべく別の記事から
    used.add(c); usedUrl.add(c[4]); out.push(c);
  }
  return out;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderCard(c, i) {
  const slot = el("div", "slot");
  const btn = el("button", "card");
  btn.id = "card-" + i;
  btn.setAttribute("aria-pressed", "false");
  btn.setAttribute("aria-label", c[0] + "（タップで裏返す）");
  const inner = el("div", "inner");

  const front = el("div", "face front");
  const fm = el("div", "meta");
  fm.append(el("span", "type", c[1]), el("span", "", c[5] ? c[5].slice(0, 7).replace("-", ".") : ""));
  front.append(fm, el("div", "word" + (c[1] === "文" ? " sentence" : ""), c[0]), el("div", "hint", "タップで裏面"));

  const back = el("div", "face back");
  const bm = el("div", "meta");
  bm.append(el("span", "type", c[1]));
  if (c[6] === "辞書") bm.append(el("span", "dict", "辞書"));
  const body = el("div");
  body.append(el("div", "backword", c[0]), el("p", "backtext", c[2]));
  const src = el("div", "src");
  if (c[4]) {
    const a = el("a", "", c[3] || c[4]);
    a.href = c[4]; a.target = "_blank"; a.rel = "noopener";
    a.addEventListener("click", (e) => e.stopPropagation());
    src.append(a);
  } else src.append(el("span", "", c[3]));
  src.append(el("time", "", c[5] || ""));
  back.append(bm, body, src);

  inner.append(front, back);
  btn.append(inner);
  btn.addEventListener("click", () => {
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });

  const one = el("button", "one", "この1枚を引き直す");
  one.addEventListener("click", () => {
    const next = pick(1, hand)[0];
    if (!next) return;
    hand[i] = next;
    render();
  });
  slot.append(btn, one);
  return slot;
}

function render() {
  const s = $("spread");
  s.replaceChildren();
  if (!hand.length) {
    s.append(el("p", "empty", "この条件のカードがありません。"));
    return;
  }
  hand.forEach((c, i) => s.append(renderCard(c, i)));
}

function draw() {
  hand = pick(3, []);
  render();
}

function showSource() {
  const arts = new Set(cards.map((c) => c[4])).size;
  const s = $("source");
  s.replaceChildren();
  s.append(el("b", "", label), `　${cards.length}枚 ・ ${arts}記事`);
  $("reset").hidden = cards === EMBEDDED;
}

function useCSV(text, name, save) {
  const list = fromCSV(text);
  if (!list.length) throw new Error("採用のカードがありません。採否列に ○ などが入っているか確認してください。");
  cards = list;
  label = name;
  if (save) { try { localStorage.setItem(STORE, JSON.stringify({ name, text })); } catch (e) {} }
  showSource();
  draw();
}

document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.type;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  draw();
}));
$("draw").addEventListener("click", draw);
$("flipall").addEventListener("click", () => {
  const btns = [...document.querySelectorAll(".card")];
  const anyFront = btns.some((b) => b.getAttribute("aria-pressed") !== "true");
  btns.forEach((b) => b.setAttribute("aria-pressed", String(anyFront)));
  $("flipall").textContent = anyFront ? "すべて表に戻す" : "すべて裏返す";
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLInputElement)) {
    e.preventDefault(); draw();
  }
});
$("csv").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const m = $("msg");
    try {
      useCSV(String(r.result), f.name, true);
      m.className = "msg"; m.textContent = `${f.name} を読み込みました。`;
    } catch (err) {
      m.className = "msg err"; m.textContent = err.message;
    }
    e.target.value = "";
  };
  r.readAsText(f, "utf-8");
});
$("reset").addEventListener("click", () => {
  try { localStorage.removeItem(STORE); } catch (e) {}
  cards = EMBEDDED; label = EMBEDDED_LABEL;
  $("msg").textContent = "";
  showSource(); draw();
});

(function start() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved) { useCSV(saved.text, saved.name, false); return; }
  } catch (e) {}
  showSource();
  draw();
})();
</script>
