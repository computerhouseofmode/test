[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opteval"
version = "0.1.0"
description = "CODE V-like sequential optical design evaluation tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
opteval = "opteval.cli:main"

[tool.setuptools]
packages = ["opteval"]
