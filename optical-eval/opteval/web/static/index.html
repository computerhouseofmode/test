<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opteval — 光学設計評価</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 4 5 22 0 26c-5-4-5-22 0-26z' fill='%234c8dff'/%3E%3Cpath d='M1 10L31 16M1 22L31 16' stroke='%231d2733' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">opteval</div>
  <input id="title" class="title-input" placeholder="タイトル" aria-label="タイトル">
  <div class="actions">
    <select id="example-select" aria-label="サンプル"><option value="">サンプルを開く…</option></select>
    <button id="btn-new" type="button">新規</button>
    <label class="btn" for="file-open">開く</label>
    <input type="file" id="file-open" accept=".json,application/json" hidden>
    <button id="btn-save" type="button">保存</button>
    <button id="btn-report" type="button">HTML レポート</button>
    <label class="toggle"><input type="checkbox" id="auto" checked> 自動更新</label>
    <button id="btn-run" type="button" class="primary" title="Ctrl+Enter">評価 ▶</button>
  </div>
</header>

<main class="workspace">
  <!-- 左: 入力 -->
  <section class="pane editor">
    <nav class="tabs" data-group="left" role="tablist">
      <button type="button" data-tab="lens" class="active">レンズデータ</button>
      <button type="button" data-tab="system">システム</button>
      <button type="button" data-tab="opt">最適化</button>
    </nav>

    <div class="tabpanel" data-panel="lens">
      <div class="table-wrap">
        <table id="lens-table" class="grid">
          <thead>
            <tr>
              <th>面</th><th>曲率半径</th><th>面間隔</th><th>硝材</th><th>n<sub>λ0</sub></th>
              <th>有効半径</th><th>コーニック</th><th>非球面 A4, A6, …</th><th>絞り</th><th>コメント</th><th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="toolbar">
        <button type="button" id="btn-add-surface">＋ 面を追加（像面の前）</button>
        <button type="button" id="btn-focus">像面を近軸焦点へ</button>
      </div>
      <p class="hint">
        値を入力して Enter / Tab で確定します。「inf」で平面・無限遠です。
        <span class="v-demo">V</span> を押すと最適化の変数になります。
        有効半径を空欄にすると自動計算になります（ケラレなし）。
      </p>
    </div>

    <div class="tabpanel" data-panel="system" hidden>
      <div class="cards">
        <fieldset class="card">
          <legend>波長 [µm]</legend>
          <div class="table-wrap">
          <table class="grid" id="wl-table">
            <thead><tr><th>#</th><th>波長</th><th>重み</th><th>主波長</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          </div>
          <div class="toolbar">
            <button type="button" id="btn-add-wl">＋ 追加</button>
            <button type="button" data-wl-preset="FdC">F, d, C</button>
            <button type="button" data-wl-preset="d">d のみ</button>
            <button type="button" data-wl-preset="gFdC">g, F, d, C</button>
          </div>
        </fieldset>

        <fieldset class="card">
          <legend>視野</legend>
          <label class="row">種類
            <select id="field-type">
              <option value="angle">画角 [deg]</option>
              <option value="height">物体高 [mm]</option>
            </select>
          </label>
          <div class="table-wrap">
          <table class="grid" id="field-table">
            <thead><tr><th>#</th><th>値</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          </div>
          <div class="toolbar"><button type="button" id="btn-add-field">＋ 追加</button></div>
        </fieldset>

        <fieldset class="card">
          <legend>開口</legend>
          <label class="row">種類
            <select id="ap-type">
              <option value="EPD">入射瞳径 EPD [mm]</option>
              <option value="FNO">F ナンバー（無限遠物体）</option>
              <option value="NAO">物体側 NA（有限物体）</option>
            </select>
          </label>
          <label class="row">値 <input id="ap-value" class="num"></label>
          <p class="hint">物体距離は レンズデータ の OBJ 行の「面間隔」で指定します（inf = 無限遠）。</p>
        </fieldset>
      </div>
    </div>

    <div class="tabpanel" data-panel="opt" hidden>
      <div class="cards stack">
        <fieldset class="card">
          <legend>変数</legend>
          <div class="table-wrap">
          <table class="grid" id="var-table">
            <thead><tr><th>面</th><th>パラメータ</th><th>最小</th><th>最大</th><th>現在値</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          </div>
          <div class="toolbar"><button type="button" id="btn-add-var">＋ 変数を追加</button></div>
        </fieldset>
        <fieldset class="card">
          <legend>目標・設定</legend>
          <label class="row"><input type="checkbox" id="opt-efl-on"> 焦点距離 EFL
            <input id="opt-efl" class="num" placeholder="100"> mm</label>
          <label class="row">EFL の重み <input id="opt-efl-w" class="num" placeholder="1"></label>
          <label class="row"><input type="checkbox" id="opt-focus"> 評価ごとに像面を近軸焦点へ移動</label>
          <label class="row">最大反復回数 <input id="opt-iter" class="num" placeholder="50"></label>
          <label class="row">瞳サンプリング（リング数） <input id="opt-rings" class="num" placeholder="4"></label>
          <p class="hint">評価関数: 全視野・全波長の横収差（主光線基準）の二乗和 ＋ 目標値からのずれ。</p>
          <div class="toolbar"><button type="button" id="btn-optimize" class="primary">最適化を実行</button></div>
        </fieldset>
      </div>
      <div id="opt-result"></div>
    </div>
  </section>

  <!-- 右: 評価 -->
  <section class="pane viewer">
    <div id="metrics" class="metrics"></div>
    <nav class="tabs scroll" data-group="right" role="tablist">
      <button type="button" data-view="summary">概要</button>
      <button type="button" data-view="layout" class="active">レイアウト</button>
      <button type="button" data-view="spot">スポット</button>
      <button type="button" data-view="ray_fan">横収差</button>
      <button type="button" data-view="opd_fan">OPD</button>
      <button type="button" data-view="field_curves">像面湾曲・歪曲</button>
      <button type="button" data-view="wavefront">波面</button>
      <button type="button" data-view="mtf">MTF</button>
      <button type="button" data-view="psf">PSF</button>
      <button type="button" data-view="seidel">Seidel</button>
    </nav>
    <div id="view-options" class="view-options"></div>
    <div id="error" class="error" hidden></div>
    <div class="view-wrap">
      <div id="view"></div>
      <div id="busy" class="busy" hidden><div class="spinner"></div></div>
    </div>
  </section>
</main>

<datalist id="glass-list"></datalist>
<script src="/static/app.js"></script>
</body>
</html>
